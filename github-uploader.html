<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub 原型上传工具</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; min-height: 100vh; padding: 20px; }
        .container { max-width: 700px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 24px; color: #333; font-size: 22px; }
        .card { background: #fff; border-radius: 12px; padding: 24px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .card h2 { font-size: 16px; color: #666; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .card h2 span { font-size: 20px; }
        label { display: block; font-size: 13px; color: #888; margin-bottom: 4px; margin-top: 12px; }
        input, select { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; transition: border-color 0.2s; }
        input:focus { border-color: #3B82F6; }
        input[type="password"] { font-family: monospace; }
        .file-input { position: relative; border: 2px dashed #ccc; border-radius: 12px; padding: 40px 20px; text-align: center; cursor: pointer; transition: all 0.2s; margin-top: 12px; }
        .file-input:hover { border-color: #3B82F6; background: #f0f7ff; }
        .file-input.dragover { border-color: #3B82F6; background: #e8f2ff; }
        .file-input p { color: #999; font-size: 14px; }
        .file-input .icon { font-size: 36px; margin-bottom: 8px; }
        .file-input input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        .upload-file-list { margin-top: 12px; }
        .upload-file-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; background: #f8f9fa; border-radius: 8px; margin-bottom: 6px; font-size: 13px; }
        .upload-file-item .name { color: #333; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .upload-file-item .size { color: #999; margin-left: 8px; white-space: nowrap; }
        .upload-file-item .remove { color: #ef4444; cursor: pointer; margin-left: 8px; font-size: 16px; }
        .btn { display: block; width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s; margin-top: 16px; }
        .btn-primary { background: #24292e; color: #fff; }
        .btn-primary:hover { background: #1a1e22; }
        .btn-primary:disabled { background: #ccc; cursor: not-allowed; }
        .btn-save { background: #3B82F6; color: #fff; padding: 10px; font-size: 14px; }
        .btn-save:hover { background: #2563eb; }
        .msg { padding: 12px 16px; border-radius: 8px; margin-top: 12px; font-size: 14px; display: none; }
        .msg.success { background: #ecfdf5; color: #059669; border: 1px solid #a7f3d0; display: block; }
        .msg.error { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; display: block; }
        .msg.info { background: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe; display: block; }
        .config-saved { display: inline-block; padding: 2px 8px; background: #ecfdf5; color: #059669; border-radius: 4px; font-size: 12px; margin-left: 8px; }
        .checkbox-row { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
        .checkbox-row input { width: auto; }
        .checkbox-row label { margin: 0; font-size: 14px; color: #555; }

        /* 文件列表 */
        .repo-file-list { margin-top: 8px; }
        .repo-file-item { display: flex; align-items: center; padding: 12px; border: 1px solid #eee; border-radius: 10px; margin-bottom: 8px; transition: all 0.2s; }
        .repo-file-item:hover { border-color: #3B82F6; box-shadow: 0 2px 8px rgba(59,130,246,0.1); }
        .repo-file-info { flex: 1; min-width: 0; }
        .repo-file-name { font-size: 14px; font-weight: 500; color: #333; word-break: break-all; }
        .repo-file-meta { font-size: 12px; color: #999; margin-top: 4px; }
        .repo-file-actions { display: flex; gap: 8px; margin-left: 12px; flex-shrink: 0; }
        .btn-small { padding: 6px 12px; border: none; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: 500; transition: all 0.2s; white-space: nowrap; }
        .btn-copy { background: #eff6ff; color: #3B82F6; }
        .btn-copy:hover { background: #3B82F6; color: #fff; }
        .btn-open { background: #f0fdf4; color: #16a34a; }
        .btn-open:hover { background: #16a34a; color: #fff; }
        .btn-delete { background: #fef2f2; color: #ef4444; }
        .btn-delete:hover { background: #ef4444; color: #fff; }
        .loading { text-align: center; padding: 20px; color: #999; }
        .empty { text-align: center; padding: 30px; color: #ccc; font-size: 14px; }
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 24px; border-radius: 8px; font-size: 14px; z-index: 1000; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
        .toast.show { opacity: 1; }
        .link-preview { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
        .link-preview a { color: #3B82F6; font-size: 12px; text-decoration: none; word-break: break-all; }
        .link-preview a:hover { text-decoration: underline; }

        /* 上传进度 */
        .upload-progress { margin-top: 12px; }
        .progress-item { padding: 8px 12px; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; gap: 8px; font-size: 13px; }
        .progress-item .status-icon { flex-shrink: 0; }
        .progress-item .file-name { flex: 1; color: #333; }
        .progress-item .link-col { color: #3B82F6; font-size: 12px; }
        .progress-item .link-col a { color: #3B82F6; text-decoration: none; }
        .progress-item .link-col a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📤 GitHub 原型上传工具</h1>

        <!-- GitHub配置 -->
        <div class="card">
            <h2><span>⚙️</span> GitHub 配置 <span id="savedBadge" class="config-saved" style="display:none">✓ 已保存</span></h2>
            <label>Personal Access Token</label>
            <input id="cfgToken" type="password" placeholder="ghp_xxxx" />
            <label>仓库所有者</label>
            <input id="cfgOwner" type="text" value="karlwork511" />
            <label>仓库名称</label>
            <input id="cfgRepo" type="text" value="karlwork" />
            <label>自定义域名（用于生成分享链接）</label>
            <input id="cfgDomain" type="text" value="karlwork.top" />
            <div class="checkbox-row">
                <input id="cfgRename" type="checkbox" checked />
                <label for="cfgRename">文件名转拼音（避免中文URL）</label>
            </div>
            <button class="btn btn-save" onclick="saveConfig()">💾 保存配置</button>
            <div id="configMsg" class="msg"></div>
        </div>

        <!-- 文件上传 -->
        <div class="card">
            <h2><span>📁</span> 上传新文件</h2>
            <div class="file-input" id="dropZone">
                <div class="icon">📎</div>
                <p>点击选择或拖拽文件到这里</p>
                <input type="file" id="fileInput" multiple accept=".html,.htm,.css,.js,.json,.md,.txt,.png,.jpg,.jpeg,.gif,.svg,.pdf" />
            </div>
            <div class="upload-file-list" id="uploadFileList"></div>
            <button class="btn btn-primary" id="uploadBtn" onclick="startUpload()" disabled>
                开始上传
            </button>
            <!-- 上传进度 -->
            <div class="upload-progress" id="uploadProgress" style="display:none"></div>
        </div>

        <!-- 仓库文件列表 -->
        <div class="card">
            <h2><span>📦</span> 仓库文件 <button onclick="loadRepoFiles()" style="background:none;border:none;cursor:pointer;font-size:16px;margin-left:auto" title="刷新">🔄</button></h2>
            <div class="repo-file-list" id="repoFileList">
                <div class="loading">加载中...</div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let selectedFiles = [];
        let config = {};

        // 拼音映射
        const pinyinMap = {
            '运营': 'operation', '租户': 'tenant', '后台': 'backend',
            '原型': 'prototype', '分享版': 'share', '采购': 'purchase',
            '订单': 'order', '入库': 'warehouse', '包裹': 'package',
            '商品': 'product', '物流': 'logistics', '系统': 'system',
            '设置': 'settings', '管理': 'manage', '列表': 'list',
            '详情': 'detail', '首页': 'home', '首页导航': 'nav',
            '充值': 'recharge', '支付': 'payment', '配置': 'config',
            '审核': 'audit', '账户': 'account', '流水': 'statement',
            '退款': 'refund', '售后': 'aftersale', '供应商': 'supplier',
            '代购': 'agent-buy', '平台': 'platform', '线路': 'route',
            '货类': 'cargo', '订阅': 'subscription', 'SaaS': 'saas',
            'POKO': 'poko', '-': '-', ' ': '-', '上传': 'upload',
            '工具': 'tool', '用户': 'user', '端': 'client'
        };

        function toPinyin(name) {
            let result = name;
            const sortedKeys = Object.keys(pinyinMap).sort((a, b) => b.length - a.length);
            for (const key of sortedKeys) {
                result = result.replace(new RegExp(key, 'g'), pinyinMap[key]);
            }
            result = result.replace(/[^\w\-\.]/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
            return result;
        }

        // 配置
        function loadConfig() {
            const saved = localStorage.getItem('gh_upload_cfg');
            if (saved) {
                config = JSON.parse(saved);
                $('cfgToken').value = config.token || '';
                $('cfgOwner').value = config.owner || 'karlwork511';
                $('cfgRepo').value = config.repo || 'karlwork';
                $('cfgDomain').value = config.domain || 'karlwork.top';
                $('cfgRename').checked = config.rename !== false;
                $('savedBadge').style.display = 'inline-block';
            }
        }

        function saveConfig() {
            config = {
                token: $('cfgToken').value.trim(),
                owner: $('cfgOwner').value.trim(),
                repo: $('cfgRepo').value.trim(),
                domain: $('cfgDomain').value.trim(),
                rename: $('cfgRename').checked
            };
            if (!config.token) { showConfigMsg('请填写 Token', 'error'); return; }
            localStorage.setItem('gh_upload_cfg', JSON.stringify(config));
            $('savedBadge').style.display = 'inline-block';
            showConfigMsg('✓ 配置已保存', 'success');
            loadRepoFiles();
        }

        function showConfigMsg(text, type) {
            const el = $('configMsg');
            el.textContent = text;
            el.className = 'msg ' + type;
            setTimeout(() => { el.className = 'msg'; }, 3000);
        }

        // 加载仓库文件列表
        async function loadRepoFiles() {
            if (!config.token) {
                $('repoFileList').innerHTML = '<div class="empty">请先配置 Token</div>';
                return;
            }

            $('repoFileList').innerHTML = '<div class="loading">加载中...</div>';

            try {
                const res = await fetch(
                    `https://api.github.com/repos/${config.owner}/${config.repo}/contents/`,
                    { headers: { 'Authorization': `token ${config.token}` } }
                );

                if (!res.ok) {
                    const err = await res.json();
                    $('repoFileList').innerHTML = `<div class="empty">加载失败: ${err.message}</div>`;
                    return;
                }

                const files = await res.json();
                // 过滤出 HTML 和其他可分享文件
                const shareableFiles = files.filter(f => 
                    f.name.endsWith('.html') || f.name.endsWith('.htm') || 
                    f.name.endsWith('.pdf') || f.name.endsWith('.md')
                ).sort((a, b) => a.name.localeCompare(b.name));

                if (shareableFiles.length === 0) {
                    $('repoFileList').innerHTML = '<div class="empty">仓库暂无可分享文件</div>';
                    return;
                }

                $('repoFileList').innerHTML = shareableFiles.map(f => {
                    const shareUrl = `https://${config.domain}/${encodeURIComponent(f.name).replace(/%2F/g, '/')}`;
                    const rawUrl = f.html_url;
                    const size = formatSize(f.size);
                    const date = new Date(f.sha ? Date.now() : '').toLocaleDateString('zh-CN');
                    
                    return `
                        <div class="repo-file-item">
                            <div class="repo-file-info">
                                <div class="repo-file-name">${f.name}</div>
                                <div class="repo-file-meta">${size}</div>
                                <div class="link-preview">
                                    <a href="${shareUrl}" target="_blank">${shareUrl}</a>
                                </div>
                            </div>
                            <div class="repo-file-actions">
                                <button class="btn-small btn-copy" onclick="copyLink('${shareUrl}')">📋 复制链接</button>
                                <button class="btn-small btn-open" onclick="window.open('${shareUrl}')">🔗 打开</button>
                                <button class="btn-small btn-delete" onclick="deleteFile('${f.name}', '${f.sha}')">🗑️</button>
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (err) {
                $('repoFileList').innerHTML = `<div class="empty">网络错误: ${err.message}</div>`;
            }
        }

        // 复制链接
        function copyLink(url) {
            navigator.clipboard.writeText(url).then(() => {
                showToast('✓ 链接已复制');
            }).catch(() => {
                // fallback
                const ta = document.createElement('textarea');
                ta.value = url;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                showToast('✓ 链接已复制');
            });
        }

        // 删除文件
        async function deleteFile(name, sha) {
            if (!confirm(`确定删除 ${name}？`)) return;

            try {
                const res = await fetch(
                    `https://api.github.com/repos/${config.owner}/${config.repo}/contents/${encodeURIComponent(name)}`,
                    {
                        method: 'DELETE',
                        headers: {
                            'Authorization': `token ${config.token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: `Delete ${name}`,
                            sha: sha
                        })
                    }
                );

                if (res.ok) {
                    showToast('✓ 已删除');
                    loadRepoFiles();
                } else {
                    const err = await res.json();
                    alert('删除失败: ' + err.message);
                }
            } catch (err) {
                alert('删除失败: ' + err.message);
            }
        }

        // 文件选择
        $('fileInput').addEventListener('change', handleFiles);
        const dropZone = $('dropZone');
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('dragover'); });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            handleFiles({ target: { files: e.dataTransfer.files } });
        });

        function handleFiles(e) {
            const files = Array.from(e.target.files);
            files.forEach(f => {
                if (!selectedFiles.find(sf => sf.name === f.name)) {
                    selectedFiles.push(f);
                }
            });
            renderUploadFileList();
            e.target.value = '';
        }

        function removeUploadFile(index) {
            selectedFiles.splice(index, 1);
            renderUploadFileList();
        }

        function renderUploadFileList() {
            const list = $('uploadFileList');
            list.innerHTML = selectedFiles.map((f, i) => `
                <div class="upload-file-item">
                    <span class="name">${f.name}</span>
                    <span class="size">${formatSize(f.size)}</span>
                    <span class="remove" onclick="removeUploadFile(${i})">✕</span>
                </div>
            `).join('');
            $('uploadBtn').disabled = selectedFiles.length === 0;
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        // 上传
        async function startUpload() {
            if (!config.token) { alert('请先保存 GitHub 配置'); return; }

            const btn = $('uploadBtn');
            btn.disabled = true;
            btn.textContent = '上传中...';

            const progress = $('uploadProgress');
            progress.style.display = 'block';
            progress.innerHTML = '';

            const results = [];

            for (let i = 0; i < selectedFiles.length; i++) {
                const file = selectedFiles[i];
                let fileName = file.name;

                if ($('cfgRename').checked) {
                    const ext = file.name.split('.').pop();
                    const base = file.name.substring(0, file.name.lastIndexOf('.'));
                    fileName = toPinyin(base) + '.' + ext;
                }

                // 添加进度项
                const progressId = 'prog-' + i;
                progress.innerHTML += `
                    <div class="progress-item" id="${progressId}">
                        <span class="status-icon">⏳</span>
                        <span class="file-name">${file.name} → ${fileName}</span>
                    </div>
                `;

                try {
                    const shareUrl = await uploadFile(file, fileName);
                    const el = $(progressId);
                    el.innerHTML = `
                        <span class="status-icon">✅</span>
                        <span class="file-name">${fileName}</span>
                        <span class="link-col"><a href="${shareUrl}" target="_blank">${shareUrl}</a></span>
                    `;
                    results.push({ name: fileName, url: shareUrl, success: true });
                } catch (err) {
                    const el = $(progressId);
                    el.innerHTML = `
                        <span class="status-icon">❌</span>
                        <span class="file-name">${fileName}: ${err.message}</span>
                    `;
                    results.push({ name: fileName, url: '', success: false, error: err.message });
                }
            }

            btn.disabled = false;
            btn.textContent = '开始上传';
            selectedFiles = [];
            renderUploadFileList();

            // 刷新文件列表
            loadRepoFiles();
        }

        async function uploadFile(file, fileName) {
            const owner = config.owner;
            const repo = config.repo;
            let sha = undefined;

            // 检查是否已存在
            try {
                const checkRes = await fetch(
                    `https://api.github.com/repos/${owner}/${repo}/contents/${encodeURIComponent(fileName)}`,
                    { headers: { 'Authorization': `token ${config.token}` } }
                );
                if (checkRes.ok) {
                    const data = await checkRes.json();
                    sha = data.sha;
                }
            } catch (e) {}

            const content = await readFileAsBase64(file);
            const body = {
                message: `${sha ? 'Update' : 'Add'} ${fileName}`,
                content: content
            };
            if (sha) body.sha = sha;

            const res = await fetch(
                `https://api.github.com/repos/${owner}/${repo}/contents/${encodeURIComponent(fileName)}`,
                {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${config.token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(body)
                }
            );

            if (!res.ok) {
                const err = await res.json();
                throw new Error(err.message || '上传失败');
            }

            return `https://${config.domain}/${encodeURIComponent(fileName).replace(/%2F/g, '/')}`;
        }

        function readFileAsBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => {
                    const base64 = reader.result.split(',')[1];
                    resolve(base64);
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function showToast(msg) {
            const t = $('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }

        function $(id) { return document.getElementById(id); }

        // 初始化
        loadConfig();
        if (config.token) loadRepoFiles();
    </script>
</body>
</html>
