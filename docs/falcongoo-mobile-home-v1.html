<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>FalconGoo 移动端首页</title>
<style>
  :root{
    --brand:#4b2ff0;
    --brand-d:#3a20d4;
    --brand-soft:#f1eeff;
    --ink:#14161b;
    --ink-2:#464c56;
    --ink-3:#8a9099;
    --line:#eef0f4;
    --bg:#f6f7f9;
    --r:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:#e9eaef;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;border:0;background:none;padding:0;cursor:pointer;color:inherit}
  input{font-family:inherit;border:0;background:none;outline:none}
  h1,h2,h3,p{margin:0}
  .app{
    position:relative;width:100%;max-width:440px;margin:0 auto;min-height:100vh;
    background:#fff;padding-bottom:calc(66px + env(safe-area-inset-bottom));
    overflow-x:hidden;
  }

  /* ==================== 顶部 ==================== */
  .hd{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:#fff;
  }
  .brand{display:flex;align-items:center;gap:8px;min-width:0}
  .logo{
    width:34px;height:34px;border-radius:11px;background:var(--brand);flex:none;
    display:grid;place-items:center;box-shadow:0 4px 12px rgba(75,47,240,.28);
  }
  .logo svg{width:19px;height:19px}
  .brand-txt{min-width:0}
  .brand-txt h1{
    font-size:15px;font-weight:800;letter-spacing:-.02em;line-height:1.15;
    display:flex;align-items:baseline;
  }
  .brand-txt h1 i{font-style:normal;color:var(--brand)}
  .brand-txt em{
    display:block;font-style:normal;font-size:10.5px;color:var(--ink-3);
    letter-spacing:.02em;margin-top:2px;white-space:nowrap;
  }
  .hd-right{display:flex;align-items:center;gap:6px;flex:none}
  .hd-btn{
    position:relative;height:34px;min-width:34px;border-radius:11px;
    display:flex;align-items:center;justify-content:center;gap:4px;
    color:var(--ink-2);background:#f5f6f9;padding:0 8px;transition:background .15s;
  }
  .hd-btn:active{background:#eceef3}
  .hd-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .hd-btn .dot{
    position:absolute;top:7px;right:7px;width:6px;height:6px;border-radius:50%;
    background:#ff4d4f;box-shadow:0 0 0 2px #f5f6f9;
  }
  .lang-btn span{font-size:11.5px;font-weight:600;white-space:nowrap}
  .lang-btn svg{width:15px;height:15px}

  /* ==================== 搜索（吸顶） ==================== */
  .search-wrap{
    position:sticky;top:0;z-index:60;background:#fff;
    padding:2px 14px 12px;transition:box-shadow .2s ease,padding .2s ease;
  }
  .search-wrap.stuck{box-shadow:0 6px 18px rgba(20,22,27,.08);padding-top:8px}
  .search-bar{
    display:flex;align-items:center;gap:8px;height:44px;padding:0 6px 0 14px;
    background:#f5f6f9;border-radius:99px;border:1px solid transparent;
    transition:border-color .18s,background .18s;
  }
  .search-bar:focus-within{border-color:var(--brand);background:#fff}
  .search-bar>svg{width:17px;height:17px;stroke:var(--ink-3);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .search-bar input{
    flex:1;min-width:0;font-size:13.5px;color:var(--ink);height:100%;
  }
  .search-bar input::placeholder{color:#a8adb6}
  .cam{
    width:34px;height:34px;border-radius:50%;background:#fff;flex:none;
    display:grid;place-items:center;color:var(--ink-2);
    box-shadow:0 1px 4px rgba(20,22,27,.08);
  }
  .cam:active{background:#eceef3}
  .cam svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

  .quick-row{
    display:flex;gap:9px;margin-top:10px;
    max-height:44px;overflow:hidden;opacity:1;
    transition:max-height .24s ease,opacity .18s ease,margin-top .24s ease;
  }
  .search-wrap.stuck .quick-row{max-height:0;opacity:0;margin-top:0}
  .quick{
    flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
    height:38px;border-radius:11px;background:var(--brand-soft);color:var(--brand);
    font-size:12.5px;font-weight:700;
  }
  .quick:active{background:#e6dfff}
  .quick svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

  /* ==================== 通用区块 ==================== */
  .sec{padding:20px 14px 0}
  .sec-hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
  .sec-hd h2{font-size:17px;font-weight:800;letter-spacing:-.02em}
  .sec-hd h2 b{color:var(--brand)}
  .sec-hd a{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:2px}
  .sec-hd a svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

  /* ==================== 为何选择 ==================== */
  .why{
    margin:14px 14px 0;padding:18px 16px 16px;border-radius:18px;
    background:linear-gradient(160deg,#f7f5ff 0%,#fdfbff 55%,#fff 100%);
    border:1px solid #eeebfd;
  }
  .why-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
  .why-hd h2{font-size:16.5px;font-weight:800;letter-spacing:-.02em}
  .why-hd h2 b{color:var(--brand)}
  .why-hd .tag{
    font-size:10.5px;font-weight:700;color:var(--brand);background:#fff;
    padding:4px 9px;border-radius:99px;border:1px solid #e5dfff;white-space:nowrap;
  }
  .perks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 8px}
  .perk{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
  .perk i{
    width:34px;height:34px;border-radius:11px;background:#fff;display:grid;place-items:center;
    box-shadow:0 2px 8px rgba(75,47,240,.1);
  }
  .perk i svg{width:17px;height:17px;stroke:var(--brand);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .perk span{font-size:11px;color:var(--ink-2);line-height:1.35}

  .steps{
    display:grid;grid-template-columns:1fr 12px 1fr 12px 1fr;align-items:start;
    gap:2px;margin-top:16px;padding-top:15px;border-top:1px dashed #e5dfff;
  }
  .step{display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center}
  .step em{
    font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--brand);
    color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;
    box-shadow:0 3px 9px rgba(75,47,240,.28);
  }
  .step b{font-size:11.5px;font-weight:700;color:var(--ink)}
  .step span{font-size:10.5px;color:var(--ink-3);line-height:1.35}
  .step-ar{align-self:center;margin-top:6px;color:#c9c2f5;display:grid;place-items:center}
  .step-ar svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

  /* ==================== Banner ==================== */
  .bn{margin-top:18px;position:relative}
  .bn-track{
    display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;
    padding:0 14px 8px;scrollbar-width:none;
  }
  .bn-track::-webkit-scrollbar{display:none}
  .bn-item{
    flex:0 0 84%;scroll-snap-align:center;height:132px;border-radius:16px;
    position:relative;overflow:hidden;padding:18px 18px 16px;color:#fff;
    display:flex;flex-direction:column;justify-content:center;
  }
  .bn-item::after{
    content:"";position:absolute;right:-26px;top:-26px;width:120px;height:120px;
    border-radius:50%;background:rgba(255,255,255,.16);
  }
  .bn-item .k{font-size:10.5px;font-weight:700;letter-spacing:.08em;opacity:.86;margin-bottom:6px}
  .bn-item .t{font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.25}
  .bn-item .d{font-size:11.5px;opacity:.9;margin-top:6px}
  .bn-item .go{
    align-self:flex-start;margin-top:10px;font-size:11.5px;font-weight:700;
    background:rgba(255,255,255,.94);color:var(--brand);padding:5px 12px;border-radius:99px;
  }
  .bn-1{background:linear-gradient(120deg,#5b3df5,#8a6bff)}
  .bn-2{background:linear-gradient(120deg,#ff7a59,#ffb066)}
  .bn-3{background:linear-gradient(120deg,#1f9bd8,#3fc9c1)}
  .bn-dots{display:flex;justify-content:center;gap:5px;margin-top:2px}
  .bn-dots i{width:5px;height:5px;border-radius:50%;background:#dcdfe6;transition:width .2s,background .2s}
  .bn-dots i.on{width:14px;border-radius:3px;background:var(--brand)}

  /* ==================== 商品 ==================== */
  .goods{padding:18px 14px 0}
  .cats{
    display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;
    margin:0 -14px 14px;padding:0 14px 2px;
  }
  .cats::-webkit-scrollbar{display:none}
  .cat{
    flex:none;height:32px;padding:0 15px;border-radius:99px;background:#f4f5f8;
    color:var(--ink-2);font-size:12.5px;font-weight:600;white-space:nowrap;
    display:flex;align-items:center;transition:background .16s,color .16s;
  }
  .cat.on{background:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(75,47,240,.26)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .card{border-radius:var(--r);overflow:hidden;background:#fff;border:1px solid var(--line)}
  .card:active{transform:scale(.99)}
  .c-img{
    position:relative;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:600;letter-spacing:.06em;color:rgba(20,22,27,.3);
  }
  .c-src{
    position:absolute;top:7px;left:7px;font-size:9.5px;font-weight:800;
    padding:2px 6px;border-radius:5px;background:rgba(255,255,255,.94);
  }
  .c-src.al{color:#ff6a00}
  .c-src.tb{color:#ff4400}
  .c-body{padding:9px 9px 10px}
  .c-title{
    font-size:12.5px;line-height:1.45;height:36px;overflow:hidden;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;color:var(--ink);
  }
  .c-foot{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:7px}
  .c-price{font-size:15.5px;font-weight:800;color:var(--brand);letter-spacing:-.02em;line-height:1}
  .c-price small{font-size:10.5px;font-weight:700;margin-right:1px}
  .c-old{font-size:10.5px;color:#b6bbc4;text-decoration:line-through;margin-left:4px}
  .c-add{
    width:28px;height:28px;border-radius:50%;background:var(--brand);flex:none;
    display:grid;place-items:center;box-shadow:0 3px 9px rgba(75,47,240,.3);
  }
  .c-add:active{background:var(--brand-d);transform:scale(.94)}
  .c-add svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  .more{
    margin:16px 14px 0;height:42px;border-radius:12px;background:#f5f6f9;
    color:var(--ink-2);font-size:13px;font-weight:600;width:calc(100% - 28px);
    display:flex;align-items:center;justify-content:center;
  }
  .more:active{background:#eceef3}

  /* ==================== 底部导航 ==================== */
  .tabbar{
    position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:70;
    width:100%;max-width:440px;background:rgba(255,255,255,.96);
    backdrop-filter:blur(12px);border-top:1px solid var(--line);
    display:grid;grid-template-columns:repeat(4,1fr);
    padding:6px 0 calc(6px + env(safe-area-inset-bottom));
  }
  .tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-3);padding:3px 0}
  .tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .tab span{font-size:10px;font-weight:600}
  .tab.on{color:var(--brand)}
  .tab .badge{
    position:absolute;transform:translate(11px,-4px);min-width:15px;height:15px;padding:0 3px;
    border-radius:8px;background:#ff4d4f;color:#fff;font-size:9px;font-weight:800;
    display:flex;align-items:center;justify-content:center;line-height:1;
  }

  /* ==================== 语言弹层 ==================== */
  .sheet-mask{
    position:fixed;inset:0;z-index:200;background:rgba(12,10,30,.42);
    display:none;align-items:flex-end;justify-content:center;
  }
  .sheet-mask.show{display:flex}
  .sheet{
    width:100%;max-width:440px;background:#fff;border-radius:20px 20px 0 0;
    padding:8px 0 calc(10px + env(safe-area-inset-bottom));
    animation:sheetUp .26s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
  .sheet-hd{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 18px 10px;border-bottom:1px solid var(--line);
  }
  .sheet-hd h3{font-size:14px;font-weight:800}
  .sheet-hd button{color:var(--ink-3);font-size:13px}
  .sheet-grp{padding:12px 18px 2px}
  .sheet-grp h4{font-size:11.5px;color:var(--ink-3);font-weight:600;margin-bottom:8px}
  .opt{
    display:flex;align-items:center;justify-content:space-between;
    padding:11px 12px;border-radius:11px;font-size:13.5px;margin-bottom:7px;
    border:1px solid var(--line);background:#fafafc;
  }
  .opt.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:700}
  .opt .ck{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;opacity:0}
  .opt.on .ck{opacity:1}

  /* ==================== Toast ==================== */
  .toast{
    position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(8px);
    z-index:300;background:rgba(20,22,27,.92);color:#fff;font-size:13px;
    padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;
    transition:opacity .2s,transform .2s;white-space:nowrap;max-width:86vw;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (min-width:441px){
    body{background:#e9eaef}
    .app{box-shadow:0 0 60px rgba(20,22,27,.1)}
  }
</style>
</head>
<body>

<div class="app" id="top">

  <!-- ==================== 顶部 ==================== -->
  <header class="hd">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none"><path d="M3 13.5 20.5 4l-6.2 8.6 2.3 7.4-4.6-4.2L8 20l.4-4.6L3 13.5Z" fill="#fff"/></svg>
      </span>
      <span class="brand-txt">
        <h1>Falcon<i>Goo</i></h1>
        <em>免费代购 全球寄送</em>
      </span>
    </div>
    <div class="hd-right">
      <button class="hd-btn" id="msgBtn" aria-label="消息">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9.3 9.3 0 0 1-3.8-.8L3 21l1.9-4.6A8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5Z"/></svg>
        <span class="dot" aria-hidden="true"></span>
      </button>
      <button class="hd-btn lang-btn" id="langBtn" aria-label="切换语言和币种">
        <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18Z"/></svg>
        <span>中文/CNY</span>
      </button>
    </div>
  </header>

  <!-- ==================== 搜索 ==================== -->
  <div class="search-wrap" id="searchWrap">
    <div class="search-bar">
      <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.6 4.6"/></svg>
      <input type="text" id="searchInput" placeholder="粘贴商品链接，或搜索商品名称" aria-label="搜索商品">
      <button class="cam" id="camBtn" aria-label="拍照搜同款">
        <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="2.5" y="6.5" width="19" height="13" rx="3"/><circle cx="12" cy="13" r="3.4"/><path d="M8.5 6.5 10 4h4l1.5 2.5"/></svg>
      </button>
    </div>
    <div class="quick-row">
      <button class="quick" id="quickFreight">
        <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="2.5" y="7" width="12" height="9" rx="1.6"/><path d="M14.5 10.5h3.6l3 3.2V16h-6.6z"/><circle cx="7" cy="18.5" r="1.6"/><circle cx="17.5" cy="18.5" r="1.6"/></svg>
        运费估算
      </button>
      <button class="quick" id="quickManual">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        手工下单
      </button>
    </div>
  </div>

  <!-- ==================== 为何选择 ==================== -->
  <section class="why">
    <div class="why-hd">
      <h2>为何选择 <b>FalconGoo</b></h2>
      <span class="tag">免费代购</span>
    </div>

    <div class="perks">
      <div class="perk">
        <i aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 8.5 12 4l9 4.5-9 4.5z"/><path d="M3 12.5 12 17l9-4.5"/><path d="M3 16.5 12 21l9-4.5"/></svg></i>
        <span>一手货源</span>
      </div>
      <div class="perk">
        <i aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3 4.5 6v6c0 4.4 3.2 7.7 7.5 9 4.3-1.3 7.5-4.6 7.5-9V6z"/><path d="m9 12 2.2 2.2L15.5 10"/></svg></i>
        <span>1:1 质检</span>
      </div>
      <div class="perk">
        <i aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4.2 13.5v-1.2a7.8 7.8 0 0 1 15.6 0v1.2"/><rect x="2.6" y="13" width="4" height="6.2" rx="2"/><rect x="17.4" y="13" width="4" height="6.2" rx="2"/><path d="M19.4 19.2a3 3 0 0 1-3 2.6h-2.6"/></svg></i>
        <span>7×24 客服</span>
      </div>
      <div class="perk">
        <i aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3.5 8 12 3.5 20.5 8v8L12 20.5 3.5 16z"/><path d="M3.5 8 12 12.5 20.5 8"/><path d="M12 12.5v8"/></svg></i>
        <span>180 天仓储</span>
      </div>
      <div class="perk">
        <i aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="2.5" y="7" width="12" height="9" rx="1.6"/><path d="M14.5 10.5h3.6l3 3.2V16h-6.6z"/><circle cx="7" cy="18.5" r="1.6"/><circle cx="17.5" cy="18.5" r="1.6"/></svg></i>
        <span>物流保障</span>
      </div>
      <div class="perk">
        <i aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5l3.2 1.9"/></svg></i>
        <span>当天入库</span>
      </div>
    </div>

    <div class="steps">
      <div class="step">
        <em>1</em>
        <b>下单支付</b>
        <span>贴链接提交代购单</span>
      </div>
      <div class="step-ar" aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></div>
      <div class="step">
        <em>2</em>
        <b>采购质检</b>
        <span>开箱拍照逐件核对</span>
      </div>
      <div class="step-ar" aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></div>
      <div class="step">
        <em>3</em>
        <b>合箱寄送</b>
        <span>付运费全球配送</span>
      </div>
    </div>
  </section>

  <!-- ==================== Banner ==================== -->
  <section class="bn">
    <div class="bn-track" id="bnTrack">
      <div class="bn-item bn-1">
        <span class="k">新用户专享</span>
        <span class="t">首单免服务费</span>

<div class="sheet-mask" id="langMask" aria-hidden="true">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="langTitle">
    <div class="sheet-hd">
      <h3 id="langTitle">语言与币种</h3>
      <button id="langClose">完成</button>
    </div>
    <div class="sheet-grp">
      <h4>语言</h4>
      <div class="opt on" data-type="lang" data-val="中文">
        简体中文
        <svg class="ck" aria-hidden="true" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>
      </div>
      <div class="opt" data-type="lang" data-val="English">

        美元 USD $

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  var toastEl = document.getElementById('toast');
  var tTimer = null;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(tTimer);
    tTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 1800);
  }

  /* ---------- 搜索吸顶 ---------- */
  var wrap = document.getElementById('searchWrap');
  window.addEventListener('scroll', function(){
    wrap.classList.toggle('stuck', window.scrollY > 6);
  }, {passive:true});

  /* ---------- Banner 圆点 ---------- */
  var track = document.getElementById('bnTrack');
  var dots = document.getElementById('bnDots');
  if(track && dots){
    var items = track.children;
    track.addEventListener('scroll', function(){
      var w = items[0].offsetWidth + 10;
      var idx = Math.round(track.scrollLeft / w);
      for(var i = 0; i < dots.children.length; i++){
        dots.children[i].classList.toggle('on', i === idx);
      }
    }, {passive:true});
  }

  /* ---------- 商品 ---------- */
  var CATS = ['推荐','男装','女装','母婴','美妆','日用品','运动','穿搭'];
  var NAMES = ['不锈钢保温杯 500ml 便携大容量','秋冬加厚连帽卫衣 男女同款','法式复古碎花吊带连衣裙 收腰显瘦','纯棉婴儿连体衣 新生儿和尚服','氨基酸洁面慕斯 温和清洁 100ml','日式陶瓷餐具套装 家用四件套','轻薄速干运动T恤 透气排汗','高腰阔腿牛仔裤 显瘦百搭'];
  var GRADS = [
    'linear-gradient(135deg,#fde8ef,#f6cfe0)',
    'linear-gradient(135deg,#e6f6ec,#cfeada)',
    'linear-gradient(135deg,#eef0f4,#dfe3ea)',
    'linear-gradient(135deg,#fdf0e3,#f7ddc2)',
    'linear-gradient(135deg,#e8eefc,#cfdaf5)',
    'linear-gradient(135deg,#f3ecfd,#e2d5f8)'
  ];
  var state = {cat:'推荐', page:1};
  var PAGE = 8;

  function makeProduct(cat, i){
    var seed = i + cat.length;
    var price = 19.9 + (seed * 37 % 260);
    var old = price * (1.35 + (seed % 5) / 10);
    return {
      title: NAMES[i % NAMES.length],
      price: price.toFixed(1),
      old: old.toFixed(1),
      src: (i % 2 === 0 ? '1688' : '淘宝'),
      grad: GRADS[seed % GRADS.length],
      label: cat
    };
  }

  function renderCats(){
    document.getElementById('cats').innerHTML = CATS.map(function(c){
      return '<button class="cat' + (c === state.cat ? ' on' : '') + '" data-cat="' + c + '">' + c + '</button>';
    }).join('');
  }

  function renderGrid(){
    var total = PAGE * state.page;
    var list = [];
    for(var i = 0; i < total; i++){ list.push(makeProduct(state.cat, i)); }
    document.getElementById('grid').innerHTML = list.map(function(p, i){
      return '<article class="card">'
        + '<div class="c-img" style="background:' + p.grad + '">'
        +   '<span class="c-src ' + (p.src === '淘宝' ? 'tb' : 'al') + '">' + p.src + '</span>'
        +   p.label
        + '</div>'
        + '<div class="c-body">'
        +   '<p class="c-title">' + p.title + '</p>'
        +   '<div class="c-foot">'
        +     '<div><span class="c-price"><small>¥</small>' + p.price + '</span>'
        +     '<span class="c-old">¥' + p.old + '</span></div>'
        +     '<button class="c-add" data-i="' + i + '" aria-label="加入购物车">'
        +       '<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 2-1.6L21 8H6"/><circle cx="10" cy="20" r="1.3"/><circle cx="18" cy="20" r="1.3"/></svg>'
        +     '</button>'
        +   '</div>'
        + '</div>'
        + '</article>';
    }).join('');
  }

  document.getElementById('cats').addEventListener('click', function(e){
    var b = e.target.closest('.cat');
    if(!b) return;
    state.cat = b.getAttribute('data-cat');
    state.page = 1;
    renderCats();
    renderGrid();
  });

  document.getElementById('grid').addEventListener('click', function(e){
    var b = e.target.closest('.c-add');
    if(b){ toast('已加入购物车'); return; }
    if(e.target.closest('.card')){ toast('商品详情页开发中'); }
  });

  document.getElementById('loadMore').addEventListener('click', function(){
    state.page++;
    renderGrid();
    toast('已加载更多商品');
  });

  renderCats();
  renderGrid();

  /* ---------- 语言/币种 ---------- */
  var langMask = document.getElementById('langMask');
  var langBtn = document.getElementById('langBtn');
  function openLang(){
    langMask.classList.add('show');
    langMask.setAttribute('aria-hidden','false');
    document.body.style.overflow = 'hidden';
  }
  function closeLang(){
    langMask.classList.remove('show');
    langMask.setAttribute('aria-hidden','true');
    document.body.style.overflow = '';
  }
  langBtn.addEventListener('click', openLang);
  document.getElementById('langClose').addEventListener('click', closeLang);
  langMask.addEventListener('click', function(e){ if(e.target === langMask){ closeLang(); } });

  langMask.addEventListener('click', function(e){
    var opt = e.target.closest('.opt');
    if(!opt) return;
    var type = opt.getAttribute('data-type');
    var group = opt.parentNode.querySelectorAll('.opt');
    for(var i = 0; i < group.length; i++){ group[i].classList.remove('on'); }
    opt.classList.add('on');
    var lang = langMask.querySelector('.opt[data-type="lang"].on').getAttribute('data-val');
    var cur  = langMask.querySelector('.opt[data-type="cur"].on').getAttribute('data-val');
    langBtn.querySelector('span').textContent = (lang === 'English' ? 'EN' : '中文') + '/' + cur;
    toast(type === 'lang' ? '语言已切换' : '币种已切换');
  });

  /* ---------- 其他入口 ---------- */
  document.getElementById('msgBtn').addEventListener('click', function(){ toast('消息中心开发中'); });
  document.getElementById('camBtn').addEventListener('click', function(){ toast('拍照搜同款开发中'); });
  document.getElementById('quickFreight').addEventListener('click', function(){ toast('运费估算开发中'); });
  document.getElementById('quickManual').addEventListener('click', function(){ toast('手工下单页开发中'); });
  document.getElementById('moreLink').addEventListener('click', function(e){ e.preventDefault(); toast('全部商品页开发中'); });
})();
</script>

</body>
</html>
