<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>FalconGoo 移动端首页</title>
<style>
  :root{
    --brand:#4b2ff0;
    --brand-d:#3a20d4;
    --brand-soft:#f1eeff;
    --ink:#14161b;
    --ink-2:#464c56;
    --ink-3:#8a9099;
    --line:#eef0f4;
    --bg:#f6f7f9;
    --r:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:#e9eaef;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;border:0;background:none;padding:0;cursor:pointer;color:inherit}
  input{font-family:inherit;border:0;background:none;outline:none}
  h1,h2,h3,p{margin:0}
  .app{
    position:relative;width:100%;max-width:440px;margin:0 auto;min-height:100vh;
    background:#fff;padding-bottom:calc(70px + env(safe-area-inset-bottom));
    overflow-x:clip;
  }

  /* ==================== 顶部 Hero ==================== */
  .hero{position:relative;padding:0 0 22px}
  .hero::before{
    content:'';position:absolute;inset:0 0 -40px;z-index:0;
    background:linear-gradient(180deg,#4b2ff0 0%,#5c3ef5 30%,#7c62f8 62%,#a795fb 86%,#d9d0ff 100%);
  }
  .hero>*{position:relative;z-index:1}
  .hd{
    position:relative;display:flex;align-items:center;justify-content:center;
    height:54px;padding:calc(env(safe-area-inset-top)) 14px 0;
  }
  .brand{
    font-size:22px;font-weight:800;color:#fff;letter-spacing:-.01em;
    text-shadow:0 2px 12px rgba(20,80,150,.22);line-height:1;
  }
  .brand i{font-style:normal;color:#d9ecff}
  .hd-right{position:absolute;right:12px;top:calc(env(safe-area-inset-top) + 10px);display:flex;align-items:center;gap:7px}
  .hd-btn{
    position:relative;width:34px;height:34px;border-radius:50%;
    display:grid;place-items:center;
    background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    transition:background .16s ease;
  }
  .hd-btn:active{background:rgba(255,255,255,.36)}
  .hd-btn svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .hd-btn .dot{
    position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;
    background:#ff4d4f;box-shadow:0 0 0 1.6px #5c3ef5;
  }
  .slogan{
    margin-top:10px;text-align:center;color:#fff;
    font-size:24px;font-weight:900;letter-spacing:.05em;line-height:1.2;
    text-shadow:0 3px 16px rgba(20,80,150,.26);
  }
  .slogan span{margin:0 6px}
  .plane{margin-top:0}
  .plane svg{display:block;height:118px;width:auto;max-width:100%;margin:0 auto}

  /* 进度卡 */
  .prog-card{
    margin:8px 12px 0;padding:10px 15px 12px;border-radius:14px;
    background:linear-gradient(180deg,rgba(255,255,255,.17),rgba(255,255,255,.06));
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  }
  .prog-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .prog-t{display:flex;align-items:baseline;gap:3px;font-size:13px;font-weight:800;color:#fff;white-space:nowrap}
  .prog-t b{font-size:15.5px;font-weight:900}
  .prog-clock{flex:none;width:22px;height:22px;color:rgba(255,255,255,.92)}
  .prog-clock svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .prog-track{position:relative;display:flex;align-items:center;gap:7px;height:21px;margin-top:9px}
  .node{flex:none;width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.28)}
  .arrows{
    flex:1;overflow:hidden;white-space:nowrap;
    color:rgba(255,255,255,.5);font-size:20px;font-weight:700;line-height:14px;letter-spacing:5px;
  }
  .pill{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    padding:4px 15px;border-radius:99px;background:#fff;color:#4b2ff0;
    font-size:12.5px;font-weight:800;white-space:nowrap;
    box-shadow:0 3px 10px rgba(52,30,150,.24);
  }

  /* ==================== 搜索（吸顶） ==================== */
  .search-wrap{
    position:sticky;top:0;z-index:60;
    margin-top:-18px;padding:0 12px 12px;
    transition:background .18s ease,box-shadow .18s ease,padding .18s ease;
  }
  .search-wrap.stuck{
    background:#fff;box-shadow:0 6px 18px rgba(20,22,27,.1);
    padding-top:10px;padding-bottom:9px;
  }
  .s-card{
    background:#fff;border-radius:18px;padding:11px;
    box-shadow:0 10px 26px rgba(52,30,150,.16);
    transition:box-shadow .18s ease,padding .18s ease;
  }
  .search-wrap.stuck .s-card{box-shadow:none;padding:0}
  .s-bar{
    display:flex;align-items:center;gap:8px;height:48px;
    padding:0 5px 0 16px;border:1.6px solid #6a4df5;border-radius:99px;
    background:#f8f6ff;
  }
  .s-bar>svg{flex:none;width:17px;height:17px;stroke:#9aa1ab;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .s-bar input{flex:1;min-width:0;font-size:13.5px;color:var(--ink)}
  .s-bar input::placeholder{color:#a9b0ba}
  .s-bar .cam{
    flex:none;width:32px;height:32px;border-radius:50%;
    display:grid;place-items:center;color:#6d7480;
  }
  .s-bar .cam svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .go{
    flex:none;height:38px;padding:0 22px;border-radius:99px;
    background:#4b2ff0;color:#fff;font-size:14px;font-weight:800;letter-spacing:.04em;
    box-shadow:0 3px 10px rgba(75,47,240,.34);transition:background .16s ease;
  }
  .go:active{background:#3a20d4}
  .quick-row{
    display:flex;gap:8px;margin-top:10px;overflow-x:auto;
    max-height:36px;opacity:1;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;
    transition:max-height .24s ease,opacity .18s ease,margin-top .24s ease;
  }
  .quick-row::-webkit-scrollbar{display:none}
  .search-wrap.stuck .quick-row{max-height:0;opacity:0;margin-top:0}
  .qc{
    flex:none;display:inline-flex;align-items:center;gap:1px;height:32px;
    padding:0 12px;border-radius:99px;background:#f2f4f7;color:#3c414a;
    font-size:12.5px;font-weight:600;white-space:nowrap;transition:background .16s ease;
  }
  .qc:active{background:#e7ebf1}
  .qc i{font-style:normal;color:#9aa1ab;font-weight:700;font-size:14px;line-height:1}

  /* ==================== 通用区块 ==================== */
  .sec{padding:20px 14px 0}
  .sec-hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
  .sec-hd h2{font-size:17px;font-weight:800;letter-spacing:-.02em}
  .sec-hd h2 b{color:var(--brand)}
  .sec-hd a{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:2px}
  .sec-hd a svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

  /* ==================== Banner ==================== */
  .bn{margin-top:18px;position:relative}
  .bn-track{
    display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;
    padding:0 14px 8px;scrollbar-width:none;
  }
  .bn-track::-webkit-scrollbar{display:none}
  .bn-item{
    flex:0 0 calc((100% - 10px) / 2);scroll-snap-align:start;height:132px;border-radius:16px;
    position:relative;overflow:hidden;padding:14px 14px 13px;color:#fff;
    display:flex;flex-direction:column;justify-content:center;
  }
  .bn-item::after{
    content:"";position:absolute;right:-30px;top:-30px;width:96px;height:96px;
    border-radius:50%;background:rgba(255,255,255,.16);
  }
  .bn-item .k{font-size:10px;font-weight:700;letter-spacing:.06em;opacity:.88;margin-bottom:5px}
  .bn-item .t{font-size:15px;font-weight:800;letter-spacing:-.01em;line-height:1.3}
  .bn-item .d{font-size:10.5px;opacity:.92;margin-top:5px;line-height:1.45}
  .bn-1{background:linear-gradient(120deg,#5b3df5,#8a6bff)}
  .bn-2{background:linear-gradient(120deg,#ff7a59,#ffb066)}
  .bn-3{background:linear-gradient(120deg,#1f9bd8,#3fc9c1)}
  .bn-4{background:linear-gradient(120deg,#e8437a,#ff8fb1)}
  .bn-5{background:linear-gradient(120deg,#12b981,#5ee0a8)}
  .bn-dots{display:flex;justify-content:center;gap:5px;margin-top:2px}
  .bn-dots i{width:5px;height:5px;border-radius:50%;background:#dcdfe6;transition:width .2s,background .2s}
  .bn-dots i.on{width:14px;border-radius:3px;background:var(--brand)}

  /* ==================== 商品 ==================== */
  .goods{padding:18px 14px 0}
  .cats{
    display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;
    margin:0 -14px 14px;padding:0 14px 2px;
  }
  .cats::-webkit-scrollbar{display:none}
  .cat{
    flex:none;height:32px;padding:0 15px;border-radius:99px;background:#f4f5f8;
    color:var(--ink-2);font-size:12.5px;font-weight:600;white-space:nowrap;
    display:flex;align-items:center;transition:background .16s,color .16s;
  }
  .cat.on{background:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(75,47,240,.26)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .card{border-radius:var(--r);overflow:hidden;background:#fff;border:1px solid var(--line)}
  .card:active{transform:scale(.99)}
  .c-img{
    position:relative;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:600;letter-spacing:.06em;color:rgba(20,22,27,.3);
  }
  .c-src{
    position:absolute;top:7px;left:7px;font-size:9.5px;font-weight:800;
    padding:2px 6px;border-radius:5px;background:rgba(255,255,255,.94);
  }
  .c-src.al{color:#ff6a00}
  .c-src.tb{color:#ff4400}
  .c-body{padding:9px 9px 10px}
  .c-title{
    font-size:12.5px;line-height:1.45;height:36px;overflow:hidden;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;color:var(--ink);
  }
  .c-foot{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:7px}
  .c-price{font-size:15.5px;font-weight:800;color:var(--brand);letter-spacing:-.02em;line-height:1}
  .c-price small{font-size:10.5px;font-weight:700;margin-right:1px}
  .c-old{font-size:10.5px;color:#b6bbc4;text-decoration:line-through;margin-left:4px}
  .c-add{
    width:28px;height:28px;border-radius:50%;background:var(--brand);flex:none;
    display:grid;place-items:center;box-shadow:0 3px 9px rgba(75,47,240,.3);
  }
  .c-add:active{background:var(--brand-d);transform:scale(.94)}
  .c-add svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  .sentinel{
    display:flex;align-items:center;justify-content:center;gap:7px;
    padding:18px 0 6px;color:#9aa1ab;font-size:12px;
  }
  .sentinel .spin{
    width:14px;height:14px;border-radius:50%;
    border:2px solid #e6e3f7;border-top-color:var(--brand);
    animation:sp .7s linear infinite;
  }
  @keyframes sp{to{transform:rotate(360deg)}}

  /* ==================== 底部导航 ==================== */
  .tabbar{
    position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:70;
    width:100%;max-width:440px;display:flex;
    background:rgba(255,255,255,.97);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border-top:1px solid var(--line);
    padding:7px 0 calc(7px + env(safe-area-inset-bottom));
  }
  .tab{
    position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    color:#9aa1ab;padding:2px 0;transition:color .16s ease;
  }
  .tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .tab span{font-size:10px;font-weight:600;letter-spacing:.01em}
  .tab.on{color:var(--brand)}
  .tab.on svg{stroke-width:2.1}
  .badge{
    position:absolute;top:-1px;left:calc(50% + 6px);
    min-width:16px;height:16px;padding:0 4px;border-radius:8px;
    background:#ff4d4f;color:#fff;font-size:9.5px;font-weight:800;font-style:normal;
    display:flex;align-items:center;justify-content:center;line-height:1;
    box-shadow:0 2px 5px rgba(255,77,79,.4);
  }

  /* ==================== 语言弹层 ==================== */
  .sheet-mask{
    position:fixed;inset:0;z-index:200;background:rgba(12,10,30,.42);
    display:none;align-items:flex-end;justify-content:center;
  }
  .sheet-mask.show{display:flex}
  .sheet{
    width:100%;max-width:440px;background:#fff;border-radius:20px 20px 0 0;
    padding:8px 0 calc(10px + env(safe-area-inset-bottom));
    animation:sheetUp .26s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
  .sheet-hd{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 18px 10px;border-bottom:1px solid var(--line);
  }
  .sheet-hd h3{font-size:14px;font-weight:800}
  .sheet-hd button{color:var(--ink-3);font-size:13px}
  .sheet-grp{padding:12px 18px 2px}
  .sheet-grp h4{font-size:11.5px;color:var(--ink-3);font-weight:600;margin-bottom:8px}
  .opt{
    display:flex;align-items:center;justify-content:space-between;
    padding:11px 12px;border-radius:11px;font-size:13.5px;margin-bottom:7px;
    border:1px solid var(--line);background:#fafafc;
  }
  .opt.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:700}
  .opt .ck{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;opacity:0}
  .opt.on .ck{opacity:1}

  /* ==================== Toast ==================== */
  .toast{
    position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(8px);
    z-index:300;background:rgba(20,22,27,.92);color:#fff;font-size:13px;
    padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;
    transition:opacity .2s,transform .2s;white-space:nowrap;max-width:86vw;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (min-width:441px){
    body{background:#e9eaef}
    .app{box-shadow:0 0 60px rgba(20,22,27,.1)}
  }
</style>
</head>
<body>

<div class="app" id="top">

  <!-- ==================== 顶部 Hero ==================== -->
  <div class="hero">
    <header class="hd">
      <h1 class="brand">Falcon<i>Goo</i></h1>
      <div class="hd-right">
        <button class="hd-btn" id="msgBtn" aria-label="消息">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9.3 9.3 0 0 1-3.8-.8L3 21l1.9-4.6A8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5Z"/></svg>
          <span class="dot" aria-hidden="true"></span>
        </button>
        <button class="hd-btn" id="langBtn" aria-label="切换语言和币种">
          <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18Z"/></svg>
        </button>
      </div>
    </header>

    <p class="slogan"><span>免费代购</span><span>全球寄送</span></p>

    <div class="plane" aria-hidden="true">
      <svg aria-hidden="true" viewBox="0 0 340 132" fill="none">
        <path d="M170 44 26 96c-7 2-6 8 1 7l143-15 143 15c7 1 8-5 1-7L170 44Z" fill="#e7f3fe"/>
        <path d="M170 18c-7 0-11 4-11 10h22c0-6-4-10-11-10Z" fill="#d8ecfb"/>
        <ellipse cx="112" cy="88" rx="15" ry="10.5" fill="#f5faff"/>
        <ellipse cx="228" cy="88" rx="15" ry="10.5" fill="#f5faff"/>
        <ellipse cx="112" cy="88" rx="8.5" ry="6" fill="#d9eafa"/>
        <ellipse cx="228" cy="88" rx="8.5" ry="6" fill="#d9eafa"/>
        <ellipse cx="170" cy="64" rx="26" ry="41" fill="#fff"/>
        <path d="M170 27c13 2 21 12 22 25h-44c1-13 9-23 22-25Z" fill="#d5e9fb"/>
        <path d="M170 33c9 2 15 9 16 17h-32c1-8 7-15 16-17Z" fill="#4a9fe8" fill-opacity=".5"/>
        <ellipse cx="170" cy="102" rx="9" ry="5" fill="#eef7fe"/>
      </svg>
    </div>

    <div class="prog-card">
      <div class="prog-top">
        <span class="prog-t"><b>1</b>购买/转运商品</span>
        <span class="prog-clock" aria-hidden="true"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.2v5.2l3.4 2"/></svg></span>
        <span class="prog-t"><b>2</b>提交国际运输</span>
      </div>
      <div class="prog-track">
        <i class="node" aria-hidden="true"></i>
        <span class="arrows" aria-hidden="true">››››››››››››››››››››››››</span>
        <i class="node" aria-hidden="true"></i>
        <span class="pill">等待入库</span>
      </div>
    </div>
  </div>

  <!-- ==================== 搜索（吸顶） ==================== -->
  <div class="search-wrap" id="searchWrap">
    <div class="s-card">
      <div class="s-bar">
        <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.6 4.6"/></svg>
        <input type="text" id="searchInput" placeholder="粘贴商品链接或输入关键字" aria-label="搜索商品">
        <button class="cam" id="camBtn" aria-label="拍照搜同款">
          <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="2.5" y="6.5" width="19" height="13" rx="3"/><circle cx="12" cy="13" r="3.4"/><path d="M8.5 6.5 10 4h4l1.5 2.5"/></svg>
        </button>
        <button class="go" id="goBtn">GO</button>
      </div>
      <div class="quick-row">
        <button class="qc" id="quickNewbie">新人指引 <i aria-hidden="true">›</i></button>
        <button class="qc" id="quickFreight">运费预估 <i aria-hidden="true">›</i></button>
        <button class="qc" id="quickManual">手工下单 <i aria-hidden="true">›</i></button>
      </div>
    </div>
  </div>

  <!-- ==================== Banner ==================== -->
  <section class="bn">
    <div class="bn-track" id="bnTrack">
      <div class="bn-item bn-1">
        <span class="k">新用户专享</span>
        <span class="t">首单免服务费</span>
        <span class="d">下单立减，最高省 ¥50</span>
      </div>
      <div class="bn-item bn-2">
        <span class="k">集运专线</span>
        <span class="t">全球运费 5 折起</span>
        <span class="d">美加欧澳全覆盖，7 天到门</span>
      </div>
      <div class="bn-item bn-3">
        <span class="k">囤货无忧</span>
        <span class="t">180 天免费仓储</span>
        <span class="d">攒够一批再寄，运费更省</span>
      </div>
      <div class="bn-item bn-4">
        <span class="k">邀请有礼</span>
        <span class="t">邀好友各得 ¥20</span>
        <span class="d">运费券实时到账</span>
      </div>
      <div class="bn-item bn-5">
        <span class="k">质检无忧</span>
        <span class="t">每件免费开箱拍照</span>
        <span class="d">到仓即拍，先看后寄</span>
      </div>
    </div>
    <div class="bn-dots" id="bnDots" aria-hidden="true">
      <i class="on"></i><i></i><i></i><i></i><i></i>
    </div>
  </section>

  <!-- ==================== 商品 ==================== -->
  <section class="goods">
    <div class="sec-hd">
      <h2>大家都在买</h2>
      <a href="#top" id="moreLink">
        全部
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg>
      </a>
    </div>

    <div class="cats" id="cats"></div>
    <div class="grid" id="grid"></div>

    <div class="sentinel" id="sentinel"><span class="spin" aria-hidden="true"></span><span>加载中…</span></div>
  </section>

  <!-- ==================== 底部导航 ==================== -->
  <nav class="tabbar" aria-label="底部导航">
    <div class="tab on">
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20H4z"/><path d="M9.5 20v-5.5h5V20"/></svg>
      <span>首页</span>
    </div>
    <div class="tab">
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5.5 7h13l-1.2 13H6.7z"/><path d="M9 7V5.2a3 3 0 0 1 6 0V7"/></svg>
      <span>代购</span>
    </div>
    <div class="tab">
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M2.5 7h11v8.5h-11z"/><path d="M13.5 10h3.6l3.4 3.5v2h-7z"/><circle cx="6.2" cy="18" r="1.7"/><circle cx="16.6" cy="18" r="1.7"/></svg>
      <span>转运</span>
    </div>
    <div class="tab">
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 2-1.6L21 8H6"/><circle cx="10" cy="20" r="1.3"/><circle cx="18" cy="20" r="1.3"/></svg>
      <span>购物车</span>

    </div>

</div>

<!-- ==================== 语言/币种弹层 ==================== -->
<div class="sheet-mask" id="langMask" aria-hidden="true">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="langTitle">
    <div class="sheet-hd">
      <h3 id="langTitle">语言与币种</h3>
      <button id="langClose">完成</button>
    </div>
    <div class="sheet-grp">
      <h4>语言</h4>
      <div class="opt on" data-type="lang" data-val="中文">
        简体中文
        <svg class="ck" aria-hidden="true" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>
      </div>
      <div class="opt" data-type="lang" data-val="English">
        English
        <svg class="ck" aria-hidden="true" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>
      </div>
    </div>
    <div class="sheet-grp">
      <h4>币种</h4>
      <div class="opt on" data-type="cur" data-val="CNY">
        人民币 CNY ¥
        <svg class="ck" aria-hidden="true" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>
      </div>
      <div class="opt" data-type="cur" data-val="USD">
        美元 USD $
        <svg class="ck" aria-hidden="true" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  var toastEl = document.getElementById('toast');
  var tTimer = null;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(tTimer);
    tTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 1800);
  }

  /* ---------- 搜索吸顶 ---------- */
  var wrap = document.getElementById('searchWrap');
  window.addEventListener('scroll', function(){
    wrap.classList.toggle('stuck', window.scrollY > 6);
  }, {passive:true});

  /* ---------- Banner 圆点 ---------- */
  var track = document.getElementById('bnTrack');
  var dots = document.getElementById('bnDots');
  if(track && dots){
    var items = track.children;
    track.addEventListener('scroll', function(){
      var max = track.scrollWidth - track.clientWidth;
      var idx = max > 0 ? Math.round(track.scrollLeft / max * (items.length - 1)) : 0;
      for(var i = 0; i < dots.children.length; i++){
        dots.children[i].classList.toggle('on', i === idx);
      }
    }, {passive:true});
  }

  /* ---------- 商品 ---------- */
  var CATS = ['推荐','男装','女装','母婴','美妆','日用品','运动','穿搭'];
  var NAMES = ['不锈钢保温杯 500ml 便携大容量','秋冬加厚连帽卫衣 男女同款','法式复古碎花吊带连衣裙 收腰显瘦','纯棉婴儿连体衣 新生儿和尚服','氨基酸洁面慕斯 温和清洁 100ml','日式陶瓷餐具套装 家用四件套','轻薄速干运动T恤 透气排汗','高腰阔腿牛仔裤 显瘦百搭'];
  var GRADS = [
    'linear-gradient(135deg,#fde8ef,#f6cfe0)',
    'linear-gradient(135deg,#e6f6ec,#cfeada)',
    'linear-gradient(135deg,#eef0f4,#dfe3ea)',
    'linear-gradient(135deg,#fdf0e3,#f7ddc2)',
    'linear-gradient(135deg,#e8eefc,#cfdaf5)',
    'linear-gradient(135deg,#f3ecfd,#e2d5f8)'
  ];
  var state = {cat:'推荐', page:1};
  var PAGE = 8;

  function makeProduct(cat, i){
    var seed = i + cat.length;
    var price = 19.9 + (seed * 37 % 260);
    var old = price * (1.35 + (seed % 5) / 10);
    return {
      title: NAMES[i % NAMES.length],
      price: price.toFixed(1),
      old: old.toFixed(1),
      src: (i % 2 === 0 ? '1688' : '淘宝'),
      grad: GRADS[seed % GRADS.length],
      label: cat
    };
  }

  function renderCats(){
    document.getElementById('cats').innerHTML = CATS.map(function(c){
      return '<button class="cat' + (c === state.cat ? ' on' : '') + '" data-cat="' + c + '">' + c + '</button>';
    }).join('');
  }

  function renderGrid(){
    var total = PAGE * state.page;
    var list = [];
    for(var i = 0; i < total; i++){ list.push(makeProduct(state.cat, i)); }
    document.getElementById('grid').innerHTML = list.map(function(p, i){
      return '<article class="card">'
        + '<div class="c-img" style="background:' + p.grad + '">'
        +   '<span class="c-src ' + (p.src === '淘宝' ? 'tb' : 'al') + '">' + p.src + '</span>'
        +   p.label
        + '</div>'
        + '<div class="c-body">'
        +   '<p class="c-title">' + p.title + '</p>'
        +   '<div class="c-foot">'
        +     '<div><span class="c-price"><small>¥</small>' + p.price + '</span>'
        +     '<span class="c-old">¥' + p.old + '</span></div>'
        +     '<button class="c-add" data-i="' + i + '" aria-label="加入购物车">'
        +       '<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 2-1.6L21 8H6"/><circle cx="10" cy="20" r="1.3"/><circle cx="18" cy="20" r="1.3"/></svg>'
        +     '</button>'
        +   '</div>'
        + '</div>'
        + '</article>';
    }).join('');
  }

  document.getElementById('cats').addEventListener('click', function(e){
    var b = e.target.closest('.cat');
    if(!b) return;
    state.cat = b.getAttribute('data-cat');
    state.page = 1;
    ended = false; loading = false;
    if(typeof setTip === 'function'){ setTip('<span class="spin" aria-hidden="true"></span><span>加载中…</span>'); }
    renderCats();
    renderGrid();
    if(typeof io === 'object' && io){ io.unobserve(sentinel); io.observe(sentinel); }
  });

  document.getElementById('grid').addEventListener('click', function(e){
    var b = e.target.closest('.c-add');
    if(b){ toast('已加入购物车'); return; }
    if(e.target.closest('.card')){ toast('商品详情页开发中'); }
  });

  /* 滚动到底自动加载 */
  var sentinel = document.getElementById('sentinel');
  var loading = false, MAXPAGE = 6, ended = false;
  function setTip(html){ sentinel.innerHTML = html; }
  var io = new IntersectionObserver(function(entries){
    for(var k = 0; k < entries.length; k++){
      if(!entries[k].isIntersecting) continue;
      if(loading || ended) return;
      if(state.page >= MAXPAGE){ ended = true; setTip('<span>已经到底啦</span>'); return; }
      loading = true;
      setTimeout(function(){
        state.page++;
        renderGrid();
        loading = false;
        if(state.page >= MAXPAGE){ ended = true; setTip('<span>已经到底啦</span>'); }
      }, 420);
    }
  }, {rootMargin:'160px 0px'});
  if('IntersectionObserver' in window){ io.observe(sentinel); }

  renderCats();
  renderGrid();

  /* ---------- 语言/币种 ---------- */
  var langMask = document.getElementById('langMask');
  var langBtn = document.getElementById('langBtn');
  function openLang(){
    langMask.classList.add('show');
    langMask.setAttribute('aria-hidden','false');
    document.body.style.overflow = 'hidden';
  }
  function closeLang(){
    langMask.classList.remove('show');
    langMask.setAttribute('aria-hidden','true');
    document.body.style.overflow = '';
  }
  langBtn.addEventListener('click', openLang);
  document.getElementById('langClose').addEventListener('click', closeLang);
  langMask.addEventListener('click', function(e){ if(e.target === langMask){ closeLang(); } });

  langMask.addEventListener('click', function(e){
    var opt = e.target.closest('.opt');
    if(!opt) return;
    var type = opt.getAttribute('data-type');
    var group = opt.parentNode.querySelectorAll('.opt');
    for(var i = 0; i < group.length; i++){ group[i].classList.remove('on'); }
    opt.classList.add('on');
    var lang = langMask.querySelector('.opt[data-type="lang"].on').getAttribute('data-val');
    var cur  = langMask.querySelector('.opt[data-type="cur"].on').getAttribute('data-val');
    langBtn.setAttribute('aria-label', (lang === 'English' ? 'EN' : '中文') + '/' + cur);
    toast(type === 'lang' ? '语言已切换' : '币种已切换');
  });

  /* ---------- 其他入口 ---------- */
  document.getElementById('msgBtn').addEventListener('click', function(){ toast('消息中心开发中'); });
  document.getElementById('camBtn').addEventListener('click', function(){ toast('拍照搜同款开发中'); });
  document.getElementById('quickNewbie').addEventListener('click', function(){ toast('新人指引页开发中'); });
  document.getElementById('quickFreight').addEventListener('click', function(){ toast('运费预估开发中'); });
  document.getElementById('quickManual').addEventListener('click', function(){ toast('手工下单页开发中'); });
  document.getElementById('goBtn').addEventListener('click', function(){
    var v = document.getElementById('searchInput').value.trim();
    toast(v ? '正在搜索：' + v : '请先粘贴商品链接或输入关键字');
  });
  document.getElementById('searchInput').addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ document.getElementById('goBtn').click(); }
  });
  Array.prototype.forEach.call(document.querySelectorAll('.qc[data-n]'), function(b){
    b.addEventListener('click', function(){ toast(b.getAttribute('data-n') + '页开发中'); });
  });
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(t, i){
    if(i === 0) return;
    t.addEventListener('click', function(){ toast(t.querySelector('span').textContent + '页开发中'); });
  });
  document.getElementById('moreLink').addEventListener('click', function(e){ e.preventDefault(); toast('全部商品页开发中'); });
})();
</script>

</body>
</html>
