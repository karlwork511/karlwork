<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>收银台 · 选择付款方式</title>
<style>
  :root{
    --brand:#6C5CE7;
    --brand-soft:#F2EFFF;
    --brand-line:#D9D2FB;
    --link:#2F6BFF;
    --text-1:#171A2A;
    --text-2:#565C70;
    --text-3:#8A90A2;
    --line:#EDEFF4;
    --line-strong:#E3E6EE;
    --bg:#F6F7FB;
    --card:#FFFFFF;
    --radius:14px;
  }

  *{box-sizing:border-box}

  html,body{margin:0;padding:0}

  body{
    background:var(--bg);
    color:var(--text-1);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }

  .topbar{
    background:#fff;
    border-bottom:1px solid var(--line);
    padding:0 24px;
  }

  .topbar-inner{
    max-width:1180px;
    margin:0 auto;
    height:58px;
    display:flex;
    align-items:center;
    gap:10px;
  }

  .brand-mark{
    width:26px;
    height:26px;
    border-radius:8px;
    background:linear-gradient(135deg,#6C5CE7,#9A8BFF);
    color:#fff;
    font-size:13px;
    font-weight:700;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    flex:none;
  }

  .brand-name{
    font-size:15px;
    font-weight:600;
    letter-spacing:.2px;
  }

  .topbar-sep{
    width:1px;
    height:16px;
    background:var(--line-strong);
    margin:0 4px;
  }

  .topbar-crumb{
    font-size:13px;
    color:var(--text-3);
  }

  .wrap{
    max-width:1180px;
    margin:0 auto;
    padding:28px 24px 64px;
    display:grid;
    grid-template-columns:minmax(0,1fr) 352px;
    gap:24px;
    align-items:start;
  }

  .pay-head{
    margin:0 0 6px;
    font-size:22px;
    font-weight:600;
    letter-spacing:-.2px;
  }

  .page-sub{
    margin:0 0 22px;
    font-size:12.5px;
    color:var(--text-3);
    line-height:1.7;
  }

  .group{
    margin-bottom:16px;
  }

  .group-title{
    margin:0 0 9px;
    font-size:13px;
    font-weight:500;
    color:var(--text-3);
    letter-spacing:.2px;
  }

  .group-card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:8px;
  }

  .group-card--balance{
    padding:16px;
  }

  .pay-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:11px 12px;
    border:1px solid transparent;
    border-radius:11px;
    background:#fff;
    cursor:pointer;
    transition:background .15s ease, border-color .15s ease;
  }

  .pay-row:hover{background:#FAFAFD}

  .pay-row.is-active{
    background:var(--brand-soft);
    border-color:var(--brand-line);
  }

  .radio{
    appearance:none;
    -webkit-appearance:none;
    width:18px;
    height:18px;
    border-radius:50%;
    border:1.5px solid #C7CBD8;
    background:#fff;
    margin:0;
    flex:none;
    cursor:pointer;
    transition:border-color .15s ease, border-width .15s ease;
  }

  .radio:checked{
    border:5px solid var(--brand);
  }

  .radio:focus-visible{
    outline:2px solid var(--brand);
    outline-offset:2px;
  }

  /* 账户余额支付 */
  .balance-row{
    background:#F8F9FC;
    border:1px solid #EDEFF5;
    border-radius:11px;
    padding:14px 16px;
    gap:14px;
  }

  .balance-row:hover{background:#F5F6FA}

  .balance-row.is-active{
    background:var(--brand-soft);
    border-color:var(--brand-line);
  }

  .bal-logo{
    width:44px;
    height:30px;
    flex:none;
    border-radius:6px;
    background:#fff;
    border:1px solid #E9ECF2;
    display:inline-flex;
    align-items:center;
    justify-content:center;
  }

  .bal-text{
    font-size:14px;
    font-weight:500;
    color:var(--text-1);
    min-width:0;
  }

  .bal-approx{
    font-size:12.5px;
    font-weight:400;
    color:var(--text-3);
    margin-left:2px;
  }

  .recharge{
    margin-left:auto;
    border:0;
    background:transparent;
    padding:0;
    font-family:inherit;
    font-size:13px;
    font-weight:500;
    color:var(--link);
    cursor:pointer;
    flex:none;
  }

  .recharge:hover{text-decoration:underline}

  /* 在线支付图标 */
  .logo{
    width:78px;
    height:34px;
    flex:none;
    border:1px solid var(--line-strong);
    border-radius:7px;
    background:#fff;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:4px;
    line-height:1;
    overflow:hidden;
  }

  .lg-visa{
    color:#1A1F71;
    font-size:10px;
    font-weight:800;
    font-style:italic;
    letter-spacing:-.5px;
  }

  .lg-mc{
    width:19px;
    height:12px;
    flex:none;
  }

  .lg-amex{
    background:#2E77BC;
    color:#fff;
    font-size:6.5px;
    font-weight:800;
    letter-spacing:.2px;
    padding:2px 2.5px;
    border-radius:2px;
  }

  .lg-alipay{
    color:#1677FF;
    font-size:13px;
    font-weight:700;
    letter-spacing:-.4px;
  }

  .lg-yoomoney{
    color:#8B3FFD;
    font-size:12px;
    font-weight:800;
    letter-spacing:-.5px;
  }

  .lg-apple-pay{
    color:#111;
    font-size:13px;
    font-weight:600;
    letter-spacing:-.2px;
    display:inline-flex;
    align-items:center;
    gap:2px;
  }

  .lg-gpay{
    display:inline-flex;
    align-items:baseline;
    gap:1px;
  }

  .lg-g{
    color:#4285F4;
    font-size:15px;
    font-weight:700;
    letter-spacing:-.3px;
  }

  .lg-gpay-txt{
    color:#5F6368;
    font-size:13px;
    font-weight:500;
  }

  .lg-payid{
    display:inline-flex;
    align-items:center;
    gap:2px;
  }

  .lg-payid-txt{
    color:#111;
    font-size:13px;
    font-weight:700;
    letter-spacing:-.3px;
  }

  .lg-payid-id{
    background:#7B2FF7;
    color:#fff;
    font-size:8px;
    font-weight:800;
    letter-spacing:.2px;
    padding:3px 3px;
    border-radius:4px;
    line-height:1;
  }

  .pay-info{
    display:flex;
    flex-direction:column;
    gap:2px;
    min-width:0;
  }

  .pay-name{
    font-size:14px;
    font-weight:500;
    color:var(--text-1);
  }

  .pay-row.is-active .pay-name{font-weight:600}

  /* 付款详情 */
  .sum-col{
    position:sticky;
    top:20px;
    align-self:start;
  }

  .sum-card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px;
    box-shadow:0 1px 2px rgba(23,26,42,.03);
  }

  .sum-title{
    margin:0 0 16px;
    font-size:15px;
    font-weight:600;
    letter-spacing:-.1px;
  }

  .sum-list{
    margin:0;
    display:flex;
    flex-direction:column;
    gap:11px;
  }

  .sum-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }

  .sum-row dt{
    display:flex;
    align-items:center;
    gap:5px;
    margin:0;
    font-size:13px;
    color:var(--text-2);
    flex:none;
  }

  .sum-row dd{
    margin:0;
    text-align:right;
    font-size:13.5px;
    font-weight:500;
    color:var(--text-1);
    min-width:0;
  }

  .amt-sub{
    display:block;
    font-size:11.5px;
    font-weight:400;
    color:var(--text-3);
    margin-top:1px;
  }

  .amt-plain{
    font-size:13px;
    font-weight:500;
    color:var(--text-3);
  }

  .q-wrap{
    position:relative;
    display:inline-flex;
    align-items:center;
  }

  .q-mark{
    width:15px;
    height:15px;
    padding:0;
    border:1px solid #C7CBD8;
    border-radius:50%;
    background:#fff;
    color:var(--text-3);
    font-family:inherit;
    font-size:10px;
    font-weight:700;
    line-height:1;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    cursor:help;
    transition:border-color .15s ease, color .15s ease;
  }

  .q-mark:hover,
  .q-mark:focus-visible{
    border-color:var(--brand);
    color:var(--brand);
    outline:none;
  }

  .q-tip{
    position:absolute;
    left:-10px;
    bottom:calc(100% + 8px);
    z-index:6;
    padding:7px 10px;
    border:1px solid var(--line-strong);
    border-radius:8px;
    background:#fff;
    box-shadow:0 8px 22px rgba(23,26,42,.12);
    font-size:12px;
    font-weight:400;
    color:var(--text-2);
    white-space:nowrap;
    opacity:0;
    transform:translateY(4px);
    pointer-events:none;
    transition:opacity .15s ease, transform .15s ease;
  }

  .q-wrap:hover .q-tip,
  .q-wrap:focus-within .q-tip{
    opacity:1;
    transform:translateY(0);
  }

  .fx-tag{
    display:inline-block;
    padding:1px 5px;
    margin:0 2px;
    border-radius:4px;
    background:#F0EDFF;
    color:#6B5CF0;
    font-size:11px;
    font-weight:500;
  }

  .sum-row dd.is-fx{
    font-size:12.5px;
    font-weight:500;
    color:var(--text-2);
  }

  .sum-total{
    margin-top:16px;
    padding-top:15px;
    border-top:1px dashed var(--line-strong);
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
  }

  .sum-total-label{
    font-size:13px;
    color:var(--text-2);
    padding-top:3px;
    flex:none;
  }

  .total-block{text-align:right}

  .total-main{
    display:block;
    font-size:21px;
    font-weight:600;
    letter-spacing:-.4px;
    color:var(--text-1);
  }

  .total-cny{
    display:block;
    margin-top:2px;
    font-size:12px;
    color:var(--text-3);
  }

  .agree{
    display:flex;
    align-items:flex-start;
    gap:7px;
    margin:16px 0 12px;
    font-size:12px;
    color:var(--text-3);
    cursor:pointer;
  }

  .agree input{
    margin:2px 0 0;
    width:14px;
    height:14px;
    accent-color:var(--brand);
    flex:none;
    cursor:pointer;
  }

  .pay-btn{
    width:100%;
    height:44px;
    border:0;
    border-radius:10px;
    background:var(--brand);
    color:#fff;
    font-family:inherit;
    font-size:14.5px;
    font-weight:600;
    letter-spacing:.2px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    transition:background .15s ease;
  }

  .pay-btn:hover{background:#5B4CD6}

  .pay-btn:focus-visible{
    outline:2px solid var(--brand);
    outline-offset:2px;
  }

  .sum-note{
    margin:12px 0 0;
    font-size:11.5px;
    line-height:1.65;
    color:var(--text-3);
  }

  @media (max-width:900px){
    .wrap{
      grid-template-columns:minmax(0,1fr);
      padding:22px 16px 48px;
    }

    .sum-col{
      position:static;
    }

    .sum-card{
      padding:18px;
    }
  }

  @media (max-width:420px){
    .logo{width:70px;gap:3px}
    .lg-visa{font-size:9px}
    .lg-mc{width:16px;height:10px}
    .lg-amex{font-size:6px}
    .pay-head{font-size:20px}
    .balance-row{padding:12px 13px;gap:11px}
    .bal-text{font-size:13.5px}
  }

  @media (prefers-reduced-motion:reduce){
    *{transition:none !important}
  }

  @media print{
    body{background:#fff}
    .topbar{display:none}
    .wrap{display:block;max-width:none;padding:0}
    .sum-col{position:static;margin-top:16px}
    .q-tip{display:none}
    .pay-btn,.agree{display:none}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <span class="brand-mark" aria-hidden="true">S</span>
    <span class="brand-name">SZT</span>
    <span class="topbar-sep" aria-hidden="true"></span>
    <span class="topbar-crumb">提交包裹 · 收银台</span>
  </div>
</header>

<main class="wrap">
  <section class="pay-col">
    <h1 class="pay-head">选择付款方式</h1>
    <p class="page-sub">
      应付金额以人民币为基准计算，切换支付方式后按该渠道收款币种自动换算展示<br>
      收款币种由支付渠道决定，与用户端展示币种设置无关
    </p>

    <div class="group">
      <h2 class="group-title">账户余额支付</h2>
      <div class="group-card group-card--balance">
        <label class="pay-row balance-row is-active" for="pm-balance">
          <input class="radio" type="radio" name="paymethod" id="pm-balance" value="balance" checked>
          <span class="bal-logo" aria-hidden="true">
            <svg viewBox="0 0 34 22" width="34" height="22" aria-hidden="true">
              <rect x="1" y="1" width="32" height="20" rx="4" fill="#1B1E27"></rect>
              <rect x="4" y="14.5" width="9" height="3" rx="1.5" fill="#5A6076"></rect>
              <text x="24.5" y="9.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="6" font-style="italic" font-weight="700" fill="#FFFFFF">VISA</text>
            </svg>
          </span>
          <span class="bal-text">账户余额 CNY 37.87 <span class="bal-approx">(≈ AUD 8.55)</span></span>
          <button type="button" class="recharge">立即充值</button>
        </label>
      </div>
    </div>

    <div class="group">
      <h2 class="group-title">在线支付</h2>
      <div class="group-card">
        <div class="pay-list" id="pay-list">
          <label class="pay-row" for="pm-alipay">
            <input class="radio" type="radio" name="paymethod" id="pm-alipay" value="alipay">
            <span class="logo" aria-hidden="true"><span class="lg-alipay">Alipay</span></span>
            <span class="pay-info"><span class="pay-name">支付宝</span></span>
          </label>

          <label class="pay-row" for="pm-yoomoney">
            <input class="radio" type="radio" name="paymethod" id="pm-yoomoney" value="yoomoney">
            <span class="logo" aria-hidden="true"><span class="lg-yoomoney">yoomoney</span></span>
            <span class="pay-info"><span class="pay-name">YooMoney</span></span>
          </label>

          <label class="pay-row" for="pm-card">
            <input class="radio" type="radio" name="paymethod" id="pm-card" value="card">
            <span class="logo" aria-hidden="true">
              <span class="lg-visa">VISA</span>
              <svg class="lg-mc" viewBox="0 0 30 18" aria-hidden="true">
                <circle cx="11" cy="9" r="8" fill="#EB001B"></circle>
                <circle cx="19" cy="9" r="8" fill="#F79E1B" opacity=".82"></circle>
              </svg>
              <span class="lg-amex">AMEX</span>
            </span>
            <span class="pay-info"><span class="pay-name">信用卡</span></span>
          </label>

          <label class="pay-row" for="pm-applepay">
            <input class="radio" type="radio" name="paymethod" id="pm-applepay" value="applepay">
            <span class="logo" aria-hidden="true">
              <span class="lg-apple-pay">
                <svg viewBox="0 0 24 24" width="12" height="14" fill="#111" aria-hidden="true">
                  <path d="M16.37 1.43c0 1.14-.42 2.2-1.26 3.03-.9.9-1.94 1.4-3.05 1.32-.02-1.13.44-2.2 1.25-3.02.85-.87 1.95-1.4 3.06-1.33zM20.6 17.05c-.5 1.15-.74 1.66-1.38 2.68-.9 1.42-2.17 3.19-3.75 3.2-1.4.02-1.76-.9-3.66-.9-1.9 0-2.3.9-3.67.92-1.58.02-2.78-1.6-3.68-3.02C2.06 16.4 1.8 11.9 3.3 9.5c1.05-1.7 2.7-2.7 4.26-2.7 1.6 0 2.6.9 3.92.9 1.28 0 2.06-.9 3.9-.9 1.4 0 2.87.76 3.92 2.08-3.44 1.88-2.88 6.8 1.3 8.17z"></path>
                </svg>
                <span>Pay</span>
              </span>
            </span>
            <span class="pay-info"><span class="pay-name">Apple Pay</span></span>
          </label>

          <label class="pay-row" for="pm-payid">
            <input class="radio" type="radio" name="paymethod" id="pm-payid" value="payid">
            <span class="logo" aria-hidden="true">
              <span class="lg-payid">
                <span class="lg-payid-txt">Pay</span>
                <span class="lg-payid-id">ID</span>
              </span>
            </span>
            <span class="pay-info"><span class="pay-name">PayID</span></span>
          </label>

          <label class="pay-row" for="pm-googlepay">
            <input class="radio" type="radio" name="paymethod" id="pm-googlepay" value="googlepay">
            <span class="logo" aria-hidden="true">
              <span class="lg-gpay">
                <span class="lg-g">G</span>
                <span class="lg-gpay-txt">Pay</span>
              </span>
            </span>
            <span class="pay-info"><span class="pay-name">Google Pay</span></span>
          </label>
        </div>
      </div>
    </div>
  </section>

  <aside class="sum-col">
    <div class="sum-card">
      <h2 class="sum-title">付款详情</h2>

      <dl class="sum-list">
        <div class="sum-row">
          <dt>应付金额</dt>
          <dd id="sum-payable"></dd>
        </div>

        <div class="sum-row">
          <dt>
            支付手续费
            <span class="q-wrap">
              <button type="button" class="q-mark" aria-describedby="fee-tip" aria-label="手续费计算方式">?</button>
              <span class="q-tip" id="fee-tip" role="tooltip"></span>
            </span>
          </dt>
          <dd id="sum-fee"></dd>
        </div>

        <div class="sum-row">
          <dt>付款方式</dt>
          <dd id="sum-method"></dd>
        </div>

        <div class="sum-row">
          <dt>汇率</dt>
          <dd id="sum-fx" class="is-fx"></dd>
        </div>
      </dl>

      <div class="sum-total">
        <span class="sum-total-label">实际应付金额</span>
        <div class="total-block">
          <span class="total-main" id="sum-total"></span>
          <span class="total-cny" id="sum-total-cny"></span>
        </div>
      </div>

      <label class="agree">
        <input type="checkbox" checked>
        <span>我已阅读并同意《支付服务协议》，并确认以上金额为本次实际支付金额</span>
      </label>

      <button type="button" class="pay-btn" id="pay-btn">立即支付</button>

      <p class="sum-note">收款币种由所选支付方式决定，与账户展示币种无关，实际扣款以支付渠道结算为准。</p>
    </div>
  </aside>
</main>

<script>
  var FX = { CNY: 1, USD: 0.149, RUB: 12.3762, AUD: 0.2257 };
  var SYMBOL = { CNY: 'CN ¥', USD: '$', RUB: '₽', AUD: 'A$' };
  var ORDER_CNY = 32.40;

  /* 账户余额约合展示币种（对应截图中的 ≈ AUD 口径，可按需改成用户展示币种） */
  var BALANCE_CNY = 37.87;
  var BALANCE_DISPLAY_CUR = 'AUD';

  var METHODS = {
    balance:   { name: '账户余额',  currency: 'CNY', rate: 0,     fixed: null },
    alipay:    { name: '支付宝',    currency: 'CNY', rate: 0,     fixed: null },
    yoomoney:  { name: 'YooMoney',  currency: 'RUB', rate: 0.027, fixed: null },
    card:      { name: '信用卡',    currency: 'USD', rate: 0.043, fixed: { amount: 0.3, currency: 'USD' } },
    applepay:  { name: 'Apple Pay', currency: 'USD', rate: 0.043, fixed: { amount: 0.3, currency: 'USD' } },
    payid:     { name: 'PayID',     currency: 'AUD', rate: 0.02,  fixed: { amount: 0.7, currency: 'AUD' } },
    googlepay: { name: 'Google Pay', currency: 'USD', rate: 0.043, fixed: { amount: 0.3, currency: 'USD' } }
  };

  var FIXED_SYMBOL = { USD: 'US $', AUD: 'AU $', RUB: 'RUB ', CNY: 'CN ¥' };

  function byId(id) { return document.getElementById(id); }

  function round2(n) { return Math.round(n * 100) / 100; }

  function fmt(n) {
    var parts = Math.abs(n).toFixed(2).split('.');
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (n < 0 ? '-' : '') + parts[0] + '.' + parts[1];
  }

  function money(n, currency) { return SYMBOL[currency] + ' ' + fmt(n); }

  function cnyText(n) { return 'CN ¥ ' + fmt(n); }

  function pct(rate) { return String(Math.round(rate * 10000) / 100); }

  function compute(id) {
    var m = METHODS[id] || METHODS.card;
    var fx = FX[m.currency];
    var fixedCny = m.fixed ? m.fixed.amount / FX[m.fixed.currency] : 0;
    var feeCny = round2(ORDER_CNY * m.rate + fixedCny);
    var totalCny = round2(ORDER_CNY + feeCny);
    return {
      m: m,
      fx: fx,
      feeCny: feeCny,
      totalCny: totalCny,
      payable: money(round2(ORDER_CNY * fx), m.currency),
      fee: money(round2(feeCny * fx), m.currency),
      total: money(round2(totalCny * fx), m.currency)
    };
  }

  function tipText(m) {
    if (!m.rate) { return '该支付方式免收手续费'; }
    var s = '(=应付金额*' + pct(m.rate) + '%';
    if (m.fixed) {
      s += ' + ' + (FIXED_SYMBOL[m.fixed.currency] || '') + m.fixed.amount;
    }
    return s + ')';
  }

  function setPair(el, main, sub) {
    el.textContent = '';
    var a = document.createElement('span');
    a.textContent = main;
    el.appendChild(a);
    if (sub) {
      var b = document.createElement('span');
      b.className = 'amt-sub';
      b.textContent = '(' + sub + ')';
      el.appendChild(b);
    }
  }

  function setPlain(el, text) {
    el.textContent = '';
    var s = document.createElement('span');
    s.className = 'amt-plain';
    s.textContent = text;
    el.appendChild(s);
  }

  function render(id) {
    var r = compute(id);
    var cur = r.m.currency;
    var sameCurrency = cur === 'CNY';

    setPair(byId('sum-payable'), r.payable, sameCurrency ? '' : cnyText(ORDER_CNY));

    if (r.feeCny > 0) {
      setPair(byId('sum-fee'), r.fee, sameCurrency ? '' : cnyText(r.feeCny));
    } else {
      setPlain(byId('sum-fee'), '免手续费');
    }

    byId('sum-method').textContent = r.m.name;

    var fxEl = byId('sum-fx');
    fxEl.textContent = 'CNY → ' + cur + ' ';
    var tag = document.createElement('span');
    tag.className = 'fx-tag';
    tag.textContent = '汇率';
    fxEl.appendChild(tag);
    fxEl.appendChild(document.createTextNode(' 1:' + (sameCurrency ? '1' : String(r.fx))));

    byId('fee-tip').textContent = tipText(r.m);

    byId('sum-total').textContent = r.total;
    byId('sum-total-cny').textContent = sameCurrency ? '' : '(' + cnyText(r.totalCny) + ')';

    byId('pay-btn').textContent = '立即支付 ' + r.total;
  }

  function selectRow(row) {
    var rows = document.querySelectorAll('.pay-row');
    for (var i = 0; i < rows.length; i++) {
      rows[i].classList.remove('is-active');
    }
    row.classList.add('is-active');
    render(row.querySelector('input').value);
  }

  var rows = document.querySelectorAll('.pay-row');
  for (var i = 0; i < rows.length; i++) {
    (function (row) {
      row.addEventListener('click', function (e) {
        if (e.target.closest('.recharge')) { return; }
        selectRow(row);
      });
      row.querySelector('input').addEventListener('change', function () {
        selectRow(row);
      });
    })(rows[i]);
  }

  var rechargeBtn = document.querySelector('.recharge');
  if (rechargeBtn) {
    rechargeBtn.addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();
    });
  }

  render('balance');
</script>

</body>
</html>
