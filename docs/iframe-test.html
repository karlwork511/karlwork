<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>嵌入测试</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; }
  .test-header { background: #fff; padding: 12px 20px; border-bottom: 1px solid #e5e7eb; display: flex; align-items: center; justify-content: space-between; }
  .test-header h2 { font-size: 14px; color: #6b7280; }
  .test-header a { color: #3b82f6; text-decoration: none; font-size: 13px; }
  .iframe-wrap { width: 100%; height: calc(100vh - 49px); }
  .iframe-wrap iframe { width: 100%; height: 100%; border: none; }
  .fallback { display: none; padding: 60px 20px; text-align: center; color: #6b7280; }
  .fallback a { color: #3b82f6; }
</style>
</head>
<body>
<div class="test-header">
  <h2>企业微信文档嵌入测试</h2>
  <a href="https://page.weixin.qq.com/smartpage/p/b1_Ad0AKAaaAGUj4zj0gqJSSWhln9o?p=Tl270p" target="_blank">新窗口打开</a>
</div>
<div class="iframe-wrap">
  <iframe id="docFrame" src="https://page.weixin.qq.com/smartpage/p/b1_Ad0AKAaaAGUj4zj0gqJSSWhln9o?p=Tl270p" sandbox="allow-scripts allow-same-origin allow-popups allow-forms"></iframe>
</div>
<div class="fallback" id="fallback">
  <p>该文档不支持 iframe 嵌入（被浏览器拦截）</p>
  <p>请 <a href="https://page.weixin.qq.com/smartpage/p/b1_Ad0AKAaaAGUj4zj0gqJSSWhln9o?p=Tl270p" target="_blank">点击这里在新窗口打开</a></p>
</div>
<script>
setTimeout(function() {
  var frame = document.getElementById("docFrame");
  var wrap = document.querySelector(".iframe-wrap");
  var fb = document.getElementById("fallback");
  if (!frame.contentDocument && !frame.contentWindow) {
    wrap.style.display = "none";
    fb.style.display = "block";
  }
}, 5000);
</script>
</body>
</html>
