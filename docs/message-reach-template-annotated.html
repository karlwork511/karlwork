<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>消息触达_消息模板配置_v2</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; color: #333; background: #F5F7FA; height: 100vh; overflow: hidden; }

.app-container { display: flex; flex-direction: column; height: 100vh; }

.annotation-toolbar { display: flex; align-items: center; justify-content: flex-end; padding: 8px 16px; background: #fff; border-bottom: 1px solid #E4E7ED; flex-shrink: 0; z-index: 100; }
.toolbar-edit-btn { padding: 6px 14px; border: 1px solid #DCDFE6; background: #fff; border-radius: 4px; cursor: pointer; font-size: 13px; color: #333; display: flex; align-items: center; gap: 4px; transition: all 0.2s; }
.toolbar-edit-btn:hover { border-color: #165DFF; color: #165DFF; }

.workspace { flex: 1; display: flex; min-height: 0; min-width: 0; }
.preview-area { flex: 1; min-width: 0; overflow: auto; padding: 16px; position: relative; }

.annotation-panel { width: 300px; background: #F7F8FA; border-left: 1px solid #E4E7ED; overflow-y: auto; flex-shrink: 0; transition: width 0.3s ease; }
.annotation-panel.collapsed { width: 0; border-left: none; overflow: hidden; }
.panel-header { padding: 16px; font-size: 15px; font-weight: 600; color: #333; border-bottom: 1px solid #E4E7ED; background: #F7F8FA; position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 8px; }
.panel-toggle-btn { width: 24px; height: 24px; border: none; background: #E8EAED; border-radius: 4px; cursor: pointer; font-size: 12px; color: #666; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.panel-toggle-btn:hover { background: #DCDFE6; color: #333; }
.panel-expand-btn { position: fixed; top: 50%; right: 0; transform: translateY(-50%); width: 36px; height: 48px; background: #165DFF; color: #fff; border: none; border-radius: 8px 0 0 8px; cursor: pointer; font-size: 18px; z-index: 999; display: none; box-shadow: -2px 2px 8px rgba(0,0,0,0.15); }
.panel-expand-btn.show { display: block; }
.panel-expand-btn:hover { background: #0E42D2; }
.annotation-item { padding: 14px 16px; border-bottom: 1px solid #E4E7ED; cursor: pointer; transition: background 0.2s; }
.annotation-item:hover { background: #EEF0F3; }
.annotation-item.active { background: #E8F3FF; }
.annotation-header { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.annotation-badge { width: 22px; height: 22px; border-radius: 50%; background: #165DFF; color: #fff; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.annotation-title { font-size: 14px; font-weight: 600; color: #333; }
.annotation-summary { font-size: 12px; color: #666; line-height: 1.6; padding-left: 32px; }

.anno-marker { position: absolute; top: 8px; right: 8px; width: 22px; height: 22px; border-radius: 50%; background: #165DFF; color: #fff; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; opacity: 0.5; transition: all 0.2s ease; cursor: pointer; z-index: 9999; user-select: none; }
.anno-marker.highlight, .anno-marker:hover { opacity: 1; transform: scale(1.2); box-shadow: 0 2px 8px rgba(22, 93, 255, 0.4); }

.modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1000; }
.modal-overlay.show { display: flex; }
.modal { background: #fff; border-radius: 8px; width: 560px; max-height: 86vh; display: flex; flex-direction: column; box-shadow: 0 4px 20px rgba(0,0,0,0.15); overflow: hidden; position: relative; }
.modal-lg { width: 760px; }
.modal-header { padding: 18px 24px; border-bottom: 1px solid #E4E7ED; display: flex; align-items: center; justify-content: space-between; }
.modal-title { font-size: 16px; font-weight: 600; color: #333; }
.modal-close { width: 28px; height: 28px; border: none; background: transparent; font-size: 20px; color: #999; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.modal-close:hover { color: #333; }
.modal-body { padding: 20px 24px; overflow-y: auto; flex: 1; }
.modal-footer { padding: 14px 24px; border-top: 1px solid #E4E7ED; display: flex; justify-content: flex-end; gap: 10px; }

.detail-table { width: 100%; border-collapse: collapse; }
.detail-table th { background: #FAFAFA; width: 100px; padding: 12px 16px; text-align: left; font-size: 13px; font-weight: 600; color: #666; border: 1px solid #E4E7ED; vertical-align: top; }
.detail-table td { padding: 12px 16px; font-size: 13px; color: #333; border: 1px solid #E4E7ED; line-height: 1.7; }
.detail-table textarea { width: 100%; min-height: 80px; padding: 8px 12px; border: 1px solid #DCDFE6; border-radius: 4px; font-size: 13px; font-family: inherit; line-height: 1.6; resize: vertical; outline: none; }
.detail-table textarea:focus { border-color: #165DFF; }

.btn { padding: 8px 16px; border-radius: 4px; font-size: 13px; cursor: pointer; border: 1px solid transparent; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px; }
.btn-primary { background: #165DFF; color: #fff; }
.btn-primary:hover { background: #0E42D2; }
.btn-default { background: #fff; border-color: #DCDFE6; color: #666; }
.btn-default:hover { border-color: #165DFF; color: #165DFF; }
.btn-danger { background: #fff; border-color: #F53F3F; color: #F53F3F; }
.btn-danger:hover { background: #F53F3F; color: #fff; }

.anno-flash { animation: flashHighlight 1.5s ease-out; }
@keyframes flashHighlight { 0% { box-shadow: 0 0 0 3px rgba(22, 93, 255, 0.6); } 100% { box-shadow: 0 0 0 3px rgba(22, 93, 255, 0); } }

/* ================= 产品界面 ================= */
:root { --main: #00B389; --main-light: #E6F7F2; --line: #E4E7ED; --sub: #86909C; }
.page-container { background: #fff; border-radius: 8px; height: calc(100vh - 74px); min-width: 940px; display: flex; flex-direction: column; overflow: hidden; position: relative; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }

.page-head { padding: 16px 24px 0; flex-shrink: 0; }
.breadcrumb { font-size: 12px; color: var(--sub); margin-bottom: 8px; }
.breadcrumb span { color: #C9CDD4; margin: 0 4px; }
.page-title { font-size: 18px; font-weight: 600; color: #1D2129; }

.top-area { padding: 0 24px; flex-shrink: 0; position: relative; }
.tabs { display: flex; gap: 28px; border-bottom: 1px solid var(--line); margin-top: 14px; }
.tab { padding: 10px 0; font-size: 14px; color: #4E5969; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab.active { color: var(--main); border-bottom-color: var(--main); font-weight: 600; }
.stats { display: flex; gap: 12px; padding: 14px 0 4px; }
.stat-card { flex: 1; background: #FAFBFC; border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; }
.stat-label { font-size: 12px; color: var(--sub); }
.stat-value { font-size: 20px; font-weight: 600; color: #1D2129; }
.stat-value.green { color: var(--main); }
.stat-value.gray { color: #C9CDD4; font-size: 15px; }

.main-body { flex: 1; display: flex; min-height: 0; padding: 12px 24px 20px; gap: 16px; }

.side-tree { width: 150px; flex-shrink: 0; border-right: 1px solid var(--line); padding-right: 12px; overflow-y: auto; position: relative; }
.tree-title { font-size: 12px; color: var(--sub); padding: 4px 8px 10px; }
.tree-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; border-radius: 4px; font-size: 13px; color: #4E5969; cursor: pointer; margin-bottom: 2px; }
.tree-item:hover { background: #F7F8FA; }
.tree-item.active { background: var(--main-light); color: var(--main); font-weight: 600; }
.tree-count { font-size: 12px; color: var(--sub); }
.tree-item.active .tree-count { color: var(--main); }

.list-area { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.filter-row { display: flex; gap: 8px; margin-bottom: 10px; flex-shrink: 0; }
.filter-row input, .filter-row select { height: 32px; padding: 0 10px; border: 1px solid #DCDFE6; border-radius: 4px; font-size: 13px; outline: none; color: #333; background: #fff; }
.filter-row input { width: 200px; }
.filter-row select { width: 130px; }
.filter-row input:focus, .filter-row select:focus { border-color: var(--main); }

.table-wrap { flex: 1; overflow-y: auto; border: 1px solid var(--line); border-radius: 6px; position: relative; }
table.scene-table { width: 100%; border-collapse: collapse; font-size: 13px; }
table.scene-table thead th { position: sticky; top: 0; background: #FAFBFC; z-index: 5; text-align: left; font-weight: 500; color: #4E5969; font-size: 12px; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.scene-table tbody td { padding: 11px 12px; border-bottom: 1px solid #F2F3F5; color: #1D2129; vertical-align: middle; }
table.scene-table tbody tr:hover { background: #FAFCFB; }
.scene-name { font-weight: 500; }
.scene-sub { font-size: 12px; color: var(--sub); margin-top: 3px; }
.ch-dot { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; white-space: nowrap; }
.dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
.dot.on { background: var(--main); }
.dot.off { background: #C9CDD4; }
.ch-text.on { color: #1D2129; }
.ch-text.off { color: #C9CDD4; }
.act-link { color: var(--main); cursor: pointer; font-size: 13px; }
.act-link:hover { text-decoration: underline; }
.act-sep { color: #E5E6EB; margin: 0 8px; }

/* ===== 编辑弹窗 ===== */
.ch-tabs { display: flex; align-items: center; border-bottom: 1px solid var(--line); margin-bottom: 18px; position: relative; padding-right: 34px; }
.ch-tab { padding: 9px 0; margin-right: 26px; font-size: 14px; color: #4E5969; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.ch-tab.active { color: var(--main); border-bottom-color: var(--main); font-weight: 600; }
.ch-tab.soon { color: #C9CDD4; cursor: not-allowed; }
.ch-tab-right { margin-left: auto; display: flex; align-items: center; gap: 12px; padding-bottom: 6px; }
.switch { width: 34px; height: 18px; border-radius: 9px; background: #C9CDD4; position: relative; cursor: pointer; flex-shrink: 0; display: inline-block; }
.switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: all 0.2s; }
.switch.on { background: var(--main); }
.switch.on::after { left: 18px; }
.preview-btn { padding: 4px 12px; border: 1px solid var(--main); color: var(--main); background: #fff; border-radius: 4px; font-size: 12px; cursor: pointer; }
.preview-btn:hover { background: var(--main-light); }

.form-row { display: flex; align-items: flex-start; margin-bottom: 16px; }
.form-row > label { width: 90px; flex-shrink: 0; text-align: right; padding-right: 12px; font-size: 13px; color: #4E5969; line-height: 32px; }
.form-row > label .req { color: #F53F3F; margin-right: 2px; }
.form-field { flex: 1; min-width: 0; position: relative; }
.form-field input[type=text], .form-field textarea { width: 100%; padding: 7px 10px; border: 1px solid #DCDFE6; border-radius: 4px; font-size: 13px; font-family: inherit; outline: none; color: #1D2129; line-height: 1.6; }
.form-field textarea { min-height: 120px; resize: vertical; }
.form-field input:focus, .form-field textarea:focus { border-color: var(--main); }
.form-field .ro { padding: 7px 0; font-size: 13px; color: #1D2129; line-height: 32px; }
.counter { text-align: right; font-size: 12px; color: var(--sub); margin-top: 4px; }
.counter.over { color: #F53F3F; }
.lang-tabs-wrap { position: relative; padding-right: 30px; }
.lang-tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--line); }
.lang-tab { padding: 6px 0; font-size: 13px; color: #4E5969; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.lang-tab.active { color: var(--main); border-bottom-color: var(--main); font-weight: 600; }
.lang-tab.pending::after { content: '·'; color: #F53F3F; margin-left: 3px; }
.translate-row { display: flex; align-items: center; gap: 12px; }
.btn-outline { padding: 6px 14px; border: 1px solid #DCDFE6; background: #fff; border-radius: 4px; font-size: 13px; color: #4E5969; cursor: pointer; }
.btn-outline:hover { border-color: var(--main); color: var(--main); }
.hint { font-size: 12px; color: var(--sub); }
.btn-main { background: var(--main); color: #fff; border: none; padding: 8px 18px; border-radius: 4px; font-size: 13px; cursor: pointer; }
.btn-main:hover { opacity: 0.9; }
.btn-ghost { background: #fff; border: 1px solid #DCDFE6; color: #4E5969; padding: 8px 18px; border-radius: 4px; font-size: 13px; cursor: pointer; }

/* ===== 预览弹窗 ===== */
.pv-lang { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
.pv-lang-btn { padding: 5px 14px; border: 1px solid #DCDFE6; border-radius: 4px; font-size: 12px; color: #4E5969; cursor: pointer; background: #fff; }
.pv-lang-btn.active { border-color: var(--main); color: var(--main); background: var(--main-light); }
.pv-lang-btn.pending { color: #C9CDD4; }
.pv-stage { background: #F5F7FA; border-radius: 8px; padding: 20px; min-height: 240px; position: relative; }
.pv-note { font-size: 12px; color: #F53F3F; margin-bottom: 10px; }

.inapp-card { background: #fff; border-radius: 8px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
.inapp-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.inapp-icon { width: 28px; height: 28px; border-radius: 6px; background: var(--main); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; }
.inapp-src { font-size: 13px; font-weight: 600; color: #1D2129; }
.inapp-time { font-size: 12px; color: var(--sub); margin-left: auto; }
.inapp-title { font-size: 14px; font-weight: 600; color: #1D2129; margin-bottom: 8px; }
.inapp-body { font-size: 13px; color: #4E5969; line-height: 1.8; }
.inapp-foot { margin-top: 12px; padding-top: 12px; border-top: 1px solid #F2F3F5; }
.inapp-btn { display: inline-block; padding: 6px 16px; background: var(--main); color: #fff; border-radius: 4px; font-size: 12px; }

.mail-card { background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
.mail-head { background: #FAFBFC; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.mail-line { font-size: 12px; color: #4E5969; line-height: 1.9; }
.mail-line b { color: #1D2129; font-weight: 500; }
.mail-subject { font-size: 14px; font-weight: 600; color: #1D2129; padding: 14px 16px 8px; }
.mail-body { padding: 0 16px 16px; font-size: 13px; color: #4E5969; line-height: 1.9; }
.mail-foot { padding: 12px 16px; border-top: 1px solid #F2F3F5; font-size: 11px; color: #C9CDD4; }

</style>
</head>
<body>

<div class="app-container">
    <div class="annotation-toolbar" id="annotation-toolbar">
        <button class="toolbar-edit-btn" onclick="openEditMode()" title="编辑标注">✏️ 编辑标注</button>
    </div>

    <div class="workspace">
    <div class="preview-area">
        <div class="page-container" id="anno-1">

            <div class="page-head">
                <div class="breadcrumb">运营中心<span>/</span>消息触达</div>
                <div class="page-title">消息触达</div>
            </div>

            <div class="top-area" id="anno-2">
                <div class="anno-marker" data-id="2">2</div>
                <div class="tabs">
                    <div class="tab">消息发送</div>
                    <div class="tab active">消息模板</div>
                    <div class="tab">发送记录</div>
                </div>
                <div class="stats">
                    <div class="stat-card"><span class="stat-label">场景总数</span><span class="stat-value" id="st-total">43</span></div>
                    <div class="stat-card"><span class="stat-label">站内信已开启</span><span class="stat-value green" id="st-inapp">43</span></div>
                    <div class="stat-card"><span class="stat-label">邮件已开启</span><span class="stat-value" id="st-mail">30</span></div>
                </div>
            </div>

            <div class="main-body">
                <div class="side-tree" id="anno-3">
                    <div class="anno-marker" data-id="3">3</div>
                    <div class="tree-title">业务分类</div>
                    <div class="tree-item active" data-cat="全部"><span>全部场景</span><span class="tree-count">43</span></div>
                    <div class="tree-item" data-cat="订单"><span>订单</span><span class="tree-count">15</span></div>
                    <div class="tree-item" data-cat="包裹"><span>包裹</span><span class="tree-count">17</span></div>
                    <div class="tree-item" data-cat="售后"><span>售后</span><span class="tree-count">7</span></div>
                    <div class="tree-item" data-cat="账户"><span>账户</span><span class="tree-count">2</span></div>
                    <div class="tree-item" data-cat="营销"><span>营销</span><span class="tree-count">2</span></div>
                </div>

                <div class="list-area">
                    <div class="filter-row">
                        <input type="text" id="kw" placeholder="搜索场景名称" oninput="renderTable()">
                    </div>

                    <div class="table-wrap" id="anno-4">
                        <div class="anno-marker" data-id="4">4</div>
                        <table class="scene-table">
                            <thead>
                                <tr>
                                    <th style="width:56%;">场景名称</th>
                                    <th style="width:14%;">站内信</th>
                                    <th style="width:14%;">邮件</th>
                                    <th style="width:16%; position:relative;" id="anno-5">操作<div class="anno-marker" data-id="5" style="top:4px;right:4px;width:18px;height:18px;font-size:10px;">5</div></th>
                                </tr>
                            </thead>
                            <tbody id="tbody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="annotation-panel" id="annotation-panel">
        <div class="panel-header">
            <button class="panel-toggle-btn" onclick="togglePanel()" title="收起面板">◀</button>
            <span>📌 标注说明</span>
        </div>
        <div id="annotation-list"></div>
    </div>
    </div>
    <button class="panel-expand-btn" id="panel-expand-btn" onclick="togglePanel()" title="展开标注面板">📌</button>
</div>

<!-- ===== 编辑弹窗 ===== -->
<div class="modal-overlay" id="edit-modal">
    <div class="modal modal-lg">
        <div class="modal-header">
            <div class="modal-title" id="edit-modal-title">编辑消息模板</div>
            <button class="modal-close" onclick="closeEdit()">×</button>
        </div>
        <div class="modal-body">
            <div class="ch-tabs">
                <div class="anno-marker" data-id="6">6</div>
                <div class="ch-tab active" data-ch="inapp" onclick="switchChannel('inapp')">站内信</div>
                <div class="ch-tab" data-ch="mail" onclick="switchChannel('mail')">邮件</div>
                <div class="ch-tab-right">
                    <span class="switch on" id="ch-switch" onclick="toggleChannel()"></span>
                    <button class="preview-btn" onclick="openPreview()">预览</button>
                </div>
            </div>

            <div class="form-row">
                <label>分类</label>
                <div class="form-field"><div class="ro" id="edit-cat">订单</div></div>
            </div>
            <div class="form-row">
                <label>场景</label>
                <div class="form-field"><div class="ro" id="edit-scene">订单创建成功</div></div>
            </div>
            <div class="form-row">
                <label>语言</label>
                <div class="form-field">
                    <div class="lang-tabs-wrap"><div class="lang-tabs" id="lang-tabs"></div><div class="anno-marker" data-id="7">7</div></div>
                </div>
            </div>
            <div class="form-row">
                <label><span class="req">*</span>消息标题</label>
                <div class="form-field">
                    <input type="text" id="edit-title" placeholder="请输入消息标题" oninput="updateCounter()">
                    <div class="counter" id="cnt-title">0 / 80</div>
                </div>
            </div>
            <div class="form-row">
                <label><span class="req">*</span>消息正文</label>
                <div class="form-field">
                    <textarea id="edit-body" placeholder="请输入消息正文" oninput="updateCounter()"></textarea>
                    <div class="counter" id="cnt-body">0 / 4000</div>
                </div>
            </div>
            <div class="form-row">
                <label>翻译</label>
                <div class="form-field">
                    <div class="translate-row">
                        <button class="btn-outline" onclick="translateAll()">一键翻译所有语言</button>
                        <span class="hint">调用CMS外部翻译接口，并保存返回的语言模板</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-ghost" onclick="closeEdit()">取消</button>
            <button class="btn-main" onclick="saveEdit()">保存模板</button>
        </div>
    </div>
</div>

<!-- ===== 预览弹窗 ===== -->
<div class="modal-overlay" id="preview-modal">
    <div class="modal modal-lg">
        <div class="modal-header">
            <div class="modal-title" id="pv-title">消息预览 · 站内信</div>
            <button class="modal-close" onclick="closePreview()">×</button>
        </div>
        <div class="modal-body">
            <div class="pv-lang" id="pv-lang"></div>
            <div class="pv-stage" id="pv-stage"><div class="anno-marker" data-id="8">8</div><div id="pv-content"></div></div>
        </div>
        <div class="modal-footer">
            <button class="btn-ghost" onclick="closePreview()">关闭</button>
        </div>
    </div>
</div>

<!-- ===== 标注详情弹窗 ===== -->
<div class="modal-overlay" id="detail-modal">
    <div class="modal">

</div>

</div>

let currentCat = '全部';
let curScene = DATA[0];
let curChannel = 'inapp';
let curLang = 'zh-CN';

function getContent(item, ch, lang) {
    const c = item.content || {};
    if (c[lang] && c[lang][ch]) return { t: c[lang][ch].t, b: c[lang][ch].b, pending: false };
    const base = c['zh-CN'] && c['zh-CN'][ch] ? c['zh-CN'][ch] : { t: item.scene, b: '' };
    return { t: base.t, b: base.b, pending: true };
}

const VAR_SAMPLE = {
    order_number: 'PO20261118001',
    domestic_tracking_number: 'SF1234567890',
    tracking_number: 'POKO20261118001',
    package_number: 'PKG20261118001',
    after_sale_number: 'AS20261118001',
    amount: '128.00',
    package_fee: '68.00',
    coupon_count: '3',
    coupon_value: '15',
    expire_time: '2026-11-20 14:30',
    time: '2026-11-18 14:30',
    payment_link: 'https://poko.com/pay'
};
function fillVars(s) {
    return (s || '').replace(/\{([a-zA-Z_]+)\}/g, (m, k) => VAR_SAMPLE[k] || ('{' + k + '}'));
}

function renderTable() {
    const kw = (document.getElementById('kw').value || '').trim();
    let list = DATA.filter(s => {
        if (currentCat !== '全部' && s.cat !== currentCat) return false;
        if (kw && s.scene.indexOf(kw) === -1) return false;
        return true;
    });
    document.getElementById('tbody').innerHTML = list.map(s => `
        <tr>
            <td>
                <div class="scene-name">${s.scene}</div>
                <div class="scene-sub">${s.trigger}</div>
            </td>
            <td><span class="ch-dot"><i class="dot ${s.inapp?'on':'off'}"></i><span class="ch-text ${s.inapp?'on':'off'}">${s.inapp?'已开启':'未开启'}</span></span></td>
            <td><span class="ch-dot"><i class="dot ${s.mail?'on':'off'}"></i><span class="ch-text ${s.mail?'on':'off'}">${s.mail?'已开启':'未开启'}</span></span></td>
            <td>
                <span class="act-link" onclick="openEdit('${s.scene}')">编辑</span>
                <span class="act-sep">|</span>
                <span class="act-link" onclick="quickPreview('${s.scene}')">预览</span>
            </td>
        </tr>`).join('') || '<tr><td colspan="4" style="text-align:center;color:#86909C;padding:40px 0;">暂无匹配场景</td></tr>';
}

document.querySelectorAll('.tree-item').forEach(el => {
    el.addEventListener('click', () => {
        document.querySelectorAll('.tree-item').forEach(x => x.classList.remove('active'));
        el.classList.add('active');
        currentCat = el.dataset.cat;
        renderTable();
    });
});

function openEdit(sceneName) {
    const s = DATA.find(x => x.scene === sceneName);
    if (!s) return;
    curScene = s;
    curChannel = 'inapp';
    curLang = 'zh-CN';
    document.getElementById('edit-modal-title').textContent = '编辑消息模板 · ' + s.scene;
    document.getElementById('edit-cat').textContent = s.cat;
    document.getElementById('edit-scene').textContent = s.scene;
    switchChannel('inapp');
    renderLangTabs();
    fillContent();
    document.getElementById('edit-modal').classList.add('show');
}

function switchChannel(ch) {
    curChannel = ch;
    document.querySelectorAll('.ch-tab').forEach(t => t.classList.toggle('active', t.dataset.ch === ch));
    const sw = document.getElementById('ch-switch');
    const on = ch === 'inapp' ? curScene.inapp : curScene.mail;
    sw.style.opacity = 1;
    sw.className = 'switch ' + (on ? 'on' : '');
    fillContent();
    renderLangTabs();
}

function toggleChannel() {
    const sw = document.getElementById('ch-switch');
    const on = sw.classList.contains('on');
    sw.classList.toggle('on', !on);
    if (curChannel === 'inapp') curScene.inapp = on ? 0 : 1;
    if (curChannel === 'mail') curScene.mail = on ? 0 : 1;
    renderTable();
}

function renderLangTabs() {
    const box = document.getElementById('lang-tabs');
    box.innerHTML = LANGS.map(l => {
        const c = curScene.content || {};
        const has = c[l.code] && c[l.code][curChannel];
        return `<span class="lang-tab ${l.code === curLang ? 'active' : ''} ${has ? '' : 'pending'}" onclick="switchLang('${l.code}')">${l.name}</span>`;
    }).join('');
}

function switchLang(code) {
    curLang = code;
    renderLangTabs();
    fillContent();
}

function fillContent() {
    const c = getContent(curScene, curChannel, curLang);
    const t = document.getElementById('edit-title');
    const b = document.getElementById('edit-body');
    t.value = c.pending ? '' : c.t;
    b.value = c.pending ? '' : c.b;
    t.placeholder = c.pending ? '该语言尚未翻译，可点击下方一键翻译' : '请输入消息标题';
    b.placeholder = c.pending ? '该语言尚未翻译，可点击下方一键翻译' : '请输入消息正文';
    updateCounter();
}

function updateCounter() {
    const t = document.getElementById('edit-title').value;
    const b = document.getElementById('edit-body').value;
    const ct = document.getElementById('cnt-title');
    const cb = document.getElementById('cnt-body');
    ct.textContent = t.length + ' / 80';
    ct.className = 'counter' + (t.length > 80 ? ' over' : '');
    cb.textContent = b.length + ' / 4000';
    cb.className = 'counter' + (b.length > 4000 ? ' over' : '');
}

function translateAll() {
    const zh = getContent(curScene, curChannel, 'zh-CN');
    if (!zh.t) { alert('请先填写中文简体内容'); return; }
    if (!curScene.content) curScene.content = {};
    LANGS.forEach(l => {
        if (l.code === 'zh-CN') return;
        if (!curScene.content[l.code]) curScene.content[l.code] = {};
        curScene.content[l.code][curChannel] = { t: zh.t, b: zh.b };
    });
    renderLangTabs();
    alert('已调用翻译接口，4 种语言模板已生成');
}

function saveEdit() {
    const t = document.getElementById('edit-title').value.trim();
    const b = document.getElementById('edit-body').value.trim();
    if (!t) { alert('请输入消息标题'); return; }
    if (!b) { alert('请输入消息正文'); return; }
    if (t.length > 80) { alert('消息标题不能超过 80 字'); return; }
    if (b.length > 4000) { alert('消息正文不能超过 4000 字'); return; }
    if (!curScene.content) curScene.content = {};
    if (!curScene.content[curLang]) curScene.content[curLang] = {};
    curScene.content[curLang][curChannel] = { t: t, b: b };
    renderLangTabs();
    alert('已保存');
}

function closeEdit() { document.getElementById('edit-modal').classList.remove('show'); }

function quickPreview(sceneName) {
    const s = DATA.find(x => x.scene === sceneName);
    if (!s) return;
    curScene = s;
    curChannel = s.inapp ? 'inapp' : (s.mail ? 'mail' : 'inapp');
    curLang = 'zh-CN';
    openPreview();
}

function openPreview() {
    renderPvLang();
    renderPvStage();
    const names = { inapp: '站内信', mail: '邮件' };
    document.getElementById('pv-title').textContent = '消息预览 · ' + names[curChannel];
    document.getElementById('preview-modal').classList.add('show');
}

function renderPvLang() {
    document.getElementById('pv-lang').innerHTML = LANGS.map(l => {
        const c = curScene.content || {};
        const has = c[l.code] && c[l.code][curChannel];
        return `<span class="pv-lang-btn ${l.code === curLang ? 'active' : ''} ${has ? '' : 'pending'}" onclick="pvSwitchLang('${l.code}')">${l.name}</span>`;
    }).join('');
}

function pvSwitchLang(code) {
    curLang = code;
    renderPvLang();
    renderPvStage();
}

function renderPvStage() {
    const c = getContent(curScene, curChannel, curLang);
    const stage = document.getElementById('pv-content');
    const note = c.pending ? '<div class="pv-note">该语言尚未翻译，当前展示中文简体内容</div>' : '';
    const T = fillVars(c.t);
    const B = fillVars(c.b).replace(/\n/g, '<br>');
    if (curChannel === 'inapp') {
        stage.innerHTML = note + `
        <div class="inapp-card">
            <div class="inapp-head">
                <div class="inapp-icon">P</div>
                <div class="inapp-src">POKO 消息中心</div>
                <div class="inapp-time">刚刚</div>
            </div>
            <div class="inapp-title">${T}</div>
            <div class="inapp-body">${B}</div>
            <div class="inapp-foot"><span class="inapp-btn">查看详情</span></div>
        </div>`;
    } else if (curChannel === 'mail') {
        stage.innerHTML = note + `
        <div class="mail-card">
            <div class="mail-head">
                <div class="mail-line">发件人：<b>POKO 通知 &lt;notice@poko.com&gt;</b></div>
                <div class="mail-line">收件人：<b>用户邮箱</b></div>

            <div class="mail-body">${B}</div>
            <div class="mail-foot">此邮件由系统自动发送，请勿直接回复</div>

    }
}

const DETAIL_LABELS = { feature:'功能说明', display:'字段/展示规则', interaction:'交互规则', business:'业务规则', state:'状态说明', exception:'异常/边界', copywriting:'文案规范' };

function loadCustomAnnotations() {
    try { const s = localStorage.getItem(STORAGE_KEY); if (s) customAnnotations = JSON.parse(s); } catch(e) {}
}
function getActiveAnnotations() { return customAnnotations || annotations; }
function renderAnnotationList() {
    const data = getActiveAnnotations();
    document.getElementById('annotation-list').innerHTML = data.map(item => `
        <div class="annotation-item" data-id="${item.id}" onclick="handleAnnotationClick(${item.id})" onmouseenter="highlightMarker(${item.id})" onmouseleave="unhighlightMarker(${item.id})">
            <div class="annotation-header"><div class="annotation-badge">${item.id}</div><div class="annotation-title">${item.title}</div></div>
            <div class="annotation-summary">${item.summary}</div>
        </div>`).join('');
}
function highlightMarker(id) {
    const m = document.querySelector(`.anno-marker[data-id="${id}"]`); if (m) m.classList.add('highlight');
    const i = document.querySelector(`.annotation-item[data-id="${id}"]`); if (i) i.classList.add('active');
}
function unhighlightMarker(id) {
    const m = document.querySelector(`.anno-marker[data-id="${id}"]`); if (m) m.classList.remove('highlight');
    const i = document.querySelector(`.annotation-item[data-id="${id}"]`); if (i) i.classList.remove('active');
}
document.querySelectorAll('.anno-marker').forEach(marker => {
    marker.addEventListener('mouseenter', () => highlightMarker(parseInt(marker.dataset.id)));
    marker.addEventListener('mouseleave', () => unhighlightMarker(parseInt(marker.dataset.id)));
    marker.addEventListener('click', () => showDetail(parseInt(marker.dataset.id)));
});
function handleAnnotationClick(id) { scrollToAnnotation(id); setTimeout(() => showDetail(id), 300); }
function scrollToAnnotation(id) {
    const item = getActiveAnnotations().find(a => a.id === id);
    if (!item) return;
    if (item.target.indexOf('#edit-modal') === 0) {
        if (!document.getElementById('edit-modal').classList.contains('show')) { curScene = DATA[0]; openEdit(DATA[0].scene); }
    }
    if (item.target.indexOf('#preview-modal') === 0) {
        if (!document.getElementById('preview-modal').classList.contains('show')) { curScene = DATA[0]; curChannel = 'inapp'; curLang = 'zh-CN'; openPreview(); }
    }
    const target = document.querySelector(item.target);
    const previewArea = document.querySelector('.preview-area');
    if (target && previewArea) {
        const top = target.offsetTop - 20;
        previewArea.scrollTo({ top: top, behavior: 'smooth' });
        target.classList.remove('anno-flash'); void target.offsetWidth; target.classList.add('anno-flash');
        setTimeout(() => target.classList.remove('anno-flash'), 1500);
    }
}
function showDetail(id) {
    const item = getActiveAnnotations().find(a => a.id === id);
    if (!item) return;
    currentAnnotation = item; isEditing = false;
    document.getElementById('modal-title').textContent = `${item.id}. ${item.title}`;
    renderDetailTable(item);
    document.getElementById('edit-btn').style.display = 'inline-flex';
    document.getElementById('save-btn').style.display = 'none';
    document.getElementById('reset-btn').style.display = customAnnotations ? 'inline-flex' : 'none';
    document.getElementById('delete-btn').style.display = (id !== 1) ? 'inline-flex' : 'none';
    document.getElementById('detail-modal').classList.add('show');
}
function renderDetailTable(item) {
    const rows = [];
    ['feature','display','interaction','business','state','exception','copywriting'].forEach(k => {
        if (item.detail[k]) rows.push({ label: DETAIL_LABELS[k], value: item.detail[k], key: k });
    });
    const table = document.getElementById('detail-table');
    if (isEditing) {
        table.innerHTML = rows.map(r => `<tr><th>${r.label}</th><td><textarea data-key="${r.key}">${r.value}</textarea></td></tr>`).join('');
    } else {
        table.innerHTML = rows.map(r => `<tr><th>${r.label}</th><td>${r.value.replace(/\n/g,'<br>')}</td></tr>`).join('');
    }
}
function toggleEdit() {
    isEditing = !isEditing;

    if (!confirm(`确定要删除标注「${currentAnnotation.title}」吗？删除后序号会自动重排。`)) return;
    if (!customAnnotations) customAnnotations = JSON.parse(JSON.stringify(annotations));
    customAnnotations = customAnnotations.filter(a => a.id !== currentAnnotation.id);
    customAnnotations.forEach((a, i) => { a.id = i + 1; });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(customAnnotations));
    closeModal(); renderAnnotationList();
}
function exportAnnotatedHTML() {
    const activeData = getActiveAnnotations();
    const originalHTML = document.documentElement.outerHTML;
    const replacement = 'const annotations = ' + JSON.stringify(activeData, null, 2) + ';';
    const newHTML = originalHTML.replace(/const annotations = \[[\s\S]*?\n\];/, replacement);
    const blob = new Blob([newHTML], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `消息触达_消息模板配置_${new Date().toISOString().slice(0,10).replace(/-/g,'')}.html`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
}

loadCustomAnnotations();
renderAnnotationList();
initPanelState();
document.getElementById('st-total').textContent = DATA.length;
document.getElementById('st-inapp').textContent = DATA.filter(d => d.inapp).length;
document.getElementById('st-mail').textContent = DATA.filter(d => d.mail).length;
renderTable();
</script>
