<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>收银台</title>
<style>
  :root{
    --brand:#6C5CE7;
    --brand-soft:#F2EFFF;
    --link:#2F6BFF;
    --warn:#E8722A;
    --text-1:#171A2A;
    --text-2:#565C70;
    --text-3:#8A90A2;
    --line:#EFF1F5;
    --line-2:#E3E6EE;
    --bg:#F5F6FA;
    --page:#FFFFFF;
  }

  *{box-sizing:border-box}

  html,body{margin:0;padding:0}

  body{
    background:var(--bg);
    color:var(--text-1);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }

  .app{
    max-width:430px;
    margin:0 auto;
    background:var(--page);
    min-height:100vh;
    padding-bottom:140px;
  }

  /* 顶部导航 */
  .m-head{
    position:sticky;
    top:0;
    z-index:20;
    height:48px;
    background:var(--page);
    display:flex;
    align-items:center;
    padding:0 12px;
    border-bottom:1px solid var(--line);
  }

  .m-back{
    width:32px;
    height:32px;
    padding:0;
    border:0;
    background:transparent;
    color:var(--text-1);
    font-family:inherit;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    justify-content:center;
  }

  .m-title{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    margin:0;
    font-size:16px;
    font-weight:600;
    letter-spacing:.2px;
  }

  .m-cur{
    margin-left:auto;
    height:26px;
    padding:0 10px;
    border:1px solid var(--line-2);
    border-radius:6px;
    background:#fff;
    color:var(--text-2);
    font-family:inherit;
    font-size:12px;
    font-weight:500;
    cursor:pointer;
  }

  /* 订单信息条 */
  .m-order{
    margin:0;
    padding:13px 20px;
    font-size:11.5px;
    color:#A2A8B8;
    letter-spacing:-.1px;
    text-align:center;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .m-sep{
    height:8px;
    background:var(--bg);
  }

  /* 区块标题 */
  .m-block-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:14px 20px 8px;
  }

  .m-block-title{
    margin:0;
    font-size:13px;
    font-weight:500;
    color:var(--text-3);
  }

  .m-recharge{
    height:26px;
    padding:0 12px;
    border:1px solid var(--brand);
    border-radius:13px;
    background:#fff;
    color:var(--brand);
    font-family:inherit;
    font-size:12px;
    font-weight:600;
    cursor:pointer;
    flex:none;
  }

  .m-recharge[hidden]{display:none}

  .m-recharge:active{background:var(--brand-soft)}

  .m-recharge:focus-visible{
    outline:2px solid var(--brand);
    outline-offset:2px;
  }

  /* 支付方式 */
  .m-list{
    background:#fff;
  }

  .m-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:14px 20px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
    background:#fff;
    transition:background .15s ease;
  }

  .m-row:last-child{border-bottom:0}

  .m-row:active{background:#FAFAFD}

  .m-input{
    position:absolute;
    width:1px;
    height:1px;
    opacity:0;
    pointer-events:none;
  }

  .m-icon{
    width:44px;
    height:28px;
    flex:none;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:2px;
    line-height:1;
  }

  .m-name{
    font-size:15px;
    font-weight:500;
    color:var(--text-1);
    min-width:0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .m-check{
    width:20px;
    height:20px;
    flex:none;
    margin-left:auto;
    border:1.5px solid #D3D7E2;
    border-radius:50%;
    background:#fff;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    transition:background .15s ease, border-color .15s ease;
  }

  .m-input:checked ~ .m-check{
    background:var(--brand);
    border-color:var(--brand);
  }

  .m-input:checked ~ .m-check::after{
    content:"";
    width:9px;
    height:5px;
    border-left:2px solid #fff;
    border-bottom:2px solid #fff;
    transform:translateY(-1px) rotate(-45deg);
  }

  .m-input:focus-visible ~ .m-check{
    outline:2px solid var(--brand);
    outline-offset:2px;
  }

  /* 余额行 */
  .m-bal{
    display:flex;
    flex-direction:column;
    gap:2px;
    min-width:0;
  }

  .m-bal-name{
    font-size:12.5px;
    color:var(--text-3);
    line-height:1.2;
  }

  .m-bal-line{
    display:flex;
    align-items:baseline;
    gap:6px;
    flex-wrap:wrap;
  }

  .m-bal-num{
    font-size:16px;
    font-weight:600;
    letter-spacing:-.2px;
    line-height:1.25;
    color:var(--text-1);
  }

  .m-bal-diff{
    font-size:11.5px;
    font-weight:500;
    color:var(--warn);
  }

  .m-bal-diff[hidden]{display:none}

  .m-row.is-disabled{
    cursor:not-allowed;
    background:#FAFAFC;
  }

  .m-row.is-disabled:active{background:#FAFAFC}

  .m-row.is-disabled .m-icon{opacity:.45}

  .m-row.is-disabled .m-bal-num{color:#B9BECD}

  .m-row.is-disabled .m-bal-name{color:#B9BECD}

  .m-row.is-disabled .m-check{
    border-color:#E3E6EE;
    background:#F7F8FB;
  }

  .m-row.is-disabled .m-input:checked ~ .m-check{
    background:#E3E6EE;
    border-color:#E3E6EE;
  }

  /* 演示切换 */
  .m-demo{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:18px 20px 10px;
  }

  .m-demo-label{
    font-size:11px;
    color:#C2C7D4;
    letter-spacing:.4px;
  }

  .m-demo-btn{
    height:24px;
    padding:0 10px;
    border:1px solid var(--line-2);
    border-radius:12px;
    background:#fff;
    color:var(--text-3);
    font-family:inherit;
    font-size:11.5px;
    cursor:pointer;
  }

  .m-demo-btn.is-on{
    border-color:var(--brand);
    color:var(--brand);
    background:var(--brand-soft);
  }

  /* 图标（移动端小尺寸） */
  .ic-visa{color:#1A1F71;font-size:7px;font-weight:800;font-style:italic;letter-spacing:-.3px}
  .ic-mc{width:13px;height:9px;flex:none}
  .ic-amex{background:#2E77BC;color:#fff;font-size:5px;font-weight:800;padding:1.5px 1.5px;border-radius:2px}
  .ic-alipay{color:#1677FF;font-size:10px;font-weight:700;letter-spacing:-.3px}
  .ic-up{display:inline-flex;align-items:center;gap:2px}
  .ic-up-txt{color:#003B7C;font-size:6.5px;font-weight:800;letter-spacing:-.2px}
  .ic-yoomoney{color:#8B3FFD;font-size:9px;font-weight:800;letter-spacing:-.4px}
  .ic-sber{background:#21A038;color:#fff;font-size:7px;font-weight:700;padding:2px 5px;border-radius:3px}
  .ic-tbank{background:#FFDD2D;color:#111;font-size:6.5px;font-weight:800;padding:2px 4px;border-radius:2px}
  .ic-apple{display:inline-flex;align-items:center;gap:1px;color:#111;font-size:10px;font-weight:600}
  .ic-gpay{display:inline-flex;align-items:baseline;gap:1px}
  .ic-g{color:#4285F4;font-size:11px;font-weight:700;letter-spacing:-.2px}
  .ic-gpay-txt{color:#5F6368;font-size:9.5px;font-weight:500}
  .ic-paypal{display:inline-flex;align-items:center;gap:1px}
  .ic-paypal-txt{color:#003087;font-size:6.5px;font-weight:800;letter-spacing:-.2px}
  .ic-payid{display:inline-flex;align-items:center;gap:1.5px}
  .ic-payid-txt{color:#111;font-size:10px;font-weight:700;letter-spacing:-.3px}
  .ic-payid-id{background:#7B2FF7;color:#fff;font-size:6px;font-weight:800;padding:2px 2.5px;border-radius:3px;line-height:1}
  .ic-trustly{background:#0EC46A;color:#fff;font-size:7.5px;font-weight:800;padding:2px 5px;border-radius:3px}
  .ic-skrill{color:#6B21D6;font-size:9.5px;font-weight:800;letter-spacing:-.4px}

  /* 底部结算栏 */
  .m-bar{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:30;
    max-width:430px;
    margin:0 auto;
    background:#fff;
    border-top:1px solid var(--line);
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    display:flex;
    align-items:center;
    gap:12px;
    box-shadow:0 -2px 12px rgba(23,26,42,.04);
  }

  .m-bar-info{
    min-width:0;
    flex:1;
  }

  .m-bar-label{
    font-size:12px;
    color:var(--text-3);
    line-height:1.3;
  }

  .m-bar-amount-row{
    display:flex;
    align-items:center;
    gap:4px;
    margin-top:1px;
  }

  .m-bar-amount{
    font-size:22px;
    font-weight:700;
    letter-spacing:-.6px;
    line-height:1.2;
    color:var(--text-1);
  }

  .m-bar-toggle{
    width:26px;
    height:26px;
    padding:0;
    border:0;
    border-radius:50%;
    background:#F2F3F8;
    color:var(--text-2);
    display:inline-flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex:none;
    transition:background .15s ease;
  }

  .m-bar-toggle:active{background:#E8EAF2}

  .m-bar-toggle:focus-visible{
    outline:2px solid var(--brand);
    outline-offset:2px;
  }

  .m-bar-fee{
    margin:2px 0 0;
    font-size:11.5px;
    color:var(--text-3);
    line-height:1.4;
  }

  .m-pay{
    flex:none;
    min-width:132px;
    height:46px;
    padding:0 22px;
    border:0;
    border-radius:24px;
    background:var(--brand);
    color:#fff;
    font-family:inherit;
    font-size:15px;
    font-weight:600;
    letter-spacing:.3px;
    cursor:pointer;
  }

  .m-pay:active{background:#5B4CD6}

  .m-pay:focus-visible{
    outline:2px solid var(--brand);
    outline-offset:2px;
  }

  /* 付款详情抽屉 */
  .m-sheet{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    top:auto;
    width:100%;
    max-width:430px;
    margin:0 auto;
    padding:0;
    border:0;
    border-radius:18px 18px 0 0;
    background:#fff;
    color:var(--text-1);
    box-shadow:0 -10px 36px rgba(17,20,32,.16);
  }

  .m-sheet[open]{
    animation:sheetIn .22s ease-out;
  }

  @keyframes sheetIn{
    from{transform:translateY(100%)}
    to{transform:translateY(0)}
  }

  .m-sheet::backdrop{
    background:rgba(17,20,32,.45);
  }

  .m-sheet-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 20px 10px;
  }

  .m-sheet-title{
    margin:0;
    font-size:16px;
    font-weight:600;
  }

  .m-sheet-close{
    width:28px;
    height:28px;
    padding:0;
    border:0;
    border-radius:50%;
    background:#F2F3F8;
    color:var(--text-2);
    font-family:inherit;
    font-size:16px;
    line-height:1;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    justify-content:center;
  }

  .m-detail{
    margin:0;
    padding:4px 20px 0;
  }

  .m-detail-row{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
    padding:9px 0;
  }

  .m-detail-row dt{
    display:flex;
    align-items:center;
    gap:5px;
    margin:0;
    font-size:13.5px;
    color:var(--text-2);
    flex:none;
  }

  .m-detail-row dd{
    margin:0;
    text-align:right;
    font-size:14px;
    font-weight:500;
    color:var(--text-1);
  }

  .m-sub{
    display:block;
    font-size:11.5px;
    font-weight:400;
    color:var(--text-3);
    margin-top:1px;
  }

  .m-plain{
    font-size:13.5px;
    font-weight:400;
    color:var(--text-3);
  }

  .q-wrap{
    position:relative;
    display:inline-flex;
    align-items:center;
  }

  .q-mark{
    width:15px;
    height:15px;
    padding:0;
    border:1px solid #C7CBD8;
    border-radius:50%;
    background:#fff;
    color:var(--text-3);
    font-family:inherit;
    font-size:10px;
    font-weight:700;
    line-height:1;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    cursor:help;
  }

  .q-mark:focus-visible{
    border-color:var(--brand);
    color:var(--brand);
    outline:none;
  }

  .q-tip{
    position:absolute;
    left:-8px;
    bottom:calc(100% + 8px);
    z-index:6;
    padding:7px 10px;
    border:1px solid var(--line-2);
    border-radius:8px;
    background:#fff;
    box-shadow:0 8px 22px rgba(23,26,42,.12);
    font-size:12px;
    font-weight:400;
    color:var(--text-2);
    white-space:nowrap;
    opacity:0;
    transform:translateY(4px);
    pointer-events:none;
    transition:opacity .15s ease, transform .15s ease;
  }

  .q-wrap:hover .q-tip,
  .q-wrap:focus-within .q-tip{
    opacity:1;
    transform:translateY(0);
  }

  .m-detail-total{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    margin:6px 20px 0;
    padding-top:12px;
    border-top:1px dashed var(--line-2);
  }

  .m-detail-total span:first-child{
    font-size:13.5px;
    color:var(--text-2);
  }

  .m-detail-total strong{
    font-size:19px;
    font-weight:700;
    letter-spacing:-.4px;
  }

  .m-sheet-note{
    margin:14px 20px 0;
    font-size:11.5px;
    line-height:1.65;
    color:var(--text-3);
  }

  .m-sheet-done{
    display:block;
    width:calc(100% - 40px);
    height:46px;
    margin:16px 20px calc(18px + env(safe-area-inset-bottom));
    border:0;
    border-radius:24px;
    background:var(--brand);
    color:#fff;
    font-family:inherit;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
  }

  .m-sheet-done:active{background:#5B4CD6}

  /* 轻提示 */
  .m-toast{
    position:fixed;
    left:50%;
    bottom:130px;
    z-index:60;
    transform:translate(-50%,8px);
    padding:9px 16px;
    border-radius:8px;
    background:rgba(23,26,42,.88);
    color:#fff;
    font-size:13px;
    white-space:nowrap;
    opacity:0;
    pointer-events:none;
    transition:opacity .18s ease, transform .18s ease;
  }

  .m-toast.is-on{
    opacity:1;
    transform:translate(-50%,0);
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important}
  }
</style>
</head>
<body>

<div class="app">
  <header class="m-head">
    <button type="button" class="m-back" aria-label="返回">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15 5 8 12l7 7"></path>
      </svg>
    </button>
    <h1 class="m-title">收银台</h1>
    <button type="button" class="m-cur">CN</button>
  </header>

  <p class="m-order">订单号 FFGICJ261163305 · 2026-11-26 16:54:26</p>

  <div class="m-sep" aria-hidden="true"></div>

  <section aria-labelledby="block-balance">
    <div class="m-block-head">
      <h2 class="m-block-title" id="block-balance">账户余额支付</h2>
      <button type="button" class="m-recharge" id="recharge-btn" hidden>去充值</button>
    </div>
    <div class="m-list">
      <label class="m-row" id="balance-row">
        <input class="m-input" type="radio" name="paymethod" value="balance" id="pm-balance">
        <span class="m-icon" aria-hidden="true">
          <svg viewBox="0 0 26 18" width="24" height="17" aria-hidden="true">
            <rect x="1" y="1" width="24" height="16" rx="3.5" fill="#1B1E27"></rect>
            <rect x="4" y="12" width="7" height="2" rx="1" fill="#5A6076"></rect>
            <text x="18" y="8" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="4.5" font-style="italic" font-weight="700" fill="#fff">VISA</text>
          </svg>
        </span>
        <span class="m-bal">
          <span class="m-bal-name">账户余额</span>
          <span class="m-bal-line">
            <span class="m-bal-num" id="bal-num">¥37.87</span>
            <span class="m-bal-diff" id="bal-diff" hidden></span>
          </span>
        </span>
        <span class="m-check" aria-hidden="true"></span>
      </label>
    </div>
  </section>

  <div class="m-sep" aria-hidden="true"></div>

  <section aria-labelledby="block-online">
    <div class="m-block-head">
      <h2 class="m-block-title" id="block-online">在线支付</h2>
    </div>
    <div class="m-list">
      <label class="m-row">
        <input class="m-input" type="radio" name="paymethod" value="alipay">
        <span class="m-icon" aria-hidden="true"><span class="ic-alipay">Alipay</span></span>
        <span class="m-name">支付宝</span>
        <span class="m-check" aria-hidden="true"></span>
      </label>

      <label class="m-row">
        <input class="m-input" type="radio" name="paymethod" value="unionpay">
        <span class="m-icon" aria-hidden="true">
          <span class="ic-up">
            <svg viewBox="0 0 14 14" width="9" height="9" aria-hidden="true">
              <rect x="0" y="2" width="3.2" height="10" fill="#E21836" transform="skewX(-10)"></rect>
              <rect x="4.8" y="2" width="3.2" height="10" fill="#00447C" transform="skewX(-10)"></rect>
              <rect x="9.6" y="2" width="3.2" height="10" fill="#007B84" transform="skewX(-10)"></rect>
            </svg>
            <span class="ic-up-txt">UnionPay</span>
          </span>
        </span>
        <span class="m-name">银联</span>
        <span class="m-check" aria-hidden="true"></span>
      </label>

      <label class="m-row">
        <input class="m-input" type="radio" name="paymethod" value="yoomoney">
        <span class="m-icon" aria-hidden="true"><span class="ic-yoomoney">yoomoney</span></span>
        <span class="m-name">YooMoney</span>
        <span class="m-check" aria-hidden="true"></span>
      </label>

      <label class="m-row">
        <input class="m-input" type="radio" name="paymethod" value="sberpay">
        <span class="m-icon" aria-hidden="true"><span class="ic-sber">Pay</span></span>
        <span class="m-name">SberPay</span>
        <span class="m-check" aria-hidden="true"></span>
      </label>

      <label class="m-row">
        <input class="m-input" type="radio" name="paymethod" value="tbank">
        <span class="m-icon" aria-hidden="true"><span class="ic-tbank">T BANK</span></span>
        <span class="m-name">T-Bank</span>
        <span class="m-check" aria-hidden="true"></span>
      </label>

      <label class="m-row">
        <input class="m-input" type="radio" name="paymethod" value="card">
        <span class="m-icon" aria-hidden="true">
          <span class="ic-visa">VISA</span>
          <svg class="ic-mc" viewBox="0 0 30 18" aria-hidden="true">
            <circle cx="11" cy="9" r="8" fill="#EB001B"></circle>
            <circle cx="19" cy="9" r="8" fill="#F79E1B" opacity=".82"></circle>
          </svg>
          <span class="ic-amex">AMEX</span>
        </span>
        <span class="m-name">信用卡</span>
        <span class="m-check" aria-hidden="true"></span>
      </label>

      <label class="m-row">
        <input class="m-input" type="radio" name="paymethod" value="applepay">
        <span class="m-icon" aria-hidden="true">
          <span class="ic-apple">
            <svg viewBox="0 0 24 24" width="10" height="12" fill="#111" aria-hidden="true">
              <path d="M16.37 1.43c0 1.14-.42 2.2-1.26 3.03-.9.9-1.94 1.4-3.05 1.32-.02-1.13.44-2.2 1.25-3.02.85-.87 1.95-1.4 3.06-1.33zM20.6 17.05c-.5 1.15-.74 1.66-1.38 2.68-.9 1.42-2.17 3.19-3.75 3.2-1.4.02-1.76-.9-3.66-.9-1.9 0-2.3.9-3.67.92-1.58.02-2.78-1.6-3.68-3.02C2.06 16.4 1.8 11.9 3.3 9.5c1.05-1.7 2.7-2.7 4.26-2.7 1.6 0 2.6.9 3.92.9 1.28 0 2.06-.9 3.9-.9 1.4 0 2.87.76 3.92 2.08-3.44 1.88-2.88 6.8 1.3 8.17z"></path>
            </svg>
            <span>Pay</span>
          </span>
        </span>
        <span class="m-name">Apple Pay</span>
        <span class="m-check" aria-hidden="true"></span>
      </label>

      <label class="m-row">
        <input class="m-input" type="radio" name="paymethod" value="googlepay">
        <span class="m-icon" aria-hidden="true">
          <span class="ic-gpay">
            <span class="ic-g">G</span>
            <span class="ic-gpay-txt">Pay</span>
          </span>
        </span>
        <span class="m-name">Google Pay</span>
        <span class="m-check" aria-hidden="true"></span>
      </label>

      <label class="m-row">
        <input class="m-input" type="radio" name="paymethod" value="paypal">
        <span class="m-icon" aria-hidden="true">
          <span class="ic-paypal">
            <svg viewBox="0 0 12 14" width="8" height="10" aria-hidden="true">
              <path d="M2 1h5.2c1.9 0 3 1.1 2.7 2.9-.35 2.1-1.9 3.3-4.1 3.3H4.4l-.6 3.3H1.3L2 1z" fill="#003087"></path>
              <path d="M4.6 4.2h4.6c1.7 0 2.7 1 2.4 2.6-.3 1.9-1.7 3-3.7 3H6.2l-.5 2.8H3.1l1.5-8.4z" fill="#009CDE" opacity=".85"></path>
            </svg>
            <span class="ic-paypal-txt">PayPal</span>
          </span>
        </span>
        <span class="m-name">PayPal</span>
        <span class="m-check" aria-hidden="true"></span>
      </label>

      <label class="m-row">
        <input class="m-input" type="radio" name="paymethod" value="payid" id="pm-payid" checked>
        <span class="m-icon" aria-hidden="true">
          <span class="ic-payid">
            <span class="ic-payid-txt">Pay</span>
            <span class="ic-payid-id">ID</span>
          </span>
        </span>
        <span class="m-name">PayID</span>
        <span class="m-check" aria-hidden="true"></span>
      </label>

      <label class="m-row">
        <input class="m-input" type="radio" name="paymethod" value="trustly">
        <span class="m-icon" aria-hidden="true"><span class="ic-trustly">Trustly</span></span>
        <span class="m-name">Trustly</span>
        <span class="m-check" aria-hidden="true"></span>
      </label>

      <label class="m-row">
        <input class="m-input" type="radio" name="paymethod" value="skrill">
        <span class="m-icon" aria-hidden="true"><span class="ic-skrill">Skrill</span></span>
        <span class="m-name">Skrill</span>
        <span class="m-check" aria-hidden="true"></span>
      </label>
    </div>
  </section>

  <div class="m-demo">
    <span class="m-demo-label">演示</span>
    <button type="button" class="m-demo-btn is-on" id="demo-full">余额充足</button>
    <button type="button" class="m-demo-btn" id="demo-low">余额不足</button>
  </div>
</div>

<footer class="m-bar">
  <div class="m-bar-info">
    <span class="m-bar-label">实际应付</span>
    <div class="m-bar-amount-row">
      <span class="m-bar-amount" id="bar-total">¥14.76</span>
      <button type="button" class="m-bar-toggle" id="detail-btn" aria-haspopup="dialog" aria-controls="detail-sheet" aria-label="查看付款详情">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 9.5 12 15.5 18 9.5"></path>
        </svg>
      </button>
    </div>
    <p class="m-bar-fee" id="bar-fee">包含支付手续费：¥3.33</p>
  </div>
  <button type="button" class="m-pay">确认支付</button>
</footer>

<dialog class="m-sheet" id="detail-sheet" aria-labelledby="sheet-title">
  <div class="m-sheet-head">
    <h2 class="m-sheet-title" id="sheet-title">付款详情</h2>
    <button type="button" class="m-sheet-close" id="sheet-close" aria-label="关闭">×</button>
  </div>

  <dl class="m-detail">
    <div class="m-detail-row">
      <dt>应付金额</dt>
      <dd id="d-payable"></dd>
    </div>
    <div class="m-detail-row">
      <dt>
        支付手续费
        <span class="q-wrap">
          <button type="button" class="q-mark" aria-describedby="fee-tip" aria-label="手续费计算方式">?</button>
          <span class="q-tip" id="fee-tip" role="tooltip"></span>
        </span>
      </dt>
      <dd id="d-fee"></dd>
    </div>
    <div class="m-detail-row">
      <dt>付款方式</dt>
      <dd id="d-method"></dd>
    </div>
  </dl>

  <div class="m-detail-total">
    <span>实际应付金额</span>
    <strong id="d-total"></strong>
  </div>

  <p class="m-sheet-note">收款币种由所选支付方式决定，与账户展示币种无关，实际扣款以支付渠道结算为准。</p>

  <button type="button" class="m-sheet-done" id="sheet-done">知道了</button>
</dialog>

<div class="m-toast" id="toast" role="status" aria-live="polite"></div>

<script>
  var FX = { CNY: 1, USD: 0.149, RUB: 12.3762, AUD: 0.2257, EUR: 0.1363 };
  var SYMBOL = { CNY: '¥', USD: '$', RUB: '₽', AUD: 'A$', EUR: '€' };
  var ORDER_CNY = 11.43;

  var BALANCE_FULL = 37.87;
  var BALANCE_LOW = 8.55;
  var balance = BALANCE_FULL;

  var METHODS = {
    balance:   { name: '余额支付（钱包）', currency: 'CNY', rate: 0,     fixed: null },
    alipay:    { name: '支付宝',           currency: 'CNY', rate: 0,     fixed: null },
    unionpay:  { name: '银联',             currency: 'CNY', rate: 0.006, fixed: null },
    yoomoney:  { name: 'YooMoney',         currency: 'RUB', rate: 0.027, fixed: null },
    sberpay:   { name: 'SberPay',          currency: 'RUB', rate: 0.035, fixed: { amount: 10, currency: 'RUB' } },
    tbank:     { name: 'T-Bank',           currency: 'RUB', rate: 0.035, fixed: { amount: 10, currency: 'RUB' } },
    card:      { name: '信用卡',           currency: 'USD', rate: 0.043, fixed: { amount: 0.3, currency: 'USD' } },
    applepay:  { name: 'Apple Pay',        currency: 'USD', rate: 0.043, fixed: { amount: 0.3, currency: 'USD' } },
    googlepay: { name: 'Google Pay',       currency: 'USD', rate: 0.043, fixed: { amount: 0.3, currency: 'USD' } },
    paypal:    { name: 'PayPal',           currency: 'USD', rate: 0.044, fixed: { amount: 0.3, currency: 'USD' } },
    payid:     { name: 'PayID',            currency: 'AUD', rate: 0.02,  fixed: { amount: 0.7, currency: 'AUD' } },
    trustly:   { name: 'Trustly',          currency: 'EUR', rate: 0.018, fixed: { amount: 0.35, currency: 'USD' } },
    skrill:    { name: 'Skrill',           currency: 'EUR', rate: 0.028, fixed: { amount: 0.35, currency: 'USD' } }
  };

  var FIXED_SYMBOL = { USD: 'US $', AUD: 'AU $', RUB: 'RUB ', CNY: 'CN ¥', EUR: '€ ' };

  var current = 'payid';

  function byId(id) { return document.getElementById(id); }

  function round2(n) { return Math.round(n * 100) / 100; }

  function fmt(n) {
    var parts = Math.abs(n).toFixed(2).split('.');
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (n < 0 ? '-' : '') + parts[0] + '.' + parts[1];
  }

  function cny(n) { return '¥' + fmt(n); }

  function pct(rate) { return String(Math.round(rate * 10000) / 100); }

  function compute(id) {
    var m = METHODS[id] || METHODS.payid;
    var fx = FX[m.currency];
    var fixedCny = m.fixed ? m.fixed.amount / FX[m.fixed.currency] : 0;
    var feeCny = round2(ORDER_CNY * m.rate + fixedCny);
    var totalCny = round2(ORDER_CNY + feeCny);
    return {
      m: m,
      fx: fx,
      feeCny: feeCny,
      totalCny: totalCny,
      payableLocal: round2(ORDER_CNY * fx),
      feeLocal: round2(feeCny * fx),
      totalLocal: round2(totalCny * fx)
    };
  }

  function tipText(m) {
    if (!m.rate) { return '该支付方式免收手续费'; }
    var s = '(=应付金额*' + pct(m.rate) + '%';
    if (m.fixed) {
      s += ' + ' + (FIXED_SYMBOL[m.fixed.currency] || '') + m.fixed.amount;
    }
    return s + ')';
  }

  function setMoney(el, cnyAmount, localAmount, currency, sameCurrency) {
    el.textContent = '';
    var main = document.createElement('span');
    main.textContent = cny(cnyAmount);
    el.appendChild(main);
    if (!sameCurrency) {
      var sub = document.createElement('span');
      sub.className = 'm-sub';
      sub.textContent = '（' + SYMBOL[currency] + ' ' + fmt(localAmount) + '）';
      el.appendChild(sub);
    }
  }

  function render(id) {
    current = id;
    var r = compute(id);
    var cur = r.m.currency;
    var same = cur === 'CNY';

    byId('bar-total').textContent = cny(r.totalCny);
    byId('bar-fee').textContent = '包含支付手续费：' + (r.feeCny > 0 ? cny(r.feeCny) : '免手续费');

    setMoney(byId('d-payable'), ORDER_CNY, r.payableLocal, cur, same);

    if (r.feeCny > 0) {
      setMoney(byId('d-fee'), r.feeCny, r.feeLocal, cur, same);
    } else {
      byId('d-fee').textContent = '';
      var plain = document.createElement('span');
      plain.className = 'm-plain';
      plain.textContent = '免手续费';
      byId('d-fee').appendChild(plain);
    }

    byId('d-method').textContent = r.m.name;

    byId('fee-tip').textContent = tipText(r.m);

    var totalEl = byId('d-total');
    totalEl.textContent = cny(r.totalCny);
    if (!same) {
      var tsub = document.createElement('span');
      tsub.className = 'm-sub';
      tsub.textContent = '（' + SYMBOL[cur] + ' ' + fmt(r.totalLocal) + '）';
      totalEl.appendChild(tsub);
    }
  }

  /* 余额状态：是否够付本单（余额支付免手续费，按订单金额判断） */
  function applyBalanceState() {
    var enough = balance >= ORDER_CNY;
    var row = byId('balance-row');
    var input = byId('pm-balance');
    var diffEl = byId('bal-diff');
    var recharge = byId('recharge-btn');

    byId('bal-num').textContent = cny(balance);

    if (enough) {
      row.classList.remove('is-disabled');
      input.disabled = false;
      diffEl.hidden = true;
      diffEl.textContent = '';
      recharge.hidden = true;
    } else {
      row.classList.add('is-disabled');
      input.disabled = true;
      diffEl.hidden = false;
      diffEl.textContent = '还差 ' + cny(round2(ORDER_CNY - balance));
      recharge.hidden = false;
      if (current === 'balance') {
        byId('pm-payid').checked = true;
        render('payid');
      }
    }
  }

  function setBalance(next) {
    balance = next;
    byId('demo-full').classList.toggle('is-on', next === BALANCE_FULL);
    byId('demo-low').classList.toggle('is-on', next === BALANCE_LOW);
    applyBalanceState();
  }

  var inputs = document.querySelectorAll('.m-input');
  for (var i = 0; i < inputs.length; i++) {
    inputs[i].addEventListener('change', function () {
      if (this.checked) { render(this.value); }
    });
  }

  var sheet = byId('detail-sheet');

  byId('detail-btn').addEventListener('click', function () {
    if (typeof sheet.showModal === 'function') {
      sheet.showModal();
    } else {
      sheet.setAttribute('open', '');
    }
  });

  function closeSheet() {
    if (typeof sheet.close === 'function') {
      sheet.close();
    } else {
      sheet.removeAttribute('open');
    }
  }

  byId('sheet-close').addEventListener('click', closeSheet);
  byId('sheet-done').addEventListener('click', closeSheet);

  sheet.addEventListener('click', function (e) {
    if (e.target === sheet) { closeSheet(); }
  });

  /* 轻提示 */
  var toastTimer;

  function showToast(msg) {
    var t = byId('toast');
    t.textContent = msg;
    t.classList.add('is-on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      t.classList.remove('is-on');
    }, 1800);
  }

  byId('recharge-btn').addEventListener('click', function () {
    showToast('跳转充值页');
  });

  byId('demo-full').addEventListener('click', function () { setBalance(BALANCE_FULL); });
  byId('demo-low').addEventListener('click', function () { setBalance(BALANCE_LOW); });

  render('payid');
  applyBalanceState();
</script>

</body>
</html>
