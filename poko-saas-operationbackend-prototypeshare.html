;&gt;\n        &lt;div class=&quot;op-info&quot;&gt;&lt;span class=&quot;op-dot warning&quot;&gt;&lt;/span&gt;&lt;span&gt;发起支付&lt;/span&gt;&lt;/div&gt;\n        &lt;span class=&quot;op-time&quot;&gt;2026-07-25 09:30:00&lt;/span&gt;\n      &lt;/div&gt;\n    `;\n  }\n\n  openBizModal(&#x27;viewModal&#x27;);\n}\n\nfunction openApproveModal() { openBizModal(&#x27;approveModal&#x27;); }\nfunction openRejectModal() { openBizModal(&#x27;rejectModal&#x27;); }\n\nfunction confirmApprove() {\n  alert(&#x27;审核通过！¥20,000.00 已充值到账户，流水已生成&#x27;);\n  closeBizModal(&#x27;approveModal&#x27;);\n  closeBizModal(&#x27;viewModal&#x27;);\n}\n\nfunction confirmReject() {\n  const ta = document.querySelector(&#x27;.reject-textarea&#x27;);\n  if (!ta.value.trim()) { alert(&#x27;请填写驳回原因&#x27;); return; }\n  alert(&#x27;已驳回，驳回原因已通知租户&#x27;);\n  closeBizModal(&#x27;rejectModal&#x27;);\n  closeBizModal(&#x27;viewModal&#x27;);\n}\n\nfunction quickReject(reason) {\n  document.querySelector(&#x27;.reject-textarea&#x27;).value = reason;\n}\n\n// ====== TAB切换 ======\nlet currentTab = &#x27;pending&#x27;;\nconst tabData = {\n  pending: { label: &#x27;待审核&#x27;, rows: &#x27;pending&#x27;, count: &#x27;5 条记录&#x27;, stats: [&#x27;待审核笔数&#x27;, &#x27;待审核金额&#x27;, &#x27;今日已通过&#x27;, &#x27;今日通过金额&#x27;], values: [&#x27;5 笔&#x27;, &#x27;¥ 58,000.00&#x27;, &#x27;12 笔&#x27;, &#x27;¥ 126,500.00&#x27;], colors: [&#x27;warning&#x27;, &#x27;warning&#x27;, &#x27;success&#x27;, &#x27;success&#x27;] },\n  approved: { label: &#x27;已通过&#x27;, rows: &#x27;approved&#x27;, count: &#x27;28 条记录&#x27;, stats: [&#x27;累计通过笔数&#x27;, &#x27;累计通过金额&#x27;, &#x27;今日通过笔数&#x27;, &#x27;今日通过金额&#x27;], values: [&#x27;28 笔&#x27;, &#x27;¥ 256,500.00&#x27;, &#x27;12 笔&#x27;, &#x27;¥ 126,500.00&#x27;], colors: [&#x27;info&#x27;, &#x27;info&#x27;, &#x27;success&#x27;, &#x27;success&#x27;] },\n  rejected: { label: &#x27;已驳回&#x27;, rows: &#x27;rejected&#x27;, count: &#x27;3 条记录&#x27;, stats: [&#x27;累计驳回笔数&#x27;, &#x27;累计驳回金额&#x27;, &#x27;今日驳回笔数&#x27;, &#x27;今日驳回金额&#x27;], values: [&#x27;3 笔&#x27;, &#x27;¥ 18,000.00&#x27;, &#x27;1 笔&#x27;, &#x27;¥ 3,000.00&#x27;], colors: [&#x27;danger&#x27;, &#x27;danger&#x27;, &#x27;danger&#x27;, &#x27;danger&#x27;] },\n  online: { label: &#x27;在线支付&#x27;, rows: &#x27;online&#x27;, count: &#x27;4 条记录&#x27;, stats: [&#x27;在线支付笔数&#x27;, &#x27;在线支付金额&#x27;, &#x27;今日成功笔数&#x27;, &#x27;今日成功金额&#x27;], values: [&#x27;4 笔&#x27;, &#x27;¥ 58,000.00&#x27;, &#x27;2 笔&#x27;, &#x27;¥ 38,000.00&#x27;], colors: [&#x27;info&#x27;, &#x27;info&#x27;, &#x27;success&#x27;, &#x27;success&#x27;] },\n  all: { label: &#x27;全部&#x27;, rows: &#x27;all&#x27;, count: &#x27;36 条记录&#x27;, stats: [&#x27;总笔数&#x27;, &#x27;总金额&#x27;, &#x27;成功笔数&#x27;, &#x27;成功率&#x27;], values: [&#x27;36 笔&#x27;, &#x27;¥ 332,500.00&#x27;, &#x27;32 笔&#x27;, &#x27;88.9%&#x27;], colors: [&#x27;info&#x27;, &#x27;info&#x27;, &#x27;success&#x27;, &#x27;success&#x27;] }\n};\n\nfunction switchTab(tab) {\n  if (currentTab === tab) return;\n  currentTab = tab;\n\n  // 更新TAB样式\n  const tabs = document.querySelectorAll(&#x27;.tab-item&#x27;);\n  const tabKeys = [&#x27;pending&#x27;, &#x27;approved&#x27;, &#x27;rejected&#x27;, &#x27;online&#x27;, &#x27;all&#x27;];\n  tabs.forEach((t, i) =&gt; {\n    t.classList.toggle(&#x27;active&#x27;, tabKeys[i] === tab);\n  });\n\n  // 隐藏所有数据行\n  document.querySelectorAll(&#x27;tbody tr&#x27;).forEach(tr =&gt; tr.style.display = &#x27;none&#x27;);\n\n  // 显示对应TAB的数据行\n  if (tab === &#x27;pending&#x27;) {\n    // 第一行 + 4个待审核行\n    const rows = document.querySelectorAll(&#x27;tbody tr&#x27;);\n    rows[0].style.display = &#x27;&#x27;;\n    document.querySelectorAll(&#x27;#tab-pending-rows, #tab-pending-rows ~ tr&#x27;).forEach((tr, i) =&gt; {\n      if (i &lt; 4 &amp;&amp; !tr.className) tr.style.display = &#x27;&#x27;;\n    });\n    // 简单处理：显示前5个非class行\n    let shown = 0;\n    document.querySelectorAll(&#x27;tbody tr&#x27;).forEach(tr =&gt; {\n      if (!tr.className &amp;&amp; shown &lt; 5) { tr.style.display = &#x27;&#x27;; shown++; }\n    });\n  } else if (tab === &#x27;all&#x27;) {\n    document.querySelectorAll(&#x27;tbody tr&#x27;).forEach(tr =&gt; tr.style.display = &#x27;&#x27;);\n  } else {\n    document.querySelectorAll(`tbody tr.tab-${tab}-row`).forEach(tr =&gt; tr.style.display = &#x27;&#x27;);\n    // all模式下额外显示一些行\n    if (tab === &#x27;approved&#x27; || tab === &#x27;online&#x27;) {\n      // 补充展示\n    }\n  }\n\n  // 更新统计卡片\n  const data = tabData[tab];\n  const statItems = document.querySelectorAll(&#x27;.stat-item&#x27;);\n  data.stats.forEach((label, i) =&gt; {\n    if (statItems[i]) {\n      statItems[i].querySelector(&#x27;.stat-label&#x27;).textContent = label;\n      const valEl = statItems[i].querySelector(&#x27;.stat-value&#x27;);\n      valEl.textContent = data.values[i];\n      valEl.className = &#x27;stat-value &#x27; + data.colors[i];\n      if (data.values[i].includes(&#x27;¥&#x27;)) valEl.classList.add(&#x27;amount&#x27;);\n    }\n  });\n\n  // 更新分页\n  document.querySelector(&#x27;.page-info&#x27;).textContent = &#x27;共 &#x27; + data.count;\n  setTimeout(drawConnections, 50);\n}\n\n// 绑定TAB点击\ndocument.addEventListener(&#x27;DOMContentLoaded&#x27;, () =&gt; {\n  const tabs = document.querySelectorAll(&#x27;.tab-item&#x27;);\n  const tabKeys = [&#x27;pending&#x27;, &#x27;approved&#x27;, &#x27;rejected&#x27;, &#x27;online&#x27;, &#x27;all&#x27;];\n  tabs.forEach((t, i) =&gt; {\n    t.style.cursor = &#x27;pointer&#x27;;\n    t.addEventListener(&#x27;click&#x27;, () =&gt; switchTab(tabKeys[i]));\n  });\n});\n&lt;/script&gt;\n&lt;/div&gt;\n&lt;div class=&quot;anno-right-panel&quot;&gt;\n&lt;h3&gt;页面标注&lt;/h3&gt;\n&lt;div class=&quot;anno-item&quot; data-anno-id=&quot;1&quot;&gt;\n&lt;div class=&quot;anno-item-header&quot;&gt;\n&lt;span class=&quot;anno-item-num&quot;&gt;1&lt;/span&gt;\n&lt;div class=&quot;anno-item-title&quot;&gt;FR-007 充值审核 · 页面总说明&lt;/div&gt;\n&lt;/div&gt;\n&lt;div class=&quot;anno-item-desc&quot;&gt;充值审核页是运营管理租户充值的核心页面，展示所有充值申请记录，支持按状态筛选和搜索。线下转账充值需运营审核通过后手动加款，在线支付（支付宝）自动到账无需审核。&lt;/div&gt;\n&lt;/div&gt;\n&lt;div class=&quot;anno-item&quot; data-anno-id=&quot;2&quot;&gt;\n&lt;div class=&quot;anno-item-header&quot;&gt;\n&lt;span class=&quot;anno-item-num&quot;&gt;2&lt;/span&gt;\n&lt;div class=&quot;anno-item-title&quot;&gt;充值状态分类&lt;/div&gt;\n&lt;/div&gt;\n&lt;div class=&quot;anno-item-desc&quot;&gt;按充值状态分类展示，共6种状态：待审核（线下转账待运营审核）、已到账（审核通过或在线支付成功）、已驳回（运营驳回）、支付中（在线支付进行中）、支付失败（在线支付...&lt;/div&gt;\n&lt;/div&gt;\n&lt;div class=&quot;anno-item&quot; data-anno-id=&quot;3&quot;&gt;\n&lt;div class=&quot;anno-item-header&quot;&gt;\n&lt;span class=&quot;anno-item-num&quot;&gt;3&lt;/span&gt;\n&lt;div class=&quot;anno-item-title&quot;&gt;充值审核操作&lt;/div&gt;\n&lt;/div&gt;\n&lt;div class=&quot;anno-item-desc&quot;&gt;运营对待审核的线下转账充值进行审核操作，包括审核通过和审核驳回两种操作。审核通过后余额增加，审核驳回需填写原因。&lt;/div&gt;\n&lt;/div&gt;\n&lt;div class=&quot;anno-item&quot; data-anno-id=&quot;4&quot;&gt;\n&lt;div class=&quot;anno-item-header&quot;&gt;\n&lt;span class=&quot;anno-item-num&quot;&gt;4&lt;/span&gt;\n&lt;div class=&quot;anno-item-title&quot;&gt;支付渠道区分&lt;/div&gt;\n&lt;/div&gt;\n&lt;div class=&quot;anno-item-desc&quot;&gt;区分不同支付渠道的充值记录。线下转账需运营审核，在线支付（支付宝）自动到账。不同渠道的充值状态流转不同。&lt;/div&gt;\n&lt;/div&gt;\n&lt;div class=&quot;anno-item&quot; data-anno-id=&quot;5&quot;&gt;\n&lt;div class=&quot;anno-item-header&quot;&gt;\n&lt;span class=&quot;anno-item-num&quot;&gt;5&lt;/span&gt;\n&lt;div class=&quot;anno-item-title&quot;&gt;充值详情与凭证&lt;/div&gt;\n&lt;/div&gt;\n&lt;div class=&quot;anno-item-desc&quot;&gt;点击充值记录可查看详情，包括充值基本信息、支付/审核时间线、操作日志等。线下转账可查看转账凭证图片。&lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;!-- 标注详情弹窗 --&gt;\n&lt;div class=&quot;anno-modal-mask&quot; id=&quot;annoModalMask&quot; onclick=&quot;annoCloseModalOnMask(event)&quot;&gt;\n&lt;div class=&quot;anno-modal-box&quot;&gt;\n&lt;div class=&quot;anno-modal-header&quot;&gt;\n&lt;h3 id=&quot;annoModalTitle&quot;&gt;标注详情&lt;/h3&gt;\n&lt;button class=&quot;anno-modal-close&quot; onclick=&quot;annoCloseModal()&quot;&gt;×&lt;/button&gt;\n&lt;/div&gt;\n&lt;div class=&quot;anno-modal-body&quot; id=&quot;annoModalBody&quot;&gt;&lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;script&gt;\n// ===== 新版标注系统交互逻辑 =====\n(function() {\n  // 获取所有标注数据（兼容两种格式）\n  function getAnnotationData() {\n    if (typeof annoData !== &#x27;undefined&#x27;) {\n      // 对象格式: { 1: {title, desc, rules, exception}, ... }\n      return annoData;\n    }\n    if (typeof annotations !== &#x27;undefined&#x27;) {\n      // 数组格式: [{title, content}, ...]\n      var result = {};\n      annotations.forEach(function(item, index) {\n        result[index + 1] = {\n          title: item.title,\n          desc: item.desc || &#x27;&#x27;,\n          content: item.content || &#x27;&#x27;,\n          rules: item.rules || &#x27;&#x27;,\n          exception: item.exception || &#x27;&#x27;\n        };\n      });\n      return result;\n    }\n    return {};\n  }\n\n  var data = getAnnotationData();\n  var keys = Object.keys(data).map(Number).sort(function(a, b) { return a - b; });\n\n  // 为左侧角标添加data-anno-id属性\n  var badges = document.querySelectorAll(&#x27;.anno-badge&#x27;);\n  badges.forEach(function(badge, index) {\n    if (!badge.getAttribute(&#x27;data-anno-id&#x27;)) {\n      var num = badge.textContent.trim();\n      if (!isNaN(parseInt(num))) {\n        badge.setAttribute(&#x27;data-anno-id&#x27;, parseInt(num));\n      } else {\n        badge.setAttribute(&#x27;data-anno-id&#x27;, index + 1);\n      }\n    }\n    // 绑定点击事件打开弹窗\n    badge.addEventListener(&#x27;click&#x27;, function(e) {\n      e.stopPropagation();\n      var id = badge.getAttribute(&#x27;data-anno-id&#x27;);\n      openAnnoDetailModal(parseInt(id));\n    });\n  });\n\n  // 为右侧标注条目绑定事件\n  var annoItems = document.querySelectorAll(&#x27;.anno-item&#x27;);\n  annoItems.forEach(function(item) {\n    var id = item.getAttribute(&#x27;data-anno-id&#x27;);\n    \n    // 悬停联动\n    item.addEventListener(&#x27;mouseenter&#x27;, function() {\n      highlightAnno(id);\n    });\n    item.addEventListener(&#x27;mouseleave&#x27;, function() {\n      unhighlightAnno(id);\n    });\n    \n    // 点击打开弹窗\n    item.addEventListener(&#x27;click&#x27;, function() {\n      openAnnoDetailModal(parseInt(id));\n    });\n  });\n\n  // 左侧角标悬停联动\n  badges.forEach(function(badge) {\n    var id = badge.getAttribute(&#x27;data-anno-id&#x27;);\n    var target = badge.closest(&#x27;.anno-target&#x27;) || badge.closest(&#x27;.anno-section&#x27;) || badge.parentElement;\n    if (target) {\n      target.addEventListener(&#x27;mouseenter&#x27;, function() {\n        highlightAnno(id);\n      });\n      target.addEventListener(&#x27;mouseleave&#x27;, function() {\n        unhighlightAnno(id);\n      });\n    }\n  });\n\n  function highlightAnno(id) {\n    var badge = document.querySelector(&#x27;.anno-badge[data-anno-id=&quot;&#x27; + id + &#x27;&quot;]&#x27;);\n    var item = document.querySelector(&#x27;.anno-item[data-anno-id=&quot;&#x27; + id + &#x27;&quot;]&#x27;);\n    if (badge) badge.classList.add(&#x27;active&#x27;);\n    if (item) item.classList.add(&#x27;active&#x27;);\n  }\n\n  function unhighlightAnno(id) {\n    var badge = document.querySelector(&#x27;.anno-badge[data-anno-id=&quot;&#x27; + id + &#x27;&quot;]&#x27;);\n    var item = document.querySelector(&#x27;.anno-item[data-anno-id=&quot;&#x27; + id + &#x27;&quot;]&#x27;);\n    if (badge) badge.classList.remove(&#x27;active&#x27;);\n    if (item) item.classList.remove(&#x27;active&#x27;);\n  }\n\n  function openAnnoDetailModal(id) {\n    var item = data[id];\n    if (!item) return;\n\n    document.getElementById(&#x27;annoModalTitle&#x27;).textContent = item.title || &#x27;标注详情&#x27;;\n    \n    var bodyHtml = &#x27;&#x27;;\n    // 如果有content字段（数组格式），直接使用\n    if (item.content) {\n      bodyHtml = item.content;\n      // 替换旧的table class\n      bodyHtml = bodyHtml.replace(/annotation-table/g, &#x27;anno-modal-table&#x27;);\n    } else {\n      // 对象格式：生成表格\n      bodyHtml = &#x27;&lt;table class=&quot;anno-modal-table&quot;&gt;&#x27;;\n      if (item.desc) {\n        bodyHtml += &#x27;&lt;tr&gt;&lt;th&gt;功能说明&lt;/th&gt;&lt;td&gt;&#x27; + item.desc + &#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;;\n      }\n      if (item.rules) {\n        bodyHtml += &#x27;&lt;tr&gt;&lt;th&gt;规则约束&lt;/th&gt;&lt;td&gt;&#x27; + item.rules + &#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;;\n      }\n      if (item.exception) {\n        bodyHtml += &#x27;&lt;tr&gt;&lt;th&gt;异常处理&lt;/th&gt;&lt;td&gt;&#x27; + item.exception + &#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;;\n      }\n      bodyHtml += &#x27;&lt;/table&gt;&#x27;;\n    }\n    \n    document.getElementById(&#x27;annoModalBody&#x27;).innerHTML = bodyHtml;\n    document.getElementById(&#x27;annoModalMask&#x27;).classList.add(&#x27;show&#x27;);\n  }\n\n  // 暴露给全局使用\n  window.annoOpenModal = openAnnoDetailModal;\n  window.annoCloseModal = function() {\n    document.getElementById(&#x27;annoModalMask&#x27;).classList.remove(&#x27;show&#x27;);\n  };\n  window.annoCloseModalOnMask = function(e) {\n    if (e.target.id === &#x27;annoModalMask&#x27;) {\n      window.annoCloseModal();\n    }\n  };\n\n  // ESC键关闭弹窗\n  document.addEventListener(&#x27;keydown&#x27;, function(e) {\n    if (e.key === &#x27;Escape&#x27;) {\n      window.annoCloseModal();\n    }\n  });\n})();\n&lt;/script&gt;\n&lt;/body&gt;\n&lt;/html&gt;\n',

/div&gt;\n&lt;/div&gt;\n&lt;!-- 备注 --&gt;\n&lt;div class=&quot;form-item&quot;&gt;\n&lt;label class=&quot;form-label&quot;&gt;备注说明&lt;/label&gt;\n&lt;textarea class=&quot;form-textarea&quot; placeholder=&quot;请输入备注信息，选填&quot;&gt;&lt;/textarea&gt;\n&lt;div class=&quot;form-tip&quot; id=&quot;remark-tip&quot;&gt;建议详细说明加款原因，方便后续审计和对账&lt;/div&gt;\n&lt;/div&gt;\n&lt;!-- 预览区 --&gt;\n&lt;div class=&quot;preview-section add&quot; id=&quot;anno-target-5&quot;&gt;\n&lt;div class=&quot;preview-title&quot;&gt;调整后账户预览&lt;/div&gt;\n&lt;div class=&quot;preview-grid&quot; id=&quot;preview-grid&quot;&gt;\n&lt;div class=&quot;preview-item&quot;&gt;\n&lt;span class=&quot;preview-item-label&quot;&gt;当前余额&lt;/span&gt;\n&lt;span class=&quot;preview-item-value&quot; id=&quot;prev-balance&quot;&gt;¥ 52,680.00&lt;/span&gt;\n&lt;/div&gt;\n&lt;div class=&quot;preview-item&quot;&gt;\n&lt;span class=&quot;preview-item-label&quot; id=&quot;prev-amount-label&quot;&gt;加款金额&lt;/span&gt;\n&lt;span class=&quot;preview-item-value add&quot; id=&quot;prev-amount&quot;&gt;+ ¥ 5,000.00&lt;/span&gt;\n&lt;/div&gt;\n&lt;div class=&quot;preview-item&quot;&gt;\n&lt;span class=&quot;preview-item-label&quot;&gt;调整后余额&lt;/span&gt;\n&lt;span class=&quot;preview-item-value add&quot; id=&quot;prev-new-balance&quot; style=&quot;font-weight:700;&quot;&gt;¥ 57,680.00&lt;/span&gt;\n&lt;/div&gt;\n&lt;div class=&quot;preview-item&quot;&gt;\n&lt;span class=&quot;preview-item-label&quot;&gt;账户状态&lt;/span&gt;\n&lt;span class=&quot;preview-item-value&quot; id=&quot;prev-status&quot;&gt;正常 → 正常&lt;/span&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;div class=&quot;warning-note&quot; id=&quot;fund-rule-note&quot;&gt;\n            💡 资金到账规则：加款金额直接计入账户余额，实时到账。\n          &lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;div class=&quot;modal-footer anno-target&quot; id=&quot;anno-target-5&quot;&gt;&lt;span class=&quot;anno-badge&quot; data-anno-id=&quot;5&quot;&gt;5&lt;/span&gt;\n&lt;div class=&quot;footer-tip&quot;&gt;所有操作将记录操作日志&lt;/div&gt;\n&lt;div class=&quot;footer-actions&quot;&gt;\n&lt;button class=&quot;btn btn-default&quot;&gt;取消&lt;/button&gt;\n&lt;button class=&quot;btn btn-success&quot; id=&quot;confirm-btn&quot;&gt;确认加款&lt;/button&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;div class=&quot;detail-modal&quot; id=&quot;detail-modal&quot; onclick=&quot;closeDetailOnMask(event)&quot;&gt;\n&lt;div class=&quot;detail-modal-box&quot;&gt;\n&lt;div class=&quot;detail-modal-header&quot;&gt;\n&lt;h3 id=&quot;detail-modal-title&quot;&gt;标注详情&lt;/h3&gt;\n&lt;button class=&quot;detail-modal-close&quot; onclick=&quot;closeDetail()&quot;&gt;×&lt;/button&gt;\n&lt;/div&gt;\n&lt;div class=&quot;detail-modal-body&quot; id=&quot;detail-modal-body&quot;&gt;&lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;script&gt;\nconst annoData = {\n  1: {\n    title: &#x27;FR-006 手动加款扣款 · 页面总说明&#x27;,\n    desc: &#x27;手动加款/扣款是运营调整租户账户余额的工具。加款直接增加余额，扣款直接扣减余额。常用于线下转账充值、罚款、调整账户等场景。扣款可能导致余额为负，触发余额不足状态。&#x27;,\n    rules: &#x27;&lt;ul&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;加款&lt;/span&gt;直接增加账户余额，生成充值流水（类型：手动加款）&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;扣款&lt;/span&gt;直接扣减账户余额，生成扣费流水（类型：手动扣款）&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;二次确认&lt;/span&gt;所有操作均需二次确认弹窗，防止误操作&lt;/li&gt;&lt;li&gt;扣款可能导致余额 &lt; 0（触发余额不足状态）&lt;/li&gt;&lt;li&gt;操作需填写原因，记录操作日志&lt;/li&gt;&lt;li&gt;仅运营管理员可执行此操作&lt;/li&gt;&lt;/ul&gt;&#x27;,\n    exception: &#x27;&lt;ul&gt;&lt;li&gt;扣款金额过大导致余额为负时，弹出风险提示需额外确认&lt;/li&gt;&lt;li&gt;操作失败时余额不变化，给出明确错误提示&lt;/li&gt;&lt;li&gt;所有操作均有操作日志，可追溯审计&lt;/li&gt;&lt;/ul&gt;&#x27;\n  },\n  2: {\n    title: &#x27;加款/扣款类型切换&#x27;,\n    desc: &#x27;通过顶部Tab切换加款和扣款两种操作类型，切换时确认按钮颜色和文案同步变化，视觉上明确区分两种操作。&#x27;,\n    rules: &#x27;&lt;ul&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;加款&lt;/span&gt;绿色主题，余额增加&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;扣款&lt;/span&gt;红色主题，余额减少&lt;/li&gt;&lt;li&gt;切换时保留已填内容（金额、原因等）&lt;/li&gt;&lt;li&gt;默认为加款类型&lt;/li&gt;&lt;li&gt;两种类型使用同一个表单框架，仅逻辑不同&lt;/li&gt;&lt;/ul&gt;&#x27;,\n    exception: &#x27;&lt;ul&gt;&lt;li&gt;切换类型时若已填金额，自动重置校验状态&lt;/li&gt;&lt;li&gt;扣款模式下额外显示风险提示&lt;/li&gt;&lt;/ul&gt;&#x27;\n  },\n  3: {\n    title: &#x27;租户信息确认&#x27;,\n    desc: &#x27;显示当前操作的租户信息和当前余额，帮助运营确认操作对象，避免选错租户。&#x27;,\n    rules: &#x27;&lt;ul&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;展示信息&lt;/span&gt;租户头像、名称、租户编号、当前余额&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;实时余额&lt;/span&gt;显示操作前的余额，便于核对&lt;/li&gt;&lt;li&gt;信息只读，不可修改&lt;/li&gt;&lt;li&gt;余额不足时余额数字标红&lt;/li&gt;&lt;/ul&gt;&#x27;,\n    exception: &#x27;&lt;ul&gt;&lt;li&gt;租户不存在或已删除时提示错误并关闭弹窗&lt;/li&gt;&lt;li&gt;余额加载失败时显示&quot;--&quot;并禁用提交按钮&lt;/li&gt;&lt;/ul&gt;&#x27;\n  },\n  4: {\n    title: &#x27;金额与原因&#x27;,\n    desc: &#x27;操作金额和原因是必填项。金额必须为正数，原因用于记录操作背景，便于后续审计和对账。&#x27;,\n    rules: &#x27;&lt;ul&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;金额&lt;/span&gt;必填，必须 &gt; 0，最多2位小数，单位元&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;原因&lt;/span&gt;必填，2-200字，说明操作理由&lt;/li&gt;&lt;li&gt;加款原因示例：线下转账充值、活动奖励等&lt;/li&gt;&lt;li&gt;扣款原因示例：罚款、培训费用、调整账户等&lt;/li&gt;&lt;li&gt;实时预览操作后余额变化&lt;/li&gt;&lt;/ul&gt;&#x27;,\n    exception: &#x27;&lt;ul&gt;&lt;li&gt;金额为0或负数时禁止提交&lt;/li&gt;&lt;li&gt;原因过于简短时提示补充说明&lt;/li&gt;&lt;li&gt;扣款后余额为负时弹出风险确认&lt;/li&gt;&lt;/ul&gt;&#x27;\n  },\n  5: {\n    title: &#x27;二次确认与提交&#x27;,\n    desc: &#x27;点击确认后弹出二次确认弹窗，展示操作详情和影响，运营确认后才真正执行。操作成功后余额立即更新并生成流水。&#x27;,\n    rules: &#x27;&lt;ul&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;二次确认&lt;/span&gt;展示操作类型、金额、原因、操作前后余额&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;事务保证&lt;/span&gt;余额变更和流水记录在同一事务中&lt;/li&gt;&lt;li&gt;扣款导致余额&lt;0时，自动标记余额不足状态&lt;/li&gt;&lt;li&gt;加款到账后触发待支付队列自动支付（先采购后物流）&lt;/li&gt;&lt;li&gt;操作成功后发送通知给租户&lt;/li&gt;&lt;li&gt;记录完整操作日志（操作人、时间、IP等）&lt;/li&gt;&lt;/ul&gt;&#x27;,\n    exception: &#x27;&lt;ul&gt;&lt;li&gt;操作失败时余额不变化，提示具体错误原因&lt;/li&gt;&lt;li&gt;网络超时时按钮显示加载中，防止重复提交&lt;/li&gt;&lt;li&gt;并发操作时使用乐观锁，保证数据一致性&lt;/li&gt;&lt;/ul&gt;&#x27;\n  }\n};\n// ========== 手动加款/扣款切换交互 ==========\nlet currentMode = &#x27;add&#x27;; // add | subtract\nlet selectedTypeIndex = 0;\n\nconst typeData = {\n  add: [\n    { icon: &#x27;🏦&#x27;, name: &#x27;线下充值&#x27; },\n    { icon: &#x27;🎁&#x27;, name: &#x27;补偿&#x27; },\n    { icon: &#x27;↩️&#x27;, name: &#x27;退款&#x27; },\n    { icon: &#x27;🆕&#x27;, name: &#x27;初始充值&#x27; },\n    { icon: &#x27;📝&#x27;, name: &#x27;其他&#x27; }\n  ],\n  subtract: [\n    { icon: &#x27;💻&#x27;, name: &#x27;定制开发费&#x27; },\n    { icon: &#x27;📚&#x27;, name: &#x27;培训费&#x27; },\n    { icon: &#x27;⚖️&#x27;, name: &#x27;罚款&#x27; },\n    { icon: &#x27;📝&#x27;, name: &#x27;其他&#x27; }\n  ]\n};\n\n// 账户初始数据\nconst accountData = {\n  balance: 52680.00,\n  creditUsed: 0.00,\n  creditLimit: 50000.00\n};\n\nfunction formatMoney(num) {\n  return &#x27;¥ &#x27; + num.toLocaleString(&#x27;zh-CN&#x27;, { minimumFractionDigits: 2, maximumFractionDigits: 2 });\n}\n\nfunction parseMoney(str) {\n  return parseFloat(str.replace(/[^\\d.]/g, &#x27;&#x27;)) || 0;\n}\n\nfunction renderTypeOptions() {\n  const container = document.getElementById(&#x27;type-options&#x27;);\n  const types = typeData[currentMode];\n  container.innerHTML = &#x27;&#x27;;\n  types.forEach((type, index) =&gt; {\n    const div = document.createElement(&#x27;div&#x27;);\n    div.className = `type-option ${currentMode} ${index === selectedTypeIndex ? &#x27;active&#x27; : &#x27;&#x27;}`;\n    div.innerHTML = `&lt;div class=&quot;type-option-icon&quot;&gt;${type.icon}&lt;/div&gt;&lt;div class=&quot;type-option-name&quot;&gt;${type.name}&lt;/div&gt;`;\n    div.onclick = () =&gt; { selectedTypeIndex = index; renderTypeOptions(); };\n    container.appendChild(div);\n  });\n}\n\nfunction updatePreview() {\n  const type = currentType; // add or sub\n  const amount = parseFloat(document.getElementById(&#x27;amount&#x27;).value) || 0;\n  \n  // 更新预览\n  if (type === &#x27;add&#x27;) {\n    document.getElementById(&#x27;prev-balance&#x27;).textContent = &#x27;¥ &#x27; + currentBalance.toLocaleString() + &#x27;.00&#x27;;\n    document.getElementById(&#x27;prev-change&#x27;).textContent = &#x27;+ ¥ &#x27; + amount.toLocaleString() + &#x27;.00&#x27;;\n    document.getElementById(&#x27;prev-change&#x27;).className = &#x27;preview-item-value add&#x27;;\n    const newBalance = currentBalance + amount;\n    document.getElementById(&#x27;prev-new-balance&#x27;).textContent = &#x27;¥ &#x27; + newBalance.toLocaleString() + &#x27;.00&#x27;;\n    \n    // 资金规则说明\n    const ruleNote = document.getElementById(&#x27;fund-rule-note&#x27;);\n    if (amount &gt; 0) {\n      ruleNote.innerHTML = &#x27;💡 加款金额直接计入账户余额，实时到账。&#x27;;\n      ruleNote.className = &#x27;rule-note&#x27;;\n    } else {\n      ruleNote.innerHTML = &#x27;请输入加款金额&#x27;;\n      ruleNote.className = &#x27;rule-note warning&#x27;;\n    }\n  } else {\n    document.getElementById(&#x27;prev-balance&#x27;).textContent = &#x27;¥ &#x27; + currentBalance.toLocaleString() + &#x27;.00&#x27;;\n    document.getElementById(&#x27;prev-change&#x27;).textContent = &#x27;- ¥ &#x27; + amount.toLocaleString() + &#x27;.00&#x27;;\n    document.getElementById(&#x27;prev-change&#x27;).className = &#x27;preview-item-value sub&#x27;;\n    const newBalance = currentBalance - amount;\n    document.getElementById(&#x27;prev-new-balance&#x27;).textContent = &#x27;¥ &#x27; + newBalance.toLocaleString() + &#x27;.00&#x27;;\n    \n    // 资金规则说明\n    const ruleNote = document.getElementById(&#x27;fund-rule-note&#x27;);\n    if (amount &lt;= 0) {\n      ruleNote.innerHTML = &#x27;请输入扣款金额&#x27;;\n      ruleNote.className = &#x27;rule-note warning&#x27;;\n    } else if (newBalance &gt;= 0) {\n      ruleNote.innerHTML = &#x27;💡 扣款直接从账户余额中扣除，余额充足。&#x27;;\n      ruleNote.className = &#x27;rule-note&#x27;;\n    } else {\n      ruleNote.innerHTML = &#x27;⚠️ 余额不足，扣款后余额将为负数。请确认后再操作。&#x27;;\n      ruleNote.className = &#x27;rule-note warning&#x27;;\n    }\n  }\n}\n\nfunction switchMode(mode) {\n  if (mode === currentMode) return;\n  currentMode = mode;\n  selectedTypeIndex = 0;\n\n  document.querySelectorAll(&#x27;.type-tab&#x27;).forEach(t =&gt; t.classList.remove(&#x27;active&#x27;));\n  document.querySelector(`.type-tab.${mode}`).classList.add(&#x27;active&#x27;);\n\n  document.getElementById(&#x27;amount-wrapper&#x27;).className = `amount-input-wrapper ${mode}`;\n  document.getElementById(&#x27;amount-label&#x27;).innerHTML = `&lt;span class=&quot;required&quot;&gt;*&lt;/span&gt;${mode === &#x27;add&#x27; ? &#x27;加款金额&#x27; : &#x27;扣款金额&#x27;}`;\n  document.getElementById(&#x27;type-label&#x27;).innerHTML = `&lt;span class=&quot;required&quot;&gt;*&lt;/span&gt;${mode === &#x27;add&#x27; ? &#x27;加款类型&#x27; : &#x27;扣款类型&#x27;}`;\n  document.getElementById(&#x27;type-tip&#x27;).textContent = `选择与实际业务场景最匹配的${mode === &#x27;add&#x27; ? &#x27;加款&#x27; : &#x27;扣款&#x27;}类型，便于后续对账和统计`;\n  document.getElementById(&#x27;remark-tip&#x27;).textContent = `建议详细说明${mode === &#x27;add&#x27; ? &#x27;加款&#x27; : &#x27;扣款&#x27;}原因，方便后续审计和对账`;\n  document.querySelector(&#x27;.preview-section&#x27;).className = `preview-section ${mode}`;\n  const btn = document.getElementById(&#x27;confirm-btn&#x27;);\n  btn.textContent = mode === &#x27;add&#x27; ? &#x27;确认加款&#x27; : &#x27;确认扣款&#x27;;\n  btn.className = `btn ${mode === &#x27;add&#x27; ? &#x27;btn-success&#x27; : &#x27;btn-danger&#x27;}`;\n\n  renderTypeOptions();\n  updatePreview();\n  setTimeout(drawConnections, 50);\n}\n\nfunction initInteractive() {\n  document.querySelector(&#x27;.type-tab.add&#x27;).onclick = () =&gt; switchMode(&#x27;add&#x27;);\n  document.querySelector(&#x27;.type-tab.subtract&#x27;).onclick = () =&gt; switchMode(&#x27;subtract&#x27;);\n  document.getElementById(&#x27;amount-input&#x27;).addEventListener(&#x27;input&#x27;, function() {\n    let val = this.value.replace(/[^\\d.]/g, &#x27;&#x27;);\n    const parts = val.split(&#x27;.&#x27;);\n    if (parts.length &gt; 2) val = parts[0] + &#x27;.&#x27; + parts.slice(1).join(&#x27;&#x27;);\n    if (parts[1] &amp;&amp; parts[1].length &gt; 2) val = parts[0] + &#x27;.&#x27; + parts[1].slice(0, 2);\n    this.value = val;\n    updatePreview();\n  });\n\n  document.querySelectorAll(&#x27;#quick-amounts .quick-amount-btn&#x27;).forEach(btn =&gt; {\n    btn.onclick = function() {\n      document.getElementById(&#x27;amount-input&#x27;).value = this.textContent.replace(/[^\\d.]/g, &#x27;&#x27;);\n      updatePreview();\n    };\n  });\n\n  renderTypeOptions();\n  updatePreview();\n}\n\nfunction openModal(id) {\n  const data = annotationData[id];\n  if (!data) return;\n  document.getElementById(&#x27;detail-modal-title&#x27;).textContent = data.title;\n  document.getElementById(&#x27;detail-modal-body&#x27;).innerHTML = data.content;\n  document.getElementById(&#x27;detail-modal&#x27;).classList.add(&#x27;show&#x27;);\n}\nfunction closeDetail() { document.getElementById(&#x27;detail-modal&#x27;).classList.remove(&#x27;show&#x27;); }\nfunction closeDetailOnMask(e) { if (e.target.id === &#x27;detail-modal&#x27;) closeDetail(); }\ndocument.addEventListener(&#x27;keydown&#x27;, e =&gt; { if (e.key === &#x27;Escape&#x27;) closeDetail(); });\n\n// 初始化交互\ninitInteractive();\n\n&lt;/script&gt;\n&lt;/div&gt;\n&lt;div class=&quot;anno-right-panel&quot;&gt;\n&lt;h3&gt;页面标注&lt;/h3&gt;\n&lt;div class=&quot;anno-item&quot; data-anno-id=&quot;1&quot;&gt;\n&lt;div class=&quot;anno-item-header&quot;&gt;\n&lt;span class=&quot;anno-item-num&quot;&gt;1&lt;/span&gt;\n&lt;div class=&quot;anno-item-title&quot;&gt;FR-006 手动加款扣款 · 页面总说明&lt;/div&gt;\n&lt;/div&gt;\n&lt;div class=&quot;anno-item-desc&quot;&gt;手动加款/扣款是运营调整租户账户余额的工具。加款直接增加余额，扣款直接扣减余额。常用于线下转账充值、罚款、调整账户等场景。扣款可能导致余额为负，触发余额不足状态...&lt;/div&gt;\n&lt;/div&gt;\n&lt;div class=&quot;anno-item&quot; data-anno-id=&quot;2&quot;&gt;\n&lt;div class=&quot;anno-item-header&quot;&gt;\n&lt;span class=&quot;anno-item-num&quot;&gt;2&lt;/span&gt;\n&lt;div class=&quot;anno-item-title&quot;&gt;加款/扣款类型切换&lt;/div&gt;\n&lt;/div&gt;\n&lt;div class=&quot;anno-item-desc&quot;&gt;通过顶部Tab切换加款和扣款两种操作类型，切换时确认按钮颜色和文案同步变化，视觉上明确区分两种操作。&lt;/div&gt;\n&lt;/div&gt;\n&lt;div class=&quot;anno-item&quot; data-anno-id=&quot;3&quot;&gt;\n&lt;div class=&quot;anno-item-header&quot;&gt;\n&lt;span class=&quot;anno-item-num&quot;&gt;3&lt;/span&gt;\n&lt;div class=&quot;anno-item-title&quot;&gt;租户信息确认&lt;/div&gt;\n&lt;/div&gt;\n&lt;div class=&quot;anno-item-desc&quot;&gt;显示当前操作的租户信息和当前余额，帮助运营确认操作对象，避免选错租户。&lt;/div&gt;\n&lt;/div&gt;\n&lt;div class=&quot;anno-item&quot; data-anno-id=&quot;4&quot;&gt;\n&lt;div class=&quot;anno-item-header&quot;&gt;\n&lt;span class=&quot;anno-item-num&quot;&gt;4&lt;/span&gt;\n&lt;div class=&quot;anno-item-title&quot;&gt;金额与原因&lt;/div&gt;\n&lt;/div&gt;\n&lt;div class=&quot;anno-item-desc&quot;&gt;操作金额和原因是必填项。金额必须为正数，原因用于记录操作背景，便于后续审计和对账。&lt;/div&gt;\n&lt;/div&gt;\n&lt;div class=&quot;anno-item&quot; data-anno-id=&quot;5&quot;&gt;\n&lt;div class=&quot;anno-item-header&quot;&gt;\n&lt;span class=&quot;anno-item-num&quot;&gt;5&lt;/span&gt;\n&lt;div class=&quot;anno-item-title&quot;&gt;二次确认与提交&lt;/div&gt;\n&lt;/div&gt;\n&lt;div class=&quot;anno-item-desc&quot;&gt;点击确认后弹出二次确认弹窗，展示操作详情和影响，运营确认后才真正执行。操作成功后余额立即更新并生成流水。&lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;!-- 标注详情弹窗 --&gt;\n&lt;div class=&quot;anno-modal-mask&quot; id=&quot;annoModalMask&quot; onclick=&quot;annoCloseModalOnMask(event)&quot;&gt;\n&lt;div class=&quot;anno-modal-box&quot;&gt;\n&lt;div class=&quot;anno-modal-header&quot;&gt;\n&lt;h3 id=&quot;annoModalTitle&quot;&gt;标注详情&lt;/h3&gt;\n&lt;button class=&quot;anno-modal-close&quot; onclick=&quot;annoCloseModal()&quot;&gt;×&lt;/button&gt;\n&lt;/div&gt;\n&lt;div class=&quot;anno-modal-body&quot; id=&quot;annoModalBody&quot;&gt;&lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;script&gt;\n// ===== 新版标注系统交互逻辑 =====\n(function() {\n  // 获取所有标注数据（兼容两种格式）\n  function getAnnotationData() {\n    if (typeof annoData !== &#x27;undefined&#x27;) {\n      // 对象格式: { 1: {title, desc, rules, exception}, ... }\n      return annoData;\n    }\n    if (typeof annotations !== &#x27;undefined&#x27;) {\n      // 数组格式: [{title, content}, ...]\n      var result = {};\n      annotations.forEach(function(item, index) {\n        result[index + 1] = {\n          title: item.title,\n          desc: item.desc || &#x27;&#x27;,\n          content: item.content || &#x27;&#x27;,\n          rules: item.rules || &#x27;&#x27;,\n          exception: item.exception || &#x27;&#x27;\n        };\n      });\n      return result;\n    }\n    return {};\n  }\n\n  var data = getAnnotationData();\n  var keys = Object.keys(data).map(Number).sort(function(a, b) { return a - b; });\n\n  // 为左侧角标添加data-anno-id属性\n  var badges = document.querySelectorAll(&#x27;.anno-badge&#x27;);\n  badges.forEach(function(badge, index) {\n    if (!badge.getAttribute(&#x27;data-anno-id&#x27;)) {\n      var num = badge.textContent.trim();\n      if (!isNaN(parseInt(num))) {\n        badge.setAttribute(&#x27;data-anno-id&#x27;, parseInt(num));\n      } else {\n        badge.setAttribute(&#x27;data-anno-id&#x27;, index + 1);\n      }\n    }\n    // 绑定点击事件打开弹窗\n    badge.addEventListener(&#x27;click&#x27;, function(e) {\n      e.stopPropagation();\n      var id = badge.getAttribute(&#x27;data-anno-id&#x27;);\n      openAnnoDetailModal(parseInt(id));\n    });\n  });\n\n  // 为右侧标注条目绑定事件\n  var annoItems = document.querySelectorAll(&#x27;.anno-item&#x27;);\n  annoItems.forEach(function(item) {\n    var id = item.getAttribute(&#x27;data-anno-id&#x27;);\n    \n    // 悬停联动\n    item.addEventListener(&#x27;mouseenter&#x27;, function() {\n      highlightAnno(id);\n    });\n    item.addEventListener(&#x27;mouseleave&#x27;, function() {\n      unhighlightAnno(id);\n    });\n    \n    // 点击打开弹窗\n    item.addEventListener(&#x27;click&#x27;, function() {\n      openAnnoDetailModal(parseInt(id));\n    });\n  });\n\n  // 左侧角标悬停联动\n  badges.forEach(function(badge) {\n    var id = badge.getAttribute(&#x27;data-anno-id&#x27;);\n    var target = badge.closest(&#x27;.anno-target&#x27;) || badge.closest(&#x27;.anno-section&#x27;) || badge.parentElement;\n    if (target) {\n      target.addEventListener(&#x27;mouseenter&#x27;, function() {\n        highlightAnno(id);\n      });\n      target.addEventListener(&#x27;mouseleave&#x27;, function() {\n        unhighlightAnno(id);\n      });\n    }\n  });\n\n  function highlightAnno(id) {\n    var badge = document.querySelector(&#x27;.anno-badge[data-anno-id=&quot;&#x27; + id + &#x27;&quot;]&#x27;);\n    var item = document.querySelector(&#x27;.anno-item[data-anno-id=&quot;&#x27; + id + &#x27;&quot;]&#x27;);\n    if (badge) badge.classList.add(&#x27;active&#x27;);\n    if (item) item.classList.add(&#x27;active&#x27;);\n  }\n\n  function unhighlightAnno(id) {\n    var badge = document.querySelector(&#x27;.anno-badge[data-anno-id=&quot;&#x27; + id + &#x27;&quot;]&#x27;);\n    var item = document.querySelector(&#x27;.anno-item[data-anno-id=&quot;&#x27; + id + &#x27;&quot;]&#x27;);\n    if (badge) badge.classList.remove(&#x27;active&#x27;);\n    if (item) item.classList.remove(&#x27;active&#x27;);\n  }\n\n  function openAnnoDetailModal(id) {\n    var item = data[id];\n    if (!item) return;\n\n    document.getElementById(&#x27;annoModalTitle&#x27;).textContent = item.title || &#x27;标注详情&#x27;;\n    \n    var bodyHtml = &#x27;&#x27;;\n    // 如果有content字段（数组格式），直接使用\n    if (item.content) {\n      bodyHtml = item.content;\n      // 替换旧的table class\n      bodyHtml = bodyHtml.replace(/annotation-table/g, &#x27;anno-modal-table&#x27;);\n    } else {\n      // 对象格式：生成表格\n      bodyHtml = &#x27;&lt;table class=&quot;anno-modal-table&quot;&gt;&#x27;;\n      if (item.desc) {\n        bodyHtml += &#x27;&lt;tr&gt;&lt;th&gt;功能说明&lt;/th&gt;&lt;td&gt;&#x27; + item.desc + &#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;;\n      }\n      if (item.rules) {\n        bodyHtml += &#x27;&lt;tr&gt;&lt;th&gt;规则约束&lt;/th&gt;&lt;td&gt;&#x27; + item.rules + &#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;;\n      }\n      if (item.exception) {\n        bodyHtml += &#x27;&lt;tr&gt;&lt;th&gt;异常处理&lt;/th&gt;&lt;td&gt;&#x27; + item.exception + &#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;;\n      }\n      bodyHtml += &#x27;&lt;/table&gt;&#x27;;\n    }\n    \n    document.getElementById(&#x27;annoModalBody&#x27;).innerHTML = bodyHtml;\n    document.getElementById(&#x27;annoModalMask&#x27;).classList.add(&#x27;show&#x27;);\n  }\n\n  // 暴露给全局使用\n  window.annoOpenModal = openAnnoDetailModal;\n  window.annoCloseModal = function() {\n    document.getElementById(&#x27;annoModalMask&#x27;).classList.remove(&#x27;show&#x27;);\n  };\n  window.annoCloseModalOnMask = function(e) {\n    if (e.target.id === &#x27;annoModalMask&#x27;) {\n      window.annoCloseModal();\n    }\n  };\n\n  // ESC键关闭弹窗\n  document.addEventListener(&#x27;keydown&#x27;, function(e) {\n    if (e.key === &#x27;Escape&#x27;) {\n      window.annoCloseModal();\n    }\n  });\n})();\n&lt;/script&gt;\n&lt;/body&gt;\n&lt;/html&gt;\n',
    '物流线路管理': '&lt;!DOCTYPE html&gt;\n&lt;html lang=&quot;zh-CN&quot;&gt;\n&lt;head&gt;\n&lt;meta charset=&quot;UTF-8&quot;&gt;\n&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;&gt;\n&lt;title&gt;POKO SaaS - 物流线路管理（平台侧）&lt;/title&gt;\n&lt;style&gt;\n  * { margin: 0; padding: 0; box-sizing: border-box; }\n  body {\n    font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, sans-serif;\n    background: #f0f2f5; color: #303133; font-size: 14px;\n  }\n  .container { display: flex; min-height: 100vh; width: 100%; position: relative; }\n  .left-panel { width: 100%; position: relative; background: #f0f2f5; padding-bottom: 40px; }\n  .right-panel {\n    width: 18%; background: #fff;\n    border-left: 1px solid #e4e7ed; padding: 20px 16px;\n    position: fixed; right: 0; top: 0; height: 100vh; overflow-y: auto; z-index: 100;\n  }\n  .right-panel h3 {\n    font-size: 15px; font-weight: 600; color: #303133;\n    margin-bottom: 16px; padding-bottom: 10px; border-bottom: 2px solid #3B82F6;\n  }\n  .annotation-item {\n    margin-bottom: 16px; padding-left: 12px; border-left: 3px solid #3B82F6;\n    cursor: pointer; transition: all 0.2s; position: relative;\n  }\n  .annotation-item:hover { background: #f5f7fa; border-radius: 0 4px 4px 0; }\n  .annotation-item .num {\n    display: inline-block; width: 20px; height: 20px; line-height: 20px;\n    text-align: center; background: #3B82F6; color: #fff; border-radius: 50%;\n    font-size: 12px; font-weight: 600; margin-right: 6px;\n  }\n  .annotation-item h4 {\n    font-size: 13px; font-weight: 600; color: #303133;\n    margin-bottom: 6px; display: inline-block;\n  }\n  .annotation-item .anno-content {\n    font-size: 12px; color: #606266; line-height: 1.6; margin-top: 4px;\n    height: 60px; overflow: hidden; position: relative;\n  }\n  .annotation-item .anno-content::after {\n    content: &#x27;...&#x27;; position: absolute; bottom: 0; right: 0;\n    padding-left: 20px; background: linear-gradient(to right, transparent, #fff 50%);\n  }\n  .annotation-item .view-more {\n    font-size: 11px; color: #3B82F6; margin-top: 4px; text-align: right;\n  }\n  .anno-section { position: relative; }\n  .anno-badge {\n    position: absolute; top: -8px; left: -8px; z-index: 10;\n    width: 22px; height: 22px; line-height: 22px; text-align: center;\n    background: #3B82F6; color: #fff;\n    border-radius: 50%; font-size: 12px; font-weight: 600;\n    cursor: pointer; user-select: none;\n    transition: all 0.2s;\n    box-shadow: 0 2px 6px rgba(59,130,246,0.3);\n  }\n  .anno-section:hover .anno-badge {\n    transform: scale(1.2);\n    background: #2563eb;\n    box-shadow: 0 4px 12px rgba(59,130,246,0.4);\n  }\n\n  /* 通用弹窗 */\n  .modal-mask {\n    position: fixed; top: 0; left: 0; width: 100%; height: 100%;\n    background: rgba(0,0,0,0.5); display: none;\n    justify-content: center; align-items: center; z-index: 9999;\n  }\n  .modal-mask.show { display: flex; }\n  .modal-box {\n    background: #fff; border: 1px solid #E4E7ED; border-radius: 12px; width: 800px; max-height: 80vh;\n    display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,0.15);\n  }\n  .modal-header {\n    padding: 16px 24px; border-bottom: 1px solid #E4E7ED;\n    display: flex; justify-content: space-between; align-items: center;\n    background: #fff; border-radius: 12px 12px 0 0;\n  }\n  .modal-header h3 { font-size: 16px; font-weight: 600; color: #303133; }\n  .modal-close {\n    width: 28px; height: 28px; border: none; background: #f5f7fa;\n    border-radius: 50%; cursor: pointer; font-size: 16px; color: #909399;\n    display: flex; align-items: center; justify-content: center;\n  }\n  .modal-close:hover { background: #e4e7ed; color: #303133; }\n  .modal-body { padding: 20px 24px; overflow-y: auto; flex: 1; }\n  .modal-footer { padding: 16px 24px; border-top: 1px solid #E4E7ED; display: flex; justify-content: flex-end; gap: 10px; background: #fff; border-radius: 0 0 12px 12px; }\n\n  /* 标注详情表格 */\n  .annotation-table {\n    width: 100%; border-collapse: collapse;\n    border: 1px solid #FFD591; border-radius: 8px; overflow: hidden;\n  }\n  .annotation-table th {\n    background: #FFE7BA; color: #AD6800;\n    padding: 10px 14px; text-align: left;\n    font-size: 13px; font-weight: 600;\n    border-bottom: 1px solid #FFD591;\n  }\n  .annotation-table td {\n    padding: 10px 14px; font-size: 13px;\n    color: #AD6800; line-height: 1.7;\n    border-bottom: 1px solid #FFE0B2;\n    background: #FFF7E6;\n  }\n  .annotation-table tr:last-child td { border-bottom: none; }\n  .annotation-table td:first-child {\n    width: 100px; font-weight: 600;\n    color: #AD6800; white-space: nowrap;\n  }\n  .annotation-table ul {\n    margin: 4px 0; padding-left: 18px;\n  }\n  .annotation-table li {\n    font-size: 12px; color: #AD6800; line-height: 1.7;\n    margin-bottom: 2px;\n  }\n  .form-item { display: flex; flex-direction: column; gap: 6px; }\n  .form-item.full { grid-column: 1 / -1; }\n  .form-label {\n    font-size: 13px; color: #606266;\n  }\n  .form-label .required { color: #EF4444; margin-right: 2px; }\n  .form-input, .form-select, .form-textarea {\n    height: 36px; padding: 0 12px; border: 1px solid #dcdfe6;\n    border-radius: 6px; font-size: 13px; color: #303133; background: #fff;\n    transition: border-color 0.2s;\n  }\n  .form-input:focus, .form-select:focus, .form-textarea:focus {\n    outline: none; border-color: #3B82F6;\n  }\n  .form-textarea {\n    height: 80px; padding: 10px 12px; resize: vertical;\n    font-family: inherit; line-height: 1.6;\n  }\n  .form-row-inline {\n    display: flex; gap: 16px; align-items: flex-start;\n  }\n  .checkbox-group {\n    display: flex; gap: 20px; flex-wrap: wrap; padding: 8px 0;\n  }\n  .checkbox-item {\n    display: flex; align-items: center; gap: 6px; cursor: pointer;\n    font-size: 13px; color: #303133;\n  }\n  .checkbox-item input[type=&quot;checkbox&quot;] { cursor: pointer; }\n\n  /* 平台后台样式 */\n  .top-nav {\n    height: 56px; background: #fff; border-bottom: 1px solid #e4e7ed;\n    display: flex; align-items: center; justify-content: space-between;\n    padding: 0 24px;\n  }\n  .logo { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 600; }\n  .logo-icon {\n    width: 32px; height: 32px; background: linear-gradient(135deg, #8B5CF6, #a78bfa);\n    border-radius: 8px; display: flex; align-items: center; justify-content: center;\n    color: #fff; font-weight: 700;\n  }\n  .nav-right { display: flex; align-items: center; gap: 20px; }\n  .user-info { display: flex; align-items: center; gap: 8px; }\n  .avatar {\n    width: 32px; height: 32px; border-radius: 50%; background: #f0f2f5;\n    display: flex; align-items: center; justify-content: center; color: #606266;\n  }\n\n  .main-content { display: flex; }\n  .sidebar {\n    width: 200px; background: #fff; border-right: 1px solid #e4e7ed; padding: 16px 0;\n  }\n  .menu-group { margin-bottom: 4px; }\n  .menu-title { padding: 10px 20px; font-size: 12px; color: #909399; font-weight: 500; }\n  .menu-item {\n    padding: 10px 20px 10px 40px; cursor: pointer; font-size: 14px; color: #606266;\n    transition: all 0.2s; display: flex; align-items: center; gap: 10px;\n  }\n  .menu-item:hover { background: #f5f7fa; color: #303133; }\n  .menu-item.active {\n    background: #ecf5ff; color: #3B82F6; font-weight: 500;\n    border-right: 3px solid #3B82F6;\n  }\n  .menu-item .icon-dot { width: 6px; height: 6px; border-radius: 50%; background: #c0c4cc; }\n  .menu-item.active .icon-dot { background: #3B82F6; }\n\n  .content { flex: 1; padding: 20px; width: calc(100% - 200px); }\n  .page-header { margin-bottom: 20px; display: flex; justify-content: space-between; align-items: flex-start; }\n  .page-title { font-size: 20px; font-weight: 600; margin-bottom: 6px; }\n  .breadcrumb { font-size: 13px; color: #90939 ument.createElement(&#x27;option&#x27;);\n  firstOpt.value = &#x27;&#x27;;\n  firstOpt.textContent = &#x27;请选择关联线路（可选，自动预填）&#x27;;\n  lineSelect.appendChild(firstOpt);\n  \n  lines.forEach(function(line, idx) {\n    var opt = document.createElement(&#x27;option&#x27;);\n    opt.value = idx;\n    opt.textContent = line.name;\n    lineSelect.appendChild(opt);\n  });\n}\n\nfunction onRelatedLineChange() {\n  var provider = document.getElementById(&#x27;providerSelect&#x27;).value;\n  var lineIdx = document.getElementById(&#x27;relatedLineSelect&#x27;).value;\n  if (!provider || lineIdx === &#x27;&#x27;) return;\n  \n  var line = providerLines[provider][parseInt(lineIdx)];\n  if (!line) return;\n  \n  // 自动预填线路信息（仅预填线路名称和运输方式，时效需手动填写）\n  document.getElementById(&#x27;lineNameInput&#x27;).value = line.name;\n  document.getElementById(&#x27;transportSelect&#x27;).value = line.transport;\n  // 时效字段不自动填充，留空由用户手动填写\n  document.getElementById(&#x27;时效Input&#x27;).value = &#x27;&#x27;;\n  \n  // 提示用户可修改\n  var hint = document.getElementById(&#x27;autoFillHint&#x27;);\n  if (!hint) {\n    var nameItem = document.getElementById(&#x27;lineNameInput&#x27;).closest(&#x27;.form-item&#x27;);\n    var tip = document.createElement(&#x27;div&#x27;);\n    tip.id = &#x27;autoFillHint&#x27;;\n    tip.style.cssText = &#x27;font-size:11px;color:#3B82F6;margin-top:2px;&#x27;;\n    tip.textContent = &#x27;✓ 已根据关联线路自动填充名称和运输方式，可手动修改；时效需手动填写&#x27;;\n    nameItem.appendChild(tip);\n  }\n}\n\nconst annotations = [\n  {\n    title: &#x27;页面总说明&#x27;,\n    content: `\n      &lt;table class=&quot;annotation-table&quot;&gt;\n        &lt;tr&gt;&lt;th&gt;项目&lt;/th&gt;&lt;th&gt;说明&lt;/th&gt;&lt;/tr&gt;\n        &lt;tr&gt;&lt;td&gt;功能说明&lt;/td&gt;&lt;td&gt;平台线路列表是运营侧集中管理所有平台线路的入口页面，以列表形式展示所有线路的基本信息、物流渠道、目的国、运输方式、首重价、状态、引用租户数等，支持搜索、筛选、新增、编辑、启用/停用、查看详情等操作。&lt;/td&gt;&lt;/tr&gt;\n        &lt;tr&gt;&lt;td&gt;规则约束&lt;/td&gt;&lt;td&gt;&lt;ul&gt;&lt;li&gt;默认按创建时间倒序排列，每页20条&lt;/li&gt;&lt;li&gt;运输方式：陆运/海快/空运/海运 4种&lt;/li&gt;&lt;li&gt;目的国多选展示（标签形式，超过3个折叠显示）&lt;/li&gt;&lt;li&gt;状态仅2种：已启用/已停用&lt;/li&gt;&lt;li&gt;已停用行文字标灰&lt;/li&gt;&lt;li&gt;引用租户数展示当前引用该线路的租户数量&lt;/li&gt;&lt;li&gt;操作列：编辑、停用/启用、查看详情&lt;/li&gt;&lt;li&gt;无删除功能，用停用替代&lt;/li&gt;&lt;/ul&gt;&lt;/td&gt;&lt;/tr&gt;\n        &lt;tr&gt;&lt;td&gt;异常处理&lt;/td&gt;&lt;td&gt;搜索无结果时显示空状态提示；筛选条件组合无数据时引导重置筛选。&lt;/td&gt;&lt;/tr&gt;\n      &lt;/table&gt;\n    `\n  },\n  {\n    title: &#x27;多维度筛选&#x27;,\n    content: `\n      &lt;table class=&quot;annotation-table&quot;&gt;\n        &lt;tr&gt;&lt;th&gt;项目&lt;/th&gt;&lt;th&gt;说明&lt;/th&gt;&lt;/tr&gt;\n        &lt;tr&gt;&lt;td&gt;功能说明&lt;/td&gt;&lt;td&gt;支持按线路名称搜索，按状态、目的国、运输方式、物流渠道等多维度筛选线路，帮助运营快速定位目标线路。&lt;/td&gt;&lt;/tr&gt;\n        &lt;tr&gt;&lt;td&gt;规则约束&lt;/td&gt;&lt;td&gt;&lt;ul&gt;&lt;li&gt;关键词搜索：支持线路名称模糊搜索&lt;/li&gt;&lt;li&gt;状态筛选：全部/已启用/已停用&lt;/li&gt;&lt;li&gt;目的国筛选：支持多选，含&quot;中国台湾&quot;&quot;中国香港&quot;选项&lt;/li&gt;&lt;li&gt;运输方式筛选：陆运/海快/空运/海运&lt;/li&gt;&lt;li&gt;物流渠道筛选：按物流渠道下拉选择&lt;/li&gt;&lt;/ul&gt;&lt;/td&gt;&lt;/tr&gt;\n        &lt;tr&gt;&lt;td&gt;异常处理&lt;/td&gt;&lt;td&gt;筛选条件组合无数据时显示空状态，可重置筛选。&lt;/td&gt;&lt;/tr&gt;\n      &lt;/table&gt;\n    `\n  },\n  {\n    title: &#x27;新增物流线路&#x27;,\n    content: `\n      &lt;table class=&quot;annotation-table&quot;&gt;\n        &lt;tr&gt;&lt;th&gt;项目&lt;/th&gt;&lt;th&gt;说明&lt;/th&gt;&lt;/tr&gt;\n        &lt;tr&gt;&lt;td&gt;功能说明&lt;/td&gt;&lt;td&gt;点击顶部「新增物流线路」按钮弹出新增弹窗，通过两级选择（先选物流渠道→再选关联线路）创建平台线路，配置基本信息、价格、续重、服务支持等。&lt;/td&gt;&lt;/tr&gt;\n        &lt;tr&gt;&lt;td&gt;规则约束&lt;/td&gt;&lt;td&gt;&lt;ul&gt;&lt;li&gt;弹窗形式交互，非新页面&lt;/li&gt;&lt;li&gt;两级联动：先选物流渠道，再选关联线路&lt;/li&gt;&lt;li&gt;选择关联线路后自动预填：线路名称、运输方式&lt;/li&gt;&lt;li&gt;时效需手动填写，不自动预填&lt;/li&gt;&lt;li&gt;4个模块：基本信息、价格配置、续重配置、服务支持&lt;/li&gt;&lt;li&gt;保存后状态直接为已启用，无草稿和发布流程&lt;/li&gt;&lt;li&gt;多段续重，默认3段，最后一段为+∞不可删除&lt;/li&gt;&lt;/ul&gt;&lt;/td&gt;&lt;/tr&gt;\n        &lt;tr&gt;&lt;td&gt;异常处理&lt;/td&gt;&lt;td&gt;关联的物流渠道线路已失效时提示更换；续重段校验不通过时给出提示。&lt;/td&gt;&lt;/tr&gt;\n      &lt;/table&gt;\n    `\n  },\n  {\n    title: &#x27;线路核心字段&#x27;,\n    content: `\n      &lt;table class=&quot;annotation-table&quot;&gt;\n        &lt;tr&gt;&lt;th&gt;项目&lt;/th&gt;&lt;th&gt;说明&lt;/th&gt;&lt;/tr&gt;\n        &lt;tr&gt;&lt;td&gt;功能说明&lt;/td&gt;&lt;td&gt;列表每行展示线路的完整核心信息，包括线路名称编码、物流渠道、目的国、运输方式、时效、价格、计费方式等，方便运营快速了解线路概况。&lt;/td&gt;&lt;/tr&gt;\n        &lt;tr&gt;&lt;td&gt;规则约束&lt;/td&gt;&lt;td&gt;&lt;ul&gt;&lt;li&gt;线路编码：PL+6位数字，系统生成不可修改&lt;/li&gt;&lt;li&gt;目的国：标签形式多选展示，超3个折叠&lt;/li&gt;&lt;li&gt;运输方式：彩色标签区分（空运蓝/海运深蓝/海快橙/陆运绿）&lt;/li&gt;&lt;li&gt;首重价按kg计费，展示续重段数&lt;/li&gt;&lt;li&gt;计费方式：实重/实重与抛重取大则&lt;/li&gt;&lt;li&gt;服务支持：保价（绿色）、包税（橙色）标签&lt;/li&gt;&lt;/ul&gt;&lt;/td&gt;&lt;/tr&gt;\n        &lt;tr&gt;&lt;td&gt;异常处理&lt;/td&gt;&lt;td&gt;无&lt;/td&gt;&lt;/tr&gt;\n      &lt;/table&gt;\n    `\n  },\n  {\n    title: &#x27;服务支持标签&#x27;,\n    content: `\n      &lt;table class=&quot;annotation-table&quot;&gt;\n        &lt;tr&gt;&lt;th&gt;项目&lt;/th&gt;&lt;th&gt;说明&lt;/th&gt;&lt;/tr&gt;\n        &lt;tr&gt;&lt;td&gt;功能说明&lt;/td&gt;&lt;td&gt;通过彩色标签快速标识线路支持的增值服务，包括保价和包税两种，帮助运营和租户快速识别线路服务能力。&lt;/td&gt;&lt;/tr&gt;\n        &lt;tr&gt;&lt;td&gt;规则约束&lt;/td&gt;&lt;td&gt;&lt;ul&gt;&lt;li&gt;保价：绿色标签，支持保价服务的线路展示&lt;/li&gt;&lt;li&gt;包税：橙色标签，支持包税服务的线路展示&lt;/li&gt;&lt;li&gt;无&quot;带电&quot;等其他服务标签（MVP仅支持保价和包税）&lt;/li&gt;&lt;li&gt;保价和包税的详细配置在详情页和编辑弹窗中查看/修改&lt;/li&gt;&lt;/ul&gt;&lt;/td&gt;&lt;/tr&gt;\n        &lt;tr&gt;&lt;td&gt;异常处理&lt;/td&gt;&lt;td&gt;无&lt;/td&gt;&lt;/tr&gt;\n      &lt;/table&gt;\n    `\n  },\n  {\n    title: &#x27;操作与状态&#x27;,\n    content: `\n      &lt;table class=&quot;annotation-table&quot;&gt;\n        &lt;tr&gt;&lt;th&gt;项目&lt;/th&gt;&lt;th&gt;说明&lt;/th&gt;&lt;/tr&gt;\n        &lt;tr&gt;&lt;td&gt;功能说明&lt;/td&gt;&lt;td&gt;每条线路支持编辑、启用/停用、查看详情三种操作，状态在已启用和已停用之间切换，管理线路的可用性。&lt;/td&gt;&lt;/tr&gt;\n        &lt;tr&gt;&lt;td&gt;规则约束&lt;/td&gt;&lt;td&gt;&lt;ul&gt;&lt;li&gt;状态仅2种：已启用/已停用&lt;/li&gt;&lt;li&gt;启用/停用操作需二次确认&lt;/li&gt;&lt;li&gt;已启用线路可被租户引用，停用后新提包不可选&lt;/li&gt;&lt;li&gt;停用不影响已引用租户的历史包裹&lt;/li&gt;&lt;li&gt;无删除功能，用停用替代&lt;/li&gt;&lt;li&gt;编辑操作打开编辑弹窗，字段与新增一致&lt;/li&gt;&lt;li&gt;查看详情跳转到线路详情页&lt;/li&gt;&lt;/ul&gt;&lt;/td&gt;&lt;/tr&gt;\n        &lt;tr&gt;&lt;td&gt;异常处理&lt;/td&gt;&lt;td&gt;启用/停用失败时给出错误提示。&lt;/td&gt;&lt;/tr&gt;\n      &lt;/table&gt;\n    `\n  },\n  {\n    title: &#x27;所属仓库&#x27;,\n    content: `\n      &lt;table class=&quot;annotation-table&quot;&gt;\n        &lt;tr&gt;&lt;th&gt;项目&lt;/th&gt;&lt;th&gt;说明&lt;/th&gt;&lt;/tr&gt;\n        &lt;tr&gt;&lt;td&gt;功能说明&lt;/td&gt;&lt;td&gt;每条物流线路对应一个仓库，用于区分不同仓库的发货线路。平台支持多仓库管理，每条线路归属唯一仓库。&lt;/td&gt;&lt;/tr&gt;\n        &lt;tr&gt;&lt;td&gt;规则约束&lt;/td&gt;&lt;td&gt;&lt;ul&gt;&lt;li&gt;可按所属仓库筛选线路列表&lt;/li&gt;&lt;li&gt;列表展示每条线路的所属仓库&lt;/li&gt;&lt;li&gt;新增线路时必须选择所属仓库&lt;/li&gt;&lt;li&gt;每条线路归属唯一仓库&lt;/li&gt;&lt;li&gt;用于区分不同仓库的发货线路&lt;/li&gt;&lt;/ul&gt;&lt;/td&gt;&lt;/tr&gt;\n        &lt;tr&gt;&lt;td&gt;异常处理&lt;/td&gt;&lt;td&gt;仓库停用后，所属线路仍可查看但不可新增；支持按仓库维度统计线路数量。&lt;/td&gt;&lt;/tr&gt;\n      &lt;/table&gt;\n    `\n  }\n];\n\n// ==================== 多段续重配置 ====================\nfunction onFirstWeightChange() {\n  // 首重重量变化时，更新第1段的起始重量\n  var firstWeight = parseFloat(document.getElementById(&#x27;firstWeight&#x27;).value) || 0;\n  var firstTierStart = document.querySelector(&#x27;#weightTiers .weight-tier:first-child .tier-start&#x27;);\n  if (firstTierStart) {\n    firstTierStart.value = firstWeight;\n  }\n  updateTierStarts();\n}\n\nfunction updateTierStarts() {\n  // 更新所有段的起始重量（每段起始 = 上一段结束）\n  var tiers = document.querySelectorAll(&#x27;#weightTiers .weight-tier&#x27;);\n  var firstWeight = parseFloat(document.getElementById(&#x27;firstWeight&#x27;).value) || 0;\n  \n  for (var i = 0; i &lt; tiers.length; i++) {\n    var startInput = tiers[i].querySelector(&#x27;.tier-start&#x27;);\n    if (i === 0) {\n      // 第1段起始 = 首重重量\n      startInput.value = firstWeight;\n    } else {\n      // 第N段起始 = 第N-1段结束\n      var prevEnd = tiers[i - 1].querySelector(&#x27;.tier-end&#x27;);\n      if (prevEnd) {\n        var prevEndVal = parseFloat(prevEnd.value);\n        startInput.value = isNaN(prevEndVal) ? &#x27;&#x27; : prevEndVal;\n      }\n    }\n  }\n  \n  // 更新段号显示\n  updateTierNumbers();\n}\n\nfunction updateTierNumbers() {\n  var tiers = document.querySelectorAll(&#x27;#weightTiers .weight-tier&#x27;);\n  tiers.forEach(function(tier, idx) {\n    var firstTd = tier.querySelector(&#x27;td:first-child&#x27;);\n    if (firstTd) {\n      firstTd.textContent = &#x27;第&#x27; + (idx + 1) + &#x27;段&#x27;;\n    }\n    tier.setAttribute(&#x27;data-index&#x27;, idx);\n  });\n}\n\nfunction addWeightTier() {\n  var tbody = document.getElementById(&#x27;weightTiers&#x27;);\n  var tiers = tbody.querySelectorAll(&#x27;.weight-tier&#x27;);\n  var lastTier = tiers[tiers.length - 1]; // 最后一段（+∞那段）\n  var secondLastTier = tiers[tiers.length - 2]; // 倒数第二段\n  \n  // 新段的起始重量 = 倒数第二段的结束重量\n  var newStartVal = &#x27;&#x27;;\n  if (secondLastTier) {\n    var prevEnd = secondLastTier.querySelector(&#x27;.tier-end&#x27;);\n    if (prevEnd &amp;&amp; prevEnd.value) {\n      newStartVal = prevEnd.value;\n    }\n  } else if (lastTier) {\n    // 只有一段的情况\n    var lastStart = lastTier.querySelector(&#x27;.tier-start&#x27;);\n    if (lastStart &amp;&amp; lastStart.value) {\n      newStartVal = lastStart.value;\n    }\n  }\n  \n  // 创建新行（插入到最后一段之前）\n  var newRow = document.createElement(&#x27;tr&#x27;);\n  newRow.className = &#x27;weight-tier&#x27;;\n  newRow.innerHTML = `\n    &lt;td style=&quot;padding:8px 12px;font-size:13px;color:#606266;border-bottom:1px solid #f0f2f5;&quot;&gt;第X段&lt;/td&gt;\n    &lt;td style=&quot;padding:8px 12px;border-bottom:1px solid #f0f2f5;&quot;&gt;\n      &lt;input type=&quot;text&quot; class=&quot;form-input tier-start&quot; value=&quot;` + newStartVal + `&quot; readonly style=&quot;height:30px;font-size:13px;background:#f5f7fa;color:#909399;cursor:not-allowed;text-align:center;width:100px;&quot;&gt;\n    &lt;/td&gt;\n    &lt;td style=&quot;padding:8px 12px;border-bottom:1px solid #f0f2f5;&quot;&gt;\n      &lt;input type=&quot;number&quot; class=&quot;form-input tier-end&quot; value=&quot;&quot; min=&quot;0&quot; step=&quot;0.1&quot; placeholder=&quot;请输入&quot; style=&quot;height:30px;font-size:13px;width:100px;&quot; oninput=&quot;updateTierStarts()&quot;&gt;\n    &lt;/td&gt;\n    &lt;td style=&quot;padding:8px 12px;border-bottom:1px solid #f0f2f5;&quot;&gt;\n      &lt;input type=&quot;number&quot; class=&quot;form-input tier-price&quot; value=&quot;&quot; min=&quot;0&quot; step=&quot;0.01&quot; placeholder=&quot;请输入&quot; style=&quot;height:30px;font-size:13px;width:100px;&quot;&gt;\n    &lt;/td&gt;\n    &lt;td style=&quot;padding:8px 12px;text-align:center;border-bottom:1px solid #f0f2f5;&quot;&gt;\n      &lt;button type=&quot;button&quot; class=&quot;btn-text danger tier-delete&quot; onclick=&quot;removeWeightTier(this)&quot; style=&quot;margin:0;font-size:12px;&quot;&gt;删除&lt;/button&gt;\n    &lt;/td&gt;\n  `;\n  \n  // 插入到最后一段之前\n  tbody.insertBefore(newRow, lastTier);\n  \n  // 更新起始重量和段号\n  updateTierStarts();\n  \n  // 聚焦到新段的结束重量输入框\n  var newEndInput = newRow.querySelector(&#x27;.tier-end&#x27;);\n  if (newEndInput) {\n    newEndInput.focus();\n  }\n}\n\nfunction removeWeightTier(btn) {\n  var tbody = document.getElementById(&#x27;weightTiers&#x27;);\n  var tiers = tbody.querySelectorAll(&#x27;.weight-tier&#x27;);\n  \n  // 检查是否点击的是最后一段\n  var row = btn.closest(&#x27;.weight-tier&#x27;);\n  if (row.classList.contains(&#x27;tier-last&#x27;)) {\n    alert(&#x27;最后一段（无限续重）不可删除&#x27;);\n    return;\n  }\n  \n  // 最少保留1段续重（即最后一段不能删，其他段删除后至少还有最后一段）\n  // 计算可删除段数量（排除最后一段）\n  var deletableCount = 0;\n  tiers.forEach(function(t) {\n    if (!t.classList.contains(&#x27;tier-last&#x27;)) {\n      deletableCount++;\n    }\n  });\n  \n  if (deletableCount &lt;= 0) {\n    alert(&#x27;最少保留1段续重&#x27;);\n    return;\n  }\n  \n  row.remove();\n  \n  // 更新起始重量和段号\n  updateTierStarts();\n}\n\nfunction openAddModal() {\n  document.getElementById(&#x27;addModal&#x27;).classList.add(&#x27;show&#x27;);\n}\nfunction closeAddModal() {\n  document.getElementById(&#x27;addModal&#x27;).classList.remove(&#x27;show&#x27;);\n}\nfunction toggleVolRatio() {\n  var v = document.getElementById(&#x27;calcMode&#x27;).value;\n  document.getElementById(&#x27;volRatioItem&#x27;).style.display = v === &#x27;max&#x27; ? &#x27;flex&#x27; : &#x27;none&#x27;;\n}\nfunction toggleInsure() {\n  var checked = document.getElementById(&#x27;insureToggle&#x27;).checked;\n  document.getElementById(&#x27;insureFields&#x27;).style.display = checked ? &#x27;block&#x27; : &#x27;none&#x27;;\n}\nfunction toggleTax() {\n  var checked = document.getElementById(&#x27;taxToggle&#x27;).checked;\n  document.getElementById(&#x27;taxFields&#x27;).style.display = checked ? &#x27;block&#x27; : &#x27;none&#x27;;\n}\nfunction openEditModal() { openAddModal(); }\nfunction submitAdd() { alert(&#x27;线路创建成功&#x27;); closeAddModal(); }\nfunction batchEnable() { alert(&#x27;批量启用选中线路&#x27;); }\nfunction batchDisable() { alert(&#x27;批量停用选中线路&#x27;); }\nfunction resetFilter() { console.log(&#x27;重置筛选&#x27;); }\nfunction doSearch() { console.log(&#x27;执行查询&#x27;); }\nfunction goDetail() { window.location.href = &#x27;物流线路详情_平台侧_带标注.html&#x27;; }\n\nfunction toggleAll(el) {\n  var checks = document.querySelectorAll(&#x27;.row-check&#x27;);\n  checks.forEach(function(c) { c.checked = el.checked; });\n  updateSelectedCount();\n}\ndocument.querySelectorAll(&#x27;.row-check&#x27;).forEach(function(c) {\n  c.addEventListener(&#x27;change&#x27;, updateSelectedCount);\n});\nfunction updateSelectedCount() {\n  var n = document.querySelectorAll(&#x27;.row-check:checked&#x27;).length;\n  document.getElementById(&#x27;selectedCount&#x27;).textContent = n;\n}\n\nfunction sortBy(el, field) {\n  var ths = document.querySelectorAll(&#x27;th.sortable&#x27;);\n  ths.forEach(function(th) { th.classList.remove(&#x27;active&#x27;); });\n  el.classList.add(&#x27;active&#x27;);\n}\nfunction goPage(el, n) {\n  document.querySelectorAll(&#x27;.page-btn&#x27;).forEach(function(b) {\n    if (b.textContent.match(/^\\d+$/)) b.classList.remove(&#x27;active&#x27;);\n  });\n  el.classList.add(&#x27;active&#x27;);\n}\nfunction prevPage() { console.log(&#x27;上一页&#x27;); }\nfunction nextPage() { console.log(&#x27;下一页&#x27;); }\n\nfunction showDetail(index) {\n  document.getElementById(&#x27;modalTitle&#x27;).textContent = annotations[index].title;\n  document.getElementById(&#x27;modalBody&#x27;).innerHTML = annotations[index].content;\n  document.getElementById(&#x27;detailModal&#x27;).classList.add(&#x27;show&#x27;);\n}\nfunction closeModal() {\n  document.getElementById(&#x27;detailModal&#x27;).classList.remove(&#x27;show&#x27;);\n}\ndocument.getElementById(&#x27;detailModal&#x27;).addEventListener(&#x27;click&#x27;, function(e) {\n  if (e.target === this) closeModal();\n});\n// 标注徽章点击弹窗\ndocument.querySelectorAll(&#x27;.anno-badge&#x27;).forEach(function(badge, idx) {\n  badge.style.pointerEvents = &#x27;auto&#x27;;\n  badge.addEventListener(&#x27;click&#x27;, function(e) {\n    e.stopPropagation();\n    showDetail(idx);\n  });\n});\ndocument.getElementById(&#x27;addModal&#x27;).addEventListener(&#x27;click&#x27;, function(e) {\n  if (e.target === this) closeAddModal();\n});\n&lt;/script&gt;\n  &lt;/div&gt;\n\n  &lt;div class=&quot;anno-right-panel&quot;&gt;\n    &lt;h3&gt;页面标注&lt;/h3&gt;\n    &lt;div class=&quot;anno-item&quot; data-anno-id=&quot;1&quot;&gt;\n      &lt;div class=&quot;anno-item-header&quot;&gt;\n        &lt;span class=&quot;anno-item-num&quot;&gt;1&lt;/span&gt;\n        &lt;div class=&quot;anno-item-title&quot;&gt;页面总说明&lt;/div&gt;\n      &lt;/div&gt;\n    &lt;/div&gt;\n    &lt;div class=&quot;anno-item&quot; data-anno-id=&quot;2&quot;&gt;\n      &lt;div class=&quot;anno-item-header&quot;&gt;\n        &lt;span class=&quot;anno-item-num&quot;&gt;2&lt;/span&gt;\n        &lt;div class=&quot;anno-item-title&quot;&gt;多维度筛选&lt;/div&gt;\n f (!isNaN(parseInt(num))) {\n        badge.setAttribute(&#x27;data-anno-id&#x27;, parseInt(num));\n      } else {\n        badge.setAttribute(&#x27;data-anno-id&#x27;, index + 1);\n      }\n    }\n    // 绑定点击事件打开弹窗\n    badge.addEventListener(&#x27;click&#x27;, function(e) {\n      e.stopPropagation();\n      var id = badge.getAttribute(&#x27;data-anno-id&#x27;);\n      openAnnoDetailModal(parseInt(id));\n    });\n  });\n\n  // 为右侧标注条目绑定事件\n  var annoItems = document.querySelectorAll(&#x27;.anno-item&#x27;);\n  annoItems.forEach(function(item) {\n    var id = item.getAttribute(&#x27;data-anno-id&#x27;);\n    \n    // 悬停联动\n    item.addEventListener(&#x27;mouseenter&#x27;, function() {\n      highlightAnno(id);\n    });\n    item.addEventListener(&#x27;mouseleave&#x27;, function() {\n      unhighlightAnno(id);\n    });\n    \n    // 点击打开弹窗\n    item.addEventListener(&#x27;click&#x27;, function() {\n      openAnnoDetailModal(parseInt(id));\n    });\n  });\n\n  // 左侧角标悬停联动\n  badges.forEach(function(badge) {\n    var id = badge.getAttribute(&#x27;data-anno-id&#x27;);\n    var target = badge.closest(&#x27;.anno-target&#x27;) || badge.closest(&#x27;.anno-section&#x27;) || badge.parentElement;\n    if (target) {\n      target.addEventListener(&#x27;mouseenter&#x27;, function() {\n        highlightAnno(id);\n      });\n      target.addEventListener(&#x27;mouseleave&#x27;, function() {\n        unhighlightAnno(id);\n      });\n    }\n  });\n\n  function highlightAnno(id) {\n    var badge = document.querySelector(&#x27;.anno-badge[data-anno-id=&quot;&#x27; + id + &#x27;&quot;]&#x27;);\n    var item = document.querySelector(&#x27;.anno-item[data-anno-id=&quot;&#x27; + id + &#x27;&quot;]&#x27;);\n    if (badge) badge.classList.add(&#x27;active&#x27;);\n    if (item) item.classList.add(&#x27;active&#x27;);\n  }\n\n  function unhighlightAnno(id) {\n    var badge = document.querySelector(&#x27;.anno-badge[data-anno-id=&quot;&#x27; + id + &#x27;&quot;]&#x27;);\n    var item = document.querySelector(&#x27;.anno-item[data-anno-id=&quot;&#x27; + id + &#x27;&quot;]&#x27;);\n    if (badge) badge.classList.remove(&#x27;active&#x27;);\n    if (item) item.classList.remove(&#x27;active&#x27;);\n  }\n\n  function openAnnoDetailModal(id) {\n    var item = data[id];\n    if (!item) return;\n\n    document.getElementById(&#x27;annoModalTitle&#x27;).textContent = item.title || &#x27;标注详情&#x27;;\n    \n    var bodyHtml = &#x27;&#x27;;\n    // 如果有content字段（数组格式），直接使用\n    if (item.content) {\n      bodyHtml = item.content;\n      // 替换旧的table class\n      bodyHtml = bodyHtml.replace(/annotation-table/g, &#x27;anno-modal-table&#x27;);\n    } else {\n      // 对象格式：生成表格\n      bodyHtml = &#x27;&lt;table class=&quot;anno-modal-table&quot;&gt;&#x27;;\n      if (item.desc) {\n        bodyHtml += &#x27;&lt;tr&gt;&lt;th&gt;功能说明&lt;/th&gt;&lt;td&gt;&#x27; + item.desc + &#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;;\n      }\n      if (item.rules) {\n        bodyHtml += &#x27;&lt;tr&gt;&lt;th&gt;规则约束&lt;/th&gt;&lt;td&gt;&#x27; + item.rules + &#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;;\n      }\n      if (item.exception) {\n        bodyHtml += &#x27;&lt;tr&gt;&lt;th&gt;异常处理&lt;/th&gt;&lt;td&gt;&#x27; + item.exception + &#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;;\n      }\n      bodyHtml += &#x27;&lt;/table&gt;&#x27;;\n    }\n    \n    document.getElementById(&#x27;annoModalBody&#x27;).innerHTML = bodyHtml;\n    document.getElementById(&#x27;annoModalMask&#x27;).classList.add(&#x27;show&#x27;);\n  }\n\n  // 暴露给全局使用\n  window.annoOpenModal = openAnnoDetailModal;\n  window.annoCloseModal = function() {\n    document.getElementById(&#x27;annoModalMask&#x27;).classList.remove(&#x27;show&#x27;);\n  };\n  window.annoCloseModalOnMask = function(e) {\n    if (e.target.id === &#x27;annoModalMask&#x27;) {\n      window.annoCloseModal();\n    }\n  };\n\n  // ESC键关闭弹窗\n  document.addEventListener(&#x27;keydown&#x27;, function(e) {\n    if (e.key === &#x27;Escape&#x27;) {\n      window.annoCloseModal();\n    }\n  });\n})();\n&lt;/script&gt;\n&lt;/body&gt;\n&lt;/html&gt;',

\n    &lt;/div&gt;\n    &lt;div class=&quot;modal-body&quot; id=&quot;modalBody&quot;&gt;&lt;/div&gt;\n  &lt;/div&gt;\n&lt;/div&gt;\n\n&lt;script&gt;\nconst annotations = [\n  {\n    title: &#x27;详情头部&#x27;,\n    content: `\n      &lt;table class=&quot;annotation-table&quot;&gt;\n        &lt;tr&gt;&lt;th&gt;项目&lt;/th&gt;&lt;th&gt;说明&lt;/th&gt;&lt;/tr&gt;\n        &lt;tr&gt;&lt;td&gt;功能说明&lt;/td&gt;&lt;td&gt;详情页头部展示线路名称、编码、状态标签和核心操作按钮（返回、编辑、启用/停用），是运营深入查看和管理单条线路的入口。&lt;/td&gt;&lt;/tr&gt;\n        &lt;tr&gt;&lt;td&gt;规则约束&lt;/td&gt;&lt;td&gt;&lt;ul&gt;&lt;li&gt;展示线路名称和线路编码（PL+6位）&lt;/li&gt;&lt;li&gt;状态标签：已启用（绿色）/已停用（灰色）&lt;/li&gt;&lt;li&gt;右上角操作：编辑、启用/停用&lt;/li&gt;&lt;li&gt;启用/停用操作需二次确认&lt;/li&gt;&lt;li&gt;返回按钮返回线路列表页&lt;/li&gt;&lt;/ul&gt;&lt;/td&gt;&lt;/tr&gt;\n        &lt;tr&gt;&lt;td&gt;异常处理&lt;/td&gt;&lt;td&gt;线路不存在时显示404状态。&lt;/td&gt;&lt;/tr&gt;\n      &lt;/table&gt;\n    `\n  },\n  {\n    title: &#x27;运营数据概览&#x27;,\n    content: `\n      &lt;table class=&quot;annotation-table&quot;&gt;\n        &lt;tr&gt;&lt;th&gt;项目&lt;/th&gt;&lt;th&gt;说明&lt;/th&gt;&lt;/tr&gt;\n        &lt;tr&gt;&lt;td&gt;功能说明&lt;/td&gt;&lt;td&gt;以卡片形式展示线路的核心运营数据指标，帮助运营快速了解线路的使用规模和业务表现。&lt;/td&gt;&lt;/tr&gt;\n        &lt;tr&gt;&lt;td&gt;规则约束&lt;/td&gt;&lt;td&gt;&lt;ul&gt;&lt;li&gt;引用租户数：当前引用该线路的租户数量&lt;/li&gt;&lt;li&gt;累计使用包裹数：该线路累计处理的包裹总数&lt;/li&gt;&lt;li&gt;累计运费金额：该线路累计产生的运费总额&lt;/li&gt;&lt;li&gt;数据从业务模块统计聚合&lt;/li&gt;&lt;/ul&gt;&lt;/td&gt;&lt;/tr&gt;\n        &lt;tr&gt;&lt;td&gt;异常处理&lt;/td&gt;&lt;td&gt;运营数据加载失败时显示&quot;--&quot;。&lt;/td&gt;&lt;/tr&gt;\n      &lt;/table&gt;\n    `\n  },\n  {\n    title: &#x27;基本信息&#x27;,\n    content: `\n      &lt;table class=&quot;annotation-table&quot;&gt;\n        &lt;tr&gt;&lt;th&gt;项目&lt;/th&gt;&lt;th&gt;说明&lt;/th&gt;&lt;/tr&gt;\n        &lt;tr&gt;&lt;td&gt;功能说明&lt;/td&gt;&lt;td&gt;展示线路的完整基础配置信息，包括物流商、关联物流商线路、目的国、运输方式、时效等核心属性。&lt;/td&gt;&lt;/tr&gt;\n        &lt;tr&gt;&lt;td&gt;规则约束&lt;/td&gt;&lt;td&gt;&lt;ul&gt;&lt;li&gt;展示字段：线路编码、线路名称、物流商、关联物流商线路、所属仓库、目的国（标签展示，超3个折叠）、运输方式、时效、线路描述、状态、创建时间、更新时间&lt;/li&gt;&lt;li&gt;关联物流商线路字段仅对运营展示，对租户隐藏&lt;/li&gt;&lt;li&gt;运输方式：陆运/海快/空运/海运&lt;/li&gt;&lt;li&gt;目的国含&quot;中国台湾&quot;&quot;中国香港&quot;等地区选项&lt;/li&gt;&lt;/ul&gt;&lt;/td&gt;&lt;/tr&gt;\n        &lt;tr&gt;&lt;td&gt;异常处理&lt;/td&gt;&lt;td&gt;无&lt;/td&gt;&lt;/tr&gt;\n      &lt;/table&gt;\n    `\n  },\n  {\n    title: &#x27;价格配置&#x27;,\n    content: `\n      &lt;table class=&quot;annotation-table&quot;&gt;\n        &lt;tr&gt;&lt;th&gt;项目&lt;/th&gt;&lt;th&gt;说明&lt;/th&gt;&lt;/tr&gt;\n        &lt;tr&gt;&lt;td&gt;功能说明&lt;/td&gt;&lt;td&gt;展示线路完整的价格体系，包括首重价格、计费方式、抛比系数、最小可寄重量，以及多段续重价格详情。&lt;/td&gt;&lt;/tr&gt;\n        &lt;tr&gt;&lt;td&gt;规则约束&lt;/td&gt;&lt;td&gt;&lt;ul&gt;&lt;li&gt;计费方式：实重/实重与抛重取大则&lt;/li&gt;&lt;li&gt;抛比系数：实抛取大时生效&lt;/li&gt;&lt;li&gt;最小可寄重量：必填项&lt;/li&gt;&lt;li&gt;首重重量可配置，默认1kg&lt;/li&gt;&lt;li&gt;续重多段表格展示：段序号、起始重量、结束重量、单价&lt;/li&gt;&lt;li&gt;最后一段结束重量为+∞&lt;/li&gt;&lt;li&gt;按kg计费&lt;/li&gt;&lt;/ul&gt;&lt;/td&gt;&lt;/tr&gt;\n        &lt;tr&gt;&lt;td&gt;异常处理&lt;/td&gt;&lt;td&gt;无&lt;/td&gt;&lt;/tr&gt;\n      &lt;/table&gt;\n    `\n  },\n  {\n    title: &#x27;服务支持&#x27;,\n    content: `\n      &lt;table class=&quot;annotation-table&quot;&gt;\n        &lt;tr&gt;&lt;th&gt;项目&lt;/th&gt;&lt;th&gt;说明&lt;/th&gt;&lt;/tr&gt;\n        &lt;tr&gt;&lt;td&gt;功能说明&lt;/td&gt;&lt;td&gt;展示线路支持的增值服务详情，包括保价配置和包税配置的完整参数。&lt;/td&gt;&lt;/tr&gt;\n        &lt;tr&gt;&lt;td&gt;规则约束&lt;/td&gt;&lt;td&gt;&lt;ul&gt;&lt;li&gt;保价配置：是否支持、保价费率、最低保价费、赔付上限&lt;/li&gt;&lt;li&gt;包税配置：是否包税、计费方式、包税率&lt;/li&gt;&lt;li&gt;与服务支持标签对应，标签仅做标识，详情在此模块查看&lt;/li&gt;&lt;li&gt;限制说明模块展示支持货物类型和禁寄品类&lt;/li&gt;&lt;/ul&gt;&lt;/td&gt;&lt;/tr&gt;\n        &lt;tr&gt;&lt;td&gt;异常处理&lt;/td&gt;&lt;td&gt;无&lt;/td&gt;&lt;/tr&gt;\n      &lt;/table&gt;\n    `\n  },\n  {\n    title: &#x27;引用租户列表&#x27;,\n    content: `\n      &lt;table class=&quot;annotation-table&quot;&gt;\n        &lt;tr&gt;&lt;th&gt;项目&lt;/th&gt;&lt;th&gt;说明&lt;/th&gt;&lt;/tr&gt;\n        &lt;tr&gt;&lt;td&gt;功能说明&lt;/td&gt;&lt;td&gt;展示所有已引用该线路的租户列表，运营可查看哪些租户在使用该线路，支持搜索和分页。&lt;/td&gt;&lt;/tr&gt;\n        &lt;tr&gt;&lt;td&gt;规则约束&lt;/td&gt;&lt;td&gt;&lt;ul&gt;&lt;li&gt;展示字段：租户名称、引用时间、租户状态、操作（查看租户）&lt;/li&gt;&lt;li&gt;按引用时间倒序排列&lt;/li&gt;&lt;li&gt;支持按租户名称搜索&lt;/li&gt;&lt;li&gt;分页加载，每页20条&lt;/li&gt;&lt;li&gt;点击&quot;查看租户&quot;可跳转到租户详情&lt;/li&gt;&lt;/ul&gt;&lt;/td&gt;&lt;/tr&gt;\n        &lt;tr&gt;&lt;td&gt;异常处理&lt;/td&gt;&lt;td&gt;数据量大时分页加载。&lt;/td&gt;&lt;/tr&gt;\n      &lt;/table&gt;\n    `\n  }\n];\n\nfunction goBack() { window.location.href = &#x27;物流线路管理_平台侧_带标注.html&#x27;; }\nfunction editLine() { alert(&#x27;打开编辑线路弹窗&#x27;); }\n\nfunction showDetail(index) {\n  document.getElementById(&#x27;modalTitle&#x27;).textContent = annotations[index].title;\n  document.getElementById(&#x27;modalBody&#x27;).innerHTML = annotations[index].content;\n  document.getElementById(&#x27;detailModal&#x27;).classList.add(&#x27;show&#x27;);\n}\nfunction closeModal() {\n  document.getElementById(&#x27;detailModal&#x27;).classList.remove(&#x27;show&#x27;);\n}\ndocument.getElementById(&#x27;detailModal&#x27;).addEventListener(&#x27;click&#x27;, function(e) {\n  if (e.target === this) closeModal();\n});\n// 标注徽章点击弹窗\ndocument.querySelectorAll(&#x27;.anno-badge&#x27;).forEach(function(badge, idx) {\n  badge.style.pointerEvents = &#x27;auto&#x27;;\n  badge.addEventListener(&#x27;click&#x27;, function(e) {\n    e.stopPropagation();\n    showDetail(idx);\n  });\n});\n&lt;/script&gt;\n  &lt;/div&gt;\n\n  &lt;div class=&quot;anno-right-panel&quot;&gt;\n    &lt;h3&gt;页面标注&lt;/h3&gt;\n    &lt;div class=&quot;anno-item&quot; data-anno-id=&quot;1&quot;&gt;\n      &lt;div class=&quot;anno-item-header&quot;&gt;\n        &lt;span class=&quot;anno-item-num&quot;&gt;1&lt;/span&gt;\n        &lt;div class=&quot;anno-item-title&quot;&gt;详情头部&lt;/div&gt;\n      &lt;/div&gt;\n    &lt;/div&gt;\n    &lt;div class=&quot;anno-item&quot; data-anno-id=&quot;2&quot;&gt;\n      &lt;div class=&quot;anno-item-header&quot;&gt;\n        &lt;span class=&quot;anno-item-num&quot;&gt;2&lt;/span&gt;\n        &lt;div class=&quot;anno-item-title&quot;&gt;运营数据概览&lt;/div&gt;\n      &lt;/div&gt;\n    &lt;/div&gt;\n    &lt;div class=&quot;anno-item&quot; data-anno-id=&quot;3&quot;&gt;\n      &lt;div class=&quot;anno-item-header&quot;&gt;\n        &lt;span class=&quot;anno-item-num&quot;&gt;3&lt;/span&gt;\n        &lt;div class=&quot;anno-item-title&quot;&gt;基本信息&lt;/div&gt;\n      &lt;/div&gt;\n    &lt;/div&gt;\n    &lt;div class=&quot;anno-item&quot; data-anno-id=&quot;4&quot;&gt;\n      &lt;div class=&quot;anno-item-header&quot;&gt;\n        &lt;span class=&quot;anno-item-num&quot;&gt;4&lt;/span&gt;\n        &lt;div class=&quot;anno-item-title&quot;&gt;价格配置&lt;/div&gt;\n      &lt;/div&gt;\n    &lt;/div&gt;\n    &lt;div class=&quot;anno-item&quot; data-anno-id=&quot;5&quot;&gt;\n      &lt;div class=&quot;anno-item-header&quot;&gt;\n        &lt;span class=&quot;anno-item-num&quot;&gt;5&lt;/span&gt;\n        &lt;div class=&quot;anno-item-title&quot;&gt;服务支持&lt;/div&gt;\n      &lt;/div&gt;\n    &lt;/div&gt;\n    &lt;div class=&quot;anno-item&quot; data-anno-id=&quot;6&quot;&gt;\n      &lt;div class=&quot;anno-item-header&quot;&gt;\n        &lt;span class=&quot;anno-item-num&quot;&gt;6&lt;/span&gt;\n        &lt;div class=&quot;anno-item-title&quot;&gt;引用租户列表&lt;/div&gt;\n      &lt;/div&gt;\n    &lt;/div&gt;\n  &lt;/div&gt;\n&lt;/div&gt;\n\n&lt;!-- 标注详情弹窗 --&gt;\n&lt;div class=&quot;anno-modal-mask&quot; id=&quot;annoModalMask&quot; onclick=&quot;annoCloseModalOnMask(event)&quot;&gt;\n  &lt;div class=&quot;anno-modal-box&quot;&gt;\n    &lt;div class=&quot;anno-modal-header&quot;&gt;\n      &lt;h3 id=&quot;annoModalTitle&quot;&gt;标注详情&lt;/h3&gt;\n      &lt;button class=&quot;anno-modal-close&quot; onclick=&quot;annoCloseModal()&quot;&gt;×&lt;/button&gt;\n    &lt;/div&gt;\n    &lt;div class=&quot;anno-modal-body&quot; id=&quot;annoModalBody&quot;&gt;&lt;/div&gt;\n  &lt;/div&gt;\n&lt;/div&gt;\n\n&lt;script&gt;\n// ===== 新版标注系统交互逻辑 =====\n(function() {\n  // 获取所有标注数据（兼容两种格式）\n  function getAnnotationData() {\n    if (typeof annoData !== &#x27;undefined&#x27;) {\n      // 对象格式: { 1: {title, desc, rules, exception}, ... }\n      return annoData;\n    }\n    if (typeof annotations !== &#x27;undefined&#x27;) {\n      // 数组格式: [{title, content}, ...]\n      var result = {};\n      annotations.forEach(function(item, index) {\n        result[index + 1] = {\n          title: item.title,\n          desc: item.desc || &#x27;&#x27;,\n          content: item.content || &#x27;&#x27;,\n          rules: item.rules || &#x27;&#x27;,\n          exception: item.exception || &#x27;&#x27;\n        };\n      });\n      return result;\n    }\n    return {};\n  }\n\n  var data = getAnnotationData();\n  var keys = Object.keys(data).map(Number).sort(function(a, b) { return a - b; });\n\n  // 为左侧角标添加data-anno-id属性\n  var badges = document.querySelectorAll(&#x27;.anno-badge&#x27;);\n  badges.forEach(function(badge, index) {\n    if (!badge.getAttribute(&#x27;data-anno-id&#x27;)) {\n      var num = badge.textContent.trim();\n      if (!isNaN(parseInt(num))) {\n        badge.setAttribute(&#x27;data-anno-id&#x27;, parseInt(num));\n      } else {\n        badge.setAttribute(&#x27;data-anno-id&#x27;, index + 1);\n      }\n    }\n    // 绑定点击事件打开弹窗\n    badge.addEventListener(&#x27;click&#x27;, function(e) {\n      e.stopPropagation();\n      var id = badge.getAttribute(&#x27;data-anno-id&#x27;);\n      openAnnoDetailModal(parseInt(id));\n    });\n  });\n\n  // 为右侧标注条目绑定事件\n  var annoItems = document.querySelectorAll(&#x27;.anno-item&#x27;);\n  annoItems.forEach(function(item) {\n    var id = item.getAttribute(&#x27;data-anno-id&#x27;);\n    \n    // 悬停联动\n    item.addEventListener(&#x27;mouseenter&#x27;, function() {\n      highlightAnno(id);\n    });\n    item.addEventListener(&#x27;mouseleave&#x27;, function() {\n      unhighlightAnno(id);\n    });\n    \n    // 点击打开弹窗\n    item.addEventListener(&#x27;click&#x27;, function() {\n      openAnnoDetailModal(parseInt(id));\n    });\n  });\n\n  // 左侧角标悬停联动\n  badges.forEach(function(badge) {\n    var id = badge.getAttribute(&#x27;data-anno-id&#x27;);\n    var target = badge.closest(&#x27;.anno-target&#x27;) || badge.closest(&#x27;.anno-section&#x27;) || badge.parentElement;\n    if (target) {\n      target.addEventListener(&#x27;mouseenter&#x27;, function() {\n        highlightAnno(id);\n      });\n      target.addEventListener(&#x27;mouseleave&#x27;, function() {\n        unhighlightAnno(id);\n      });\n    }\n  });\n\n  function highlightAnno(id) {\n    var badge = document.querySelector(&#x27;.anno-badge[data-anno-id=&quot;&#x27; + id + &#x27;&quot;]&#x27;);\n    var item = document.querySelector(&#x27;.anno-item[data-anno-id=&quot;&#x27; + id + &#x27;&quot;]&#x27;);\n    if (badge) badge.classList.add(&#x27;active&#x27;);\n    if (item) item.classList.add(&#x27;active&#x27;);\n  }\n\n  function unhighlightAnno(id) {\n    var badge = document.querySelector(&#x27;.anno-badge[data-anno-id=&quot;&#x27; + id + &#x27;&quot;]&#x27;);\n    var item = document.querySelector(&#x27;.anno-item[data-anno-id=&quot;&#x27; + id + &#x27;&quot;]&#x27;);\n    if (badge) badge.classList.remove(&#x27;active&#x27;);\n    if (item) item.classList.remove(&#x27;active&#x27;);\n  }\n\n  function openAnnoDetailModal(id) {\n    var item = data[id];\n    if (!item) return;\n\n    document.getElementById(&#x27;annoModalTitle&#x27;).textContent = item.title || &#x27;标注详情&#x27;;\n    \n    var bodyHtml = &#x27;&#x27;;\n    // 如果有content字段（数组格式），直接使用\n    if (item.content) {\n      bodyHtml = item.content;\n      // 替换旧的table class\n      bodyHtml = bodyHtml.replace(/annotation-table/g, &#x27;anno-modal-table&#x27;);\n    } else {\n      // 对象格式：生成表格\n      bodyHtml = &#x27;&lt;table class=&quot;anno-modal-table&quot;&gt;&#x27;;\n      if (item.desc) {\n        bodyHtml += &#x27;&lt;tr&gt;&lt;th&gt;功能说明&lt;/th&gt;&lt;td&gt;&#x27; + item.desc + &#x27;&lt;
