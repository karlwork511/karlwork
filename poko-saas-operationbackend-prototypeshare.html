le class=&quot;detail-table&quot; id=&quot;detail-table&quot;&gt;&lt;/table&gt;\n        &lt;/div&gt;\n        &lt;div class=&quot;modal-footer&quot;&gt;\n            &lt;button class=&quot;btn btn-default btn-danger&quot; id=&quot;delete-btn&quot; style=&quot;display:none; margin-right:auto;&quot; onclick=&quot;deleteAnnotation()&quot;&gt;删除标注&lt;/button&gt;\n            &lt;button class=&quot;btn btn-default&quot; id=&quot;reset-btn&quot; style=&quot;display:none;&quot; onclick=&quot;resetAnnotation()&quot;&gt;重置&lt;/button&gt;\n            &lt;button class=&quot;btn btn-default&quot; id=&quot;export-btn&quot; onclick=&quot;exportAnnotatedHTML()&quot;&gt;导出HTML&lt;/button&gt;\n            &lt;button class=&quot;btn btn-default&quot; id=&quot;edit-btn&quot; onclick=&quot;toggleEdit()&quot;&gt;编辑&lt;/button&gt;\n            &lt;button class=&quot;btn btn-primary&quot; id=&quot;save-btn&quot; style=&quot;display:none;&quot; onclick=&quot;saveAnnotation()&quot;&gt;保存&lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;/div&gt;\n&lt;script&gt;\nconst STORAGE_KEY = &#x27;annotated-prototype-new-tenant-modal-v2.2.3&#x27;;\nlet currentAnnotation = null;\nlet isEditing = false;\nlet customAnnotations = null;\n\nconst annotations = [\n    {\n        id: 1,\n        title: &#x27;页面总览&#x27;,\n        summary: &#x27;新建租户弹窗，运营收到商家入驻申请后创建租户账号。弹窗分3模块：租户基本信息、订阅信息、初始设置。&#x27;,\n        target: &#x27;#anno-1&#x27;,\n        detail: {\n            feature: &#x27;新建租户弹窗页面。运营人员在收到商家入驻申请后，通过此弹窗为该商家创建系统租户账号。\\n\\n弹窗采用居中模态布局，宽度800px，带半透明遮罩层。弹窗内部分为3个功能模块：\\n1. 租户基本信息 - 填写公司/个体信息和联系方式\\n2. 订阅信息 - 配置套餐版本和订阅时长\\n3. 初始设置 - 设置初始余额、店铺编码、采购账户\\n\\n弹窗顶部有标题&quot;新建租户&quot;和关闭按钮（×），底部有&quot;取消&quot;和&quot;确认创建&quot;两个操作按钮。&#x27;,\n            rules: &#x27;1. 弹窗打开时显示遮罩层，禁止点击遮罩关闭（只能通过取消按钮或×关闭）\\n2. 弹窗内容超出时可滚动，弹窗最大高度不超过视口80%\\n3. 确认创建按钮在未通过表单校验时置灰不可点击\\n4. 取消按钮关闭弹窗并清空所有已填内容\\n5. 弹窗打开后焦点默认在第一个输入框&#x27;,\n            exceptions: &#x27;1. 网络异常时提交按钮显示loading状态，提示&quot;创建中，请稍候...&quot;\\n2. 接口超时（&gt;10s）提示&quot;网络超时，请重试&quot;\\n3. 并发创建同一手机号租户时提示&quot;该手机号已被使用，请核实&quot;&#x27;,\n            data: &#x27;弹窗初始化需加载：\\n- 套餐版本列表（当前仅标准版）\\n- 各平台类型的账户列表（淘宝/1688/微店）\\n- 平台统一账户标识&#x27;,\n            permission: &#x27;仅&quot;租户管理-新建&quot;权限的运营角色可访问此弹窗。权限不足时按钮不可见。&#x27;\n        }\n    },\n    {\n        id: 2,\n        title: &#x27;租户基本信息区&#x27;,\n        summary: &#x27;选择租户类型（个体/企业），填写公司名、联系人、联系电话、联系邮箱，手机号和邮箱唯一性校验。&#x27;,\n        target: &#x27;#anno-2&#x27;,\n        detail: {\n            feature: &#x27;租户基本信息录入区域，包含以下字段：\\n\\n1. 租户类型：Radio单选按钮，选项为&quot;企业&quot;（默认选中）和&quot;个体&quot;\\n2. 公司名称：文本输入框，企业类型时必填，个体类型时选填\\n3. 联系人：文本输入框，必填，最大20个字符\\n4. 联系电话：文本输入框，必填，仅允许输入11位手机号\\n5. 联系邮箱：邮箱输入框，必填，需通过邮箱格式校验\\n\\n字段布局：租户类型独占一行；公司名称独占一行；联系人和联系电话并排一行；联系邮箱独占一行。&#x27;,\n            rules: &#x27;1. 租户类型切换为&quot;个体&quot;时，公司名称字段提示变为&quot;选填&quot;\\n2. 联系人限制最多20个字符，超出截断\\n3. 联系电话仅允许输入数字，限制11位，失焦时校验是否为有效手机号（1开头）\\n4. 联系邮箱失焦时校验格式（xxx@xxx.xxx）\\n5. 手机号和邮箱在系统内做唯一性校验（提交时校验）\\n6. 所有必填字段标红色*号\\n7. 实时校验：输入过程中显示校验状态（绿框=通过，红框=未通过）&#x27;,\n            exceptions: &#x27;1. 手机号格式错误：提示&quot;请输入有效的11位手机号&quot;\\n2. 邮箱格式错误：提示&quot;请输入有效的邮箱地址&quot;\\n3. 手机号已存在：提示&quot;该手机号已被其他租户使用&quot;\\n4. 邮箱已存在：提示&quot;该邮箱已被其他租户使用&quot;\\n5. 联系人输入特殊字符：自动过滤，仅保留中英文和常见符号&#x27;,\n            data: &#x27;- 联系人：字符串，2-20字符\\n- 联系电话：11位数字字符串\\n- 联系邮箱：标准邮箱格式字符串\\n- 公司名称：字符串，最长100字符\\n- 租户类型：枚举值 enterprise/individual&#x27;,\n            permission: &#x27;无特殊权限要求，有弹窗访问权限即可填写。&#x27;\n        }\n    },\n    {\n        id: 3,\n        title: &#x27;订阅信息区&#x27;,\n        summary: &#x27;套餐默认&quot;标准版&quot;不可改，订阅时长可选1/3/6/12/24个月，费用手动填写，到期时间自动计算。&#x27;,\n        target: &#x27;#anno-3&#x27;,\n        detail: {\n            feature: &#x27;租户订阅信息配置区域，包含以下字段：\\n\\n1. 套餐版本：禁用状态文本框，固定显示&quot;标准版&quot;，不可修改\\n2. 订阅时长：下拉选择框，选项为1个月/3个月/6个月/1年（12个月）/2年（24个月），默认选中&quot;1年&quot;\\n3. 订阅费用：数字输入框，由运营手动填写实际收取金额（单位：元），下方提示&quot;线下收取费用，不走账户余额&quot;\\n4. 到期时间：禁用状态文本框，根据订阅开始日期+时长自动计算显示\\n\\n字段布局：套餐版本与订阅时长并排；订阅费用与到期时间并排。&#x27;,\n            rules: &#x27;1. 套餐版本当前仅支持&quot;标准版&quot;，后续扩展时改为下拉选择\\n2. 订阅时长选择后不显示对应价格（价格由运营手动填写费用）\\n3. 订阅费用为必填项，最小值0.01，最大值999999.99，保留两位小数\\n4. 到期时间 = 当前日期 + 订阅时长，精确到天\\n5. 订阅时长变更时自动重新计算到期时间\\n6. 到期时间显示格式：YYYY-MM-DD&#x27;,\n            exceptions: &#x27;1. 费用输入非数字：自动过滤非数字字符\\n2. 费用超出范围：提示&quot;请输入0.01-999999.99之间的金额&quot;\\n3. 费用为空提交时：提示&quot;请填写订阅费用&quot;\\n4. 跨月计算到期日：如1月31日+1个月，取当月最后一天（2月28/29日）&#x27;,\n            data: &#x27;- 套餐版本：固定值 &quot;standard&quot;\\n- 订阅时长：枚举值 1/3/6/12/24（月）\\n- 订阅费用：Decimal，精度2位，单位元\\n- 到期时间：Date类型，自动计算&#x27;,\n            permission: &#x27;无特殊权限要求，有弹窗访问权限即可填写。&#x27;\n        }\n    },\n    {\n        id: 4,\n        title: &#x27;店铺编码字段&#x27;,\n        summary: &#x27;单个输入框，非必填，不填时系统默认写入&quot;默认编码&quot;。一个租户仅一个编码。&#x27;,\n        target: &#x27;#anno-4&#x27;,\n        detail: {\n            feature: &#x27;店铺编码配置字段，位于&quot;初始设置&quot;区域内。\\n\\n- 单个文本输入框，非必填\\n- placeholder显示&quot;不填默认为「默认编码」&quot;\\n- 一个租户仅一个编码，简化为单字段\\n\\n同区域还包含：\\n- 初始余额输入框（选填）\\n- 采购账户配置区（见标注5）\\n- 备注文本域（选填）&#x27;,\n            rules: &#x27;1. 编码值最大长度50个字符\\n2. 仅允许中英文、数字、下划线、短横线\\n3. 不填时系统自动写入默认值&quot;默认编码&quot;\\n4. 编码值在系统内不要求唯一（不同租户可有相同编码）\\n5. 创建后可在租户详情页编辑修改\\n6. 初始余额为选填，不填则默认为0&#x27;,\n            exceptions: &#x27;1. 输入特殊字符：实时过滤，提示&quot;仅支持中英文、数字、下划线和短横线&quot;\\n2. 超出长度限制：截断并提示&quot;编码最长50个字符&quot;\\n3. 前后空格自动去除（trim处理）&#x27;,\n            data: &#x27;- 店铺编码：字符串，最大50字符\\n- 初始余额：Decimal，精度2位，默认0\\n- 默认编码值：&quot;默认编码&quot;（系统常量）&#x27;,\n            permission: &#x27;无特殊权限要求。&#x27;\n        }\n    },\n    {\n        id: 5,\n        title: &#x27;采购账户配置区&#x27;,\n        summary: &#x27;按平台类型分淘宝/1688/微店三个卡片，每个卡片可分别选择主用账户（单选）和备用账户（单选+添加按钮，选填），默认&quot;平台统一账户&quot;。&#x27;,\n        target: &#x27;#anno-6&#x27;,\n        detail: {\n            feature: &#x27;采购账户配置区域，采用卡片式布局，按平台类型分为3个独立卡片：\\n\\n每个卡片包含：\\n1. 平台类型标签：淘宝（橙色#F97316）、1688（蓝色#3B82F6）、微店（绿色#10B941）\\n2. 主用账户：下拉单选，默认为&quot;平台统一账户&quot;，标记绿色&quot;主用&quot;标签\\n3. 备用账户：下拉单选 + &quot;添加&quot;按钮，选填非必填，标记橙色&quot;备用&quot;标签和&quot;（选填）&quot;提示。点击&quot;添加&quot;可追加一个备用账户\\n\\n账户选项来源：系统设置中已配置的对应平台类型的采购账户列表。\\n\\n3个卡片横向并排，等宽布局。&#x27;,\n            rules: &#x27;1. 每个平台类型的主用账户只能选1个（单选下拉）\\n2. 每个平台类型的备用账户为非必填，通过单选下拉选择1个，点击&quot;+ 添加&quot;按钮可追加更多备用账户\\n3. 主用账户和备用账户不能重复选择同一个账户\\n4. 主用账户默认为&quot;平台统一账户&quot;，备用账户默认为空\\n5. 账户下拉列表仅展示对应平台类型的账户\\n6. 备用账户的&quot;+ 添加&quot;按钮点击后新增一行单选下拉，可继续选择备用账户\\n7. 卡片布局自适应，最小宽度200px&#x27;,\n            exceptions: &#x27;1. 某平台类型下无可用账户：下拉框显示&quot;暂无可用账户&quot;，不可选择\\n2. 主用账户与备用账户冲突：自动移除备用账户中的重复项，提示&quot;主备账户不能相同，已自动调整&quot;\\n3. 账户被禁用/删除：下拉列表中灰显标注&quot;已停用&quot;，不可选择&#x27;,\n            data: &#x27;- 账户列表数据：从系统设置-采购账户管理接口获取\\n- 按平台类型筛选：taobao/alibaba1688/weidian\\n- 每个账户包含：id、名称、平台类型、状态（启用/停用）\\n- 默认账户标识：is_default=true 的为&quot;平台统一账户&quot;&#x27;,\n            permission: &#x27;无特殊权限要求，但账户列表仅展示当前运营可见范围内的账户。&#x27;\n        }\n    }\n];\n\nfunction loadCustomAnnotations() { try { const s = localStorage.getItem(STORAGE_KEY); if (s) customAnnotations = JSON.parse(s); } catch(e) {} }\nfunction getActiveAnnotations() { return customAnnotations || annotations; }\nfunction renderAnnotationList() {\n    const list = document.getElementById(&#x27;annotation-list&#x27;);\n    const data = getActiveAnnotations();\n    list.innerHTML = data.map(item =&gt; `\n        &lt;div class=&quot;annotation-item&quot; data-id=&quot;${item.id}&quot; onclick=&quot;handleAnnotationClick(${item.id})&quot; onmouseenter=&quot;highlightMarker(${item.id})&quot; onmouseleave=&quot;unhighlightMarker(${item.id})&quot;&gt;\n            &lt;div class=&quot;annotation-header&quot;&gt;&lt;div class=&quot;annotation-badge&quot;&gt;${item.id}&lt;/div&gt;&lt;div class=&quot;annotation-title&quot;&gt;${item.title}&lt;/div&gt;&lt;/div&gt;\n            &lt;div class=&quot;annotation-summary&quot;&gt;${item.summary}&lt;/div&gt;\n        &lt;/div&gt;`).join(&#x27;&#x27;);\n}\nfunction highlightMarker(id) {\n    const m = document.querySelector(`.anno-marker[data-id=&quot;${id}&quot;]`); if (m) m.classList.add(&#x27;highlight&#x27;);\n    const i = document.querySelector(`.annotation-item[data-id=&quot;${id}&quot;]`); if (i) i.classList.add(&#x27;active&#x27;);\n}\nfunction unhighlightMarker(id) {\n    const m = document.querySelector(`.anno-marker[data-id=&quot;${id}&quot;]`); if (m) m.classList.remove(&#x27;highlight&#x27;);\n    const i = document.querySelector(`.annotation-item[data-id=&quot;${id}&quot;]`); if (i) i.classList.remove(&#x27;active&#x27;);\n}\ndocument.querySelectorAll(&#x27;.anno-marker&#x27;).forEach(marker =&gt; {\n    marker.addEventListener(&#x27;mouseenter&#x27;, () =&gt; highlightMarker(parseInt(marker.dataset.id)));\n    marker.addEventListener(&#x27;mouseleave&#x27;, () =&gt; unhighlightMarker(parseInt(marker.dataset.id)));\n    marker.addEventListener(&#x27;click&#x27;, () =&gt; showDetail(parseInt(marker.dataset.id)));\n});\nfunction handleAnnotationClick(id) { scrollToAnnotation(id); setTimeout(() =&gt; showDetail(id), 300); }\nfunction scrollToAnnotation(id) {\n    const data = getActiveAnnotations(); const item = data.find(a =&gt; a.id === id); if (!item) return;\n    const target = document.querySelector(item.target);\n    const previewArea = document.querySelector(&#x27;.preview-area&#x27;);\n    if (target &amp;&amp; previewArea) {\n        const targetTop = target.offsetTop - 20;\n        previewArea.scrollTo({ top: targetTop, behavior: &#x27;smooth&#x27; });\n        target.classList.remove(&#x27;anno-flash&#x27;); void target.offsetWidth; target.classList.add(&#x27;anno-flash&#x27;);\n        setTimeout(() =&gt; target.classList.remove(&#x27;anno-flash&#x27;), 1500);\n    }\n}\nfunction showDetail(id) {\n    const item = getActiveAnnotations().find(a =&gt; a.id === id); if (!item) return;\n    currentAnnotation = item; isEditing = false;\n    document.getElementById(&#x27;modal-title&#x27;).textContent = `${item.id}. ${item.title}`;\n    renderDetailTable(item);\n    document.getElementById(&#x27;edit-btn&#x27;).style.display = &#x27;inline-flex&#x27;;\n    document.getElementById(&#x27;save-btn&#x27;).style.display = &#x27;none&#x27;;\n    document.getElementById(&#x27;reset-btn&#x27;).style.display = customAnnotations ? &#x27;inline-flex&#x27; : &#x27;none&#x27;;\n    document.getElementById(&#x27;delete-btn&#x27;).style.display = (id !== 1) ? &#x27;inline-flex&#x27; : &#x27;none&#x27;;\n    document.getElementById(&#x27;detail-modal&#x27;).classList.add(&#x27;show&#x27;);\n}\nfunction renderDetailTable(item) {\n    const detail = item.detail; const rows = [];\n    if (detail.feature) rows.push({ label: &#x27;功能说明&#x27;, value: detail.feature });\n    if (detail.rules) rows.push({ label: &#x27;规则约束&#x27;, value: detail.rules });\n    if (detail.exceptions) rows.push({ label: &#x27;异常处理&#x27;, value: detail.exceptions });\n    if (detail.data) rows.push({ label: &#x27;数据要求&#x27;, value: detail.data });\n    if (detail.permission) rows.push({ label: &#x27;权限要求&#x27;, value: detail.permission });\n    const table = document.getElementById(&#x27;detail-table&#x27;);\n    if (isEditing) {\n        table.innerHTML = rows.map(row =&gt; `&lt;tr&gt;&lt;th&gt;${row.label}&lt;/th&gt;&lt;td&gt;&lt;textarea data-key=&quot;${getKeyFromLabel(row.label)}&quot;&gt;${row.value}&lt;/textarea&gt;&lt;/td&gt;&lt;/tr&gt;`).join(&#x27;&#x27;);\n    } else {\n        table.innerHTML = rows.map(row =&gt; `&lt;tr&gt;&lt;th&gt;${row.label}&lt;/th&gt;&lt;td&gt;${row.value.replace(/\\n/g, &#x27;&lt;br&gt;&#x27;)}&lt;/td&gt;&lt;/tr&gt;`).join(&#x27;&#x27;);\n    }\n}\nfunction getKeyFromLabel(label) { return { &#x27;功能说明&#x27;: &#x27;feature&#x27;, &#x27;规则约束&#x27;: &#x27;rules&#x27;, &#x27;异常处理&#x27;: &#x27;exceptions&#x27;, &#x27;数据要求&#x27;: &#x27;data&#x27;, &#x27;权限要求&#x27;: &#x27;permission&#x27; }[label] || label; }\nfunction toggleEdit() {\n    isEditing = !isEditing; renderDetailTable(currentAnnotation);\n    document.getElementById(&#x27;edit-btn&#x27;).style.display = isEditing ? &#x27;none&#x27; : &#x27;inline-flex&#x27;;\n    document.getElementById(&#x27;save-btn&#x27;).style.display = isEditing ? &#x27;inline-flex&#x27; : &#x27;none&#x27;;\n}\nfunction saveAnnotation() {\n    const textareas = document.querySelectorAll(&#x27;#detail-table textarea&#x27;);\n    if (!customAnnotations) customAnnotations = JSON.parse(JSON.stringify(annotations));\n    const item = customAnnotations.find(a =&gt; a.id === currentAnnotation.id); if (!item) return;\n    textareas.forEach(ta =&gt; { item.detail[ta.dataset.key] = ta.value; });\n    localStorage.setItem(STORAGE_KEY, JSON.stringify(customAnnotations));\n    currentAnnotation = item; isEditing = false; renderDetailTable(item);\n    document.getElementById(&#x27;edit-btn&#x27;).style.display = &#x27;inline-flex&#x27;;\n    document.getElementById(&#x27;save-btn&#x27;).style.display = &#x27;none&#x27;;\n    document.getElementById(&#x27;reset-btn&#x27;).style.display = &#x27;inline-flex&#x27;;\n    renderAnnotationList();\n    const btn = document.getElementById(&#x27;save-btn&#x27;); const o = btn.textContent;\n    btn.textContent = &#x27;已保存 ✓&#x27;; setTimeout(() =&gt; { btn.textContent = o; }, 1500);\n}\nfunction resetAnnotation() {\n    if (!confirm(&#x27;确定要重置为原始内容吗？&#x27;)) return;\n    localStorage.removeItem(STORAGE_KEY); customAnnotations = null;\n    const original = annotations.find(a =&gt; a.id === currentAnnotation.id);\n    currentAnnotation = original; isEditing = false; renderDetailTable(original);\n    document.getElementById(&#x27;edit-btn&#x27;).style.display = &#x27;inline-flex&#x27;;\n    document.getElementById(&#x27;save-btn&#x27;).style.display = &#x27;none&#x27;;\n    document.getElementById(&#x27;reset-btn&#x27;).style.display = &#x27;none&#x27;;\n    document.getElementById(&#x27;delete-btn&#x27;).style.display = &#x27;none&#x27;;\n    renderAnnotationList();\n}\nfunction closeModal() { document.getElementById(&#x27;detail-modal&#x27;).classList.remove(&#x27;show&#x27;); }\ndocument.getElementById(&#x27;detail-modal&#x27;).addEventListen gt;\n              &lt;button class=&quot;page-btn disabled&quot;&gt;‹&lt;/button&gt;\n              &lt;button class=&quot;page-btn active&quot;&gt;1&lt;/button&gt;\n              &lt;button class=&quot;page-btn&quot;&gt;2&lt;/button&gt;\n              &lt;button class=&quot;page-btn&quot;&gt;3&lt;/button&gt;\n              &lt;button class=&quot;page-btn&quot;&gt;4&lt;/button&gt;\n              &lt;button class=&quot;page-btn&quot;&gt;›&lt;/button&gt;\n            &lt;/div&gt;\n          &lt;/div&gt;\n        &lt;/div&gt;\n      &lt;/div&gt;\n    &lt;/div&gt;\n  &lt;/div&gt;\n  &lt;/div&gt;\n\n&lt;div class=&quot;anno-modal-mask&quot; id=&quot;anno-modal&quot; onclick=&quot;closeAnnoModalOnMask(event)&quot;&gt;\n  &lt;div class=&quot;anno-modal-box&quot;&gt;\n    &lt;div class=&quot;anno-modal-header&quot;&gt;\n      &lt;h3 id=&quot;anno-modal-title&quot;&gt;标注详情&lt;/h3&gt;\n      &lt;button class=&quot;anno-modal-close&quot; onclick=&quot;closeAnnoModal()&quot;&gt;×&lt;/button&gt;\n    &lt;/div&gt;\n    &lt;div class=&quot;anno-modal-body&quot; id=&quot;anno-modal-body&quot;&gt;&lt;/div&gt;\n  &lt;/div&gt;\n&lt;/div&gt;\n\n&lt;script&gt;\nconst annoData = {\n  1: {\n    title: &#x27;FR-001 租户列表 · 页面总说明&#x27;,\n    desc: &#x27;租户列表是运营管理员管理租户的核心入口页面，集中展示所有租户的基本信息、订阅状态和账户信息。支持多维度筛选搜索，支持快速查看详情、手动续费、启用/禁用等操作。&#x27;,\n    rules: &#x27;&lt;ul&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;展示字段&lt;/span&gt;租户编号、租户类型、公司名称、联系人、联系电话、联系邮箱、套餐、租户状态、账户余额、账户状态、到期时间、剩余天数、创建时间&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;排序规则&lt;/span&gt;默认按创建时间倒序排列，最新创建的在前&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;分页&lt;/span&gt;默认20条/页，支持页码跳转&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;权限&lt;/span&gt;仅运营管理员可查看&lt;/li&gt;&lt;/ul&gt;&#x27;,\n    exception: &#x27;&lt;ul&gt;&lt;li&gt;数据加载失败时显示空状态和重试按钮&lt;/li&gt;&lt;li&gt;搜索无结果时显示空状态提示&lt;/li&gt;&lt;li&gt;筛选组合无数据时引导重置筛选&lt;/li&gt;&lt;/ul&gt;&#x27;\n  },\n  2: {\n    title: &#x27;多维度筛选搜索&#x27;,\n    desc: &#x27;顶部筛选区提供多维度组合查询能力，支持租户类型、租户状态、账户状态等维度筛选，配合关键词模糊搜索快速定位目标租户。&#x27;,\n    rules: &#x27;&lt;ul&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;租户类型&lt;/span&gt;全部/企业/个体，企业需填公司名，个体可选&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;租户状态&lt;/span&gt;全部/正常/已过期/已禁用（3种状态）&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;账户状态&lt;/span&gt;余额状态（正常/余额不足）+ 未支付维度筛选&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;关键词&lt;/span&gt;模糊匹配公司名、联系人、租户编号&lt;/li&gt;&lt;li&gt;多个条件间为AND关系，需同时满足&lt;/li&gt;&lt;/ul&gt;&#x27;,\n    exception: &#x27;&lt;ul&gt;&lt;li&gt;无匹配结果时显示空状态提示&lt;/li&gt;&lt;li&gt;关键词为空时按其他条件正常查询&lt;/li&gt;&lt;/ul&gt;&#x27;\n  },\n  3: {\n    title: &#x27;新建租户&#x27;,\n    desc: &#x27;运营管理员手动创建新租户账号，支持企业和个体两种租户类型。填写基本信息后系统自动生成租户编号和初始密码，发送邮件通知。&#x27;,\n    rules: &#x27;&lt;ul&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;必填字段&lt;/span&gt;租户类型、联系人、联系电话、邮箱、套餐、订阅时长&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;企业类型&lt;/span&gt;公司名称必填，不可与已有租户重复&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;个体类型&lt;/span&gt;公司名称选填，可留空&lt;/li&gt;&lt;li&gt;手机号和邮箱系统内唯一，实时校验&lt;/li&gt;&lt;li&gt;套餐默认&quot;标准版&quot;不可改&lt;/li&gt;&lt;li&gt;初始余额选填，默认为0&lt;/li&gt;&lt;/ul&gt;&#x27;,\n    exception: &#x27;&lt;ul&gt;&lt;li&gt;手机号/邮箱已被占用时提示更换&lt;/li&gt;&lt;li&gt;邮件发送失败不影响创建，运营可手动告知&lt;/li&gt;&lt;/ul&gt;&#x27;\n  },\n  4: {\n    title: &#x27;账户余额&#x27;,\n    desc: &#x27;展示租户当前账户余额。系统采用单余额账户模式，无授信额度、无赠送金。所有费用实时从余额扣减，余额不足时新单进入待支付队列。&#x27;,\n    rules: &#x27;&lt;ul&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;余额定义&lt;/span&gt;单余额账户，无授信、无赠送金&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;扣费模式&lt;/span&gt;所有费用实时扣费，无日结概念&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;余额不足&lt;/span&gt;余额 &lt; 0 即为余额不足&lt;/li&gt;&lt;li&gt;余额不足行余额数字标红显示&lt;/li&gt;&lt;li&gt;充值/退款到账后余额立即更新&lt;/li&gt;&lt;/ul&gt;&#x27;,\n    exception: &#x27;&lt;ul&gt;&lt;li&gt;手动扣款可能导致余额为负，触发余额不足状态&lt;/li&gt;&lt;li&gt;余额更新使用事务，保证与流水记录原子性&lt;/li&gt;&lt;/ul&gt;&#x27;\n  },\n  5: {\n    title: &#x27;账户状态双维度&#x27;,\n    desc: &#x27;账户状态分为两个独立维度：余额状态（正常/余额不足）和未支付状态（正常/有未支付项）。有未支付项时显示未支付项总数徽标。&#x27;,\n    rules: &#x27;&lt;ul&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;余额状态&lt;/span&gt;正常（余额≥0）/ 余额不足（余额&lt;0）&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;未支付状态&lt;/span&gt;正常（双队列为空）/ 有未支付项（采购或物流待支付非空）&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;双队列&lt;/span&gt;采购待支付队列 + 物流待支付队列，均FIFO&lt;/li&gt;&lt;li&gt;有未支付项的行显示红色徽标，标注待支付项总数&lt;/li&gt;&lt;li&gt;余额不足仅影响新单扣费，不影响已有业务&lt;/li&gt;&lt;/ul&gt;&#x27;,\n    exception: &#x27;&lt;ul&gt;&lt;li&gt;待支付队列支付失败时跳过当前项继续下一项&lt;/li&gt;&lt;li&gt;充值后先付采购待支付，再付物流待支付&lt;/li&gt;&lt;/ul&gt;&#x27;\n  },\n  6: {\n    title: &#x27;行操作&#x27;,\n    desc: &#x27;每行提供详情、续费、启用/禁用三个核心操作入口，覆盖租户管理的主要日常操作场景。&#x27;,\n    rules: &#x27;&lt;ul&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;详情&lt;/span&gt;跳转租户详情页，查看完整信息&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;手动续费&lt;/span&gt;延长订阅有效期，已过期租户续费后自动恢复&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;禁用&lt;/span&gt;正常/已过期租户可禁用，禁用后不可登录&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;启用&lt;/span&gt;已禁用租户可启用，恢复原状态&lt;/li&gt;&lt;li&gt;禁用操作需二次确认，防止误操作&lt;/li&gt;&lt;li&gt;所有操作均记录操作日志&lt;/li&gt;&lt;/ul&gt;&#x27;,\n    exception: &#x27;&lt;ul&gt;&lt;li&gt;操作时若租户状态已变更，提示刷新后重试&lt;/li&gt;&lt;li&gt;操作失败有明确错误提示，不静默失败&lt;/li&gt;&lt;/ul&gt;&#x27;\n  }\n};\n\n// ===== Vue原型生成器标准标注系统 =====\nfunction openAnnoModal(id) {\n  const data = annoData[id];\n  if (!data) return;\n  let tableHtml = &#x27;&lt;table class=&quot;anno-modal-table&quot;&gt;&#x27;;\n  tableHtml += &#x27;&lt;tr&gt;&lt;th&gt;功能说明&lt;/th&gt;&lt;td&gt;&#x27; + data.desc + &#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;;\n  tableHtml += &#x27;&lt;tr&gt;&lt;th&gt;规则约束&lt;/th&gt;&lt;td&gt;&#x27; + data.rules + &#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;;\n  tableHtml += &#x27;&lt;tr&gt;&lt;th&gt;异常处理&lt;/th&gt;&lt;td&gt;&#x27; + data.exception + &#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;;\n  if (data.extra) {\n    for (let key in data.extra) {\n      tableHtml += &#x27;&lt;tr&gt;&lt;th&gt;&#x27; + key + &#x27;&lt;/th&gt;&lt;td&gt;&#x27; + data.extra[key] + &#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;;\n    }\n  }\n  tableHtml += &#x27;&lt;/table&gt;&#x27;;\n  document.getElementById(&#x27;anno-modal-title&#x27;).textContent = data.title;\n  document.getElementById(&#x27;anno-modal-body&#x27;).innerHTML = tableHtml;\n  document.getElementById(&#x27;anno-modal&#x27;).classList.add(&#x27;show&#x27;);\n}\nfunction closeAnnoModal() {\n  document.getElementById(&#x27;anno-modal&#x27;).classList.remove(&#x27;show&#x27;);\n}\nfunction closeAnnoModalOnMask(e) {\n  if (e.target.id === &#x27;anno-modal&#x27;) closeAnnoModal();\n}\ndocument.addEventListener(&#x27;keydown&#x27;, function(e) {\n  if (e.key === &#x27;Escape&#x27;) closeAnnoModal();\n});\n\n\n&lt;/script&gt;\n  &lt;/div&gt;\n\n  &lt;div class=&quot;anno-right-panel&quot;&gt;\n    &lt;h3&gt;页面标注&lt;/h3&gt;\n    &lt;div class=&quot;anno-item&quot; data-anno-id=&quot;1&quot;&gt;\n      &lt;div class=&quot;anno-item-header&quot;&gt;\n        &lt;span class=&quot;anno-item-num&quot;&gt;1&lt;/span&gt;\n        &lt;div class=&quot;anno-item-title&quot;&gt;FR-001 租户列表 · 页面总说明&lt;/div&gt;\n      &lt;/div&gt;\n      &lt;div class=&quot;anno-item-desc&quot;&gt;租户列表是运营管理员管理租户的核心入口页面，集中展示所有租户的基本信息、订阅状态和账户信息。支持多维度筛选搜索，支持快速查看详情、手动续费、启用/禁用等操作。&lt;/div&gt;\n    &lt;/div&gt;\n    &lt;div class=&quot;anno-item&quot; data-anno-id=&quot;2&quot;&gt;\n      &lt;div class=&quot;anno-item-header&quot;&gt;\n        &lt;span class=&quot;anno-item-num&quot;&gt;2&lt;/span&gt;\n        &lt;div class=&quot;anno-item-title&quot;&gt;多维度筛选搜索&lt;/div&gt;\n      &lt;/div&gt;\n      &lt;div class=&quot;anno-item-desc&quot;&gt;顶部筛选区提供多维度组合查询能力，支持租户类型、租户状态、账户状态等维度筛选，配合关键词模糊搜索快速定位目标租户。&lt;/div&gt;\n    &lt;/div&gt;\n    &lt;div class=&quot;anno-item&quot; data-anno-id=&quot;3&quot;&gt;\n      &lt;div class=&quot;anno-item-header&quot;&gt;\n        &lt;span class=&quot;anno-item-num&quot;&gt;3&lt;/span&gt;\n        &lt;div class=&quot;anno-item-title&quot;&gt;新建租户&lt;/div&gt;\n      &lt;/div&gt;\n      &lt;div class=&quot;anno-item-desc&quot;&gt;运营管理员手动创建新租户账号，支持企业和个体两种租户类型。填写基本信息后系统自动生成租户编号和初始密码，发送邮件通知。&lt;/div&gt;\n    &lt;/div&gt;\n    &lt;div class=&quot;anno-item&quot; data-anno-id=&quot;4&quot;&gt;\n      &lt;div class=&quot;anno-item-header&quot;&gt;\n        &lt;span class=&quot;anno-item-num&quot;&gt;4&lt;/span&gt;\n        &lt;div class=&quot;anno-item-title&quot;&gt;账户余额&lt;/div&gt;\n      &lt;/div&gt;\n      &lt;div class=&quot;anno-item-desc&quot;&gt;展示租户当前账户余额。系统采用单余额账户模式，无授信额度、无赠送金。所有费用实时从余额扣减，余额不足时新单进入待支付队列。&lt;/div&gt;\n    &lt;/div&gt;\n    &lt;div class=&quot;anno-item&quot; data-anno-id=&quot;5&quot;&gt;\n      &lt;div class=&quot;anno-item-header&quot;&gt;\n        &lt;span class=&quot;anno-item-num&quot;&gt;5&lt;/span&gt;\n        &lt;div class=&quot;anno-item-title&quot;&gt;账户状态双维度&lt;/div&gt;\n      &lt;/div&gt;\n      &lt;div class=&quot;anno-item-desc&quot;&gt;账户状态分为两个独立维度：余额状态（正常/余额不足）和未支付状态（正常/有未支付项）。有未支付项时显示未支付项总数徽标。&lt;/div&gt;\n    &lt;/div&gt;\n    &lt;div class=&quot;anno-item&quot; data-anno-id=&quot;6&quot;&gt;\n      &lt;div class=&quot;anno-item-header&quot;&gt;\n        &lt;span class=&quot;anno-item-num&quot;&gt;6&lt;/span&gt;\n        &lt;div class=&quot;anno-item-title&quot;&gt;行操作&lt;/div&gt;\n      &lt;/div&gt;\n      &lt;div class=&quot;anno-item-desc&quot;&gt;每行提供详情、续费、启用/禁用三个核心操作入口，覆盖租户管理的主要日常操作场景。&lt;/div&gt;\n    &lt;/div&gt;\n  &lt;/div&gt;\n&lt;/div&gt;\n\n&lt;!-- 标注详情弹窗 --&gt;\n&lt;div class=&quot;anno-modal-mask&quot; id=&quot;annoModalMask&quot; onclick=&quot;annoCloseModalOnMask(event)&quot;&gt;\n  &lt;div class=&quot;anno-modal-box&quot;&gt;\n    &lt;div class=&quot;anno-modal-header&quot;&gt;\n      &lt;h3 id=&quot;annoModalTitle&quot;&gt;标注详情&lt;/h3&gt;\n      &lt;button class=&quot;anno-modal-close&quot; onclick=&quot;annoCloseModal()&quot;&gt;×&lt;/button&gt;\n    &lt;/div&gt;\n    &lt;div class=&quot;anno-modal-body&quot; id=&quot;annoModalBody&quot;&gt;&lt;/div&gt;\n  &lt;/div&gt;\n&lt;/div&gt;\n\n\n&lt;script&gt;\n// ===== 新版标注系统交互逻辑 =====\n(function() {\n  // 获取所有标注数据（兼容两种格式）\n  function getAnnotationData() {\n    if (typeof annoData !== &#x27;undefined&#x27;) {\n      // 对象格式: { 1: {title, desc, rules, exception}, ... }\n      return annoData;\n    }\n    if (typeof annotations !== &#x27;undefined&#x27;) {\n      // 数组格式: [{title, content}, ...]\n      var result = {};\n      annotations.forEach(function(item, index) {\n        result[index + 1] = {\n          title: item.title,\n          desc: item.desc || &#x27;&#x27;,\n          content: item.content || &#x27;&#x27;,\n          rules: item.rules || &#x27;&#x27;,\n          exception: item.exception || &#x27;&#x27;\n        };\n      });\n      return result;\n    }\n    return {};\n  }\n\n  var data = getAnnotationData();\n  var keys = Object.keys(data).map(Number).sort(function(a, b) { return a - b; });\n\n  // 为左侧角标添加data-anno-id属性\n  var badges = document.querySelectorAll(&#x27;.anno-badge&#x27;);\n  badges.forEach(function(badge, index) {\n    if (!badge.getAttribute(&#x27;data-anno-id&#x27;)) {\n      var num = badge.textContent.trim();\n      if (!isNaN(parseInt(num))) {\n        badge.setAttribute(&#x27;data-anno-id&#x27;, parseInt(num));\n      } else {\n        badge.setAttribute(&#x27;data-anno-id&#x27;, index + 1);\n      }\n    }\n    // 绑定点击事件打开弹窗\n    badge.addEventListener(&#x27;click&#x27;, function(e) {\n      e.stopPropagation();\n      var id = badge.getAttribute(&#x27;data-anno-id&#x27;);\n      openAnnoDetailModal(parseInt(id));\n    });\n  });\n\n  // 为右侧标注条目绑定事件\n  var annoItems = document.querySelectorAll(&#x27;.anno-item&#x27;);\n  annoItems.forEach(function(item) {\n    var id = item.getAttribute(&#x27;data-anno-id&#x27;);\n    \n    // 悬停联动\n    item.addEventListener(&#x27;mouseenter&#x27;, function() {\n      highlightAnno(id);\n    });\n    item.addEventListener(&#x27;mouseleave&#x27;, function() {\n      unhighlightAnno(id);\n    });\n    \n    // 点击打开弹窗\n    item.addEventListener(&#x27;click&#x27;, function() {\n      openAnnoDetailModal(parseInt(id));\n    });\n  });\n\n  // 左侧角标悬停联动\n  badges.forEach(function(badge) {\n    var id = badge.getAttribute(&#x27;data-anno-id&#x27;);\n    var target = badge.closest(&#x27;.anno-target&#x27;) || badge.closest(&#x27;.anno-section&#x27;) || badge.parentElement;\n    if (target) {\n      target.addEventListener(&#x27;mouseenter&#x27;, function() {\n        highlightAnno(id);\n      });\n      target.addEventListener(&#x27;mouseleave&#x27;, function() {\n        unhighlightAnno(id);\n      });\n    }\n  });\n\n  function highlightAnno(id) {\n    var badge = document.querySelector(&#x27;.anno-badge[data-anno-id=&quot;&#x27; + id + &#x27;&quot;]&#x27;);\n    var item = document.querySelector(&#x27;.anno-item[data-anno-id=&quot;&#x27; + id + &#x27;&quot;]&#x27;);\n    if (badge) badge.classList.add(&#x27;active&#x27;);\n    if (item) item.classList.add(&#x27;active&#x27;);\n  }\n\n  function unhighlightAnno(id) {\n    var badge = document.querySelector(&#x27;.anno-badge[data-anno-id=&quot;&#x27; + id + &#x27;&quot;]&#x27;);\n    var item = document.querySelector(&#x27;.anno-item[data-anno-id=&quot;&#x27; + id + &#x27;&quot;]&#x27;);\n    if (badge) badge.classList.remove(&#x27;active&#x27;);\n    if (item) item.classList.remove(&#x27;active&#x27;);\n  }\n\n  function openAnnoDetailModal(id) {\n    var item = data[id];\n    if (!item) return;\n\n    document.getElementById(&#x27;annoModalTitle&#x27;).textContent = item.title || &#x27;标注详情&#x27;;\n    \n    var bodyHtml = &#x27;&#x27;;\n    // 如果有content字段（数组格式），直接使用\n    if (item.content) {\n      bodyHtml = item.content;\n      // 替换旧的table class\n      bodyHtml = bodyHtml.replace(/annotation-table/g, &#x27;anno-modal-table&#x27;);\n    } else {\n      // 对象格式：生成表格\n      bodyHtml = &#x27;&lt;table class=&quot;anno-modal-table&quot;&gt;&#x27;;\n      if (item.desc) {\n        bodyHtml += &#x27;&lt;tr&gt;&lt;th&gt;功能说明&lt;/th&gt;&lt;td&gt;&#x27; + item.desc + &#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;;\n      }\n      if (item.rules) {\n        bodyHtml += &#x27;&lt;tr&gt;&lt;th&gt;规则约束&lt;/th&gt;&lt;td&gt;&#x27; + item.rules + &#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;;\n      }\n      if (item.exception) {\n        bodyHtml += &#x27;&lt;tr&gt;&lt;th&gt;异常处理&lt;/th&gt;&lt;td&gt;&#x27; + item.exception + &#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;;\n      }\n      bodyHtml += &#x27;&lt;/table&gt;&#x27;;\n    }\n    \n    document.getElementById(&#x27;annoModalBody&#x27;).innerHTML = bodyHtml;\n    document.getElementById(&#x27;annoModalMask&#x27;).classList.add(&#x27;show&#x27;);\n  }\n\n  // 暴露给全局使用\n  window.annoOpenModal = openAnnoDetailModal;\n  window.annoCloseModal = function() {\n    document.getElementById(&#x27;annoModalMask&#x27;).classList.remove(&#x27;show&#x27;);\n  };\n  window.annoCloseModalOnMask = function(e) {\n    if (e.target.id === &#x27;annoModalMask&#x27;) {\n      window.annoCloseModal();\n    }\n  };\n\n  // ESC键关闭弹窗\n  document.addEventListener(&#x27;keydown&#x27;, function(e) {\n    if (e.key === &#x27;Escape&#x27;) {\n      window.annoCloseModal();\n    }\n  });\n})();\n&lt;/script&gt;\n&lt;/body&gt;\n&lt;/html&gt;\n',

ry&quot; onclick=&quot;confirmSwitch()&quot;&gt;确认切换&lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;/div&gt;\n&lt;div class=&quot;modal-overlay&quot; id=&quot;detail-modal&quot;&gt;\n    &lt;div class=&quot;modal&quot;&gt;\n        &lt;div class=&quot;modal-header&quot;&gt;\n            &lt;div class=&quot;modal-title&quot; id=&quot;modal-title&quot;&gt;标注详情&lt;/div&gt;\n            &lt;button class=&quot;modal-close&quot; onclick=&quot;closeModal()&quot;&gt;×&lt;/button&gt;\n        &lt;/div&gt;\n        &lt;div class=&quot;modal-body&quot;&gt;\n            &lt;table class=&quot;detail-table&quot; id=&quot;detail-table&quot;&gt;&lt;/table&gt;\n        &lt;/div&gt;\n        &lt;div class=&quot;modal-footer&quot;&gt;\n            &lt;button class=&quot;btn btn-default btn-danger&quot; id=&quot;delete-btn&quot; style=&quot;display:none; margin-right:auto;&quot; onclick=&quot;deleteAnnotation()&quot;&gt;删除标注&lt;/button&gt;\n            &lt;button class=&quot;btn btn-default&quot; id=&quot;reset-btn&quot; style=&quot;display:none;&quot; onclick=&quot;resetAnnotation()&quot;&gt;重置&lt;/button&gt;\n            &lt;button class=&quot;btn btn-default&quot; id=&quot;export-btn&quot; onclick=&quot;exportAnnotatedHTML()&quot;&gt;导出HTML&lt;/button&gt;\n            &lt;button class=&quot;btn btn-default&quot; id=&quot;edit-btn&quot; onclick=&quot;toggleEdit()&quot;&gt;编辑&lt;/button&gt;\n            &lt;button class=&quot;btn btn-primary&quot; id=&quot;save-btn&quot; style=&quot;display:none;&quot; onclick=&quot;saveAnnotation()&quot;&gt;保存&lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;/div&gt;\n&lt;script&gt;\nconst STORAGE_KEY = &#x27;annotated-prototype-tenant-detail-v2.2.3&#x27;;\nlet currentAnnotation = null;\nlet isEditing = false;\nlet customAnnotations = null;\n\nconst annotations = [\n    {\n        id: 1,\n        title: &#x27;页面总览&#x27;,\n        summary: &#x27;租户360度详情页面，集中查看单个租户全量信息，分8个区域，是运营处理租户问题的核心页面。&#x27;,\n        target: &#x27;#anno-1&#x27;,\n        detail: {\n            feature: &#x27;租户详情页面，集中展示单个租户的全量信息，供运营人员查看和处理租户相关问题。\\n\\n页面分为8个核心区域：\\n1. 基本信息 - 租户类型、公司名、联系方式\\n2. 订阅信息 - 套餐版本、到期时间\\n3. 账户信息 - 余额、状态、待支付统计\\n4. 资源用量 - 订单数、仓储商品数、消费统计\\n5. 缴费记录 - 历史缴费明细列表\\n6. 账户流水 - 收支明细列表\\n7. 店铺编码 - 单个编码展示与编辑\\n8. 采购账户 - 按平台分主备账户展示\\n\\n页面顶部有返回按钮、租户名称、状态标签和操作按钮组。&#x27;,\n            rules: &#x27;1. 页面数据从租户详情API一次性加载，后续各区域独立刷新\\n2. 账户余额和待支付数据实时刷新（每次进入页面请求最新数据）\\n3. 操作按钮组根据租户状态动态显示/隐藏（如禁用状态不显示&quot;禁用&quot;按钮，显示&quot;启用&quot;按钮）\\n4. 各区域卡片独立，支持独立加载和错误处理\\n5. 手机号展示中间4位脱敏（如138****6789）&#x27;,\n            exceptions: &#x27;1. 租户不存在（404）：显示&quot;租户不存在&quot;提示，返回租户列表\\n2. 无权限查看：显示&quot;无权限访问&quot;提示\\n3. 部分区域数据加载失败：该区域显示&quot;加载失败，点击重试&quot;，不影响其他区域\\n4. 租户被禁用：页面仍可访问，但操作按钮受限&#x27;,\n            data: &#x27;页面初始化需加载：\\n- 租户基本信息（类型、公司名、联系人、电话、邮箱）\\n- 订阅信息（套餐、时长、到期时间）\\n- 账户信息（余额、状态、待支付统计）\\n- 店铺编码\\n- 采购账户配置（按平台类型分组）\\n- 资源用量统计\\n- 缴费记录（分页，默认最近10条）\\n- 账户流水（分页，默认最近10条）&#x27;,\n            permission: &#x27;需要&quot;租户管理-查看&quot;权限。以下操作需要额外权限：\\n- 编辑信息：租户管理-编辑\\n- 手动续费：租户管理-续费\\n- 加款/扣款：财务管理-操作\\n- 禁用/启用：租户管理-高级权限&#x27;\n        }\n    },\n    {\n        id: 2,\n        title: &#x27;基本信息+订阅+账户信息区&#x27;,\n        summary: &#x27;展示租户类型、公司名、联系方式、套餐、到期时间；账户余额大字号展示；操作按钮：编辑、续费、加款/扣款。&#x27;,\n        target: &#x27;#anno-2&#x27;,\n        detail: {\n            feature: &#x27;整合展示租户的基本信息、订阅信息和账户信息三大模块。\\n\\n基本信息字段（3列网格布局）：\\n- 租户类型（企业/个体）\\n- 公司名称\\n- 联系人\\n- 联系电话（脱敏展示）\\n- 联系邮箱\\n- 套餐版本\\n- 订阅时长\\n- 到期时间（临期30天内橙色高亮）\\n- 创建时间\\n\\n账户信息区域（左侧大字余额 + 右侧统计卡片）：\\n- 账户余额：大字号居中展示（32px），负数红色\\n- 账户状态：正常/冻结/禁用\\n- 采购待支付：金额 + 笔数\\n- 物流待支付：金额 + 笔数\\n- 可用余额：账户余额 - 待支付总额\\n\\n操作按钮组（页面顶部右侧）：\\n- 编辑信息、手动续费、加款/扣款、禁用&#x27;,\n            rules: &#x27;1. 余额大字号展示，正数黑色，负数红色（#F53F3F）\\n2. 手机号脱敏：中间4位用*号替换\\n3. 到期时间：距到期≤30天时，文字变为橙色（#E65100）警示\\n4. 可用余额 = 账户余额 - 采购待支付 - 物流待支付\\n5. 账户状态显示对应颜色标签：正常绿色、冻结橙色、禁用红色\\n6. 编辑按钮点击弹出编辑弹窗（复用新建弹窗结构，回填数据）\\n7. 手动续费点击弹出续费弹窗\\n8. 加款/扣款点击弹出金额操作弹窗&#x27;,\n            exceptions: &#x27;1. 余额加载失败：显示&quot;--&quot;，提供&quot;刷新&quot;按钮\\n2. 到期时间已过期：状态标签变为&quot;已过期&quot;红色\\n3. 租户被禁用：所有操作按钮隐藏，仅显示&quot;启用&quot;按钮\\n4. 待支付数据获取超时：显示&quot;计算中...&quot;，5秒后显示&quot;--&quot;&#x27;,\n            data: &#x27;- 余额：金额，精度2位，单位元\\n- 待支付金额：金额，来自待支付订单汇总\\n- 到期时间：日期，需与当前日期比较判断临期\\n- 状态枚举：正常/冻结/禁用/已过期&#x27;,\n            permission: &#x27;查看：租户管理-查看\\n编辑信息：租户管理-编辑\\n手动续费：租户管理-续费\\n加款/扣款：财务管理-操作\\n禁用/启用：租户管理-高级权限&#x27;\n        }\n    },\n    {\n        id: 3,\n        title: &#x27;店铺编码区（v2.2.2简化）&#x27;,\n        summary: &#x27;展示该租户的单个店铺编码值，右侧有&quot;编辑&quot;按钮，点击弹出编辑弹窗修改编码（单字段编辑）。&#x27;,\n        target: &#x27;#anno-3&#x27;,\n        detail: {\n            feature: &#x27;店铺编码展示与编辑区域。\\n\\n展示内容：\\n- 编码值：大字号加粗展示（如&quot;默认编码&quot;或自定义值）\\n- 系统默认标记：如果是系统默认值，显示橙色&quot;系统默认&quot;标签\\n- 编辑按钮：右侧，点击弹出编辑弹窗\\n\\n编辑弹窗：\\n- 单个输入框，回填当前编码值\\n- 确认/取消按钮\\n- 弹窗标题：&quot;编辑店铺编码&quot;&#x27;,\n            rules: &#x27;1. 编码值最大50字符，仅允许中英文、数字、下划线、短横线\\n2. 编辑后即时生效，无需审批\\n3. 编码修改后记录操作日志（操作人、时间、旧值、新值）\\n4. 不能清空编码（至少保留1个字符）\\n5. 如果是系统默认值且用户未修改，保存时提示&quot;编码未变更&quot;\\n6. v2.2.2简化：由多编码列表改为单编码，编辑也是单字段&#x27;,\n            exceptions: &#x27;1. 输入非法字符：实时过滤，提示&quot;仅支持中英文、数字、下划线和短横线&quot;\\n2. 保存失败：提示&quot;保存失败，请重试&quot;，保留用户输入内容\\n3. 并发编辑：后保存者覆盖，提示&quot;编码已被其他操作人修改，当前已保存最新值&quot;&#x27;,\n            data: &#x27;- 编码值：文本，最大50字符\\n- 是否系统默认：是/否\\n- 最后修改时间：日期时间\\n- 最后修改人：文本&#x27;,\n            permission: &#x27;查看：租户管理-查看\\n编辑：租户管理-编辑&#x27;\n        }\n    },\n    {\n        id: 4,\n        title: &#x27;采购账户区（v2.2.3主备标记）&#x27;,\n        summary: &#x27;按平台类型分3个卡片展示，每个卡片含主用账户（醒目标记）和备用账户列表，底部有切换按钮。&#x27;,\n        target: &#x27;#anno-4&#x27;,\n        detail: {\n            feature: &#x27;采购账户配置展示区域，按平台类型分为3个独立卡片（淘宝/1688/微店）。\\n\\n每个卡片包含：\\n1. 平台类型标签（头部）：\\n   - 淘宝：橙色#F97316\\n   - 1688：蓝色#3B82F6\\n   - 微店：绿色#10B941\\n\\n2. 主用账户区域：\\n   - 绿色背景框突出展示（#F0FDF4背景 + #BBF7D0边框）\\n   - 账户名称大字号加粗\\n   - 绿色&quot;主用&quot;角色标签\\n\\n3. 备用账户列表：\\n   - 每个备用账户显示名称 + 状态标签（正常/已停用）\\n   - 橙色&quot;备用&quot;角色标签\\n   - 无备用账户时显示&quot;暂未配置备用账户&quot;灰色文字\\n\\n4. 切换按钮：\\n   - 底部虚线边框按钮\\n   - 文案&quot;切换采购账户&quot;\\n   - 点击弹出账户选择弹窗&#x27;,\n            rules: &#x27;1. 主用账户只能有1个，醒目展示（绿色背景框+加粗字体）\\n2. 备用账户可以有0个或多个\\n3. 主用和备用不能是同一个账户\\n4. 切换弹窗功能：\\n   - 可选择目标账户\\n   - 可选择角色（主用/备用）\\n   - 如果选为主用，原主用账户自动降级为备用（或清空）\\n   - 如果选为备用，原主用不变\\n5. 账户状态实时展示：正常（绿色）/已停用（灰色）\\n6. 停用账户仍可展示但不能选择为主用\\n7. 3个卡片等宽横向布局，最小宽度240px&#x27;,\n            exceptions: &#x27;1. 某平台无可用账户：卡片显示&quot;该平台暂未配置采购账户&quot;，切换按钮置灰\\n2. 切换时主用账户被停用：自动切换到第一个备用账户，若无备用则使用平台统一账户\\n3. 所有账户均被停用：提示&quot;所有采购账户均已停用，请及时配置新账户&quot;\\n4. 切换操作失败：提示&quot;切换失败，请重试&quot;，保持原状态&#x27;,\n            data: &#x27;- 账户数据结构：{账户ID, 账户名称, 平台类型, 状态, 是否主用, 是否备用}\\n- 平台类型：淘宝/1688/微店\\n- 状态枚举：正常/已停用\\n- 平台统一账户标识：系统默认账户&#x27;,\n            permission: &#x27;查看：租户管理-查看\\n切换账户：租户管理-编辑 + 采购账户管理权限&#x27;\n        }\n    },\n    {\n        id: 5,\n        title: &#x27;缴费记录+账户流水区&#x27;,\n        summary: &#x27;缴费记录列表（分页+时间筛选）；账户流水列表（分页+类型筛选+时间筛选）。&#x27;,\n        target: &#x27;#anno-5&#x27;,\n        detail: {\n            feature: &#x27;财务数据展示区域，分为上下两个子模块：\\n\\n【缴费记录】\\n- 表格列：缴费时间、缴费金额、缴费方式、对应周期、操作人、状态\\n- 筛选：时间范围（开始日期 ~ 结束日期）\\n- 分页：每页10条，显示总记录数\\n- 缴费方式：线下转账/线下现金/线上支付\\n- 状态标签：已完成（绿色）/待确认（橙色）\\n\\n【账户流水】\\n- 表格列：时间、类型、金额、余额、关联单号、备注\\n- 筛选：类型下拉（全部/采购扣款/物流扣款/手动加款/手动扣款/退款）+ 时间范围\\n- 分页：每页10条，显示总记录数和页码\\n- 金额展示：正数绿色+号，负数红色-号\\n\\n两个子模块用分割线分隔，各自独立卡片头。&#x27;,\n            rules: &#x27;1. 缴费记录默认展示最近3个月的记录\\n2. 账户流水默认展示最近1个月的记录\\n3. 流水金额格式：正数显示&quot;+¥ xxx.xx&quot;（绿色），负数显示&quot;-¥ xxx.xx&quot;（红色）\\n4. 流水类型标签颜色：采购扣款蓝色、物流扣款橙色、手动加款绿色、手动扣款灰色、退款紫色\\n5. 分页支持页码跳转，最多显示5个页码+省略号\\n6. 关联单号可点击跳转到对应单据详情&#x27;,\n            exceptions: &#x27;1. 无数据：表格区域显示&quot;暂无数据&quot;空状态图标\\n2. 筛选无结果：显示&quot;未找到匹配的记录，请调整筛选条件&quot;\\n3. 日期范围非法（开始&gt;结束）：提示&quot;开始日期不能晚于结束日期&quot;&#x27;,\n            data: &#x27;- 缴费记录：{缴费时间, 缴费金额, 缴费方式, 对应周期, 操作人, 状态}\\n- 账户流水：{时间, 类型, 金额, 余额, 关联单号, 备注}\\n- 金额：金额，精度2位\\n- 时间范围筛选：开始日期, 结束日期\\n- 分页参数：当前页码, 每页条数&#x27;,\n            permission: &#x27;查看：租户管理-查看&#x27;\n        }\n    },\n    {\n        id: 6,\n        title: &#x27;资源用量区&#x27;,\n        summary: &#x27;展示订单数、仓储商品数、本月消费等平台资源使用情况，带进度条可视化。&#x27;,\n        target: &#x27;#anno-6&#x27;,\n        detail: {\n            feature: &#x27;资源用量统计展示区域，以3列网格卡片形式展示关键业务指标。\\n\\n展示指标：\\n1. 本月订单数：数字 + 进度条（相对月度目标）\\n2. 仓储商品数：数字 + 进度条（相对仓储上限）\\n3. 本月消费：金额 + 进度条（相对账户预算/历史均值）\\n\\n每个指标卡片包含：\\n- 图标（emoji）\\n- 数值（大字号加粗）\\n- 标签说明\\n- 进度条（颜色区分：蓝/绿/橙）\\n\\n区域头部右侧显示&quot;本月统计&quot;文字标签。&#x27;,\n            rules: &#x27;1. 数据为当月1日至当前日期的累计值\\n2. 每日凌晨自动更新统计数据\\n3. 进度条宽度 = 当前值 / 目标值 * 100%，最大100%\\n4. 进度条颜色区分：\\n   - 订单数：蓝色#3B82F6\\n   - 仓储商品数：绿色#10B941\\n   - 本月消费：橙色#F97316\\n5. 数值超过目标值时，进度条显示100%并在数值旁显示&quot;超额&quot;标签\\n6. 3个卡片等宽布局，响应式最小宽度180px&#x27;,\n            exceptions: &#x27;1. 统计数据加载失败：显示&quot;--&quot;并提供&quot;刷新&quot;按钮\\n2. 目标值未设置：进度条不显示，仅展示数值\\n3. 当月无数据：所有指标显示0，进度条为空\\n4. 数据延迟（非实时更新）：显示&quot;数据更新于xx分钟前&quot;提示&#x27;,\n            data: &#x27;- 订单数：整数\\n- 仓储商品数：整数\\n- 本月消费：金额，精度2位\\n- 各指标目标值：从套餐配置中获取&#x27;,\n            permission: &#x27;查看：租户管理-查看（无额外权限要求）&#x27;\n        }\n    }\n];\n\nfunction loadCustomAnnotations() { try { const s = localStorage.getItem(STORAGE_KEY); if (s) customAnnotations = JSON.parse(s); } catch(e) {} }\nfunction getActiveAnnotations() { return customAnnotations || annotations; }\nfunction renderAnnotationList() {\n    const list = document.getElementById(&#x27;annotation-list&#x27;);\n    const data = getActiveAnnotations();\n    list.innerHTML = data.map(item =&gt; `\n        &lt;div class=&quot;annotation-item&quot; data-id=&quot;${item.id}&quot; onclick=&quot;handleAnnotationClick(${item.id})&quot; onmouseenter=&quot;highlightMarker(${item.id})&quot; onmouseleave=&quot;unhighlightMarker(${item.id})&quot;&gt;\n            &lt;div class=&quot;annotation-header&quot;&gt;&lt;div class=&quot;annotation-badge&quot;&gt;${item.id}&lt;/div&gt;&lt;div class=&quot;annotation-title&quot;&gt;${item.title}&lt;/div&gt;&lt;/div&gt;\n            &lt;div class=&quot;annotation-summary&quot;&gt;${item.summary}&lt;/div&gt;\n        &lt;/div&gt;`).join(&#x27;&#x27;);\n}\nfunction highlightMarker(id) {\n    const m = document.querySelector(`.anno-marker[data-id=&quot;${id}&quot;]`); if (m) m.classList.add(&#x27;highlight&#x27;);\n    const i = document.querySelector(`.annotation-item[data-id=&quot;${id}&quot;]`); if (i) i.classList.add(&#x27;active&#x27;);\n}\nfunction unhighlightMarker(id) {\n    const m = document.querySelector(`.anno-marker[data-id=&quot;${id}&quot;]`); if (m) m.classList.remove(&#x27;highlight&#x27;);\n    const i = document.querySelector(`.annotation-item[data-id=&quot;${id}&quot;]`); if (i) i.classList.remove(&#x27;active&#x27;);\n}\ndocument.querySelectorAll(&#x27;.anno-marker&#x27;).forEach(marker =&gt; {\n    marker.addEventListener(&#x27;mouseenter&#x27;, () =&gt; highlightMarker(parseInt(marker.dataset.id)));\n    marker.addEventListener(&#x27;mouseleave&#x27;, () =&gt; unhighlightMarker(parseInt(marker.dataset.id)));\n    marker.addEventListener(&#x27;click&#x27;, () =&gt; showDetail(parseInt(marker.dataset.id)));\n});\nfunction handleAnnotationClick(id) { scrollToAnnotation(id); setTimeout(() =&gt; showDetail(id), 300); }\nfunction scrollToAnnotation(id) {\n    const data = getActiveAnnotations(); const item = data.find(a =&gt; a.id === id); if (!item) return;\n    const target = document.querySelector(item.target);\n    const previewArea = document.querySelector(&#x27;.preview-area&#x27;);\n    if (target &amp;&amp; previewArea) {\n        const targetTop = target.offsetTop - 20;\n        previewArea.scrollTo({ top: targetTop, behavior: &#x27;smooth&#x27; });\n        target.classList.remove(&#x27;anno-flash&#x27;); void target.offsetWidth; target.classList.add(&#x27;anno-flash&#x27;);\n        setTimeout(() =&gt; target.classList.remove(&#x27;anno-flash&#x27;), 1500);\n    }\n}\nfunction showDetail(id) {\n    const item = getActiveAnnotations().find(a =&gt; a.id === id); if (!item) return;\n    currentAnnotation = item; isEditing = false;\n    document.getElementById(&#x27;modal-title&#x27;).textContent = `${item.id}. ${item.title}`;\n    renderDetailTable(item);\n    document.getElementById(&#x27;edit-btn&#x27;).style.display = &#x27;inline-flex&#x27;;\n    document.getElementById(&#x27;save-btn&#x27;).style.display = &#x27;none&#x27;;\n    document.getElementById(&#x27;reset-btn&#x27;).style.display = customAnnotations ? &#x27;inline-flex&#x27; : &#x27;none&#x27;;\n    document.getElementById(&#x27;delete-btn&#x27;).style.display = (id !== 1) ? &#x27;inline-flex&#x27; : &#x27;none&#x27;;\n    document.getElementById(&#x27;detail-modal&#x27;).classList.add(&#x27;show&#x27;);\n}\nfunction renderDetailTable(item) {\n    const detail = item.detail; const rows = [];\n    if (detail.feature) rows.push({ label: &#x27;功能说明&#x27;, value: detail.feature });\n    if (detail.rules) rows.push({ label: &#x27;规则约束&#x27;, value: detail.rules });\n    if (detail.exceptions) rows.push({ label: &#x27;异常处理&#x27;, value: detail.exceptions });\n    if (detail.data) rows.push({ label: &#x27;数据要求&#x27;, value: detail.data });\n    if (detail.permission) rows.push({ label: &#x27;权限要求&#x27;, value: detail.permission });\n    const table = document.getElementById(&#x27;detail-table&#x27;);\n    if (isEditing) {\n        table.innerHTML = rows.map(row =&gt; `&lt;tr&gt;&lt;th&gt;${row.label}&lt;/th&gt;&lt;td&gt;&lt;textarea data-key=&quot;${getKeyFromLabel(row.label)}&quot;&gt;${row.value}&lt;/textarea&gt;&lt;/td&gt;&lt;/tr&gt;`).join(&#x27;&#x27;);\n    } else {\n        table.innerHTML = rows.map(row =&gt; `&lt;tr&gt;&lt;th&gt;${row.label}&lt;/th&gt;&lt;td&gt;${row.value.replace(/\\n/g, &#x27;&lt;br&gt;&#x27;)}&lt;/td&gt;&lt;/tr&gt;`).join(&#x27;&#x27;);\n    }\n}\nfunction getKeyFromLabel(label) { return { &#x27;功能说明&#x27;: &#x27;feature&#x27;, &#x27;规则约束&#x27;: &#x27;rules&#x27;, &#x27;异常处理&#x27;: &#x27;exceptions&#x27;, &#x27;数据要求&#x27;: &#x27;data&#x27;, &#x27;权限要求&#x27;: &#x27;permission&#x27; }[label] || label; }\nfunction toggle ne&#x27;;\n    renderAnnotationList();\n}\nfunction closeModal() { document.getElementById(&#x27;detail-modal&#x27;).classList.remove(&#x27;show&#x27;); }\ndocument.getElementById(&#x27;detail-modal&#x27;).addEventListener(&#x27;click&#x27;, function(e) { if (e.target === this) closeModal(); });\ndocument.addEventListener(&#x27;keydown&#x27;, function(e) { if (e.key === &#x27;Escape&#x27;) closeModal(); });\n\nconst PANEL_STATE_KEY = STORAGE_KEY + &#x27;-panel&#x27;;\nfunction initPanelState() {\n    try { const c = localStorage.getItem(PANEL_STATE_KEY) === &#x27;1&#x27;;\n    if (c) { document.getElementById(&#x27;annotation-panel&#x27;).classList.add(&#x27;collapsed&#x27;); document.getElementById(&#x27;panel-expand-btn&#x27;).classList.add(&#x27;show&#x27;); } } catch(e) {}\n}\nfunction togglePanel() {\n    const panel = document.getElementById(&#x27;annotation-panel&#x27;); const expandBtn = document.getElementById(&#x27;panel-expand-btn&#x27;);\n    const isCollapsed = panel.classList.toggle(&#x27;collapsed&#x27;); expandBtn.classList.toggle(&#x27;show&#x27;, isCollapsed);\n    try { localStorage.setItem(PANEL_STATE_KEY, isCollapsed ? &#x27;1&#x27; : &#x27;0&#x27;); } catch(e) {}\n}\nfunction addAnnotation() {\n    if (!customAnnotations) customAnnotations = JSON.parse(JSON.stringify(annotations));\n    const newId = customAnnotations.length + 1;\n    const newItem = { id: newId, title: &#x27;新标注 &#x27; + newId, summary: &#x27;点击编辑修改标注内容...&#x27;, target: &#x27;#anno-&#x27; + newId,\n        detail: { feature: &#x27;请填写功能说明...&#x27;, rules: &#x27;请填写规则约束...&#x27;, exceptions: &#x27;请填写异常处理...&#x27; } };\n    customAnnotations.push(newItem); localStorage.setItem(STORAGE_KEY, JSON.stringify(customAnnotations));\n    renderAnnotationList(); currentAnnotation = newItem; isEditing = true;\n    document.getElementById(&#x27;modal-title&#x27;).textContent = `${newItem.id}. ${newItem.title}`;\n    renderDetailTable(newItem);\n    document.getElementById(&#x27;edit-btn& d&quot;&gt;*&lt;/span&gt;&lt;/label&gt;\n                &lt;div class=&quot;password-wrapper&quot;&gt;\n                    &lt;input type=&quot;password&quot; class=&quot;form-input&quot; id=&quot;edit-app-secret&quot; placeholder=&quot;请输入appSecret&quot;&gt;\n                    &lt;button type=&quot;button&quot; class=&quot;password-toggle&quot; onclick=&quot;togglePassword(&#x27;edit-app-secret&#x27;, this)&quot;&gt;显示&lt;/button&gt;\n                &lt;/div&gt;\n            &lt;/div&gt;\n            &lt;div class=&quot;form-group&quot;&gt;\n                &lt;label class=&quot;form-label&quot;&gt;启用状态&lt;/label&gt;\n                &lt;div class=&quot;switch-wrap&quot;&gt;\n                    &lt;button type=&quot;button&quot; class=&quot;switch-toggle active&quot; id=&quot;edit-status&quot; onclick=&quot;toggleSwitch(this)&quot;&gt;&lt;/button&gt;\n                    &lt;span class=&quot;switch-label&quot; id=&quot;edit-status-label&quot;&gt;已启用&lt;/span&gt;\n                &lt;/div&gt;\n            &lt;/div&gt;\n        &lt;/div&gt;\n        &lt;div class=&quot;modal-footer&quot;&gt;\n            &lt;button class=&quot;btn btn-default&quot; onclick=&quot;closeEditModal()&quot;&gt;取消&lt;/button&gt;\n            &lt;button class=&quot;btn btn-primary&quot; onclick=&quot;saveEditModal()&quot;&gt;保存修改&lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;/div&gt;\n\n&lt;!-- 查看租户弹窗 --&gt;\n&lt;div class=&quot;modal-overlay&quot; id=&quot;tenant-modal&quot;&gt;\n    &lt;div class=&quot;modal modal-lg&quot;&gt;\n        &lt;div class=&quot;modal-header&quot;&gt;\n            &lt;div class=&quot;modal-title&quot; id=&quot;tenant-modal-title&quot;&gt;关联租户列表&lt;/div&gt;\n            &lt;button class=&quot;modal-close&quot; onclick=&quot;closeTenantModal()&quot;&gt;×&lt;/button&gt;\n        &lt;/div&gt;\n        &lt;div class=&quot;modal-body&quot; id=&quot;tenant-modal-body&quot;&gt;&lt;/div&gt;\n        &lt;div class=&quot;modal-footer&quot;&gt;\n            &lt;button class=&quot;btn btn-primary&quot; onclick=&quot;closeTenantModal()&quot;&gt;关闭&lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;/div&gt;\n&lt;script&gt;\nconst STORAGE_KEY = &#x27;annotated-prototype-procurement-account-list&#x27;;\nlet currentAnnotation = null; let isEditing = false; let customAnnotations = null;\nconst annotations = [\n  {\n    id: 1,\n    title: &#x27;页面总览&#x27;,\n    summary: &#x27;系统设置中的采购账户管理页面，统一列表展示所有采购账户，支持按平台类型筛选和新增/编辑/启停操作。&#x27;,\n    target: &#x27;#anno-1&#x27;,\n    detail: {\n      feature: &#x27;采购账户管理页面位于系统设置模块内，以统一列表形式展示所有采购账户，无TAB分区。\\n\\n支持按平台类型（淘宝/1688/微店）筛选，支持关键词搜索，支持新增、编辑、启停操作。&#x27;,\n      rules: &#x27;1. 页面入口：系统设置 &gt; 采购账户\\n2. 每页显示20条，底部分页\\n3. 支持按平台类型筛选和关键词搜索\\n4. 筛选与搜索可组合使用，切换筛选条件时重置分页到第一页&#x27;,\n      exceptions: &#x27;1. 若无采购账户数据，显示空状态提示&quot;暂无采购账户，请点击新增&quot;\\n2. 筛选/搜索无结果时显示&quot;暂无匹配数据&quot;&#x27;,\n      data: &#x27;列表字段：账户ID、账户名称、平台类型、授权账号、授权状态、启用状态、关联租户数、累计采购单数、创建时间、操作&#x27;\n    }\n  },\n  {\n    id: 2,\n    title: &#x27;平台类型筛选栏&#x27;,\n    summary: &#x27;顶部平台类型筛选按钮组（全部/淘宝/1688/微店），点击切换筛选对应平台的采购账户。&#x27;,\n    target: &#x27;#anno-2&#x27;,\n    detail: {\n      feature: &#x27;提供平台类型快速筛选功能，按钮组包含：全部、淘宝、1688、微店四个选项。点击切换当前筛选条件，列表实时刷新显示对应平台类型的账户。&#x27;,\n      rules: &#x27;1. 默认选中&quot;全部&quot;，展示所有平台账户\\n2. 单选模式，点击某按钮后其他按钮取消选中\\n3. 选中按钮使用主蓝色高亮（#165DFF）\\n4. 切换筛选条件时重置分页到第一页\\n5. 可与搜索框组合使用，两个条件取交集&#x27;,\n      exceptions: &#x27;无&#x27;,\n      data: &#x27;筛选维度：平台类型\\n选项：全部 / 淘宝 / 1688 / 微店\\n按钮样式：选中=蓝底白字，未选中=白底灰边&#x27;\n    }\n  },\n  {\n    id: 3,\n    title: &#x27;采购账户列表&#x27;,\n    summary: &#x27;表格展示所有采购账户，包含账户信息、平台类型、授权状态等字段，操作列支持编辑、启停、查看租户。&#x27;,\n    target: &#x27;#anno-3&#x27;,\n    detail: {\n      feature: &#x27;以表格形式展示所有采购账户信息，共10列：\\n\\n• 账户ID：系统自动生成的唯一标识\\n• 账户名称：账户的描述名称\\n• 平台类型：淘宝(橙)/1688(蓝)/微店(绿)彩色标签\\n• 授权账号：平台账号名/邮箱\\n• 授权状态：已授权(绿)/待授权(橙)/授权过期(红)\\n• 启用状态：有效(绿)/无效(灰)\\n• 关联租户数：数字，可点击弹窗查看租户列表\\n• 累计采购单数：历史采购总量\\n• 创建时间：yyyy-MM-dd HH:mm\\n• 操作：编辑、停用/启用、查看关联租户&#x27;,\n      rules: &#x27;1. 授权过期状态时，操作列增加&quot;重新授权&quot;按钮\\n2. 关联租户数可点击，弹窗展示关联的租户列表\\n3. 每页20条，底部分页\\n4. 表格支持横向滚动（列较多时）\\n\\n【授权状态流转说明】\\n• 待授权：新建账户后，尚未完成平台API授权\\n• 已授权：完成授权操作，凭证有效\\n• 授权过期：平台侧凭证到期，需重新授权\\n• 流转路径：新建→待授权→完成授权→已授权→凭证到期→授权过期→重新授权→已授权&#x27;,\n      exceptions: &#x27;1. 列表为空时显示空状态插图+提示文案\\n2. 授权状态为&quot;授权过期&quot;时，行末增加红色警告提示\\n3. 网络加载失败时显示重试按钮&#x27;,\n      data: &#x27;字段格式要求：\\n- 账户ID：ACC开头+数字编号\\n- 平台类型标签：淘宝=#F97316橙色, 1688=#3B82F6蓝色, 微店=#10B941绿色\\n- 授权状态标签：已授权=#059669绿色, 待授权=#F97316橙色, 授权过期=#EF4444红色\\n- 启用状态标签：有效=#059669绿色, 无效=#6B7280灰色\\n- 创建时间：yyyy-MM-dd HH:mm格式&#x27;\n    }\n  },\n  {\n    id: 4,\n    title: &#x27;新增采购账户按钮&#x27;,\n    summary: &#x27;筛选栏右侧&quot;新增采购账户&quot;按钮，点击弹出新增表单弹窗。&#x27;,\n    target: &#x27;#anno-4&#x27;,\n    detail: {\n      feature: &#x27;点击&quot;新增采购账户&quot;按钮，弹出新增采购账户表单弹窗（见新增编辑采购账户弹窗页面），用于配置新的采购账户信息。保存后新账户出现在列表中。&#x27;,\n      rules: &#x27;1. 按钮位于筛选栏右侧，使用主蓝色样式\\n2. 点击后弹出新增弹窗（弹窗宽度约600px）\\n3. 弹窗内表单填写完成后点击保存，新账户出现在列表末尾\\n4. 保存成功后弹出提示&quot;新增成功&quot;&#x27;,\n      exceptions: &#x27;1. 必填项未填写时，点击保存后红色提示具体缺失字段\\n2. 授权账号与已有账户重复时提示&quot;该授权账号已存在&quot;&#x27;,\n      data: &#x27;弹窗表单字段：平台类型、账户名称、授权账号、应用名称（条件必填）、appKey、appSecret、启用状态&#x27;\n    }\n  },\n];\nfunction loadCustomAnnotations() { try { const s = localStorage.getItem(STORAGE_KEY); if (s) customAnnotations = JSON.parse(s); } catch(e) {} }\nfunction getActiveAnnotations() { return customAnnotations || annotations; }\nfunction renderAnnotationList() { const list = document.getElementById(&#x27;annotation-list&#x27;); const data = getActiveAnnotations(); list.innerHTML = data.map(item =&gt; `&lt;div class=&quot;annotation-item&quot; data-id=&quot;${item.id}&quot; onclick=&quot;handleAnnotationClick(${item.id})&quot; onmouseenter=&quot;highlightMarker(${item.id})&quot; onmouseleave=&quot;unhighlightMarker(${item.id})&quot;&gt;&lt;div class=&quot;annotation-header&quot;&gt;&lt;div class=&quot;annotation-badge&quot;&gt;${item.id}&lt;/div&gt;&lt;div class=&quot;annotation-title&quot;&gt;${item.title}&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;annotation-summary&quot;&gt;${item.summary}&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;); }\nfunction highlightMarker(id) { const m = document.querySelector(`.anno-marker[data-id=&quot;${id}&quot;]`); if (m) m.classList.add(&#x27;highlight&#x27;); const i = document.querySelector(`.annotation-item[data-id=&quot;${id}&quot;]`); if (i) i.classList.add(&#x27;active&#x27;); }\nfunction unhighlightMarker(id) { const m = document.querySelector(`.anno-marker[data-id=&quot;${id}&quot;]`); if (m) m.classList.remove(&#x27;highlight&#x27;); const i = document.querySelector(`.annotation-item[data-id=&quot;${id}&quot;]`); if (i) i.classList.remove(&#x27;active&#x27;); }\ndocument.querySelectorAll(&#x27;.anno-marker&#x27;).forEach(marker =&gt; { marker.addEventListener(&#x27;mouseenter&#x27;, () =&gt; highlightMarker(parseInt(marker.dataset.id))); marker.addEventListener(&#x27;mouseleave&#x27;, () =&gt; unhighlightMarker(parseInt(marker.dataset.id))); marker.addEventListener(&#x27;click&#x27;, () =&gt; showDetail(parseInt(marker.dataset.id))); });\nfunction handleAnnotationClick(id) { scrollToAnnotation(id); setTimeout(() =&gt; showDetail(id), 300); }\nfunction scrollToAnnotation(id) { const data = getActiveAnnotations(); const item = data.find(a =&gt; a.id === id); if (!item) return; const target = document.querySelector(item.target); const pa = document.querySelector(&#x27;.preview-area&#x27;); if (target &amp;&amp; pa) { pa.scrollTo({ top: target.offsetTop - 20, behavior: &#x27;smooth&#x27; }); target.classList.remove(&#x27;anno-flash&#x27;); void target.offsetWidth; target.classList.add(&#x27;anno-flash&#x27;); setTimeout(() =&gt; target.classList.remove(&#x27;anno-flash&#x27;), 1500); } }\nfunction showDetail(id) { const item = getActiveAnnotations().find(a =&gt; a.id === id); if (!item) return; currentAnnotation = item; isEditing = false; document.getElementById(&#x27;modal-title&#x27;).textContent = `${item.id}. $ 7;; }\nfunction saveAnnotation() { const tas = document.querySelectorAll(&#x27;#detail-table textarea&#x27;); if (!customAnnotations) customAnnotations = JSON.parse(JSON.stringify(annotations)); const item = customAnnotations.find(a =&gt; a.id === currentAnnotation.id); if (!item) return; tas.forEach(ta =&gt; { item.detail[ta.dataset.key] = ta.value; }); localStorage.setItem(STORAGE_KEY, JSON.stringify(customAnnotations)); currentAnnotation = item; isEditing = false; renderDetailTable(item); document.getElementById(&#x27;edit-btn&#x27;).style.display = &#x27;inline-flex&#x27;; document.getElementById(&#x27;save-btn&#x27;).style.display = &#x27;none&#x27;; document.getElementById(&#x27;reset-btn&#x27;).style.display = &#x27;inline-flex&#x27;; renderAnnotationList(); }\nfunction resetAnnotation() { if (!confirm(&#x27;确定要重置？&#x27;)) return; localStorage.removeItem(STORAGE_KEY); customAnnotations = null; const o = annotations.find(a =&gt; a.id === currentAnnotation.id); currentAnnotation = o; isEditing = false; renderDetailTable(o); document.getElementById(&#x27;edit-btn&#x27;).style.display = &#x27;inline-flex&#x27;; document.getElementById(&#x27;save-btn&#x27;).style.display = &#x27;none&#x27;; document.getElementById(&#x27;reset-btn&#x27;).style.display = &#x27;none&#x27;; document.getElementById(&#x27;delete-btn&#x27;).style.display = &#x27;none&#x27;; renderAnnotationList(); }\nfunction closeModal() { document.getElementById(&#x27;detail-modal&#x27;).classList.remove(&#x27;show&#x27;); }\ndocument.getElementById(&#x27;detail-modal&#x27;).addEventListener(&#x27;click&#x27;, function(e) { if (e.target === this) closeModal(); });\ndocument.addEventListener(&#x27;keydown&#x27;, function(e) { if (e.key === &#x27;Escape&#x27;) closeModal(); });\nconst PANEL_STATE_KEY = STORAGE_KEY + &#x27;-panel&#x27;;\nfunction initPanelState() { try { const c = localStorage.getItem(PANEL_STATE_KEY) === &#x27;1&#x27;; if (c) { document.getElementById(&#x27;annotation-panel&#x27;).classL
