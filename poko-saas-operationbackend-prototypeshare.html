al-title&quot;&gt;标注详情&lt;/div&gt;\n            &lt;button class=&quot;modal-close&quot; onclick=&quot;closeModal()&quot;&gt;×&lt;/button&gt;\n        &lt;/div&gt;\n        &lt;div class=&quot;modal-body&quot;&gt;&lt;table class=&quot;detail-table&quot; id=&quot;detail-table&quot;&gt;&lt;/table&gt;&lt;/div&gt;\n        &lt;div class=&quot;modal-footer&quot;&gt;\n            &lt;button class=&quot;btn btn-default btn-danger&quot; id=&quot;delete-btn&quot; style=&quot;display:none; margin-right:auto;&quot; onclick=&quot;deleteAnnotation()&quot;&gt;删除标注&lt;/button&gt;\n            &lt;button class=&quot;btn btn-default&quot; id=&quot;reset-btn&quot; style=&quot;display:none;&quot; onclick=&quot;resetAnnotation()&quot;&gt;重置&lt;/button&gt;\n            &lt;button class=&quot;btn btn-default&quot; id=&quot;export-btn&quot; onclick=&quot;exportAnnotatedHTML()&quot;&gt;导出HTML&lt;/button&gt;\n            &lt;button class=&quot;btn btn-default&quot; id=&quot;edit-btn&quot; onclick=&quot;toggleEdit()&quot;&gt;编辑&lt;/button&gt;\n            &lt;button class=&quot;btn btn-primary&quot; id=&quot;save-btn&quot; style=&quot;display:none;&quot; onclick=&quot;saveAnnotation()&quot;&gt;保存&lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;/div&gt;\n\n&lt;script&gt;\n// ===== 标注数据 =====\nconst STORAGE_KEY = \'annotated-prototype-supplier-v2.2.4\';\nlet currentAnnotation = null; let isEditing = false; let customAnnotations = null;\n\nconst annotations = [\n    {\n        id: 1,\n        title: \'页面总览\',\n        summary: \'供应商管理列表页面，集中管理所有供应商及其关联仓库、渠道产品信息，为平台线路配置提供资源支撑。\',\n        target: \'#anno-1\',\n        detail: {\n            feature: \'供应商管理列表页面，集中管理所有供应商及其关联仓库和渠道产品信息。为平台线路配置提供供应商和仓库资源，支撑仓库维度的线路可用性判断。新增供应商类型字段用于区分供应商类别。\',\n            rules: \'1. 页面默认按创建时间倒序排列\\n2. 每页显示20条数据\\n3. 列表展示供应商基本信息（含供应商类型）和关联仓库数量\\n4. 支持快速搜索、供应商类型筛选和状态筛选\',\n            exceptions: \'1. 无供应商数据时展示空状态提示\\n2. 网络异常时提示&quot;加载失败，请重试&quot;\\n3. 删除有关联线路的供应商时提示&quot;该供应商已关联线路，无法删除&quot;\',\n            data: \'供应商列表数据，包含供应商ID、名称、供应商类型、联系人、联系电话、关联仓库数、状态、创建时间\',\n            permission: \'查看供应商列表需要具备&quot;供应商管理-查看&quot;权限\'\n        }\n    },\n    {\n        id: 2,\n        title: \'搜索筛选与操作栏\',\n        summary: \'搜索框支持按名称搜索，新增供应商类型筛选下拉（默认全部类型），状态标签页筛选，右侧新增按钮。\',\n        target: \'#anno-2\',\n        detail: {\n            feature: \'提供供应商的搜索和筛选能力：\\n1. 搜索框：支持按供应商名称模糊搜索\\n2. 供应商类型筛选：下拉选择，默认&quot;全部类型&quot;，第一期仅支持&quot;物流供应商&quot;选项\\n3. 状态筛选：全部/正常/停用三个标签页切换\\n4. 新增供应商按钮：点击打开新增供应商弹窗\',\n            rules: \'1. 搜索支持实时模糊匹配，输入后防抖300ms触发\\n2. 搜索、类型筛选和状态筛选可组合使用\\n3. 切换状态标签时重置搜索条件\\n4. 供应商类型筛选为第一期功能，后续可扩展更多类型\\n5. 新增供应商按钮需&quot;供应商管理-新增&quot;权限\',\n            exceptions: \'1. 搜索无结果时列表显示空状态\\n2. 搜索框最大输入100字符\\n3. 筛选组合无结果时列表显示空状态\',\n            data: \'筛选条件：供应商名称关键词、供应商类型、供应商状态\',\n            permission: \'查看权限可见列表，新增权限可见新增按钮\'\n        }\n    },\n    {\n        id: 3,\n        title: \'供应商列表\',\n        summary: \'表格展示供应商信息，新增供应商类型列，包含ID、名称、类型、联系人、电话、关联仓库数、状态、操作列。\',\n        target: \'#anno-3\',\n        detail: {\n            rules: \'1. 默认按创建时间倒序排列\\n2. 每页20条，支持分页\\n3. 关联仓库数展示该供应商关联的仓库数量\\n4. 状态用彩色标签区分：正常（绿色）、停用（灰色）\\n5. 供应商类型用蓝色标签展示\\n6. 停用状态的供应商不可用于线路配置\\n7. 删除操作需二次确认\',\n            exceptions: \'1. 删除有关联线路的供应商时拦截，提示&quot;该供应商下存在关联线路，请先解除关联&quot;\\n2. 停用时若供应商有进行中的业务，提示确认\\n3. 列表加载失败时显示重试按钮\',\n            data: \'模拟数据：\\n- 深圳优品供应链（SUP001），物流供应商，张三，3个仓库，正常\\n- 广州环球物流（SUP002），物流供应商，李四，2个仓库，正常\\n- 义乌集货通（SUP003），物流供应商，王五，5个仓库，停用\\n- 东莞恒达仓储（SUP004），物流供应商，赵六，1个仓库，正常\',\n            permission: \'编辑需&quot;供应商管理-编辑&quot;权限\\n删除需&quot;供应商管理-删除&quot;权限\\n启用/停用需&quot;供应商管理-状态管理&quot;权限\'\n        }\n    },\n    {\n        id: 4,\n        title: \'新增/编辑供应商弹窗\',\n        summary: \'弹窗表单包含供应商基本信息（含供应商类型下拉）、渠道产品维护表格、关联仓库配置三个区域。\',\n        target: \'#anno-4\',\n        detail: {\n            feature: \'弹窗表单用于新增或编辑供应商，包含三个区域：\\n\\n【基本信息】\\n- 供应商名称（必填，最多100字）\\n- 供应商类型（必填，下拉选择，第一期仅&quot;物流供应商&quot;，默认选中）\\n- 联系人（必填）\\n- 联系电话（必填）\\n- 邮箱（选填）\\n- 地址（选填）\\n- 备注（选填）\\n\\n【渠道产品维护】（详见标注5）\\n\\n【关联仓库配置】（详见标注6）\\n\\n弹窗宽度780px，可容纳渠道产品表格。\',\n            rules: \'1. 必填字段未填写时提交按钮置灰，表单项下方显示红色提示\\n2. 供应商名称最多100字，超出截断\\n3. 供应商类型为必填，第一期仅&quot;物流供应商&quot;选项\\n4. 联系电话格式校验（手机号/座机号）\\n5. 邮箱格式校验\\n6. 编辑时回填已有数据（含渠道产品数据）\\n7. 新增和编辑共用同一个弹窗，标题区分\',\n            exceptions: \'1. 供应商名称重复时提示&quot;该供应商名称已存在&quot;\\n2. 联系电话格式不正确时提示&quot;请输入正确的联系电话&quot;\\n3. 邮箱格式不正确时提示&quot;请输入正确的邮箱地址&quot;\\n4. 保存失败时提示&quot;保存失败，请重试&quot;\',\n            data: \'供应商基本信息：名称、供应商类型、联系人、电话、邮箱、地址、备注\',\n            permission: \'新增需&quot;供应商管理-新增&quot;权限\\n编辑需&quot;供应商管理-编辑&quot;权限\'\n        }\n    },\n    {\n        id: 5,\n        title: \'渠道产品维护区（v2.2.7新增字段）\',\n        summary: \'弹窗中基本信息下方，以表格形式管理渠道产品，字段含物流渠道、货物类型、目的国、运输方式、渠道产品名称、编码、操作，支持添加/编辑/删除。\',\n        target: \'#anno-5\',\n        detail: {\n            feature: \'弹窗内渠道产品维护区域，用于配置该供应商可用的物流渠道产品（下单线路）：\\n\\n1. 表格字段：\\n   - 物流渠道：下拉选择（DHL、FedEx、UPS、顺丰国际等）\\n   - **货物类型（v2.2.7新增）**：单选下拉（普货/特货/特A/特B/特C/食品专线），特货表示支持特A/特B/特C\\n   - **目的国（v2.2.7新增）**：单选下拉，选择该渠道可达的目的国家\\n   - **运输方式（v2.2.7新增）**：单选下拉（空运/海运/铁路/陆运）\\n   - 渠道产品名称：文本输入（如&quot;DHL美国专线&quot;、&quot;FedEx欧洲经济&quot;）\\n   - 渠道产品编码：文本输入或系统自动生成（如&quot;CH-DHL-US-001&quot;）\\n   - 操作：编辑/删除\\n\\n2. 表格下方有&quot;+ 添加渠道产品&quot;按钮\\n3. 说明文字：渠道产品是给供应商下单时指定的下单线路\\n4. 编辑模式下展示已有渠道产品数据\\n\\n【联动逻辑】\\n平台线路新增/编辑时，选中对应渠道产品后，自动带出该渠道的货物类型、目的国、运输方式，这三个字段只读不可修改。\',\n            rules: \'1. 渠道产品至少包含物流渠道、货物类型、目的国、运输方式和渠道产品名称\\n2. 货物类型枚举：普货/特货/特A/特B/特C/食品专线\\n3. 特货 = 支持特A/特B/特C，选特货时平台线路会带出所有特货类型\\n4. 渠道产品编码支持手动输入或系统自动生成\\n5. 添加按钮点击后在表格末尾新增一行空数据\\n6. 删除操作需二次确认\\n7. 编辑模式下回填已有渠道产品数据\\n8. 物流渠道下拉选项可扩展，第一期支持DHL、FedEx、UPS、顺丰国际\',\n            exceptions: \'1. 物流渠道未选择时提示&quot;请选择物流渠道&quot;\\n2. 货物类型未选择时提示&quot;请选择货物类型&quot;\\n3. 目的国未选择时提示&quot;请选择目的国&quot;\\n4. 运输方式未选择时提示&quot;请选择运输方式&quot;\\n5. 渠道产品名称为空时提示&quot;请输入渠道产品名称&quot;\\n6. 渠道产品编码重复时提示&quot;该编码已存在，请修改&quot;\',\n            data: \'模拟数据（深圳优品供应链）：\\n- DHL / 普货 / 美国 / 空运 / DHL美国专线 / CH-DHL-US-001\\n- FedEx / 特A / 英国 / 空运 / FedEx标准专线 / CH-FEDEX-STD-001\\n- UPS / 食品专线 / 日本 / 海运 / UPS亚欧快线 / CH-UPS-ASIAEU-001\',\n            permission: \'渠道产品维护随供应商编辑权限，无需单独权限控制\'\n        }\n    },\n    {\n        id: 6,\n        title: \'关联仓库配置区（数据来源：仓库管理模块）\',\n        summary: \'弹窗下半部分，以卡片形式多选仓库，数据从仓库管理列表同步，不可在此页面新增，至少保留1个关联仓库。\',\n        target: \'#anno-6\',\n        detail: {\n            feature: \'弹窗内下半部分的关联仓库配置区域：\\n1. 仓库数据从仓库管理模块同步获取，不可在此页面新增仓库\\n2. 以卡片形式展示所有可用仓库（checkbox多选形式）\\n3. 每张仓库卡片展示以下字段（表单样式，左侧标签灰色，右侧为只读展示值）：\\n   - 收件人（文本样式，如&quot;达哥&quot;）\\n   - 收件手机号（文本样式，如&quot;19023567890&quot;）\\n   - 国家（下拉框只读样式，如&quot;中国&quot;）\\n   - 省/市/区（三个并排下拉框只读样式，中间用&quot;/&quot;分隔，如&quot;广东省 / 广州市 / 荔湾区&quot;）\\n   - 详细地址（textarea只读样式，右下角显示字数限制如 6/500）\\n4. 卡片顶部有checkbox和仓库名称作为标题\\n5. 卡片采用两列排版，白底圆角边框，已选中时高亮（蓝色边框+浅蓝背景）\\n6. 编辑供应商时可增删仓库关联\',\n            rules: \'1. 至少保留1个关联仓库，否则无法保存\\n2. 仓库数据从仓库管理列表实时同步，确保数据一致性\\n3. checkbox选中时卡片高亮（蓝色边框+浅蓝背景）\\n4. 卡片采用两列网格布局，响应式排列\\n5. 所有字段均为只读disabled样式，不可在此页面编辑仓库信息\\n6. 详细地址字数限制500字，右下角显示当前字数/500\',\n            exceptions: \'1. 仓库管理模块无可用仓库时提示&quot;暂无可用仓库，请先在仓库管理中创建&quot;\\n2. 取消所有仓库选择时提示&quot;至少需要关联1个仓库&quot;\\n3. 仓库数据同步失败时提示&quot;仓库数据加载失败，请重试&quot;\',\n            data: \'仓库卡片展示字段：收件人、收件手机号、国家、省/市/区、详细地址\\n数据来源于仓库管理模块的仓库列表接口\\n\\n模拟数据：\\n- 广州荔湾仓：收件人&quot;达哥&quot;，手机号&quot;19023567890&quot;，中国/广东省/广州市/荔湾区，中央大街1号\\n- 深圳南山仓：收件人&quot;李明&quot;，手机号&quot;13800001111&quot;，中国/广东省/深圳市/南山区，科技园路88号\\n- 义乌集货仓：收件人&quot;张伟&quot;，手机号&quot;13900002222&quot;，中国/浙江省/义乌市/稠州街道，国际商贸城A区\',\n        }\n    }\n,\n    {\n        id: 7,\n        title: \'供应商状态说明\',\n        summary: \'供应商有两种状态：正常/停用。状态通过筛选栏切换和列表标签展示，停用供应商不可用于线路配置。\',\n        target: \'#anno-7\',\n        detail: {\n            feature: \'供应商状态字段说明：\\n\\n【状态枚举值】\\n- 正常（绿色标签 tag-normal）：供应商可正常使用\\n- 停用（灰色标签 tag-disabled）：供应商已暂停使用\\n\\n【状态变更逻辑】\\n- 新建供应商默认为&quot;正常&quot;状态\\n- 列表操作列提供&quot;启用/停用&quot;按钮，点击切换状态\\n- 停用操作需二次确认弹窗\\n- 启用操作即时生效，无需审批\\n\\n【状态的业务影响】\\n- 正常状态：可被线路配置选用、可编辑、可新增渠道产品\\n- 停用状态：不可被线路配置选用（级联选择器中不可见）、已有线路不受影响但不可新增\\n- 停用状态下仍可编辑供应商基本信息\\n- 筛选栏可按状态筛选（全部/正常/停用）\',\n            rules: \'1. 状态标签颜色：正常=#10B941（绿色），停用=#9CA3AF（灰色）\\n2. 切换状态操作需要&quot;供应商管理-状态管理&quot;权限\\n3. 状态变更记录操作日志\\n4. 停用前检查是否有进行中的业务，有则需确认\',\n            exceptions: \'1. 停用有关联活跃线路的供应商时，提示&quot;该供应商下有N条关联线路，停用后新线路将无法使用此供应商&quot;\\n2. 网络异常时操作失败，提示&quot;操作失败，请重试&quot;\',\n            data: \'供应商状态字段：枚举值 active/disabled\',\n            permission: \'启用/停用操作需&quot;供应商管理-状态管理&quot;权限\'\n        }\n    }];\n\n// ===== 标注系统JS =====\nfunction loadCustomAnnotations() { try { const s = localStorage.getItem(STORAGE_KEY); if (s) customAnnotations = JSON.parse(s); } catch(e) {} }\nfunction getActiveAnnotations() { return customAnnotations || annotations; }\nfunction renderAnnotationList() { const list = document.getElementById(\'annotation-list\'); const data = getActiveAnnotations(); list.innerHTML = data.map(item =&gt; `&lt;div class=&quot;annotation-item&quot; data-id=&quot;${item.id}&quot; onclick=&quot;handleAnnotationClick(${item.id})&quot; onmouseenter=&quot;highlightMarker(${item.id})&quot; onmouseleave=&quot;unhighlightMarker(${item.id})&quot;&gt;&lt;div class=&quot;annotation-header&quot;&gt;&lt;div class=&quot;annotation-badge&quot;&gt;${item.id}&lt;/div&gt;&lt;div class=&quot;annotation-title&quot;&gt;${item.title}&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;annotation-summary&quot;&gt;${item.summary}&lt;/div&gt;&lt;/div&gt;`).join(\'\'); }\nfunction highlightMarker(id) { const m = document.querySelector(`.anno-marker[data-id=&quot;${id}&quot;]`); if (m) m.classList.add(\'highlight\'); const i = document.querySelector(`.annotation-item[data-id=&quot;${id}&quot;]`); if (i) i.classList.add(\'active\'); }\nfunction unhighlightMarker(id) { const m = document.querySelector(`.anno-marker[data-id=&quot;${id}&quot;]`); if (m) m.classList.remove(\'highlight\'); const i = document.querySelector(`.annotation-item[data-id=&quot;${id}&quot;]`); if (i) i.classList.remove(\'active\'); }\ndocument.querySelectorAll(\'.anno-marker\').forEach(marker =&gt; { marker.addEventListener(\'mouseenter\', () =&gt; highlightMarker(parseInt(marker.dataset.id))); marker.addEventListener(\'mouseleave\', () =&gt; unhighlightMarker(parseInt(marker.dataset.id))); marker.addEventListener(\'click\', () =&gt; showDetail(parseInt(marker.dataset.id))); });\nfunction handleAnnotationClick(id) { scrollToAnnotation(id); setTimeout(() =&gt; showDetail(id), 300); }\nfunction scrollToAnnotation(id) { const data = getActiveAnnotations(); const item = data.find(a =&gt; a.id === id); if (!item) return; const target = document.querySelector(item.target); const pa = document.querySelector(\'.preview-area\'); if (target &amp;&amp; pa) { pa.scrollTo({ top: target.offsetTop - 20, behavior: \'smooth\' }); target.classList.remove(\'anno-flash\'); void target.offsetWidth; target.classList.add(\'anno-flash\'); setTimeout(() =&gt; target.classList.remove(\'anno-flash\'), 1500); } }\nfunction showDetail(id) { const item = getActiveAnnotations().find(a =&gt; a.id === id); if (!item) return; currentAnnotation = item; isEditing = false; document.getElementById(\'modal-title\').textContent = `${item.id}. ${item.title}`; renderDetailTable(item); document.getElementById(\'edit-btn\').style.display = \'inline-flex\'; document.getElementById(\'save-btn\').style.display = \'none\'; document.getElementById(\'reset-btn\').style.display = customAnnotations ? \'inline-flex\' : \'none\'; document.getElementById(\'delete-btn\').style.display = (id !== 1) ? \'inline-flex\' : \'none\'; document.getElementById(\'detail-modal\').classList.add(\'show\'); }\nfunction renderDetailTable(item) { const d = item.detail; const rows = []; if (d.feature) rows.push({label:\'功能说明\',value:d.feature}); if (d.rules) rows.push({label:\'规则约束\',value:d.rules}); if (d.exceptions) rows.push({label:\'异常处理\',value:d.exceptions}); if (d.data) rows.push({label:\'数据要求\',value:d.data}); if (d.permission) rows.push({label:\'权限要求\',value:d.permission}); const t = document.getElementById(\'detail-table\'); if (isEditing) { t.innerHTML = rows.map(r =&gt; `&lt;tr&gt;&lt;th&gt;${r.label}&lt;/th&gt;&lt;td&gt;&lt;textarea data-key=&quot;${getKeyFromLabel(r.label)}&quot;&gt;${r.value}&lt;/textarea&gt;&lt;/td&gt;&lt;/tr&gt;`).join(\'\'); } else { t.innerHTML = rows.map(r =&gt; `&lt;tr&gt;&lt;th&gt;${r.label}&lt;/th&gt;&lt;td&gt;${r.value.replace(/\\n/g,\'&lt;br&gt;\')}&lt;/td&gt;&lt;/tr&gt;`).join(\'\'); } }\nfunction getKeyFromLabel(l) { return {\'功能说明\':\'feature\',\'规则约束\':\'rules\',\'异常处理\':\'exceptions\',\'数据要求\':\'data\',\'权限要求\':\'permission\'}[l]||l; }\nfunction toggleEdit() { isEditing = !isEditing; renderDetailTable(currentAnnotation); document.getElementById(\'edit-btn\').style.display = isEditing ? \'none\' : \'inline-flex\'; document.getElementById(\'save-btn\').style.display = isEditing ? \'inline-flex\' : \'none\'; }\nfunction saveAnnotation() { const tas = document.querySelectorAll(\'#detail-table textarea\'); if (!customAnnotations) customAnnotations = JSON.parse(JSON.stringify(annotations)); const item = customAnnotations.find(a =&gt; a.id === currentAnnotation.id); if (!item) return; tas.forEach(ta =&gt; { item.detail[ta.dataset.key] = ta.value; }); localStorage.setItem(STORAGE_KEY, JSON.stringify(customAnnotations)); currentAnnotation = item; isEditing = false; renderDetailTable(item); document.getElementById(\'edit-btn\').style.display = \'inline-flex\'; document.getElementById(\'save-btn\').style.display = \'none\'; document.getElementById(\'reset-btn\').style.display = \'inline-flex\'; renderAnnotationList(); }\nfunction resetAnnotation() { if (!confirm(\'确定要重置？\')) return; localStorage.removeItem(STORAGE_KEY); customAnnotations = null; const o = annotations.find(a =&gt; a.id === currentAnnotation.id); currentAnnotation = o; isEditing = false; renderDetailTable(o); document.getElementById(\'edit-btn\').style.display = \'inline-flex\'; document.getElementById(\'save-btn\').style.display = \'none\'; document.getElementById(\'reset-btn\').style.display = \'none\'; document.getElementById(\'delete-btn\').style.display = \'none\'; renderAnnotationList(); }\nfunction closeModal() { document.getElementById(\'detail-modal\').classList.remove(\'show\'); }\ndocument.getElementById(\'detail-modal\').addEventListener(\'click\', function(e) { if (e.target === this) closeModal(); });\ndocument.addEventListener(\'keydown\', function(e) { if (e.key === \'Escape\') { closeModal(); closeSupplierModal(); } });\nconst PANEL_STATE_KEY = STORAGE_KEY + \'-panel\';\nfunction initPanelState() { try { const c = localStorage.getItem(PANEL_STATE_KEY) === \'1\'; if (c) { document.getElementById(\'annotation-panel\').classList.add(\'collapsed\'); document.getElementById(\'panel-expand-btn\').classList.add(\'show\'); } } catch(e) {} }\nfunction togglePanel() { const p = document.getElementById(\'annotation-panel\'); const b = document.getElementById(\'panel-expand-btn\'); const ic = p.classList.toggle(\'collapsed\'); b.classList.toggle(\'show\', ic); try { localStorage.setItem(PANEL_STATE_KEY, ic ? \'1\' : \'0\'); } catch(e) {} }\nfunction addAnnotation() { if (!customAnnotations) customAnnotations = JSON.parse(JSON.stringify(annotations)); const n = customAnnotations.length + 1; const ni = {id:n, title:\'新标注\'+n, summary:\'点击编辑修改...\', target:\'#anno-\'+n, detail:{feature:\'请填写功能说明...\',rules:\'请填写规则约束...\',exceptions:\'请填写异常处理...\'}}; customAnnotations.push(ni); localStorage.setItem(STORAGE_KEY, JSON.stringify(customAnnotations)); renderAnnotationList(); currentAnnotation = ni; isEditing = true; document.getElementById(\'modal-title\').textContent = `${ni.id}. ${ni.title}`; renderDetailTable(ni); document.getElementById(\'edit-btn\').style.display = \'none\'; document.getElementById(\'save-btn\').style.display = \'inline-flex\'; document.getElementById(\'reset-btn\').style.display = \'none\'; document.getElementById(\'delete-btn\').style.display = \'inline-flex\'; document.getElementById(\'detail-modal\').classList.add(\'show\'); }\nfunction deleteAnnotation() { if (!currentAnnotation || currentAnnotation.id === 1) return; if (!confirm(`确定删除「${currentAnnotation.title}」？`)) return; customAnnotations = customAnnotations.filter(a =&gt; a.id !== currentAnnotation.id); customAnnotations.forEach((it,i) =&gt; { it.id = i+1; }); localStorage.setItem(STORAGE_KEY, JSON.stringify(customAnnotations)); closeModal(); renderAnnotationList(); }\nfunction exportAnnotatedHTML() { const ad = getActiveAnnotations(); const oh = document.documentElement.outerHTML; const ds = JSON.stringify(ad, null, 2); const rp = \'const annotations = \' + ds + \';\'; const nh = oh.replace(/const annotations = \\[[\\s\\S]*?\\n\\];/, rp); const b = new Blob([nh], {type:\'text/html;charset=utf-8\'}); const u = URL.createObjectURL(b); const a = document.createElement(\'a\'); a.href = u; const t = document.title || \'带标注原型\'; const d = new Date().toISOString().slice(0,10).replace(/-/g,\'\'); a.download = `${t}_${d}.html`; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(u); }\n\n// ===== 产品交互JS =====\nfunction openSupplierModal(mode) {\n    const title = mode === \'edit\' ? \'编辑供应商\' : \'新增供应商\';\n    document.querySelector(\'#supplier-modal .modal-title\').textContent = title;\n    document.getElementById(\'supplier-modal\').classList.add(\'show\');\n    renderWarehouseCards();\n    // 渲染渠道产品（编辑模式加载已有数据，新增模式为空）\n    if (mode === \'edit\') {\n        renderChannelProducts(channelProductData[\'edit\']);\n    } else {\n        renderChannelProducts(channelProductData[\'new\']);\n    }\n}\nfunction closeSupplierModal() { document.getElementById(\'supplier-modal\').classList.remove(\'show\'); }\nfunction deleteSupplier(name, hasRoutes) {\n    if (hasRoutes) {\n        alert(\'无法删除「\' + name + \'」\\n\\n该供应商已被物流线路引用，请先解除关联后再删除。\\n\\n提示：进入「平台线路」页面，找到引用该供应商的线路并移除后，即可删除。\');\n    } else {\n        if (confirm(\'确定要删除供应商「\' + name + \'」吗？\\n\\n删除后不可恢复。\')) {\n            alert(\'供应商「\' + name + \'」已删除\');\n        }\n    }\n}\n\n\n// 状态筛选tab切换\ndocument.querySelectorAll(\'.status-tab\').forEach(tab =&gt; {\n    tab.addEventListener(\'click\', function() {\n        document.querySelectorAll(\'.status-tab\').forEach(t =&gt; t.classList.remove(\'active\'));\n        this.classList.add(\'active\');\n    });\n});\n\n// ===== 仓库数据（模拟从仓库管理模块获取） =====\nconst warehouseDataFromManagement = [\n    { id: \'WH-GZ-LW-001\', name: \'广州荔湾仓\', receiver: \'达哥\', receiverPhone: \'19023567890\', country: \'中国\', province: \'广东省\', city: \'广州市\', district: \'荔湾区\', address: \'中央大街1号\', selected: true },\n    { id: \'WH-SZ-NS-002\', name: \'深圳南山仓\', receiver: \'李明\', receiverPhone: \'13800001111\', country: \'中国\', province: \'广东省\', city: \'深圳市\', district: \'南山区\', address: \'科技园路88号\', selected: true },\n    { id: \'WH-JH-YW-003\', name: \'义乌集货仓\', receiver: \'张伟\', receiverPhone: \'13900002222\', country: \'中国\', province: \'浙江省\', city: \'义乌市\', district: \'稠州街道\', address: \'国际商贸城A区\', selected: false }\n];\n\n\n// ===== 渠道产品数据 =====\nconst channelProductOptions = [\'DHL\', \'FedEx\', \'UPS\', \'顺丰国际\', \'EMS国际\', \'中通国际\'];\nconst cargoTypeOptions = [\'普货\', \'特货\', \'特A\', \'特B\', \'特C\', \'食品专线\'];\nconst countryOptions = [\'美国\', \'英国\', \'德国\', \'法国\', \'日本\', \'韩国\', \'澳大利亚\', \'加拿大\', \'新加坡\', \'马来西亚\'];\nconst transportOptions = [\'空运\', \'海运\', \'铁路\', \'陆运\'];\n\n// 模拟渠道产品数据（按供应商ID）\nconst channelProductData = {\n    \'edit\': [\n        { channel: \'DHL\', cargoType: \'普货\', country: \'美国\', transport: \'空运\', name: \'DHL美国专线\', code: \'CH-DHL-US-001\' },\n        { channel: \'FedEx\', cargoType: \'特A\', country: \'英国\', transport: \'空运\', name: \'FedEx标准专线\', code: \'CH-FEDEX-STD-001\' },\n        { channel: \'UPS\', cargoType: \'食品专线\', country: \'日本\', transport: \'海运\', name: \'UPS亚欧快线\', code: \'CH-UPS-ASIAEU-001\' }\n    ],\n    \'new\': []\n};\n\nlet currentChannelProducts = [];\n\nfunction renderChannelProducts(products) {\n    currentChannelProducts = products || [];\n    const tbody = document.getElementById(\'cp-table-body\');\n    if (!tbody) return;\n    if (currentChannelProducts.length === 0) {\n        tbody.innerHTML = \'&lt;tr&gt;&lt;td colspan=&quot;7&quot; style=&quot;text-align:center;color:#86909C;padding:20px 0;&quot;&gt;暂无渠道产品，请点击下方按钮添加&lt;/td&gt;&lt;/tr&gt;\';\n        return;\n    }\n    tbody.innerHTML = currentChannelProducts.map(function(item, index) {\n        // 物流渠道下拉\n        const channelOptionsHtml = channelProductOptions.map(function(opt) {\n            const selected = opt === item.channel ? \' selected\' : \'\';\n            return \'&lt;option value=&quot;\' + opt + \'&quot;\' + selected + \'&gt;\' + opt + \'&lt;/option&gt;\';\n        }).join(\'\');\n        // 货物类型下拉\n        const cargoTypeOptionsHtml = cargoTypeOptions.map(function(opt) {\n            const selected = opt === item.cargoType ? \' selected\' : \'\';\n            return \'&lt;option value=&quot;\' + opt + \'&quot;\' + selected + \'&gt;\' + opt + \'&lt;/option&gt;\';\n        }).join(\'\');\n        // 目的国下拉\n        const countryOptionsHtml = countryOptions.map(function(opt) {\n            const selected = opt === item.country ? \' selected\' : \'\';\n            return \'&lt;option value=&quot;\' + opt + \'&quot;\' + selected + \'&gt;\' + opt + \'&lt;/option&gt;\';\n        }).join(\'\');\n        // 运输方式下拉\n        const transportOptionsHtml = transportOptions.map(function(opt) {\n            const selected = opt === item.transport ? \' selected\' : \'\';\n            return \'&lt;option value=&quot;\' + opt + \'&quot;\' + selected + \'&gt;\' + opt + \'&lt;/option&gt;\';\n        }).join(\'\');\n        \n        return \'&lt;tr&gt;\' +\n            \'&lt;td&gt;&lt;select class=&quot;cp-select&quot; onchange=&quot;updateChannelProduct(\' + index + \', \\\'channel\\\', this.value)&quot;&gt;\' + channelOptionsHtml + \'&lt;/select&gt;&lt;/td&gt;\' +\n            \'&lt;td&gt;&lt;select class=&quot;cp-select&quot; onchange=&quot;updateChannelProduct(\' + index + \', \\\'cargoType\\\', this.value)&quot;&gt;\' + cargoTypeOptionsHtml + \'&lt;/select&gt;&lt;/td&gt;\' +\n            \'&lt;td&gt;&lt;select class=&quot;cp-select&quot; onchange=&quot;updateChannelProduct(\' + index + \', \\\'country\\\', this.value)&quot;&gt;\' + countryOptionsHtml + \'&lt;/select&gt;&lt;/td&gt;\' +\n            \'&lt;td&gt;&lt;select class=&quot;cp-select&quot; onchange=&quot;updateChannelProduct(\' + index + \', \\\'transport\\\', this.value)&quot;&gt;\' + transportOptionsHtml + \'&lt;/select&gt;&lt;/td&gt;\' +\n            \'&lt;td&gt;&lt;input class=&quot;cp-input&quot; type=&quot;text&quot; value=&quot;\' + item.name + \'&quot; placeholder=&quot;请输入渠道产品名称&quot; onchange=&quot;updateChannelProduct(\' + index + \', \\\'name\\\', this.value)&quot;&gt;&lt;/td&gt;\' +\n            \'&lt;td&gt;&lt;input class=&quot;cp-input&quot; type=&quot;text&quot; value=&quot;\' + item.code + \'&quot; placeholder=&quot;请输入或自动生成&quot; onchange=&quot;updateChannelProduct(\' + index + \', \\\'code\\\', this.value)&quot;&gt;&lt;/td&gt;\' +\n            \'&lt;td&gt;\' +\n                \'&lt;span class=&quot;cp-action-link&quot; onclick=&quot;editChannelProduct(\' + index + \')&quot;&gt;编辑&lt;/span&gt;\' +\n                \'&lt;span class=&quot;cp-action-link danger&quot; onclick=&quot;deleteChannelProduct(\' + index + \')&quot;&gt;删除&lt;/span&gt;\' +\n            \'&lt;/td&gt;\' +\n        \'&lt;/tr&gt;\';\n    }).join(\'\');\n}\n\nfunction updateChannelProduct(index, field, value) {\n    if (currentChannelProducts[index]) {\n        currentChannelProducts[index][field] = value;\n    }\n}\n\nfunction addChannelProduct() {\n    currentChannelProducts.push({ channel: \'DHL\', cargoType: \'普货\', country: \'美国\', transport: \'空运\', name: \'\', code: \'\' });\n    renderChannelProducts(currentChannelProducts);\n}\n\nfunction editChannelProduct(index) {\n    // 编辑模式：聚焦到对应行（模拟）\n    const rows = document.querySelectorAll(\'#cp-table-body tr\');\n    if (rows[index]) {\n        const input = rows[index].querySelector(\'.cp-input\');\n        if (input) { input.focus(); input.style.borderColor = \'#165DFF\'; }\n    }\n}\n\nfunction deleteChannelProduct(index) {\n    if (!confirm(\'确定删除该渠道产品？\')) return;\n    currentChannelProducts.splice(index, 1);\n    renderChannelProducts(currentChannelProducts);\n}\n\n// 渲染仓库卡片\nfunction renderWarehouseCards() {\n    const container = document.getElementById(\'warehouse-cards-container\');\n    if (!container) return;\n    container.innerHTML = warehouseDataFromManagement.map(function(wh, index) {\n        const checkedClass = wh.selected ? \' checked\' : \'\';\n        const checkedAttr = wh.selected ? \' checked\' : \'\';\n        const addrLen = (wh.address || \'\').length;\n        return \'&lt;div class=&quot;warehouse-card\' + checkedClass + \'&quot; data-index=&quot;\' + index + \'&quot;&gt;\' +\n            \'&lt;div class=&quot;warehouse-card-header&quot;&gt;\' +\n                \'&lt;input type=&quot;checkbox&quot;\' + checkedAttr + \' onchange=&quot;toggleWarehouseCard(this, \' + index + \')&quot;&gt;\' +\n                \'&lt;span class=&quot;warehouse-card-title&quot;&gt;\' + wh.name + \'&lt;/span&gt;\' +\n            \'&lt;/div&gt;\' +\n            \'&lt;div class=&quot;warehouse-card-fields&quot;&gt;\' +\n                \'&lt;div class=&quot;warehouse-field&quot;&gt;\' +\n                    \'&lt;span class=&quot;warehouse-field-label&quot;&gt;收件人&lt;/span&gt;\' +\n                    \'&lt;span class=&quot;warehouse-field-value&quot;&gt;&lt;span class=&quot;wh-input-readonly&quot;&gt;\' + wh.receiver + \'&lt;/span&gt;&lt;/span&gt;\' +\n                \'&lt;/div&gt;\' +\n                \'&lt;div class=&quot;warehouse-field&quot;&gt;\' +\n                    \'&lt;span class=&quot;warehouse-field-label&quot;&gt;收件手机号&lt;/span&gt;\' +\n                    \'&lt;span class=&quot;warehouse-field-value&quot;&gt;&lt;span class=&quot;wh-input-readonly&quot;&gt;\' + wh.receiverPhone + \'&lt;/span&gt;&lt;/span&gt;\' +\n                \'&lt;/div&gt;\' +\n                \'&lt;div class=&quot;warehouse-field&quot;&gt;\' +\n                    \'&lt;span class=&quot;warehouse-field-label&quot;&gt;国家&lt;/span&gt;\' +\n                    \'&lt;span class=&quot;warehouse-field-value&quot;&gt;&lt;span class=&quot;wh-select-readonly&quot;&gt;\' + wh.country + \'&lt;/span&gt;&lt;/span&gt;\' +\n                \'&lt;/div&gt;\' +\n                \'&lt;div class=&quot;warehouse-field&quot;&gt;\' +\n                    \'&lt;span class=&quot;warehouse-field-label&quot;&gt;省/市/区&lt;/span&gt;\' +\n                    \'&lt;span class=&quot;warehouse-field-value&quot;&gt;\' +\n                        \'&lt;span class=&quot;wh-region-group&quot;&gt;\' +\n                            \'&lt;span class=&quot;wh-select-readonly&quot;&gt;\' + wh.province + \'&lt;/span&gt;\' +\n                            \'&lt;span class=&quot;wh-region-sep&quot;&gt;/&lt;/span&gt;\' +\n                            \'&lt;span class=&quot;wh-select-readonly&quot;&gt;\' + wh.city + \'&lt;/span&gt;\' +\n                            \'&lt;span class=&quot;wh-region-sep&quot;&gt;/&lt;/span&gt;\' +\n                            \'&lt;span class=&quot;wh-select-readonly&quot;&gt;\' + wh.district + \'&lt;/span&gt;\' +\n                        \'&lt;/span&gt;\' +\n                    \'&lt;/span&gt;\' +\n                \'&lt;/div&gt;\' +\n                \'&lt;div class=&quot;warehouse-field full-width&quot;&gt;\' +\n                    \'&lt;span class=&quot;warehouse-field-label&quot;&gt;详细地址&lt;/span&gt;\' +\n                    \'&lt;span class=&quot;warehouse-field-value&quot;&gt;\' +\n                        \'&lt;div class=&quot;wh-textarea-wrap&quot;&gt;\' +\n                            \'&lt;div class=&quot;wh-textarea-readonly&quot;&gt;\' + wh.address + \'&lt;/div&gt;\' +\n                            \'&lt;span class=&quot;wh-textarea-count&quot;&gt;\' + addrLen + \'/500&lt;/span&gt;\' +\n                        \'&lt;/div&gt;\' +\n                    \'&lt;/span&gt;\' +\n                \'&lt;/div&gt;\' +\n            \'&lt;/div&gt;\' +\n        \'&lt;/div&gt;\';\n    }).join(\'\');\n}\n\n// 仓库卡片checkbox切换\nfunction toggleWarehouseCard(checkbox, index) {\n    warehouseDataFromManagement[index].selected = checkbox.checked;\n    const card = checkbox.closest(\'.warehouse-card\');\n    card.classList.toggle(\'checked\', checkbox.checked);\n}\n\n// 初始化渲染仓库卡片\nrenderWarehouseCards();\n\n// 弹窗点击遮罩关闭\ndocument.getElementById(\'supplier-modal\').addEventListener(\'click\', function(e) { if (e.target === this) closeSupplierModal(); });\n\nloadCustomAnnotations(); renderAnnotationList(); initPanelState();\n&lt;/script&gt;\n&lt;/body&gt;\n&lt;/html&gt;',
    '平台线路新增/编辑': '&lt;!DOCTYPE html&gt;\n&lt;html lang=&quot;zh-CN&quot;&gt;\n&lt;head&gt;\n&lt;meta charset=&quot;UTF-8&quot;&gt;\n&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;&gt;\n&lt;title&gt;平台线路新增编辑_v2.2.7&lt;/title&gt;\n&lt;style&gt;\n/* ====== 标注系统CSS ====== */\n* { margin: 0; padding: 0; box-sizing: border-box; }\nbody { font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, &quot;Helvetica Neue&quot;, sans-serif; color: #333; background: #F5F7FA; }\n.app-container { display: flex; min-height: 100vh; }\n.preview-area { flex: 1; min-width: 0; overflow-y: auto; padding: 24px; position: relative; }\n.annotation-panel { width: 300px; background: #F7F8FA; border-left: 1px solid #E4E7ED; overflow-y: auto; flex-shrink: 0; transition: width 0.3s ease; }\n.annotation-panel.collapsed { width: 0; border-left: none; overflow: hidden; }\n.panel-header { padding: 16px; font-size: 15px; font-weight: 600; color: #333; border-bottom: 1px solid #E4E7ED; background: #F7F8FA; position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 8px; }\n.panel-toggle-btn { width: 24px; height: 24px; border: none; background: #E8EAED; border-radius: 4px; cursor: pointer; font-size: 12px; color: #666; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }\n.panel-toggle-btn:hover { background: #DCDFE6; color: #333; }\n.panel-add-btn { width: 24px; height: 24px; border: none; background: #165DFF; color: #fff; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; margin-left: auto; flex-shrink: 0; }\n.panel-add-btn:hover { background: #0E42D2; }\n.panel-expand-btn { position: fixed; top: 50%; right: 0; transform: translateY(-50%); width: 36px; height: 48px; background: #165DFF; color: #fff; border: none; border-radius: 8px 0 0 8px; cursor: pointer; font-size: 18px; z-index: 999; display: none; box-shad ;&gt;\n                            &lt;label class=&quot;form-label&quot;&gt;线路描述&lt;/label&gt;\n                            &lt;textarea class=&quot;textarea-field&quot; placeholder=&quot;选填，简要描述线路特点和服务范围&quot;&gt;美国专线，覆盖美国全境（含阿拉斯加、夏威夷），支持普货和电子产品寄送，时效稳定。末端由USPS/UPS派送。&lt;/textarea&gt;\n                        &lt;/div&gt;\n                    &lt;/div&gt;\n                    &lt;div class=&quot;form-row full&quot; style=&quot;margin-top: 10px;&quot;&gt;\n                        &lt;div class=&quot;form-group&quot;&gt;\n                            &lt;label class=&quot;form-label&quot;&gt;备注&lt;/label&gt;\n                            &lt;textarea class=&quot;textarea-field&quot; placeholder=&quot;选填，内部备注信息（不对外展示）&quot; style=&quot;min-height: 40px;&quot;&gt;&lt;/textarea&gt;\n                        &lt;/div&gt;\n                    &lt;/div&gt;\n                &lt;/div&gt;\n\n            &lt;/div&gt;\n\n            &lt;!-- 页面底部按钮 --&gt;\n            &lt;div class=&quot;page-footer&quot;&gt;\n                &lt;button class=&quot;btn-cancel&quot;&gt;取消&lt;/button&gt;\n                &lt;button class=&quot;btn-save&quot;&gt;保存&lt;/button&gt;\n            &lt;/div&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n\n    &lt;div class=&quot;annotation-panel&quot; id=&quot;annotation-panel&quot;&gt;\n        &lt;div class=&quot;panel-header&quot;&gt;\n            &lt;button class=&quot;panel-toggle-btn&quot; onclick=&quot;togglePanel()&quot; title=&quot;收起面板&quot;&gt;◀&lt;/button&gt;\n            &lt;span&gt;📌 标注说明&lt;/span&gt;\n            &lt;button class=&quot;panel-add-btn&quot; onclick=&quot;addAnnotation()&quot; title=&quot;新增标注&quot;&gt;+&lt;/button&gt;\n        &lt;/div&gt;\n        &lt;div id=&quot;annotation-list&quot;&gt;&lt;/div&gt;\n    &lt;/div&gt;\n    &lt;button class=&quot;panel-expand-btn&quot; id=&quot;panel-expand-btn&quot; onclick=&quot;togglePanel()&quot; title=&quot;展开标注面板&quot;&gt;📌&lt;/button&gt;\n&lt;/div&gt;\n\n&lt;!-- 标注详情弹窗 --&gt;\n&lt;div class=&quot;modal-overlay&quot; id=&quot;detail-modal&quot;&gt;\n    &lt;div class=&quot;modal&quot;&gt;\n        &lt;div class=&quot;modal-header&quot;&gt;\n            &lt;div class=&quot;modal-title&quot; id=&quot;modal-title&quot;&gt;标注详情&lt;/div&gt;\n            &lt;button class=&quot;modal-close&quot; onclick=&quot;closeModal()&quot;&gt;×&lt;/button&gt;\n        &lt;/div&gt;\n        &lt;div class=&quot;modal-body&quot;&gt;&lt;table class=&quot;detail-table&quot; id=&quot;detail-table&quot;&gt;&lt;/table&gt;&lt;/div&gt;\n        &lt;div class=&quot;modal-footer&quot;&gt;\n            &lt;button class=&quot;btn btn-default btn-danger&quot; id=&quot;delete-btn&quot; style=&quot;display:none; margin-right:auto;&quot; onclick=&quot;deleteAnnotation()&quot;&gt;删除标注&lt;/button&gt;\n            &lt;button class=&quot;btn btn-default&quot; id=&quot;reset-btn&quot; style=&quot;display:none;&quot; onclick=&quot;resetAnnotation()&quot;&gt;重置&lt;/button&gt;\n            &lt;button class=&quot;btn btn-default&quot; id=&quot;export-btn&quot; onclick=&quot;exportAnnotatedHTML()&quot;&gt;导出HTML&lt;/button&gt;\n            &lt;button class=&quot;btn btn-default&quot; id=&quot;edit-btn&quot; onclick=&quot;toggleEdit()&quot;&gt;编辑&lt;/button&gt;\n            &lt;button class=&quot;btn btn-primary&quot; id=&quot;save-btn&quot; style=&quot;display:none;&quot; onclick=&quot;saveAnnotation()&quot;&gt;保存&lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;/div&gt;\n\n&lt;script&gt;\nconst STORAGE_KEY = \'annotated-prototype-platform-route-edit\';\nlet currentAnnotation = null; let isEditing = false; let customAnnotations = null;\nconst annotations = [\n    {\n        id: 1,\n        title: \'页面总览\',\n        summary: \'平台线路新增/编辑页面，平铺展示基本信息、价格配置、保价包税、货物类型四大模块，所有内容无需滚动即可浏览。\',\n        target: \'#anno-1\',\n        detail: {\n            feature: \'平台线路新增/编辑页面，采用标准后台管理页面布局。\\n\\n页面包含面包屑导航、页面标题、四大内容区块（基本信息、价格配置、保价包税、货物类型与禁寄品类），以及底部操作按钮。\\n\\n所有内容区块以卡片形式平铺排列，无滚动遮挡，确保用户一目了然。\\n\\n页面最大内容宽度约900px，居中展示。\',\n            rules: \'1. 新增时标题为&quot;新增平台线路&quot;，编辑时为&quot;编辑平台线路（线路名称）&quot;\\n2. 面包屑路径：首页 / 物流管理 / 平台线路 / 新增（或编辑）\\n3. 保存前需校验所有必填项\\n4. 所属仓库决定该线路在用户端的可用性——仓库停用则线路不可用\\n5. 底部固定&quot;取消&quot;和&quot;保存&quot;按钮\',\n            exceptions: \'1. 关联线路被删除时，页面顶部提示&quot;关联线路已失效&quot;并引导返回列表\\n2. 供应商/仓库状态异常时，保存前进行二次确认\\n3. 网络异常保存失败时提示重试\',\n            data: \'线路编码格式：LN-{YYYYMMDD}-{4位序号}\\n保存成功后刷新列表页并高亮新增/编辑行\',\n            permission: \'操作权限：物流配置-线路管理-新增/编辑\\n所属供应商和仓库受租户权限范围限制\'\n        }\n    },\n    {\n        id: 2,\n        title: \'基本信息模块\',\n        summary: \'线路名称（从关联线路带出可修改）、线路编码（系统生成不可改）、四级级联选择（物流供应商→物流渠道→渠道产品→仓库）、渠道产品联动区域（货物类型映射、目的国、运输方式自动带出）、时效。\',\n        target: \'#anno-2\',\n        detail: {\n            feature: \'基本信息模块包含以下字段：\\n\\n• 线路名称：必填，从关联物流商线路自动带出，支持手动修改\\n• 线路编码：系统自动生成，只读展示\\n• 物流供应商：必填，四级级联选择的第一级，下拉选择供应商后联动展示该供应商下的物流渠道\\n• 物流渠道：必填，四级级联选择的第二级，选择供应商后联动出现\\n• 渠道产品：必填，四级级联选择的第三级，选择物流渠道后联动出现，展示格式为&quot;渠道产品名称（编码）&quot;\\n• 仓库：必填，四级级联选择的第四级，选择渠道产品后联动出现\\n\\n【渠道产品联动区域】选择渠道产品后自动展示：\\n• 货物类型映射：\\n  - 供应商货物类型：只读标签（橙色），从渠道产品带出（普货/特货/特A/特B/特C/食品专线）\\n  - 平台货物类型：多选checkbox，根据供应商货物类型默认映射勾选，可手动编辑修改\\n  - 映射关系代码写死：普货→普货；特A→带电产品+品牌/仿牌；特B→液体/膏体+粉末；特C→数码设备+医药保健；特货→全部特货类；食品专线→食品\\n• 目的国：只读标签（蓝色），从渠道产品带出\\n• 运输方式：只读输入框，从渠道产品带出\\n\\n• 时效：手动填写，格式为&quot;X-Y个工作日&quot;\\n\\n级联关系：物流供应商→物流渠道→渠道产品→仓库，每级选择后自动过滤下级选项。\',\n            rules: \'1. 线路名称不可与已有线路重复（保存时校验）\\n2. 四个级联字段均为必填，未选择上级时下级下拉框置灰不可操作\\n3. 切换上级选择时，自动清空并重置所有下级选项，同时隐藏渠道产品联动区域\\n4. 选择渠道产品后，联动区域自动展示货物类型映射、目的国、运输方式\\n5. 供应商货物类型只读，不可修改\\n6. 平台货物类型根据映射关系默认勾选，用户可手动增减\\n7. 目的国和运输方式只读，数据来源为渠道产品\\n8. 时效为必填，格式校验：正整数-正整数\\n9. 编辑模式下四个级联字段均有预选值，联动区域自动展示对应数据\',\n            exceptions: \'1. 某级联下无可选数据时，下级下拉框显示&quot;暂无可选数据&quot;提示\\n2. 线路名称重复时标红提示\\n3. 级联数据源异常（如供应商被停用）时，页面顶部提示&quot;关联数据已失效&quot;\\n4. 渠道产品未配置货物类型/目的国/运输方式时，联动区域提示&quot;该渠道产品信息不完整，请先到供应商管理中完善&quot;\',\n            data: \'物流供应商数据：关联供应商管理模块，仅展示状态为&quot;合作中&quot;的供应商\\n物流渠道数据：根据供应商过滤\\n渠道产品数据：根据物流渠道过滤，展示格式为&quot;产品名称（产品编码）&quot;\\n仓库数据：根据渠道产品过滤，仅展示可用且状态为&quot;正常&quot;的仓库\\n货物类型映射关系：代码写死，不通过后台配置\',\n            permission: \'物流供应商/渠道/产品/仓库的选择受当前操作人员的租户权限范围限制\'\n        }\n    },\n    {\n        id: 3,\n        title: \'价格配置模块\',\n        summary: \'计费方式（实重/实重与抛重取大，选后者显示抛比必填项）、首重重量+首重价格、最小可寄重量、单件限重、续重分段价格表格（起始重量自动联动只读）。\',\n        target: \'#anno-3\',\n        detail: {\n            feature: \'价格配置模块支持灵活的运费计算规则：\\n• 计费方式：实重 / 实重与抛重取大（两个选项），选择&quot;实重与抛重取大&quot;时展示抛比输入框（必填）\\n• 首重配置：首重重量(kg) + 首重价格(元)\\n• 最小可寄重量：低于此重量的包裹不接受\\n• 单件限重：单件包裹的最大重量限制\\n• 续重分段价格：多段阶梯式，起始重量自动联动（第一段=首重重量，后续=上段结束重量），用户只需填写结束重量和单价；最后一段为无限续重（+∞）不可删除；支持动态添加分段\',\n            rules: \'1. 选择&quot;实重与抛重取大&quot;时抛比字段为必填\\n2. 续重起始重量自动等于上段结束重量（第一段等于首重重量），不可手动修改\\n3. 最后一段为无限续重（+∞），不可删除\\n4. 续重单价必须 &gt; 0\\n5. 首重价格必须 &gt; 0\\n6. 最小可寄重量必须 &gt; 0 且 ≤ 首重重量\\n7. 单件限重必须 ≥ 首重重量\\n8. 最少保留1段续重\\n9. 重量区间规则：≤首重按首重价格；&gt;首重且≤续重段结束重量按续重计费\',\n            exceptions: \'1. 续重段区间不连续时保存报错并标红对应行\\n2. 首段起始重量与首重不一致时提示修正\\n3. 重复区间校验失败时提示&quot;续重段区间重叠&quot;\\n4. 删除无限续重段时提示&quot;最后一段不可删除&quot;\',\n            data: \'金额精度：保留2位小数\\n重量精度：保留3位小数\\n续重段数无上限，但建议不超过10段\\n单件限重范围：1~100kg\',\n            permission: \'价格配置修改需物流配置权限；价格变更立即生效，影响后续订单计费\'\n        }\n    },\n    {\n        id: 4,\n        title: \'保价与包税配置\',\n        summary: \'保价服务（checkbox勾选，保价费率/最低保价费/最高赔付上限）；包税服务（checkbox勾选，包税计费方式/包税费率）。两个服务各自独立灰色背景卡片区块。\',\n        target: \'#anno-4\',\n        detail: {\n            feature: \'保价与包税配置采用两个独立的灰色背景卡片区块：\\n\\n保价服务区块：\\n• 支持保价服务勾选框（默认勾选，加粗标题）\\n• 保价费率（%）：输入保价费率百分比\\n• 最低保价费（元）：保价收费的最低金额\\n• 最高赔付上限（元）：保价赔偿的最大金额，使用number类型输入框带数字增减按钮\\n\\n包税服务区块：\\n• 支持包税服务勾选框（默认勾选，加粗标题）\\n• 包税计费方式：下拉选择，当前选项为&quot;按重量（元/kg）&quot;，蓝色边框高亮\\n• 包税费率：输入框，填写具体费率\\n\\n两个区块均以浅灰色背景卡片呈现，视觉层次清晰。\',\n            rules: \'1. 保价费率必须 &gt; 0\\n2. 最低保价费必须 ≥ 0\\n3. 最高赔付上限必须 &gt; 最低保价费\\n4. 包税费率必须 &gt; 0\\n5. 取消勾选保价服务时，保价相关字段不提交\\n6. 取消勾选包税服务时，包税相关字段不提交\\n7. 包税计费方式下拉选项由系统配置决定\',\n            exceptions: \'1. 保价费率超过合理范围时提示&quot;费率异常，请确认&quot;\\n2. 最高赔付上限低于最低保价费时提示&quot;赔付上限不能低于最低保价费&quot;\\n3. 取消勾选后如已有订单使用该服务，提示&quot;已有订单使用该服务，请确认是否关闭&quot;\',\n            data: \'保价费率精度：保留2位小数\\n最低保价费精度：保留2位小数\\n最高赔付上限：整数，范围100~1000000元\\n包税费率精度：保留4位小数\',\n            permission: \'保价/包税配置修改需审批后方可生效（首次配置）\'\n        }\n    },\n    {\n        id: 5,\n        title: \'禁寄品类与线路信息\',\n        summary: \'禁寄品类（多选标签）、线路描述（选填）、备注（选填）。货物类型已移至基本信息模块的联动区域。\',\n        target: \'#anno-5\',\n        detail: {\n            feature: \'禁寄品类与线路信息配置：\\n\\n• 支持货物类型：已移至上方「基本信息」模块的渠道产品联动区域，由渠道产品的供应商货物类型自动映射为平台货物类型，用户可编辑\\n• 禁寄品类：多选标签形式，包括易燃易爆品、管制刀具、仿牌商品、活体动物、毒品/违禁药品等\\n• 线路描述：选填，文本域，简要描述线路特点和服务范围\\n• 备注：选填，文本域，内部备注信息不对外展示\',\n            rules: \'1. 禁寄品类为可选配置\\n2. 线路描述最大长度500字符\\n3. 备注最大长度1000字符\\n4. 禁寄品类会在用户端展示，提醒用户注意\\n5. 货物类型由渠道产品联动决定，不在本区域配置\',\n            exceptions: \'1. 禁寄品类与支持的货物类型有逻辑冲突时提示\\n2. 渠道产品未配置货物类型时，联动区域提示完善信息\',\n            data: \'禁寄品类选项来源于系统字典表\\n线路描述和备注支持换行\\n货物类型映射关系代码写死\',\n            permission: \'禁寄品类的变更会影响用户端展示，需确保准确性\\n备注信息仅内部可见，用户端不展示\'\n        }\n    }\n];\nfunction loadCustomAnnotations() { try { const s = localStorage.getItem(STORAGE_KEY); if (s) customAnnotations = JSON.parse(s); } catch(e) {} }\nfunction getActiveAnnotations() { return customAnnotations || annotations; }\nfunction renderAnnotationList() { const list = document.getElementById(\'annotation-list\'); const data = getActiveAnnotations(); list.innerHTML = data.map(item =&gt; `&lt;div class=&quot;annotation-item&quot; data-id=&quot;${item.id}&quot; onclick=&quot;handleAnnotationClick(${item.id})&quot; onmouseenter=&quot;highlightMarker(${item.id})&quot; onmouseleave=&quot;unhighlightMarker(${item.id})&quot;&gt;&lt;div class=&quot;annotation-header&quot;&gt;&lt;div class=&quot;annotation-badge&quot;&gt;${item.id}&lt;/div&gt;&lt;div class=&quot;annotation-title&quot;&gt;${item.title}&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;annotation-summary&quot;&gt;${item.summary}&lt;/div&gt;&lt;/div&gt;`).join(\'\'); }\nfunction highlightMarker(id) { const m = document.querySelector(`.anno-marker[data-id=&quot;${id}&quot;]`); if (m) m.classList.add(\'highlight\'); const i = document.querySelector(`.annotation-item[data-id=&quot;${id}&quot;]`); if (i) i.classList.add(\'active\'); }\nfunction unhighlightMarker(id) { const m = document.querySelector(`.anno-marker[data-id=&quot;${id}&quot;]`); if (m) m.classList.remove(\'highlight\'); const i = document.querySelector(`.annotation-item[data-id=&quot;${id}&quot;]`); if (i) i.classList.remove(\'active\'); }\ndocument.querySelectorAll(\'.anno-marker\').forEach(marker =&gt; { marker.addEventListener(\'mouseenter\', () =&gt; highlightMarker(parseInt(marker.dataset.id))); marker.addEventListener(\'mouseleave\', () =&gt; unhighlightMarker(parseInt(marker.dataset.id))); marker.addEventListener(\'click\', () =&gt; showDetail(parseInt(marker.dataset.id))); });\nfunction handleAnnotationClick(id) { scrollToAnnotation(id); setTimeout(() =&gt; showDetail(id), 300); }\nfunction scrollToAnnotation(id) { const data = getActiveAnnotations(); const item = data.find(a =&gt; a.id === id); if (!item) return; const target = document.querySelector(item.target); const pa = document.querySelector(\'.preview-area\'); if (target &amp;&amp; pa) { pa.scrollTo({ top: target.offsetTop - 20, behavior: \'smooth\' }); target.classList.remove(\'anno-flash\'); void target.offsetWidth; target.classList.add(\'anno-flash\'); setTimeout(() =&gt; target.classList.remove(\'anno-flash\'), 1500); } }\nfunction showDetail(id) { const item = getActiveAnnotations().find(a =&gt; a.id === id); if (!item) return; currentAnnotation = item; isEditing = false; document.getElementById(\'modal-title\').textContent = `${item.id}. ${item.title}`; renderDetailTable(item); document.getElementById(\'edit-btn\').style.display = \'inline-flex\'; document.getElementById(\'save-btn\').style.display = \'none\'; document.getElementById(\'reset-btn\').style.display = customAnnotations ? \'inline-flex\' : \'none\'; document.getElementById(\'delete-btn\').style.display = (id !== 1) ? \'inline-flex\' : \'none\'; document.getElementById(\'detail-modal\').classList.add(\'show\'); }\nfunction renderDetailTable(item) { const d = item.detail; const rows = []; if (d.feature) rows.push({label:\'功能说明\',value:d.feature}); if (d.rules) rows.push({label:\'规则约束\',value:d.rules}); if (d.exceptions) rows.push({label:\'异常处理\',value:d.exceptions}); if (d.data) rows.push({label:\'数据要求\',value:d.data}); if (d.permission) rows.push({label:\'权限要求\',value:d.permission}); const t = document.getElementById(\'detail-table\'); if (isEditing) { t.innerHTML = rows.map(r =&gt; `&lt;tr&gt;&lt;th&gt;${r.label}&lt;/th&gt;&lt;td&gt;&lt;textarea data-key=&quot;${getKeyFromLabel(r.label)}&quot;&gt;${r.value}&lt;/textarea&gt;&lt;/td&gt;&lt;/tr&gt;`).join(\'\'); } else { t.innerHTML = rows.map(r =&gt; `&lt;tr&gt;&lt;th&gt;${r.label}&lt;/th&gt;&lt;td&gt;${r.value.replace(/\\n/g,\'&lt;br&gt;\')}&lt;/td&gt;&lt;/tr&gt;`).join(\'\'); } }\nfunction getKeyFromLabel(l) { return {\'功能说明\':\'feature\',\'规则约束\':\'rules\',\'异常处理\':\'exceptions\',\'数据要求\':\'data\',\'权限要求\':\'permission\'}[l]||l; }\nfunction toggleEdit() { isEditing = !isEditing; renderDetailTable(currentAnnotation); document.getElementById(\'edit-btn\').style.display = isEditing ? \'none\' : \'inline-flex\'; document.getElementById(\'save-btn\').style.display = isEditing ? \'inline-flex\' : \'none\'; }\nfunction saveAnnotation() { const tas = document.querySelectorAll(\'#detail-table textarea\'); if (!customAnnotations) customAnnotations = JSON.parse(JSON.stringify(annotations)); const item = customAnnotations.find(a =&gt; a.id === currentAnnotation.id); if (!item) return; tas.forEach(ta =&gt; { item.detail[ta.dataset.key] = ta.value; }); localStorage.setItem(STORAGE_KEY, JSON.stringify(customAnnotations)); currentAnnotation = item; isEditing = false; renderDetailTable(item); document.getElementById(\'edit-btn\').style.display = \'inline-flex\'; document.getElementById(\'save-btn\').style.display = \'none\'; document.getElementById(\'reset-btn\').style.display = \'inline-flex\'; document.getElementById(\'delete-btn\').style.display = (currentAnnotation.id !== 1) ? \'inline-flex\' : \'none\'; renderAnnotationList(); }\nfunction resetAnnotation() { if (!confirm(\'确定要重置？\')) return; localStorage.removeItem(STORAGE_KEY); customAnnotations = null; const o = annotations.find(a =&gt; a.id === currentAnnotation.id); currentAnnotation = o; isEditing = false; renderDetailTable(o); document.getElementById(\'edit-btn\').style.display = \'inline-flex\'; document.getElementById(\'save-btn\').style.display = \'none\'; document.getElementById(\'reset-btn\').style.display = \'none\'; document.getElementById(\'delete-btn\').style.display = \'none\'; renderAnnotationList(); }\nfunction closeModal() { document.getElementById(\'detail-modal\').classList.remove(\'show\'); }\ndocument.getElementById(\'detail-modal\').addEventListener(\'click\', function(e) { if (e.target === this) closeModal(); });\ndocument.addEventListener(\'keydown\', function(e) { if (e.key === \'Escape\') closeModal(); });\nconst PANEL_STATE_KEY = STORAGE_KEY + \'-panel\';\nfunction initPanelState() { try { const c = localStorage.getItem(PANEL_STATE_KEY) === \'1\'; if (c) { document.getElementById(\'annotation-panel\').classList.add(\'collapsed\'); document.getElementById(\'panel-expand-btn\').classList.add(\'show\'); } } catch(e) {} }\nfunction togglePanel() { const p = document.getElementById(\'annotation-panel\'); const b = document.getElementById(\'panel-expand-btn\'); const ic = p.classList.toggle(\'collapsed\'); b.classList.toggle(\'show\', ic); try { localStorage.setItem(PANEL_STATE_KEY, ic ? \'1\' : \'0\'); } catch(e) {} }\nfunction addAnnotation() { if (!customAnnotations) customAnnotations = JSON.parse(JSON.stringify(annotations)); const n = customAnnotations.length + 1; const ni = {id:n, title:\'新标注\'+n, summary:\'点击编辑修改...\', target:\'#anno-\'+n, detail:{feature:\'请填写功能说明...\',rules:\'请填写规则约束...\',exceptions:\'请填写异常处理...\'}}; customAnnotations.push(ni); localStorage.setItem(STORAGE_KEY, JSON.stringify(customAnnotations)); renderAnnotationList(); currentAnnotation = ni; isEditing = true; document.getElementById(\'modal-title\').textContent = `${ni.id}. ${ni.title}`; renderDetailTable(ni); document.getElementById(\'edit-btn\').style.display = \'none\'; document.getElementById(\'save-btn\').style.display = \'inline-flex\'; document.getElementById(\'reset-btn\').style.display = \'none\'; document.getElementById(\'delete-btn\').style.display = \'inline-flex\'; document.getElementById(\'detail-modal\').classList.add(\'show\'); }\nfunction deleteAnnotation() { if (!currentAnnotation || currentAnnotation.id === 1) return; if (!confirm(`确定删除「${currentAnnotation.title}」？`)) return; customAnnotations = customAnnotations.filter(a =&gt; a.id !== currentAnnotation.id); customAnnotations.forEach((it,i) =&gt; { it.id = i+1; }); localStorage.setItem(STORAGE_KEY, JSON.stringify(customAnnotations)); closeModal(); renderAnnotationList(); }\nfunction exportAnnotatedHTML() { const ad = getActiveAnnotations(); const oh = document.documentElement.outerHTML; const ds = JSON.stringify(ad, null, 2); const rp = \'const annotations = \' + ds + \';\'; const nh = oh.replace(/const annotations = \\[[\\s\\S]*?\\n\\];/, rp); const b = new Blob([nh], {type:\'text/html;charset=utf-8\'}); const u = URL.createObjectURL(b); const a = document.createElement(\'a\'); a.href = u; const t = document.title || \'带标注原型\'; const d = new Date().toISOString().slice(0,10).replace(/-/g,\'\'); a.download = `${t}_${d}.html`; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(u); }\n// ====== 计费方式切换：控制抛比字段显隐 ======\nfunction onBillingTypeChange() {\n    var billingType = document.getElementById(\'billingType\').value;\n    var throwRatioField = document.getElementById(\'throwRatioField\');\n    if (billingType === \'实重与抛重取大\') {\n        throwRatioField.style.display = \'\';\n    } else {\n        throwRatioField.style.display = \'none\';\n    }\n}\n\n// ====== 续重分段联动：起始重量=首重重量或上段结束重量 ======\nfunction syncContRows() {\n    var rows = document.querySelectorAll(\'.price-table tbody tr\');\n    if (rows.length === 0) return;\n    // 找首重重量输入框\n    var fwVal = \'1\';\n    var allLabels = document.querySelectorAll(\'.form-label\');\n    for (var i = 0; i &lt; allLabels.length; i++) {\n        if (allLabels[i].textContent.indexOf(\'首重重量\') !== -1) {\n            var inp = allLabels[i].closest(\'.form-group\').querySelector(\'.form-input\');\n            if (inp) fwVal = inp.value || \'1\';\n            break;\n        }\n    }\n    // 第一段起始重量 = 首重重量\n    var firstCells = rows[0].querySelectorAll(\'td\');\n    if (firstCells.length &gt;= 2) firstCells[1].textContent = fwVal;\n    // 后续每段起始重量 = 上段结束重量\n    for (var r = 1; r &lt; rows.length; r++) {\n        var cells = rows[r].querySelectorAll(\'td\');\n        var prevEndInput = rows[r - 1].querySelector(\'td:nth-child(3) input\');\n        if (prevEndInput &amp;&amp; cells.length &gt;= 2) {\n            cells[1].textContent = prevEndInput.value || \'-\';\n        }\n    }\n    // +∞ 行的起始重量 = 最后数据行的结束重量\n    var lastStartEl = document.getElementById(\'last-start-weight\');\n    if (lastStartEl &amp;&amp; rows.length &gt;= 2) {\n        var lastDataEnd = rows[rows.length - 2].querySelector(\'td:nth-child(3) input\');\n        if (lastDataEnd) lastStartEl.textContent = lastDataEnd.value || \'-\';\n    }\n}\n\n// 监听首重重量变化\nvar fwInput = null;\nvar allInputs = document.querySelectorAll(\'.form-row .form-input\');\nfor (var i = 0; i &lt; allInputs.length; i++) {\n    if (allInputs[i].closest(\'.form-group\') &amp;&amp; allInputs[i].closest(\'.form-group\').querySelector(\'.form-label\') &amp;&amp; allInputs[i].closest(\'.form-group\').querySelector(\'.form-label\').textContent.indexOf(\'首重重量\') !== -1) {\n        fwInput = allInputs[i];\n        break;\n    }\n}\nif (fwInput) {\n    fwInput.addEventListener(\'input\', syncContRows);\n    fwInput.addEventListener(\'change\', syncContRows);\n}\n\n// 监听续重结束重量变化，联动下一行起始重量\ndocument.querySelectorAll(\'.price-table tbody tr\').forEach(function(row, idx, allRows) {\n    var endInput = row.querySelector(\'td:nth-child(3) input\');\n    if (endInput) {\n        endInput.addEventListener(\'input\', function() {\n            if (idx + 1 &lt; allRows.length) {\n                var nextRow = allRows[idx + 1];\n                var nextStartCell = nextRow.querySelectorAll(\'td\')[1];\n                if (nextStartCell) nextStartCell.textContent = endInput.value || \'-\';\n            }\n        });\n    }\n});\n\n// 初始化联动\nsyncContRows();\n\n// ====== 四级级联选择数据与逻辑 ======\nconst cascadeData = {\n    \'深圳优品供应链\': {\n        \'DHL\': {\n            \'DHL美国专线(CH-DHL-US-001)\': { warehouses: [\'南山仓\', \'宝安仓\'], cargoType: \'普货\', country: \'美国\', transport: \'空运\' },\n            \'DHL欧洲专线(CH-DHL-EU-002)\': { warehouses: [\'南山仓\'], cargoType: \'普货\', country: \'英国\', transport: \'空运\' }\n        },\n        \'FedEx\': {\n            \'FedEx标准专线(CH-FEDEX-STD-001)\': { warehouses: [\'宝安仓\'], cargoType: \'特A\', country: \'日本\', transport: \'空运\' }\n        }\n    },\n    \'广州环球物流\': {\n        \'UPS\': {\n            \'UPS全球速递(CH-UPS-EX-001)\': { warehouses: [\'南山仓\', \'宝安仓\', \'龙岗仓\'], cargoType: \'特B\', country: \'美国\', transport: \'空运\' }\n        },\n        \'USPS\': {\n            \'USPS经济小包(CH-USPS-EC-001)\': { warehouses: [\'南山仓\'], cargoType: \'食品专线\', country: \'美国\', transport: \'海运\' }\n        }\n    },\n    \'义乌集货通\': {\n        \'云途物流\': {\n            \'云途经济小包(CH-YT-EC-001)\': { warehouses: [\'南山仓\', \'宝安仓\'], cargoType: \'特C\', country: \'澳大利亚\', transport: \'空运\' }\n        },\n        \'燕文物流\': {\n            \'燕文标准专线(CH-YW-STD-001)\': { warehouses: [\'南山仓\'], cargoType: \'普货\', country: \'加拿大\', transport: \'海运\' }\n        }\n    }\n};\n\n// 供应商货物类型 → 平台货物类型映射（代码写死）\nfunction getPlatformCargoTypes(supplierType) {\n    const mapping = {\n        \'普货\': [\'普货\'],\n        \'特A\': [\'带电产品\', \'品牌/仿牌\'],\n        \'特B\': [\'液体/膏体\', \'粉末\'],\n        \'特C\': [\'数码设备\', \'医药保健\'],\n        \'特货\': [\'带电产品\', \'品牌/仿牌\', \'液体/膏体\', \'粉末\', \'数码设备\', \'医药保健\'],\n        \'食品专线\': [\'食品\']\n    };\n    return mapping[supplierType] || [\'普货\'];\n}\n\nconst allPlatformCargoOptions = [\'普货\', \'带电产品\', \'品牌/仿牌\', \'液体/膏体\', \'粉末\', \'数码设备\', \'医药保健\', \'食品\'];\n\nfunction updateAutoFillFields(productFullName) {\n    const infoSection = document.getElementById(\'channelProductInfo\');\n    if (!productFullName) {\n        infoSection.style.display = \'none\';\n        return;\n    }\n    var meta = null;\n    var supplier = document.getElementById(\'cascade-supplier\').value;\n    var channel = document.getElementById(\'cascade-channel\').value;\n    if (supplier &amp;&amp; channel &amp;&amp; cascadeData[supplier] &amp;&amp; cascadeData[supplier][channel] &amp;&amp; cascadeData[supplier][channel][productFullName]) {\n        meta = cascadeData[supplier][channel][productFullName];\n    }\n    if (!meta) {\n        infoSection.style.display = \'none\';\n        return;\n    }\n    infoSection.style.display = \'\';\n    // 供应商货物类型（只读标签）\n    document.getElementById(\'supplierCargoTags\').innerHTML = \'&lt;span class=&quot;cargo-tag-readonly supplier&quot;&gt;\' + meta.cargoType + \'&lt;/span&gt;\';\n    // 平台货物类型（默认映射勾选，可编辑）\n    var mappedTypes = getPlatformCargoTypes(meta.cargoType);\n    document.getElementById(\'platformCargoChecks\').innerHTML = allPlatformCargoOptions.map(function(opt) {\n        var checked = mappedTypes.indexOf(opt) !== -1 ? \' checked\' : \'\';\n        return \'&lt;label class=&quot;cargo-checkbox-sm&quot;&gt;&lt;input type=&quot;checkbox&quot;\' + checked + \'&gt; \' + opt + \'&lt;/label&gt;\';\n    }).join(\'\');\n    // 目的国（只读标签）\n    document.getElementById(\'productCountries\').innerHTML = \'&lt;span class=&quot;country-tag-readonly&quot;&gt;\' + meta.country + \'&lt;/span&gt;\';\n    // 运输方式（只读输入框）\n    document.getElementById(\'productTransport\').value = meta.transport;\n}\n\nfunction resetSelect(el, placeholder) {\n    el.innerHTML = \'&lt;option value=&quot;&quot;&gt;\' + placeholder + \'&lt;/option&gt;\';\n    el.disabled = true;\n}\n\nfunction fillSelect(el, options, selectedValue) {\n    el.innerHTML = \'&lt;option value=&quot;&quot;&gt;请选择&lt;/option&gt;\';\n    options.forEach(function(opt) {\n        var o = document.createElement(\'option\');\n        o.value = opt;\n        o.textContent = opt;\n        if (opt === selectedValue) o.selected = true;\n        el.appendChild(o);\n    });\n    el.disabled = false;\n}\n\nfunction onSupplierChange() {\n    var supplier = document.getElementById(\'cascade-supplier\').value;\n    var channelEl = document.getElementById(\'cascade-channel\');\n    var productEl = document.getElementById(\'cascade-product\');\n    var warehouseEl = document.getElementById(\'cascade-warehouse\');\n    if (!supplier) {\n        resetSelect(channelEl, \'请先选择物流供应商\');\n        resetSelect(productEl, \'请先选择物流渠道\');\n        resetSelect(warehouseEl, \'请先选择渠道产品\');\n        updateAutoFillFields(null);\n        return;\n    }\n    var channels = Object.keys(cascadeData[supplier] || {});\n    fillSelect(channelEl, channels);\n    resetSelect(productEl, \'请先选择物流渠道\');\n    resetSelect(warehouseEl, \'请先选择渠道产品\');\n    updateAutoFillFields(null);\n}\n\nfunction onChannelChange() {\n    var supplier = document.getElementById(\'cascade-supplier\').value;\n    var channel = document.getElementById(\'cascade-channel\').value;\n    var productEl = document.getElementById(\'cascade-product\');\n    var warehouseEl = document.getElementById(\'cascade-warehouse\');\n    if (!channel) {\n        resetSelect(productEl, \'请先选择物流渠道\');\n        resetSelect(warehouseEl, \'请先选择渠道产品\');\n        updateAutoFillFields(null);\n        return;\n    }\n    var products = Object.keys(cascadeData[supplier][channel] || {});\n    fillSelect(productEl, products);\ ception: &#x27;&lt;ul&gt;&lt;li&gt;数据量过大时必须带筛选条件查询&lt;/li&gt;&lt;li&gt;无权限租户的流水不展示&lt;/li&gt;&lt;/ul&gt;&#x27;\n  },\n  2: {\n    title: &#x27;多维度筛选&#x27;,\n    desc: &#x27;支持按租户、时间范围、流水类型等多维度组合筛选，帮助运营快速定位特定流水记录，高效处理对账和问题排查。&#x27;,\n    rules: &#x27;&lt;ul&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;按租户筛选&lt;/span&gt;支持搜索选择租户，可单选或全部&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;按时间筛选&lt;/span&gt;支持快捷时间和自定义范围&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;按类型筛选&lt;/span&gt;10种流水类型可选&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;搜索&lt;/span&gt;按流水号、租户名、关联单号搜索&lt;/li&gt;&lt;li&gt;多个条件间为AND关系&lt;/li&gt;&lt;li&gt;支持一键重置&lt;/li&gt;&lt;/ul&gt;&#x27;,\n    exception: &#x27;&lt;ul&gt;&lt;li&gt;无筛选条件时默认展示近7天数据&lt;/li&gt;&lt;li&gt;时间范围超过3个月时提示缩小范围&lt;/li&gt;&lt;/ul&gt;&#x27;\n  },\n  3: {\n    title: &#x27;租户维度展示&#x27;,\n    desc: &#x27;每条流水记录都关联到具体租户，运营可通过流水直接查看对应租户信息，快速跳转到租户详情页进行进一步操作。&#x27;,\n    rules: &#x27;&lt;ul&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;租户信息&lt;/span&gt;展示租户名称和租户编号&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;快速跳转&lt;/span&gt;点击租户名称可跳转至租户详情页&lt;/li&gt;&lt;li&gt;可按租户汇总统计&lt;/li&gt;&lt;li&gt;租户已禁用时名称显示灰色&lt;/li&gt;&lt;li&gt;支持按租户名称/编号搜索&lt;/li&gt;&lt;/ul&gt;&#x27;,\n    exception: &#x27;&lt;ul&gt;&lt;li&gt;租户已删除时显示&quot;已删除&quot;标记，不可跳转&lt;/li&gt;&lt;li&gt;无权限的租户流水不可见&lt;/li&gt;&lt;/ul&gt;&#x27;\n  },\n  4: {\n    title: &#x27;流水类型标识&#x27;,\n    desc: &#x27;通过不同颜色的标签区分10种流水类型，收入类绿色、支出类红色，便于运营快速识别流水性质和资金流向。&#x27;,\n    rules: &#x27;&lt;ul&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;收入类（绿）&lt;/span&gt;充值加款、手动加款、物流退回、采购退款、集运单取消退回&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;支出类（红）&lt;/span&gt;手动扣款、采购扣费、物流预扣、物流补扣、订阅扣费&lt;/li&gt;&lt;li&gt;金额正数为收入，负数为支出&lt;/li&gt;&lt;li&gt;每类流水有独立的标签颜色和样式&lt;/li&gt;&lt;li&gt;hover显示类型说明&lt;/li&gt;&lt;/ul&gt;&#x27;,\n    exception: &#x27;&lt;ul&gt;&lt;li&gt;未知类型流水显示&quot;其他&quot;并标灰&lt;/li&gt;&lt;li&gt;流水类型列表与租户侧保持一致&lt;/li&gt;&lt;/ul&gt;&#x27;\n  },\n  5: {\n    title: &#x27;流水详情弹窗&#x27;,\n    desc: &#x27;点击流水号可查看流水详情弹窗，包含流水基本信息、关联业务信息、租户信息、余额变动等完整数据，帮助运营全面了解每笔流水的背景。&#x27;,\n    rules: &#x27;&lt;ul&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;完整信息&lt;/span&gt;流水号、类型、金额、余额变动、关联业务、租户信息、发生时间&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;操作记录&lt;/span&gt;手动操作显示操作人和操作时间&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;快速跳转&lt;/span&gt;可跳转租户详情、关联业务详情&lt;/li&gt;&lt;li&gt;详情弹窗支持关闭后保留筛选状态&lt;/li&gt;&lt;li&gt;支持上下条切换浏览&lt;/li&gt;&lt;/ul&gt;&#x27;,\n    exception: &#x27;&lt;ul&gt;&lt;li&gt;关联业务数据加载失败时显示&quot;--&quot;&lt;/li&gt;&lt;li&gt;无权限数据显示&quot;无权限查看&quot;&lt;/li&gt;&lt;/ul&gt;&#x27;\n  }\n};\n\n// ===== Vue原型生成器标准标注系统 =====\nfunction openAnnoModal(id) {\n  const data = annoData[id];\n  if (!data) return;\n  let tableHtml = &#x27;&lt;table class=&quot;anno-modal-table&quot;&gt;&#x27;;\n  tableHtml += &#x27;&lt;tr&gt;&lt;th&gt;功能说明&lt;/th&gt;&lt;td&gt;&#x27; + data.desc + &#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;;\n  tableHtml += &#x27;&lt;tr&gt;&lt;th&gt;规则约束&lt;/th&gt;&lt;td&gt;&#x27; + data.rules + &#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;;\n  tableHtml += &#x27;&lt;tr&gt;&lt;th&gt;异常处理&lt;/th&gt;&lt;td&gt;&#x27; + data.exception + &#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;;\n  if (data.extra) {\n    for (let key in data.extra) {\n      tableHtml += &#x27;&lt;tr&gt;&lt;th&gt;&#x27; + key + &#x27;&lt;/th&gt;&lt;td&gt;&#x27; + data.extra[key] + &#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;;\n    }\n  }\n  tableHtml += &#x27;&lt;/table&gt;&#x27;;\n  document.getElementById(&#x27;anno-modal-title&#x27;).textContent = data.title;\n  document.getElementById(&#x27;anno-modal-body&#x27;).innerHTML = tableHtml;\n  document.getElementById(&#x27;anno-modal&#x27;).classList.add(&#x27;show&#x27;);\n}\nfunction closeAnnoModal() {\n  document.getElementById(&#x27;anno-modal&#x27;).classList.remove(&#x27;show&#x27;);\n}\ndocument.addEventListener(&#x27;click&#x27;, function(e) {\n  if (e.target.id === &#x27;anno-modal&#x27;) closeAnnoModal();\n});\ndocument.addEventListener(&#x27;keydown&#x27;, function(e) {\n  if (e.key === &#x27;Escape&#x27;) closeAnnoModal();\n});\n\n// 点击流水号打开详情\ndocument.querySelectorAll(&#x27;td .amount:first-child&#x27;).forEach(el =&gt; {\n  if (el.textContent.startsWith(&#x27;L&#x27;)) {\n    el.style.color = &#x27;#3B82F6&#x27;;\n    el.style.cursor = &#x27;pointer&#x27;;\n    el.onclick = function() {\n      document.getElementById(&#x27;detailModal&#x27;).classList.add(&#x27;show&#x27;);\n    };\n  }\n});\n\n// 让第一列流水号可点击（更精确的选择器）\ndocument.querySelectorAll(&#x27;tbody tr td:first-child&#x27;).forEach(td =&gt; {\n  td.style.color = &#x27;#3B82F6&#x27;;\n  td.style.cursor = &#x27;pointer&#x27;;\n  td.onclick = function() {\n    document.getElementById(&#x27;detailModal&#x27;).classList.add(&#x27;show&#x27;);\n  };\n});\n\nfunction closeDetailModal() {\n  document.getElementById(&#x27;detailModal&#x27;).classList.remove(&#x27;show&#x27;);\n}\n\n// 点击遮罩关闭\ndocument.getElementById(&#x27;detailModal&#x27;).addEventListener(&#x27;click&#x27;, function(e) {\n  if (e.target === this) closeDetailModal();\n});\n\n// ESC关闭\ndocument.addEventListener(&#x27;keydown&#x27;, function(e) {\n  if (e.key === &#x27;Escape&#x27;) {\n    closeDetailModal();\n  }\n});\n&lt;/script&gt;\n&lt;/div&gt;\n\n&lt;/div&gt;\n&lt;!-- 标注详情弹窗 --&gt;\n&lt;div class=&quot;anno-modal-mask&quot; id=&quot;annoModalMask&quot; onclick=&quot;annoCloseModalOnMask(event)&quot;&gt;\n&lt;div class=&quot;anno-modal-box&quot;&gt;\n&lt;div class=&quot;anno-modal-header&quot;&gt;\n&lt;h3 id=&quot;annoModalTitle&quot;&gt;标注详情&lt;/h3&gt;\n&lt;button class=&quot;anno-modal-close&quot; onclick=&quot;annoCloseModal()&quot;&gt;×&lt;/button&gt;\n&lt;/div&gt;\n&lt;div class=&quot;anno-modal-body&quot; id=&quot;annoModalBody&quot;&gt;&lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;script&gt;\n// ===== 新版标注系统交互逻辑 =====\n(function() {\n  // 获取所有标注数据（兼容两种格式）\n  function getAnnotationData() {\n    if (typeof annoData !== &#x27;undefined&#x27;) {\n      // 对象格式: { 1: {title, desc, rules, exception}, ... }\n      return annoData;\n    }\n    if (typeof annotations !== &#x27;undefined&#x27;) {\n      // 数组格式: [{title, content}, ...]\n      var result = {};\n      annotations.forEach(function(item, index) {\n        result[index + 1] = {\n          title: item.title,\n          desc: item.desc || &#x27;&#x27;,\n          content: item.content || &#x27;&#x27;,\n          rules: item.rules || &#x27;&#x27;,\n          exception: item.exception || &#x27;&#x27;\n        };\n      });\n      return result;\n    }\n    return {};\n  }\n\n  var data = getAnnotationData();\n  var keys = Object.keys(data).map(Number).sort(function(a, b) { return a - b; });\n\n  // 为左侧角标添加data-anno-id属性\n  var badges = document.querySelectorAll(&#x27;.anno-badge&#x27;);\n  badges.forEach(function(badge, index) {\n    if (!badge.getAttribute(&#x27;data-anno-id&#x27;)) {\n      var num = badge.textContent.trim();\n      if (!isNaN(parseInt(num))) {\n        badge.setAttribute(&#x27;data-anno-id&#x27;, parseInt(num));\n      } else {\n        badge.setAttribute(&#x27;data-anno-id&#x27;, index + 1);\n      }\n    }\n    // 绑定点击事件打开弹窗\n    badge.addEventListener(&#x27;click&#x27;, function(e) {\n      e.stopPropagation();\n      var id = badge.getAttribute(&#x27;data-anno-id&#x27;);\n      openAnnoDetailModal(parseInt(id));\n    });\n  });\n\n  // 为右侧标注条目绑定事件\n  var annoItems = document.querySelectorAll(&#x27;.anno-item&#x27;);\n  annoItems.forEach(function(item) {\n    var id = item.getAttribute(&#x27;data-anno-id&#x27;);\n    \n    // 悬停联动\n    item.addEventListener(&#x27;mouseenter&#x27;, function() {\n      highlightAnno(id);\n    });\n    item.addEventListener(&#x27;mouseleave&#x27;, function() {\n      unhighlightAnno(id);\n    });\n    \n    // 点击打开弹窗\n    item.addEventListener(&#x27;click&#x27;, function() {\n      openAnnoDetailModal(parseInt(id));\n    });\n  });\n\n  // 左侧角标悬停联动\n  badges.forEach(function(badge) {\n    var id = badge.getAttribute(&#x27;data-anno-id&#x27;);\n    var target = badge.closest(&#x27;.anno-target&#x27;) || badge.closest(&#x27;.anno-section&#x27;) || badge.parentElement;\n    if (target) {\n      target.addEventListener(&#x27;mouseenter&#x27;, function() {\n        highlightAnno(id);\n      });\n      target.addEventListener(&#x27;mouseleave&#x27;, function() {\n        unhighlightAnno(id);\n      });\n    }\n  });\n\n  function highlightAnno(id) {\n    var badge = document.querySelector(&#x27;.anno-badge[data-anno-id=&quot;&#x27; + id + &#x27;&quot;]&#x27;);\n    var item = document.querySelector(&#x27;.anno-item[data-anno-id=&quot;&#x27; + id + &#x27;&quot;]&#x27;);\n    if (badge) badge.classList.add(&#x27;active&#x27;);\n    if (item) item.classList.add(&#x27;active&#x27;);\n  }\n\n  function unhighlightAnno(id) {\n    var badge = document.querySelector(&#x27;.anno-badge[data-anno-id=&quot;&#x27; + id + &#x27;&quot;]&#x27;);\n    var item = document.querySelector(&#x27;.anno-item[data-anno-id=&quot;&#x27; + id + &#x27;&quot;]&#x27;);\n    if (badge) badge.classList.remove(&#x27;active&#x27;);\n    if (item) item.classList.remove(&#x27;active&#x27;);\n  }\n\n  function openAnnoDetailModal(id) {\n    var item = data[id];\n    if (!item) return;\n\n    document.getElementById(&#x27;annoModalTitle&#x27;).textContent = item.title || &#x27;标注详情&#x27;;\n    \n    var bodyHtml = &#x27;&#x27;;\n    // 如果有content字段（数组格式），直接使用\n    if (item.content) {\n      bodyHtml = item.content;\n      // 替换旧的table class\n      bodyHtml = bodyHtml.replace(/annotation-table/g, &#x27;anno-modal-table&#x27;);\n    } else {\n      // 对象格式：生成表格\n      bodyHtml = &#x27;&lt;table class=&quot;anno-modal-table&quot;&gt;&#x27;;\n      if (item.desc) {\n        bodyHtml += &#x27;&lt;tr&gt;&lt;th&gt;功能说明&lt;/th&gt;&lt;td&gt;&#x27; + item.desc + &#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;;\n      }\n      if (item.rules) {\n        bodyHtml += &#x27;&lt;tr&gt;&lt;th&gt;规则约束&lt;/th&gt;&lt;td&gt;&#x27; + item.rules + &#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;;\n      }\n      if (item.exception) {\n        bodyHtml += &#x27;&lt;tr&gt;&lt;th&gt;异常处理&lt;/th&gt;&lt;td&gt;&#x27; + item.exception + &#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;;\n      }\n      bodyHtml += &#x27;&lt;/table&gt;&#x27;;\n    }\n    \n    document.getElementById(&#x27;annoModalBody&#x27;).innerHTML = bodyHtml;\n    document.getElementById(&#x27;annoModalMask&#x27;).classList.add(&#x27;show&#x27;);\n  }\n\n  // 暴露给全局使用\n  window.annoOpenModal = openAnnoDetailModal;\n  window.annoCloseModal = function() {\n    document.getElementById(&#x27;annoModalMask&#x27;).classList.remove(&#x27;show&#x27;);\n  };\n  window.annoCloseModalOnMask = function(e) {\n    if (e.target.id === &#x27;annoModalMask&#x27;) {\n      window.annoCloseModal();\n    }\n  };\n\n  // ESC键关闭弹窗\n  document.addEventListener(&#x27;keydown&#x27;, function(e) {\n    if (e.key === &#x27;Escape&#x27;) {\n      window.annoCloseModal();\n    }\n  });\n})();\n&lt;/script&gt;\n&lt;div class=&quot;anno-right-panel&quot;&gt;\n&lt;h3&gt;页面标注&lt;/h3&gt;\n&lt;div class=&quot;anno-item&quot; data-anno-id=&quot;1&quot;&gt;\n&lt;div class=&quot;anno-item-header&quot;&gt;\n&lt;span class=&quot;anno-item-num&quot;&gt;1&lt;/span&gt;\n&lt;div class=&quot;anno-item-title&quot;&gt;FR-008 运营流水总表 · 页面总说明&lt;/div&gt;\n&lt;/div&gt;\n&lt;div class=&quot;anno-item-desc&quot;&gt;运营侧账户流水总表汇聚所有租户的账户流水记录，是运营进行全局资金监控和对账的核心工具。支持按租户、时间、流水类型等多维度筛选。&lt;/div&gt;\n&lt;/div&gt;\n&lt;div class=&quot;anno-item&quot; data-anno-id=&quot;2&quot;&gt;\n&lt;div class=&quot;anno-item-header&quot;&gt;\n&lt;span class=&quot;anno-item-num&quot;&gt;2&lt;/span&gt;\n&lt;div class=&quot;anno-item-title&quot;&gt;多维度筛选&lt;/div&gt;\n&lt;/div&gt;\n&lt;div class=&quot;anno-item-desc&quot;&gt;支持按租户、时间范围、流水类型等多维度组合筛选，帮助运营快速定位特定流水记录，高效处理对账和问题排查。&lt;/div&gt;\n&lt;/div&gt;\n&lt;div class=&quot;anno-item&quot; data-anno-id=&quo div class=&quot;timeline-dot&quot;&gt;&lt;/div&gt;\n&lt;div class=&quot;timeline-content&quot;&gt;\n&lt;div class=&quot;timeline-title&quot;&gt;支付处理中&lt;/div&gt;\n&lt;div class=&quot;timeline-time&quot;&gt;进行中&lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n\n&lt;!-- 操作日志 --&gt;\n&lt;div class=&quot;op-log-section&quot;&gt;\n&lt;div class=&quot;section-title&quot;&gt;操作日志&lt;/div&gt;\n&lt;div class=&quot;op-log-list&quot; id=&quot;viewOpLog&quot;&gt;&lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;div class=&quot;biz-modal-footer&quot; id=&quot;viewFooter&quot;&gt;\n&lt;button class=&quot;btn btn-default&quot; onclick=&quot;closeBizModal(&#x27;viewModal&#x27;)&quot;&gt;关闭&lt;/button&gt;\n&lt;button class=&quot;btn btn-danger&quot; onclick=&quot;openRejectModal()&quot;&gt;驳回&lt;/button&gt;\n&lt;button class=&quot;btn btn-success&quot; onclick=&quot;openApproveModal()&quot;&gt;审核通过&lt;/button&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n\n&lt;!-- 审核通过确认弹窗 --&gt;\n&lt;div class=&quot;biz-modal-mask&quot; id=&quot;approveModal&quot; onclick=&quot;closeBizModalOnMask(event, &#x27;approveModal&#x27;)&quot;&gt;\n&lt;div class=&quot;biz-modal small&quot;&gt;\n&lt;div class=&quot;biz-modal-header&quot;&gt;\n&lt;h3&gt;确认审核通过&lt;/h3&gt;\n&lt;button class=&quot;biz-modal-close&quot; onclick=&quot;closeBizModal(&#x27;approveModal&#x27;)&quot;&gt;×&lt;/button&gt;\n&lt;/div&gt;\n&lt;div class=&quot;biz-modal-body&quot;&gt;\n&lt;div class=&quot;confirm-icon success&quot;&gt;✓&lt;/div&gt;\n&lt;div class=&quot;confirm-title&quot;&gt;确认通过该笔充值？&lt;/div&gt;\n&lt;div class=&quot;confirm-desc&quot;&gt;\n充值单号：C2026072500089&lt;br/&gt;\n充值金额：&lt;span class=&quot;amount-success&quot;&gt;+ ¥ 20,000.00&lt;/span&gt;&lt;br/&gt;\n租 户：星淘海外代购\n&lt;/div&gt;\n&lt;div class=&quot;confirm-tip&quot;&gt;通过后余额将立即增加，并生成充值流水记录，操作不可撤销。&lt;/div&gt;\n&lt;/div&gt;\n&lt;div class=&quot;biz-modal-footer&quot;&gt;\n&lt;button class=&quot;btn btn-default&quot; onclick=&quot;closeBizModal(&#x27;approveModal&#x27;)&quot;&gt;取消&lt;/button&gt;\n&lt;button class=&quot;btn btn-success&quot; onclick=&quot;confirmApprove()&quot;&gt;确认通过&lt;/button&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n\n&lt;!-- 审核驳回弹窗 --&gt;\n&lt;div class=&quot;biz-modal-mask&quot; id=&quot;rejectModal&quot; onclick=&quot;closeBizModalOnMask(event, &#x27;rejectModal&#x27;)&quot;&gt;\n&lt;div class=&quot;biz-modal small&quot;&gt;\n&lt;div class=&quot;biz-modal-header&quot;&gt;\n&lt;h3&gt;驳回充值申请&lt;/h3&gt;\n&lt;button class=&quot;biz-modal-close&quot; onclick=&quot;closeBizModal(&#x27;rejectModal&#x27;)&quot;&gt;×&lt;/button&gt;\n&lt;/div&gt;\n&lt;div class=&quot;biz-modal-body&quot;&gt;\n&lt;div class=&quot;form-item&quot;&gt;\n&lt;label class=&quot;form-label&quot;&gt;&lt;span class=&quot;required&quot;&gt;*&lt;/span&gt;驳回原因&lt;/label&gt;\n&lt;textarea class=&quot;reject-textarea&quot; placeholder=&quot;请填写驳回原因，不少于5个字&quot; rows=&quot;4&quot;&gt;&lt;/textarea&gt;\n&lt;/div&gt;\n&lt;div class=&quot;quick-reject-tags&quot;&gt;\n&lt;span class=&quot;quick-reject-tag&quot; onclick=&quot;quickReject(&#x27;转账凭证不清晰，无法识别汇款人信息&#x27;)&quot;&gt;凭证不清晰&lt;/span&gt;\n&lt;span class=&quot;quick-reject-tag&quot; onclick=&quot;quickReject(&#x27;未收到对应金额的银行转账&#x27;)&quot;&gt;未收到款项&lt;/span&gt;\n&lt;span class=&quot;quick-reject-tag&quot; onclick=&quot;quickReject(&#x27;租户账户异常，暂不支持充值&#x27;)&quot;&gt;账户异常&lt;/span&gt;\n&lt;span class=&quot;quick-reject-tag&quot; onclick=&quot;quickReject(&#x27;充值金额与凭证不符&#x27;)&quot;&gt;金额不符&lt;/span&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;div class=&quot;biz-modal-footer&quot;&gt;\n&lt;button class=&quot;btn btn-default&quot; onclick=&quot;closeBizModal(&#x27;rejectModal&#x27;)&quot;&gt;取消&lt;/button&gt;\n&lt;button class=&quot;btn btn-danger&quot; onclick=&quot;confirmReject()&quot;&gt;确认驳回&lt;/button&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n\n&lt;div class=&quot;modal-mask&quot; id=&quot;modal&quot; onclick=&quot;closeModalOnMask(event)&quot;&gt;\n&lt;div class=&quot;modal-box&quot;&gt;\n&lt;div class=&quot;modal-header&quot;&gt;\n&lt;h3 id=&quot;modal-title&quot;&gt;标注详情&lt;/h3&gt;\n&lt;button class=&quot;modal-close&quot; onclick=&quot;closeModal()&quot;&gt;×&lt;/button&gt;\n&lt;/div&gt;\n&lt;div class=&quot;modal-body&quot; id=&quot;modal-body&quot;&gt;&lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;script&gt;\nconst annoData = {\n  1: {\n    title: &#x27;FR-007 充值审核 · 页面总说明&#x27;,\n    desc: &#x27;充值审核页是运营管理租户充值的核心页面，展示所有充值申请记录，支持按状态筛选和搜索。线下转账充值需运营审核通过后手动加款，在线支付（支付宝）自动到账无需审核。&#x27;,\n    rules: &#x27;&lt;ul&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;使用角色&lt;/span&gt;仅运营管理员可查看和操作&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;充值状态（6种）&lt;/span&gt;待审核、已到账、已驳回、支付中、支付失败、已关闭&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;线下转账&lt;/span&gt;需运营审核，审核通过后余额增加&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;在线支付&lt;/span&gt;支付宝在线支付自动到账，无需审核&lt;/li&gt;&lt;li&gt;默认按申请时间倒序排列&lt;/li&gt;&lt;li&gt;支持按状态、时间、关键词筛选&lt;/li&gt;&lt;/ul&gt;&#x27;,\n    exception: &#x27;&lt;ul&gt;&lt;li&gt;审核通过时若租户不存在，提示错误并刷新列表&lt;/li&gt;&lt;li&gt;同一充值单只能审核一次，防止重复操作&lt;/li&gt;&lt;li&gt;网络异常时操作不生效，需重试&lt;/li&gt;&lt;/ul&gt;&#x27;\n  },\n  2: {\n    title: &#x27;充值状态分类&#x27;,\n    desc: &#x27;按充值状态分类展示，共6种状态：待审核（线下转账待运营审核）、已到账（审核通过或在线支付成功）、已驳回（运营驳回）、支付中（在线支付进行中）、支付失败（在线支付失败）、已关闭（超时未支付）。&#x27;,\n    rules: &#x27;&lt;ul&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;待审核&lt;/span&gt;线下转账提交凭证后，等待运营审核&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;已到账&lt;/span&gt;运营审核通过 或 在线支付成功，余额已增加&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;已驳回&lt;/span&gt;运营审核不通过，余额不变&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;支付中&lt;/span&gt;已发起第三方支付，等待回调&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;支付失败&lt;/span&gt;第三方支付失败，余额不变&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;已关闭&lt;/span&gt;超时未支付自动关闭&lt;/li&gt;&lt;/ul&gt;&#x27;,\n    exception: &#x27;&lt;ul&gt;&lt;li&gt;在线支付回调异常时，状态保持&quot;支付中&quot;，主动查询机制兜底&lt;/li&gt;&lt;li&gt;同一支付回调多次到达时，幂等机制保证不重复到账&lt;/li&gt;&lt;/ul&gt;&#x27;\n  },\n  3: {\n    title: &#x27;充值审核操作&#x27;,\n    desc: &#x27;运营对待审核的线下转账充值进行审核操作，包括审核通过和审核驳回两种操作。审核通过后余额增加，审核驳回需填写原因。&#x27;,\n    rules: &#x27;&lt;ul&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;审核通过&lt;/span&gt;余额增加 + 生成充值流水 + 发通知给租户 + 触发待支付队列自动支付&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;审核驳回&lt;/span&gt;余额不变 + 发驳回通知 + 记录驳回原因&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;二次确认&lt;/span&gt;两种操作均需二次确认弹窗&lt;/li&gt;&lt;li&gt;驳回时必须填写驳回原因（不少于5字）&lt;/li&gt;&lt;li&gt;操作记录操作人、操作时间、审核意见&lt;/li&gt;&lt;li&gt;同一充值单仅可审核一次&lt;/li&gt;&lt;/ul&gt;&#x27;,\n    exception: &#x27;&lt;ul&gt;&lt;li&gt;审核通过时余额更新与流水记录在同一事务中&lt;/li&gt;&lt;li&gt;并发审核时使用乐观锁，防止重复操作&lt;/li&gt;&lt;li&gt;审核操作不可撤销，需谨慎操作&lt;/li&gt;&lt;/ul&gt;&#x27;\n  },\n  4: {\n    title: &#x27;支付渠道区分&#x27;,\n    desc: &#x27;区分不同支付渠道的充值记录。线下转账需运营审核，在线支付（支付宝）自动到账。不同渠道的充值状态流转不同。&#x27;,\n    rules: &#x27;&lt;ul&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;线下转账&lt;/span&gt;状态流转：待审核 → 已到账 / 已驳回&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;支付宝在线支付&lt;/span&gt;状态流转：支付中 → 已到账 / 支付失败 / 已关闭&lt;/li&gt;&lt;li&gt;线下转账需租户上传转账凭证图片&lt;/li&gt;&lt;li&gt;在线支付跳转至支付宝完成支付&lt;/li&gt;&lt;li&gt;不同渠道有不同的审核流程&lt;/li&gt;&lt;/ul&gt;&#x27;,\n    exception: &#x27;&lt;ul&gt;&lt;li&gt;在线支付超时未回调时，主动查询支付状态&lt;/li&gt;&lt;li&gt;凭证图片需做访问控制，仅相关运营和对应租户可见&lt;/li&gt;&lt;/ul&gt;&#x27;\n  },\n  5: {\n    title: &#x27;充值详情与凭证&#x27;,\n    desc: &#x27;点击充值记录可查看详情，包括充值基本信息、支付/审核时间线、操作日志等。线下转账可查看转账凭证图片。&#x27;,\n    rules: &#x27;&lt;ul&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;详情信息&lt;/span&gt;充值单号、金额、渠道、租户、状态、时间等&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;凭证查看&lt;/span&gt;线下转账可查看转账凭证大图&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;操作日志&lt;/span&gt;完整记录申请、审核、到账等各节点操作人和时间&lt;/li&gt;&lt;li&gt;支持查看关联的流水记录&lt;/li&gt;&lt;li&gt;凭证图片支持放大预览&lt;/li&gt;&lt;/ul&gt;&#x27;,\n    exception: &#x27;&lt;ul&gt;&lt;li&gt;凭证图片加载失败时显示占位图和重试按钮&lt;/li&gt;&lt;li&gt;在线支付详情展示支付流水号和第三方交易号&lt;/li&gt;&lt;/ul&gt;&#x27;\n  }\n};\nfunction openModal(id) {\n  const data = annotationData[id];\n  if (!data) return;\n  document.getElementById(&#x27;modal-title&#x27;).textContent = data.title;\n  document.getElementById(&#x27;modal-body&#x27;).innerHTML = data.content;\n  document.getElementById(&#x27;modal&#x27;).classList.add(&#x27;show&#x27;);\n}\nfunction closeModal() { document.getElementById(&#x27;modal&#x27;).classList.remove(&#x27;show&#x27;); }\nfunction closeModalOnMask(e) { if (e.target.id === &#x27;modal&#x27;) closeModal(); }\ndocument.addEventListener(&#x27;keydown&#x27;, e =&gt; { if (e.key === &#x27;Escape&#x27;) closeModal(); });\n\n\n// ====== 业务弹窗函数 ======\nfunction openBizModal(id) { document.getElementById(id).classList.add(&#x27;show&#x27;); }\nfunction closeBizModal(id) { document.getElementById(id).classList.remove(&#x27;show&#x27;); }\nfunction closeBizModalOnMask(e, id) { if (e.target.id === id) closeBizModal(id); }\n\n// 统一充值详情：根据类型展示不同区块\nfunction openViewModal(type) {\n  type = type || &#x27;offline_pending&#x27;; // 默认线下待审核\n  const voucherSec = document.getElementById(&#x27;viewVoucherSection&#x27;);\n  const timelineSec = document.getElementById(&#x27;viewPayTimelineSection&#x27;);\n  const thirdRow = document.getElementById(&#x27;viewThirdRow&#x27;);\n  const rejectRow = document.getElementById(&#x27;viewRejectRow&#x27;);\n  const footer = document.getElementById(&#x27;viewFooter&#x27;);\n  const opLog = document.getElementById(&#x27;viewOpLog&#x27;);\n  const statusEl = document.getElementById(&#x27;viewStatus&#x27;);\n  const channelEl = document.getElementById(&#x27;viewChannel&#x27;);\n  const orderNoEl = document.getElementById(&#x27;viewOrderNo&#x27;);\n  const amountEl = document.getElementById(&#x27;viewAmount&#x27;);\n  const tenantEl = docume
