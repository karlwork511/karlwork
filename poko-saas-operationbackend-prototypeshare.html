t;span class=&quot;channel-meta-item&quot;&gt;商户号：2088********1234&lt;/span&gt;\n&lt;span class=&quot;channel-meta-item&quot;&gt;环境：正式&lt;/span&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;div class=&quot;channel-right&quot;&gt;\n&lt;div class=&quot;status-switch&quot;&gt;\n&lt;div class=&quot;switch on&quot;&gt;&lt;/div&gt;\n&lt;span class=&quot;status-text active&quot;&gt;已启用&lt;/span&gt;\n&lt;/div&gt;\n&lt;div class=&quot;channel-actions&quot;&gt;\n&lt;button class=&quot;sort-btn&quot;&gt;↑&lt;/button&gt;\n&lt;span class=&quot;sort-order&quot;&gt;2&lt;/span&gt;\n&lt;button class=&quot;sort-btn&quot;&gt;↓&lt;/button&gt;\n&lt;div class=&quot;action-divider&quot;&gt;&lt;/div&gt;\n&lt;button class=&quot;btn-text&quot; onclick=&quot;openChannelModal(&#x27;edit&#x27;, &#x27;online&#x27;, &#x27;alipay&#x27;)&quot;&gt;编辑&lt;/button&gt;\n&lt;button class=&quot;btn-danger-text&quot;&gt;删除&lt;/button&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;!-- 微信支付 --&gt;\n&lt;div class=&quot;channel-item&quot;&gt;\n&lt;div class=&quot;channel-icon wechat&quot;&gt;微&lt;/div&gt;\n&lt;div class=&quot;channel-info&quot;&gt;\n&lt;div class=&quot;channel-name-row&quot;&gt;\n&lt;span class=&quot;channel-name&quot;&gt;微信支付&lt;/span&gt;\n&lt;span class=&quot;channel-type-tag online&quot;&gt;在线支付&lt;/span&gt;\n&lt;/div&gt;\n&lt;div class=&quot;channel-desc&quot;&gt;微信支付在线支付，支付成功后自动到账，无需人工审核&lt;/div&gt;\n&lt;div class=&quot;channel-meta&quot;&gt;\n&lt;span class=&quot;channel-meta-item&quot;&gt;商户号：1600********5678&lt;/span&gt;\n&lt;span class=&quot;channel-meta-item&quot;&gt;环境：正式&lt;/span&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;div class=&quot;channel-right&quot;&gt;\n&lt;div class=&quot;status-switch&quot;&gt;\n&lt;div class=&quot;switch&quot;&gt;&lt;/div&gt;\n&lt;span class=&quot;status-text inactive&quot;&gt;已禁用&lt;/span&gt;\n&lt;/div&gt;\n&lt;div class=&quot;channel-actions&quot;&gt;\n&lt;button class=&quot;sort-btn&quot;&gt;↑&lt;/button&gt;\n&lt;span class=&quot;sort-order&quot;&gt;3&lt;/span&gt;\n&lt;button class=&quot;sort-btn&quot; disabled=&quot;&quot;&gt;↓&lt;/button&gt;\n&lt;div class=&quot;action-divider&quot;&gt;&lt;/div&gt;\n&lt;button class=&quot;btn-text&quot; onclick=&quot;openChannelModal(&#x27;edit&#x27;, &#x27;online&#x27;, &#x27;wechat&#x27;)&quot;&gt;编辑&lt;/button&gt;\n&lt;button class=&quot;btn-danger-text&quot;&gt;删除&lt;/button&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;div class=&quot;modal-mask&quot; id=&quot;modal&quot; onclick=&quot;closeModalOnMask(event)&quot;&gt;\n&lt;div class=&quot;modal-box&quot;&gt;\n&lt;div class=&quot;modal-header&quot;&gt;\n&lt;h3 id=&quot;modal-title&quot;&gt;标注详情&lt;/h3&gt;\n&lt;button class=&quot;modal-close&quot; onclick=&quot;closeModal()&quot;&gt;×&lt;/button&gt;\n&lt;/div&gt;\n&lt;div class=&quot;modal-body&quot; id=&quot;modal-body&quot;&gt;&lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;script&gt;\nconst annoData = {\n  1: {\n    title: &#x27;FR-009 系统设置 · 支付配置 · 页面总说明&#x27;,\n    desc: &#x27;支付配置是运营管理支付渠道的核心页面，包括支付渠道管理和线下转账账户维护。MVP阶段仅保留支付配置，账户设置和通知设置写死默认值。&#x27;,\n    rules: &#x27;&lt;ul&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;使用角色&lt;/span&gt;仅运营管理员&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;MVP范围&lt;/span&gt;仅支付配置，账户设置和通知设置写死默认值&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;支付渠道管理&lt;/span&gt;配置在线支付渠道（支付宝）和线下转账渠道&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;线下转账维护&lt;/span&gt;维护收款账户信息，供租户线下转账使用&lt;/li&gt;&lt;li&gt;敏感字段加密存储，禁止明文展示&lt;/li&gt;&lt;li&gt;支持启用/停用支付渠道&lt;/li&gt;&lt;/ul&gt;&#x27;,\n    exception: &#x27;&lt;ul&gt;&lt;li&gt;敏感配置修改需要二次验证（管理员密码）&lt;/li&gt;&lt;li&gt;配置保存失败时保留原值并提示错误&lt;/li&gt;&lt;/ul&gt;&#x27;\n  },\n  2: {\n    title: &#x27;支付渠道管理&#x27;,\n    desc: &#x27;管理所有可用的支付渠道，包括在线支付（支付宝）和线下转账。运营可启用/停用渠道，配置渠道参数。&#x27;,\n    rules: &#x27;&lt;ul&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;在线支付&lt;/span&gt;支付宝在线支付，配置商户号、密钥等&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;线下转账&lt;/span&gt;银行转账、支付宝转账等，配置收款账户&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;启用/停用&lt;/span&gt;渠道可启停，停用后租户侧不可见&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;环境切换&lt;/span&gt;支持沙箱/生产环境切换（支付宝）&lt;/li&gt;&lt;li&gt;每个渠道有独立的配置参数&lt;/li&gt;&lt;li&gt;渠道列表展示名称、类型、状态、操作&lt;/li&gt;&lt;/ul&gt;&#x27;,\n    exception: &#x27;&lt;ul&gt;&lt;li&gt;停用正在使用的渠道时弹出确认提示&lt;/li&gt;&lt;li&gt;渠道配置错误时不影响其他渠道使用&lt;/li&gt;&lt;/ul&gt;&#x27;\n  },\n  3: {\n    title: &#x27;线下转账账户维护&#x27;,\n    desc: &#x27;维护线下转账的收款账户信息，包括银行账户、支付宝收款码等。这些信息展示给租户，供其转账时使用。&#x27;,\n    rules: &#x27;&lt;ul&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;账户类型&lt;/span&gt;银行转账、支付宝转账等&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;展示字段&lt;/span&gt;账户名称、账号/收款码、开户行、备注&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;启用/停用&lt;/span&gt;可单独启停某收款账户&lt;/li&gt;&lt;li&gt;支持新增、编辑、删除收款账户&lt;/li&gt;&lt;li&gt;账户信息变更后实时同步到租户侧&lt;/li&gt;&lt;li&gt;可设置账户排序和默认展示&lt;/li&gt;&lt;/ul&gt;&#x27;,\n    exception: &#x27;&lt;ul&gt;&lt;li&gt;删除正在使用的账户时提示确认&lt;/li&gt;&lt;li&gt;所有账户都停用时提示至少保留一个&lt;/li&gt;&lt;/ul&gt;&#x27;\n  },\n  4: {\n    title: &#x27;敏感字段加密存储&#x27;,\n    desc: &#x27;支付配置中的敏感信息（如支付宝密钥、商户号密钥等）采用加密存储，页面上不展示明文，修改时需要验证管理员身份。&#x27;,\n    rules: &#x27;&lt;ul&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;加密存储&lt;/span&gt;敏感字段入库前加密，不明文存储&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;禁止明文展示&lt;/span&gt;页面上敏感信息显示为***，不可查看&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;修改验证&lt;/span&gt;修改敏感配置需输入管理员密码二次验证&lt;/li&gt;&lt;li&gt;密钥等字段仅可设置，不可查看&lt;/li&gt;&lt;li&gt;支持&quot;重新设置&quot;清空后重新输入&lt;/li&gt;&lt;li&gt;加密算法采用行业标准AES-256&lt;/li&gt;&lt;/ul&gt;&#x27;,\n    exception: &#x27;&lt;ul&gt;&lt;li&gt;密码验证失败次数过多时锁定操作&lt;/li&gt;&lt;li&gt;密钥配置错误时有测试连接功能验证&lt;/li&gt;&lt;/ul&gt;&#x27;\n  },\n  5: {\n    title: &#x27;MVP配置范围说明&#x27;,\n    desc: &#x27;MVP阶段系统设置仅保留支付配置模块。账户设置（最低充值金额、过期扫描时间等）和通知设置（余额不足提醒、到期提醒等）均写死默认值，后续版本开放配置。&#x27;,\n    rules: &#x27;&lt;ul&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;支付配置&lt;/span&gt;MVP阶段开放，运营可直接修改&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;账户设置&lt;/span&gt;MVP写死默认值，V2.x开放配置&lt;/li&gt;&lt;li&gt;&lt;span class=&quot;anno-modal-tag&quot;&gt;通知设置&lt;/span&gt;MVP写死默认值，V2.x开放配置&lt;/li&gt;&lt;li&gt;默认值：最低充值金额0元、过期扫描时间每日02:00&lt;/li&gt;&lt;li&gt;默认通知：余额不足邮件提醒、到期前30天提醒&lt;/li&gt;&lt;li&gt;后续版本逐步开放更多配置项&lt;/li&gt;&lt;/ul&gt;&#x27;,\n    exception: &#x27;&lt;ul&gt;&lt;li&gt;需调整默认值时联系开发人员修改配置文件&lt;/li&gt;&lt;li&gt;菜单中不显示账户设置和通知设置入口&lt;/li&gt;&lt;/ul&gt;&#x27;\n  }\n};\nfunction openModal(id) {\n  const data = annotationData[id];\n  if (!data) return;\n  document.getElementById(&#x27;modal-title&#x27;).textContent = data.title;\n  document.getElementById(&#x27;modal-body&#x27;).innerHTML = data.content;\n  document.getElementById(&#x27;modal&#x27;).classList.add(&#x27;show&#x27;);\n}\nfunction closeModal() { document.getElementById(&#x27;modal&#x27;).classList.remove(&#x27;show&#x27;); }\nfunction closeModalOnMask(e) { if (e.target.id === &#x27;modal&#x27;) closeModal(); }\ndocument.addEventListener(&#x27;keydown&#x27;, e =&gt; { if (e.key === &#x27;Escape&#x27;) closeModal(); });\n\n&lt;/script&gt;\n&lt;/div&gt;\n&lt;div class=&quot;anno-right-panel&quot;&gt;\n&lt;h3&gt;页面标注&lt;/h3&gt;\n&lt;div class=&quot;anno-item&quot; data-anno-id=&quot;1&quot;&gt;\n&lt;div class=&quot;anno-item-header&quot;&gt;\n&lt;span class=&quot;anno-item-num&quot;&gt;1&lt;/span&gt;\n&lt;div class=&quot;anno-item-title&quot;&gt;FR-009 系统设置 · 支付配置 · 页面总说明&lt;/div&gt;\n&lt;/div&gt;\n&lt;div class=&quot;anno-item-desc&quot;&gt;支付配置是运营管理支付渠道的核心页面，包括支付渠道管理和线下转账账户维护。MVP阶段仅保留支付配置，账户设置和通知设置写死默认值。&lt;/div&gt;\n&lt;/div&gt;\n&lt;div class=&quot;anno-item&quot; data-anno-id=&quot;2&quot;&gt;\n&lt;div class=&quot;anno-item-header&quot;&gt;\n&lt;span class=&quot;anno-item-num&quot;&gt;2&lt;/span&gt;\n&lt;div class=&quot;anno-item-title&quot;&gt;支付渠道管理&lt;/div&gt;\n&lt;/div&gt;\n&lt;div class=&quot;anno-item-desc&quot;&gt;管理所有可用的支付渠道，包括在线支付（支付宝）和线下转账。运营可启用/停用渠道，配置渠道参数。&lt;/div&gt;\n&lt;/div&gt;\n&lt;div class=&quot;anno-item&quot; data-anno-id=&quot;3&quot;&gt;\n&lt;div class=&quot;anno-item-header&quot;&gt;\n&lt;span class=&quot;anno-item-num&quot;&gt;3&lt;/span&gt;\n&lt;div class=&quot;anno-item-title&quot;&gt;线下转账账户维护&lt;/div&gt;\n&lt;/div&gt;\n&lt;div class=&quot;anno-item-desc&quot;&gt;维护线下转账的收款账户信息，包括银行账户、支付宝收款码等。这些信息展示给租户，供其转账时使用。&lt;/div&gt;\n&lt;/div&gt;\n&lt;div class=&quot;anno-item&quot; data-anno-id=&quot;4&quot;&gt;\n&lt;div class=&quot;anno-item-header&quot;&gt;\n&lt;span class=&quot;anno-item-num&quot;&gt;4&lt;/span&gt;\n&lt;div class=&quot;anno-item-title&quot;&gt;敏感字段加密存储&lt;/div&gt;\n&lt;/div&gt;\n&lt;div class=&quot;anno-item-desc&quot;&gt;支付配置中的敏感信息（如支付宝密钥、商户号密钥等）采用加密存储，页面上不展示明文，修改时需要验证管理员身份。&lt;/div&gt;\n&lt;/div&gt;\n&lt;div class=&quot;anno-item&quot; data-anno-id=&quot;5&quot;&gt;\n&lt;div class=&quot;anno-item-header&quot;&gt;\n&lt;span class=&quot;anno-item-num&quot;&gt;5&lt;/span&gt;\n&lt;div class=&quot;anno-item-title&quot;&gt;MVP配置范围说明&lt;/div&gt;\n&lt;/div&gt;\n&lt;div class=&quot;anno-item-desc&quot;&gt;MVP阶段系统设置仅保留支付配置模块。账户设置（最低充值金额、过期扫描时间等）和通知设置（余额不足提醒、到期提醒等）均写死默认值，后续版本开放配置。&lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;!-- 标注详情弹窗 --&gt;\n&lt;div class=&quot;anno-modal-mask&quot; id=&quot;annoModalMask&quot; onclick=&quot;annoCloseModalOnMask(event)&quot;&gt;\n&lt;div class=&quot;anno-modal-box&quot;&gt;\n&lt;div class=&quot;anno-modal-header&quot;&gt;\n&lt;h3 id=&quot;annoModalTitle&quot;&gt;标注详情&lt;/h3&gt;\n&lt;button class=&quot;anno-modal-close&quot; onclick=&quot;annoCloseModal()&quot;&gt;×&lt;/button&gt;\n&lt;/div&gt;\n&lt;div class=&quot;anno-modal-body&quot; id=&quot;annoModalBody&quot;&gt;&lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;!-- 新增/编辑支付渠道弹窗 --&gt;\n&lt;div class=&quot;channel-modal-mask&quot; id=&quot;channelModal&quot;&gt;\n&lt;div class=&quot;channel-modal-box&quot;&gt;\n&lt;div class=&quot;channel-modal-header&quot;&gt;\n&lt;h3 id=&quot;channelModalTitle&quot;&gt;新增支付渠道&lt;/h3&gt;\n&lt;button class=&quot;channel-modal-close&quot; onclick=&quot;closeChannelModal()&quot;&gt;×&lt;/button&gt;\n&lt;/div&gt;\n&lt;div class=&quot;channel-modal-body&quot;&gt;\n&lt;div style=&quot;display:flex;gap:0;border-bottom:1px solid #ebeef5;margin-bottom:20px;&quot;&gt;\n&lt;div class=&quot;channel-type-tab active&quot; id=&quot;tabOnline&quot; onclick=&quot;switchChannelTab(&#x27;online&#x27;)&quot; style=&quot;padding:10px 20px;cursor:pointer;font-size:13px;color:#3B82F6;border-bottom:2px solid #3B82F6;margin-bottom:-1px;font-weight:500;&quot;&gt;在线支付&lt;/div&gt;\n&lt;div class=&quot;channel-type-tab&quot; id=&quot;tabOffline&quot; onclick=&quot;switchChannelTab(&#x27;offline&#x27;)&quot; style=&quot;padding:10px 20px;cursor:pointer;font-size:13px;color:#606266;border-bottom:2px solid transparent;margin-bottom:-1px;&quot;&gt;线下转账&lt;/div&gt;\n&lt;/div&gt;\n&lt;!-- 在线支付表单 --&gt;\n&lt;div id=&quot;onlineForm&quot;&gt;\n&lt;div style=&quot;font-size:13px;font-weight:600;color:#303133;margin:0 0 12px;padding-left:8px;border-left:3px solid #3B82F6;&quot;&gt;基础信息&lt;/div&gt;\n&lt;div style=&quot;display:grid;grid-template-columns:1fr 1fr;gap:14px 20px;margin-bottom:16px;&quot;&gt;\n&lt;div style=&quot;display:flex;flex-direction:column;&quot;&gt;\n&lt;label style=&quot;font-size:12px;color:#606266;margin-bottom:6px;&quot;&gt;* 渠道名称&lt;/label&gt;\n&lt;input style=&quot;height:34px;padding:0 12px;border:1px solid #dcdfe6;border-radius:6px;font-size:13px;color:#303133;outline:none;&quot; placeholder=&quot;如：支付宝、微信支付&quot;&gt;\n&lt;/div&gt;\n&lt;div style=&quot;display:flex;flex-direction:column;&quot;&gt;\n&lt;label style=&quot;font-size:12px;color:#606266;margin-bottom:6px;&quot;&gt;* 渠道标识&lt;/label&gt;\n&lt;input style=&quot;height:34px;padding:0 12px;border:1px solid #dcdfe6;border-radius:6px;font-size:13px;color:#303133;outline:none;&quot; placeholder=&quot;如：alipay、wechat_pay&quot;&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;div style=&quot;display:grid;grid-template-columns:1fr 1fr;gap:14px 20px;margin-bottom:16px;&quot;&gt;\n&lt;div style=&quot;display:flex;flex-direction:column;&quot;&gt;\n&lt;label style=&quot;font-size:12px;color:#606266;margin-bottom:6px;&quot;&gt;排序&lt;/label&gt;\n&lt;input style=&quot;height:34px;padding:0 12px;border:1px solid #dcdfe6;border-radius:6px;font-size:13px;color:#303133;outline:none;&quot; type=&quot;number&quot; placeholder=&quot;数字越小越靠前&quot; value=&quot;2&quot;&gt;\n&lt;/div&gt;\n&lt;div style=&quot;display:flex;flex-direction:column;&quot;&gt;\n&lt;label style=&quot;font-size:12px;color:#606266;margin-bottom:6px;&quot;&gt;启用状态&lt;/label&gt;\n&lt;select style=&quot;height:34px;padding:0 12px;border:1px solid #dcdfe6;border-radius:6px;font-size:13px;color:#303133;outline:none;&quot;&gt;\n&lt;option selected&gt;启用&lt;/option&gt;\n&lt;option&gt;禁用&lt;/option&gt;\n&lt;/select&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;div style=&quot;font-size:13px;font-weight:600;color:#303133;margin:0 0 12px;padding-left:8px;border-left:3px solid #3B82F6;&quot;&gt;渠道参数&lt;/div&gt;\n&lt;div style=&quot;display:grid;grid-template-columns:1fr 1fr;gap:14px 20px;margin-bottom:16px;&quot;&gt;\n&lt;div style=&quot;display:flex;flex-direction:column;&quot;&gt;\n&lt;label style=&quot;font-size:12px;color:#606266;margin-bottom:6px;&quot;&gt;* AppID&lt;/label&gt;\n&lt;input style=&quot;height:34px;padding:0 12px;border:1px solid #dcdfe6;border-radius:6px;font-size:13px;color:#303133;outline:none;&quot; placeholder=&quot;请输入AppID&quot;&gt;\n&lt;/div&gt;\n&lt;div style=&quot;display:flex;flex-direction:column;&quot;&gt;\n&lt;label style=&quot;font-size:12px;color:#606266;margin-bottom:6px;&quot;&gt;* 商户号&lt;/label&gt;\n&lt;input style=&quot;height:34px;padding:0 12px;border:1px solid #dcdfe6;border-radius:6px;font-size:13px;color:#303133;outline:none;&quot; placeholder=&quot;请输入商户号&quot;&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;div style=&quot;display:flex;flex-direction:column;margin-bottom:16px;&quot;&gt;\n&lt;label style=&quot;font-size:12px;color:#606266;margin-bottom:6px;&quot;&gt;* 商户密钥&lt;/label&gt;\n&lt;input style=&quot;height:34px;padding:0 12px;border:1px solid #dcdfe6;border-radius:6px;font-size:13px;color:#303133;outline:none;&quot; type=&quot;password&quot; placeholder=&quot;请输入商户密钥（AES-256加密存储）&quot;&gt;\n&lt;/div&gt;\n&lt;div style=&quot;display:flex;flex-direction:column;margin-bottom:16px;&quot;&gt;\n&lt;label style=&quot;font-size:12px;color:#606266;margin-bottom:6px;&quot;&gt;证书文件&lt;/label&gt;\n&lt;div style=&quot;border:1px dashed #dcdfe6;border-radius:6px;padding:12px;text-align:center;cursor:pointer;background:#fafafa;&quot;&gt;\n&lt;div style=&quot;font-size:20px;margin-bottom:4px;&quot;&gt;📎&lt;/div&gt;\n&lt;div style=&quot;font-size:12px;color:#606266;&quot;&gt;点击上传证书文件（&lt;span style=&quot;color:#3B82F6;&quot;&gt;.pem / .p12&lt;/span&gt;）&lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;div style=&quot;display:flex;flex-direction:column;margin-bottom:16px;&quot;&gt;\n&lt;label style=&quot;font-size:12px;color:#606266;margin-bottom:6px;&quot;&gt;* 回调地址&lt;/label&gt;\n&lt;input style=&quot;height:34px;padding:0 12px;border:1px solid #dcdfe6;border-radius:6px;font-size:13px;color:#303133;outline:none;&quot; placeholder=&quot;https://api.poko.com/callback/alipay&quot;&gt;\n&lt;/div&gt;\n&lt;div style=&quot;display:grid;grid-template-columns:1fr 1fr;gap:14px 20px;&quot;&gt;\n&lt;div style=&quot;display:flex;flex-direction:column;&quot;&gt;\n&lt;label style=&quot;font-size:12px;color:#606266;margin-bottom:6px;&quot;&gt;环境&lt;/label&gt;\n&lt;div style=&quot;display:flex;gap:16px;margin-top:4px;&quot;&gt;\n&lt;label style=&quot;display:flex;align-items:center;gap:4px;cursor:pointer;font-size:13px;color:#303133;font-weight:500;&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;env_online&quot; checked style=&quot;accent-color:#3B82F6;&quot;&gt; 生产环境&lt;/label&gt;\n&lt;label style=&quot;display:flex;align-items:center;gap:4px;cursor:pointer;font-size:13px;color:#606266;&quot;&gt;&lt;input type=&quot;radio&quot; name=&quot;env_online&quot; style=&quot;accent-color:#3B82F6;&quot;&gt; 沙箱环境&lt;/label&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;!-- 线下转账表单（隐藏） --&gt;\n&lt;div id=&quot;offlineForm&quot; style=&quot;display:none;&quot;&gt;\n&lt;div style=&quot;font-size:13px;font-weight:600;color:#303133;margin:0 0 12px;padding-left:8px;border-left:3px solid #3B82F6;&quot;&gt;基础信息&lt;/div&gt;\n&lt;div style=&quot;display:grid;grid-template-columns:1fr 1fr;gap:14px 20px;margin-bottom:16px;&quot;&gt;\n&lt;div style=&quot;display:flex;flex-direction:column;&quot;&gt;\n&lt;label style=&quot;font-size:12px;color:#606266;margin-bottom:6px;&quot;&gt;* 渠道名称&lt;/label&gt;\n&lt;input style=&quot;height:34px;padding:0 12px;border:1px solid #dcdfe6;border-radius:6px;font-size:13px;color:#303133;outline:none;&quot; placeholder=&quot;如：线下银行转账&quot;&gt;\n&lt;/div&gt;\n&lt;div style=&quot;display:flex;flex-direction:column;&quot;&gt;\n&lt;label style=&quot;font-size:12px;color:#606266;margin-bottom:6px;&quot;&gt;排序&lt;/label&gt;\n&lt;input style=&quot;height:34px;padding:0 12px;border:1px solid #dcdfe6;border-radius:6px;font-size:13px;color:#303133;outline:none;&quot; type=&quot;number&quot; placeholder=&quot;数字越小越靠前&quot;&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;div style=&quot;font-size:13px;font-weight:600;color:#303133;margin:0 0 12px;padding-left:8px;border-left:3px solid #3B82F6;&quot;&gt;收款账户信息&lt;/div&gt;\n&lt;div style=&quot;display:grid;grid-template-columns:1fr 1fr;gap:14px 20px;margin-bottom:16px;&quot;&gt;\n&lt;div style=&quot;display:flex;flex-direction:column;&quot;&gt;\n&lt;label style=&quot;font-size:12px;color:#606266;margin-bottom:6px;&quot;&gt;* 开户银行&lt;/label&gt;\n&lt;input style=&quot;height:34px;padding:0 12px;border:1px solid #dcdfe6;border-radius:6px;font-size:13px;color:#303133;outline:none;&quot; placeholder=&quot;如：中国工商银行深圳市分行&quot;&gt;\n&lt;/div&gt;\n&lt;div style=&quot;display:flex;flex-direction:column;&quot;&gt;\n&lt;label style=&quot;font-size:12px;color:#606266;margin-bottom:6px;&quot;&gt;* 银行账号&lt;/label&gt;\n&lt;input style=&quot;height:34px;padding:0 12px;border:1px solid #dcdfe6;border-radius:6px;font-size:13px;color:#303133;outline:none;&quot; placeholder=&quot;请输入银行账号&quot;&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;div style=&quot;display:grid;grid-template-columns:1fr 1fr;gap:14px 20px;margin-bottom:16px;&quot;&gt;\n&lt;div style=&quot;display:flex;flex-direction:column;&quot;&gt;\n&lt;label style=&quot;font-size:12px;color:#606266;margin-bottom:6px;&quot;&gt;* 开户名&lt;/label&gt;\n&lt;input style=&quot;height:34px;padding:0 12px;border:1px solid #dcdfe6;border-radius:6px;font-size:13px;color:#303133;outline:none;&quot; placeholder=&quot;请输入开户名&quot;&gt;\n&lt;/div&gt;\n&lt;div style=&quot;display:flex;flex-direction:column;&quot;&gt;\n&lt;label style=&quot;font-size:12px;color:#606266;margin-bottom:6px;&quot;&gt;收款说明&lt;/label&gt;\n&lt;input style=&quot;height:34px;padding:0 12px;border:1px solid #dcdfe6;border-radius:6px;font-size:13px;color:#303133;outline:none;&quot; placeholder=&quot;如：转账时请备注租户编号&quot;&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;div style=&quot;display:flex;flex-direction:column;margin-bottom:16px;&quot;&gt;\n&lt;label style=&quot;font-size:12px;color:#606266;margin-bottom:6px;&quot;&gt;收款二维码&lt;/label&gt;\n&lt;div style=&quot;border:1px dashed #dcdfe6;border-radius:6px;padding:12px;text-align:center;cursor:pointer;background:#fafafa;&quot;&gt;\n&lt;div style=&quot;font-size:20px;margin-bottom:4px;&quot;&gt;📷&lt;/div&gt;\n&lt;div style=&quot;font-size:12px;color:#606266;&quot;&gt;点击上传二维码图片（&lt;span style=&quot;color:#3B82F6;&quot;&gt;.png / .jpg&lt;/span&gt;）&lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;div class=&quot;channel-modal-footer&quot; style=&quot;padding:14px 24px;border-top:1px solid #ebeef5;display:flex;justify-content:flex-end;gap:10px;&quot;&gt;\n&lt;button onclick=&quot;closeChannelModal()&quot; style=&quot;height:34px;padding:0 16px;border-radius:6px;font-size:13px;cursor:pointer;border:1px solid #dcdfe6;background:#fff;color:#606266;&quot;&gt;取消&lt;/button&gt;\n&lt;button onclick=&quot;closeChannelModal()&quot; style=&quot;height:34px;padding:0 16px;border-radius:6px;font-size:13px;cursor:pointer;border:none;background:#3B82F6;color:#fff;font-weight:500;&quot;&gt;保存&lt;/button&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;script&gt;\n// ===== 渠道弹窗交互 =====\nfunction openChannelModal(type) {\n  document.getElementById(&#x27;channelModalTitle&#x27;).textContent = &#x27;新增支付渠道&#x27;;\n  switchChannelTab(&#x27;online&#x27;);\n  document.getElementById(&#x27;channelModal&#x27;).classList.add(&#x27;show&#x27;);\n}\nfunction closeChannelModal() {\n  document.getElementById(&#x27;channelModal&#x27;).classList.remove(&#x27;show&#x27;);\n}\nfunction switchChannelTab(tab) {\n  var tabOnline = document.getElementById(&#x27;tabOnline&#x27;);\n  var tabOffline = document.getElementById(&#x27;tabOffline&#x27;);\n  var onlineForm = document.getElementById(&#x27;onlineForm&#x27;);\n  var offlineForm = document.getElementById(&#x27;offlineForm&#x27;);\n  if (tab === &#x27;online&#x27;) {\n    tabOnline.style.color = &#x27;#3B82F6&#x27;; tabOnline.style.borderBottomColor = &#x27;#3B82F6&#x27;; tabOnline.style.fontWeight = &#x27;500&#x27;;\n    tabOffline.style.color = &#x27;#606266&#x27;; tabOffline.style.borderBottomColor = &#x27;transparent&#x27;; tabOffline.style.fontWeight = &#x27;normal&#x27;;\n    onlineForm.style.display = &#x27;block&#x27;; offlineForm.style.display = &#x27;none&#x27;;\n  } else {\n    tabOffline.style.color = &#x27;#3B82F6&#x27;; tabOffline.style.borderBottomColor = &#x27;#3B82F6&#x27;; tabOffline.style.fontWeight = &#x27;500&#x27;;\n    tabOnline.style.color = &#x27;#606266&#x27;; tabOnline.style.borderBottomColor = &#x27;transparent&#x27;; tabOnline.style.fontWeight = &#x27;normal&#x27;;\n    onlineForm.style.display = &#x27;none&#x27;; offlineForm.style.display = &#x27;block&#x27;;\n  }\n}\n// ===== 新版标注系统交互逻辑 =====\n(function() {\n  // 获取所有标注数据（兼容两种格式）\n  function getAnnotationData() {\n    if (typeof annoData !== &#x27;undefined&#x27;) {\n      // 对象格式: { 1: {title, desc, rules, exception}, ... }\n      return annoData;\n    }\n    if (typeof annotations !== &#x27;undefined&#x27;) {\n      // 数组格式: [{title, content}, ...]\n      var result = {};\n      annotations.forEach(function(item, index) {\n        result[index + 1] = {\n          title: item.title,\n          desc: item.desc || &#x27;&#x27;,\n          content: item.content || &#x27;&#x27;,\n          rules: item.rules || &#x27;&#x27;,\n          exception: item.exception || &#x27;&#x27;\n        };\n      });\n      return result;\n    }\n    return {};\n  }\n\n  var data = getAnnotationData();\n  var keys = Object.keys(data).map(Number).sort(function(a, b) { return a - b; });\n\n  // 为左侧角标添加data-anno-id属性\n  var badges = document.querySelectorAll(&#x27;.anno-badge&#x27;);\n  badges.forEach(function(badge, index) {\n    if (!badge.getAttribute(&#x27;data-anno-id&#x27;)) {\n      var num = badge.textContent.trim();\n      if (!isNaN(parseInt(num))) {\n        badge.setAttribute(&#x27;data-anno-id&#x27;, parseInt(num));\n      } else {\n        badge.setAttribute(&#x27;data-anno-id&#x27;, index + 1);\n      }\n    }\n    // 绑定点击事件打开弹窗\n    badge.addEventListener(&#x27;click&#x27;, function(e) {\n      e.stopPropagation();\n      var id = badge.getAttribute(&#x27;data-anno-id&#x27;);\n      openAnnoDetailModal(parseInt(id));\n    });\n  });\n\n  // 为右侧标注条目绑定事件\n  var annoItems = document.querySelectorAll(&#x27;.anno-item&#x27;);\n  annoItems.forEach(function(item) {\n    var id = item.getAttribute(&#x27;data-anno-id&#x27;);\n    \n    // 悬停联动\n    item.addEventListener(&#x27;mouseenter&#x27;, function() {\n      highlightAnno(id);\n    });\n    item.addEventListener(&#x27;mouseleave&#x27;, function() {\n      unhighlightAnno(id);\n    });\n    \n    // 点击打开弹窗\n    item.addEventListener(&#x27;click&#x27;, function() {\n      openAnnoDetailModal(parseInt(id));\n    });\n  });\n\n  // 左侧角标悬停联动\n  badges.forEach(function(badge) {\n    var id = badge.getAttribute(&#x27;data-anno-id&#x27;);\n    var target = badge.closest(&#x27;.anno-target&#x27;) || badge.closest(&#x27;.anno-section&#x27;) || badge.parentElement;\n    if (target) {\n      target.addEventListener(&#x27;mouseenter&#x27;, function() {\n        highlightAnno(id);\n      });\n      target.addEventListener(&#x27;mouseleave&#x27;, function() {\n        unhighlightAnno(id);\n      });\n    }\n  });\n\n  function highlightAnno(id) {\n    var badge = document.querySelector(&#x27;.anno-badge[data-anno-id=&quot;&#x27; + id + &#x27;&quot;]&#x27;);\n    var item = document.querySelector(&#x27;.anno-item[data-anno-id=&quot;&#x27; + id + &#x27;&quot;]&#x27;);\n    if (badge) badge.classList.add(&#x27;active&#x27;);\n    if (item) item.classList.add(&#x27;active&#x27;);\n  }\n\n  function unhighlightAnno(id) {\n    var badge = document.querySelector(&#x27;.anno-badge[data-anno-id=&quot;&#x27; + id + &#x27;&quot;]&#x27;);\n    var item = document.querySelector(&#x27;.anno-item[data-anno-id=&quot;&#x27; + id + &#x27;&quot;]&#x27;);\n    if (badge) badge.classList.remove(&#x27;active&#x27;);\n    if (item) item.classList.remove(&#x27;active&#x27;);\n  }\n\n  function openAnnoDetailModal(id) {\n    var item = data[id];\n    if (!item) return;\n\n    document.getElementById(&#x27;annoModalTitle&#x27;).textContent = item.title || &#x27;标注详情&#x27;;\n    \n    var bodyHtml = &#x27;&#x27;;\n    // 如果有content字段（数组格式），直接使用\n    if (item.content) {\n      bodyHtml = item.content;\n      // 替换旧的table class\n      bodyHtml = bodyHtml.replace(/annotation-table/g, &#x27;anno-modal-table&#x27; function decodeHtml(encoded) {
  const textarea = document.createElement('textarea');
  textarea.innerHTML = encoded;
  return textarea.value;
}

function loadPage(pageName) {
  const iframe = document.getElementById('preview');
  const loading = document.getElementById('loading');
  const content = pageData[pageName];
  if (!content) {
    loading.textContent = '页面不存在';
    loading.style.display = 'block';
    iframe.style.display = 'none';
    return;
  }
  loading.style.display = 'none';
  iframe.style.display = 'block';
  iframe.srcdoc = decodeHtml(content);
}

document.querySelectorAll('.menu-item[data-page]').forEach(item => {
  item.addEventListener('click', function() {
    document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
    this.classList.add('active');
    loadPage(this.getAttribute('data-page'));

});
