<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>医院点餐系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding-top: 8vh;
        }

        .container { max-width: 800px; width: 100%; padding: 20px; }

        .header { text-align: center; padding: 20px 0; }
        .header h1 { font-size: 28px; color: #2c3e50; font-weight: 600; }
        .header .subtitle { font-size: 14px; color: #95a5a6; margin-top: 8px; }

        /* 右上角按钮组 */
        .top-right-btns {
            position: fixed;
            top: 16px;
            right: 16px;
            display: flex;
            gap: 10px;
            z-index: 50;
        }
        .top-btn {
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 500;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .top-btn.primary { background: #3498db; color: white; }
        .top-btn.secondary { background: #ecf0f1; color: #7f8c8d; }
        .top-btn:active { transform: scale(0.95); }

        .settings-btn {
            position: fixed;
            top: 16px;
            left: 16px;
            width: 40px;
            height: 40px;
            background: white;
            border: none;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            z-index: 50;
            transition: all 0.2s;
        }
        .settings-btn:active { transform: scale(0.95); }
        .settings-dot {
            width: 8px;
            height: 8px;
            background: #e74c3c;
            border-radius: 50%;
            position: absolute;
            top: 6px;
            right: 6px;
        }

        /* 页面切换 */
        .page { display: none; animation: fadeIn 0.3s ease; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* 输入框 */
        .input-group { background: white; border-radius: 16px; padding: 30px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); margin-top: 20px; }
        .input-group label { display: block; font-size: 16px; color: #34495e; margin-bottom: 12px; font-weight: 500; }
        .input-group input { width: 100%; padding: 16px 20px; font-size: 20px; border: 2px solid #e0e6ed; border-radius: 12px; outline: none; transition: border-color 0.3s; text-align: center; letter-spacing: 4px; }
        .input-group input:focus { border-color: #3498db; }
        .input-group .hint { font-size: 13px; color: #95a5a6; margin-top: 12px; text-align: center; }

        /* 套餐卡片 */
        .meal-list { display: grid; gap: 16px; margin-top: 20px; }
        .meal-card { background: white; border-radius: 16px; padding: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); cursor: pointer; transition: all 0.3s; border: 3px solid transparent; display: flex; align-items: center; gap: 16px; }
        .meal-card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.12); }
        .meal-card.selected { border-color: #3498db; background: #f0f8ff; }
        .meal-card .meal-img { width: 80px; height: 80px; border-radius: 12px; background: #f0f0f0; display: flex; align-items: center; justify-content: center; font-size: 32px; flex-shrink: 0; }
        .meal-card .meal-info { flex: 1; }
        .meal-card .meal-name { font-size: 18px; font-weight: 600; color: #2c3e50; margin-bottom: 2px; }
        .meal-card .meal-name-en { font-size: 12px; color: #95a5a6; font-style: italic; margin-bottom: 6px; }
        .meal-card .meal-desc { font-size: 13px; color: #7f8c8d; line-height: 1.4; }
        .meal-card .meal-desc-en { font-size: 11px; color: #bdc3c7; font-style: italic; margin-top: 2px; }
        .meal-card .meal-tag { display: inline-block; padding: 2px 8px; font-size: 12px; font-weight: 600; border-radius: 6px; margin-right: 6px; }
        .meal-card .check-mark { width: 28px; height: 28px; border-radius: 50%; border: 2px solid #ddd; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.3s; font-size: 14px; color: white; }
        .meal-card.selected .check-mark { background: #3498db; border-color: #3498db; }

        /* 确认页 */
        .confirm-box { background: white; border-radius: 16px; padding: 30px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); margin-top: 20px; }
        .confirm-row { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid #f0f0f0; }
        .confirm-row:last-child { border-bottom: none; }
        .confirm-row .label { font-size: 15px; color: #7f8c8d; }
        .confirm-row .value { font-size: 18px; font-weight: 600; color: #2c3e50; }

        /* 备注 */
        .quick-tag { display: inline-block; padding: 8px 16px; font-size: 14px; color: #3498db; background: #f0f8ff; border: 1px solid #3498db; border-radius: 20px; cursor: pointer; transition: all 0.2s; user-select: none; }
        .quick-tag:hover { background: #3498db; color: white; }
        .quick-tag:active { transform: scale(0.95); }

        /* 按钮 */
        .btn-group { display: flex; gap: 16px; margin-top: 30px; padding: 0 10px; }
        .btn { flex: 1; padding: 18px; font-size: 17px; font-weight: 600; border: none; border-radius: 14px; cursor: pointer; transition: all 0.3s; letter-spacing: 1px; }
        .btn-primary { background: #3498db; color: white; }
        .btn-primary:hover { background: #2980b9; }
        .btn-primary:active { transform: scale(0.98); }
        .btn-secondary { background: #ecf0f1; color: #7f8c8d; }
        .btn-secondary:hover { background: #d5dbdb; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-danger { background: #e74c3c; color: white; }
        .btn-danger:active { transform: scale(0.98); }

        /* 订单管理页 */
        .stats-bar { background: white; border-radius: 16px; padding: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); margin-top: 20px; display: flex; justify-content: space-around; }
        .stat-item { text-align: center; }
        .stat-item .num { font-size: 28px; font-weight: 700; color: #3498db; }
        .stat-item .lbl { font-size: 13px; color: #95a5a6; margin-top: 4px; }

        .order-actions { display: flex; gap: 10px; margin: 16px 0; flex-wrap: wrap; }
        .order-actions .btn { flex: none; padding: 12px 20px; font-size: 14px; }

        .order-list { display: grid; gap: 12px; margin-top: 12px; }
        .order-card { background: white; border-radius: 14px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; align-items: center; gap: 14px; border-left: 4px solid #3498db; }
        .order-card.delivered { border-left-color: #27ae60; opacity: 0.7; }
        .order-card .checkbox { width: 24px; height: 24px; border-radius: 6px; border: 2px solid #ddd; display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer; font-size: 12px; color: white; }
        .order-card .checkbox.checked { background: #3498db; border-color: #3498db; }
        .order-card.delivered .checkbox { display: none; }
        .order-card .order-info { flex: 1; }
        .order-card .order-no { font-size: 16px; font-weight: 600; color: #2c3e50; }
        .order-card .order-meal { font-size: 13px; color: #7f8c8d; margin-top: 4px; }
        .order-card .order-remark { font-size: 12px; color: #e67e22; margin-top: 2px; }
        .order-card .order-time { font-size: 12px; color: #95a5a6; margin-top: 4px; }
        .order-card .status-tag { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 500; flex-shrink: 0; }
        .status-tag.pending { background: #fff3cd; color: #856404; }
        .status-tag.done { background: #d4edda; color: #155724; }

        /* 餐品管理 */
        .menu-item { background: white; border-radius: 14px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; align-items: center; gap: 14px; margin-top: 12px; }
        .menu-item .menu-icon { width: 50px; height: 50px; border-radius: 10px; background: #f0f0f0; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
        .menu-item .menu-info { flex: 1; }
        .menu-item .menu-name { font-size: 16px; font-weight: 600; color: #2c3e50; }
        .menu-item .menu-name-en { font-size: 11px; color: #95a5a6; font-style: italic; }
        .menu-item .menu-desc { font-size: 12px; color: #7f8c8d; margin-top: 2px; }
        .menu-item .menu-desc-en { font-size: 10px; color: #bdc3c7; font-style: italic; }
        .menu-item .menu-actions { display: flex; gap: 8px; }
        .menu-item .menu-actions button { padding: 6px 12px; font-size: 12px; border: none; border-radius: 6px; cursor: pointer; }
        .btn-edit { background: #3498db; color: white; }
        .btn-del { background: #e74c3c; color: white; }
        .btn-add { width: 100%; padding: 14px; font-size: 15px; font-weight: 500; border: 2px dashed #3498db; background: #f0f8ff; color: #3498db; border-radius: 14px; cursor: pointer; margin-top: 12px; }

        /* 弹窗 */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .modal-overlay.show { opacity: 1; pointer-events: auto; }
        .modal-box { background: white; border-radius: 20px; padding: 30px; max-width: 360px; width: 90%; }
        .modal-box .modal-title { font-size: 18px; font-weight: 600; color: #2c3e50; margin-bottom: 16px; text-align: center; }
        .modal-box .modal-input { width: 100%; padding: 14px; font-size: 16px; border: 2px solid #e0e6ed; border-radius: 10px; outline: none; text-align: center; margin-bottom: 16px; }
        .modal-box .modal-input:focus { border-color: #3498db; }
        .modal-box .modal-btns { display: flex; gap: 12px; }
        .modal-box .modal-btns .btn { padding: 14px; font-size: 15px; }

        /* 设置弹窗特殊样式 */
        .settings-status { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-radius: 12px; margin-bottom: 20px; font-size: 14px; font-weight: 500; }
        .settings-status.connected { background: #d4edda; color: #155724; }
        .settings-status.disconnected { background: #fff3cd; color: #856404; }
        .settings-status .status-icon { font-size: 18px; }

        /* 成功提示 */
        .success-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .success-overlay.show { opacity: 1; pointer-events: auto; }
        .success-box { background: white; border-radius: 20px; padding: 40px; text-align: center; max-width: 300px; }
        .success-box .icon { font-size: 48px; margin-bottom: 16px; }
        .success-box .title { font-size: 20px; font-weight: 600; color: #2c3e50; margin-bottom: 8px; }
        .success-box .desc { font-size: 14px; color: #7f8c8d; }

        /* 猫咪吉祥物 */
        .mascot { position: fixed; bottom: 24px; right: 24px; width: 110px; height: 110px; cursor: grab; z-index: 100; transition: transform 0.3s; touch-action: none; user-select: none; }
        .mascot:hover { transform: scale(1.08); }
        .mascot.dragging { cursor: grabbing; transition: none; }
        .mascot.hidden { display: none; }
        .mascot-close { position: absolute; top: -8px; right: -8px; width: 28px; height: 28px; background: #ff6b6b; border-radius: 50%; display: none; align-items: center; justify-content: center; color: white; font-size: 16px; font-weight: bold; cursor: pointer; z-index: 101; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
        .mascot-close.show { display: flex; }
        .mascot img { width: 100%; height: 100%; object-fit: contain; }

        /* 对话气泡 */
        .bubble { position: absolute; bottom: 120px; right: 0; background: white; border-radius: 16px; padding: 16px 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); max-width: 260px; font-size: 14px; line-height: 1.6; color: #34495e; opacity: 0; transform: translateY(10px); transition: all 0.3s; pointer-events: none; }
        .bubble.show { opacity: 1; transform: translateY(0); }
        .bubble::after { content: ''; position: absolute; bottom: -8px; right: 30px; width: 16px; height: 16px; background: white; transform: rotate(45deg); box-shadow: 2px 2px 4px rgba(0,0,0,0.1); }
        .bubble .bubble-name { font-weight: 600; color: #3498db; margin-bottom: 4px; }

        /* 加载提示 */
        .loading-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 300; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .loading-overlay.show { opacity: 1; pointer-events: auto; }
        .loading-spinner { width: 40px; height: 40px; border: 4px solid #e0e6ed; border-top-color: #3498db; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { font-size: 15px; color: #7f8c8d; margin-top: 16px; font-weight: 500; }
    </style>
</head>
<body>
    <!-- 设置按钮 -->
    <button class="settings-btn" id="settingsBtn" onclick="openSettings()">
        ⚙
        <div class="settings-dot" id="settingsDot"></div>
    </button>

    <!-- 右上角按钮 -->
    <div class="top-right-btns" id="topBtns" style="display:none;">
        <button class="top-btn secondary" id="btnBackToOrder" style="display:none;" onclick="showPage(4)">返回订单</button>
        <button class="top-btn secondary" id="btnBackToMeal" style="display:none;" onclick="showPage(1)">返回点餐</button>
        <button class="top-btn primary" id="btnViewOrders" style="display:none;" onclick="showPage(4)">查看订单</button>
        <button class="top-btn secondary" id="btnMenuMgmt" style="display:none;" onclick="showPage(5)">餐品管理</button>
    </div>

    <div class="container">
        <div class="header">
            <h1>🏥 医院点餐系统</h1>
            <div class="subtitle">健康体检 · 营养配餐</div>
        </div>

        <!-- 页面1：点餐入口 -->
        <div class="page active" id="page1">
            <div class="input-group">
                <label>请输入客户序号</label>
                <input type="text" id="customerNo" placeholder="如：一、二、三、秦、元..." maxlength="10">
                <div class="hint">请输入体检客户的序号，支持中文、数字、拼音</div>
            </div>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="goToPage2()">下一步</button>
            </div>
        </div>

        <!-- 页面2：点餐页 -->
        <div class="page" id="page2">
            <div style="margin-bottom: 16px;">
                <div style="font-size: 15px; color: #7f8c8d;">客户序号：<span id="displayCustomerNo" style="font-weight: 600; color: #3498db;"></span></div>
            </div>
            <div class="meal-list" id="mealList">
                <p style="text-align:center;color:#95a5a6;padding:40px;">请先在左上角⚙设置中连接系统</p>
            </div>
            <div class="btn-group">
                <button class="btn btn-secondary" onclick="goToPage1()">返回</button>
                <button class="btn btn-primary" id="btnNext" onclick="goToPage3()" disabled>下一步</button>
            </div>
        </div>

        <!-- 页面3：确认提交页 -->
        <div class="page" id="page3">
            <div class="confirm-box">
                <div class="confirm-row"><div class="label">客户序号</div><div class="value" id="confirmCustomerNo">-</div></div>
                <div class="confirm-row"><div class="label">所选套餐</div><div class="value" id="confirmMeal">-</div></div>
                <div class="confirm-row"><div class="label">套餐内容</div><div class="value" id="confirmMealDesc" style="font-size: 14px;">-</div></div>
            </div>
            <div style="background: white; border-radius: 16px; padding: 20px; margin-top: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.08);">
                <div style="font-size: 15px; color: #34495e; font-weight: 500; margin-bottom: 12px;">备注</div>
                <div style="position: relative;">
                    <textarea id="remarkInput" placeholder="输入备注信息..." maxlength="100" oninput="updateCharCount()" style="width: 100%; min-height: 80px; padding: 12px 60px 12px 14px; font-size: 15px; border: 2px solid #e0e6ed; border-radius: 12px; outline: none; resize: none; font-family: inherit; line-height: 1.5;"></textarea>
                    <div id="charCount" style="position: absolute; bottom: 8px; right: 12px; font-size: 13px; color: #95a5a6;">0/100</div>
                </div>
                <div style="margin-top: 12px; display: flex; flex-wrap: wrap; gap: 10px;">
                    <span class="quick-tag" onclick="addRemark('不加奶')">不加奶</span>
                    <span class="quick-tag" onclick="addRemark('不加糖')">不加糖</span>
                    <span class="quick-tag" onclick="addRemark('热饮')">热饮</span>
                    <span class="quick-tag" onclick="addRemark('冷饮')">冷饮</span>
                    <span class="quick-tag" onclick="addRemark('常温')">常温</span>
                </div>
            </div>
            <div class="btn-group">
                <button class="btn btn-secondary" onclick="goToPage2()">返回修改</button>
                <button class="btn btn-primary" onclick="submitOrder()">确认提交</button>
            </div>
        </div>

        <!-- 页面4：订单管理 -->
        <div class="page" id="page4">
            <div class="stats-bar">
                <div class="stat-item"><div class="num" id="statTotal">0</div><div class="lbl">今日下单</div></div>
                <div class="stat-item"><div class="num" id="statPending">0</div><div class="lbl">待出餐</div></div>
                <div class="stat-item"><div class="num" id="statDelivered">0</div><div class="lbl">已送达</div></div>
            </div>
            <div class="order-actions">
                <button class="btn btn-primary" id="btnBatchDeliver" onclick="batchDeliver()" disabled style="display:none;">批量确认送达</button>
                <button class="btn btn-danger" id="btnBatchDelete" onclick="showDeleteConfirm()" disabled style="display:none;">删除选中</button>
                <button class="btn btn-secondary" onclick="toggleSelectMode()" id="btnSelectMode">选择</button>
            </div>
            <div class="order-list" id="orderList"></div>
        </div>

        <!-- 页面5：餐品管理 -->
        <div class="page" id="page5">
            <div id="menuList"></div>
            <button class="btn-add" onclick="showAddMenuModal()">+ 添加新套餐</button>
        </div>
    </div>

    <!-- 设置弹窗 -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-box">
            <div class="modal-title">⚙ 系统设置</div>
            <div class="settings-status disconnected" id="settingsStatus">
                <span class="status-icon">🔴</span>
                <span>未连接</span>
            </div>
            <input type="password" class="modal-input" id="settingsPwdInput" placeholder="输入密码连接系统" onkeypress="if(event.key==='Enter')doSettingsConnect()">
            <div id="settingsPwdError" style="color:#e74c3c;font-size:13px;text-align:center;margin-bottom:12px;display:none;">密码错误</div>
            <div class="modal-btns">
                <button class="btn btn-secondary" onclick="closeSettings()">关闭</button>
                <button class="btn btn-primary" id="btnConnect" onclick="doSettingsConnect()">连接</button>
            </div>
        </div>
    </div>

    <!-- 删除确认弹窗 -->
    <div class="modal-overlay" id="deleteModal">
        <div class="modal-box">
            <div class="modal-title">确认删除</div>
            <p style="font-size: 14px; color: #7f8c8d; text-align: center; margin-bottom: 16px;">请输入密码确认删除操作</p>
            <input type="password" class="modal-input" id="deletePwdInput" placeholder="输入密码" oninput="checkDeletePwd()">
            <div class="modal-btns">
                <button class="btn btn-secondary" onclick="closeDeleteModal()">取消</button>
                <button class="btn btn-danger" id="btnConfirmDelete" onclick="confirmDelete()" disabled>确认删除</button>
            </div>
        </div>
    </div>

    <!-- 添加/编辑餐品弹窗 -->
    <div class="modal-overlay" id="menuModal">
        <div class="modal-box">
            <div class="modal-title" id="menuModalTitle">添加套餐</div>
            <input type="text" class="modal-input" id="menuNameInput" placeholder="套餐名称">
            <input type="text" class="modal-input" id="menuDescInput" placeholder="套餐描述">
            <div class="modal-btns">
                <button class="btn btn-secondary" onclick="closeMenuModal()">取消</button>
                <button class="btn btn-primary" onclick="saveMenu()">保存</button>
            </div>
        </div>
    </div>

    <!-- 加载提示 -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text" id="loadingText">正在提交...</div>
    </div>

    <!-- 成功提示 -->
    <div class="success-overlay" id="successOverlay" onclick="closeSuccess()">
        <div class="success-box">
            <div class="icon">🎉</div>
            <div class="title">提交成功！</div>
            <div class="desc">订单已记录，等待出餐</div>
        </div>
    </div>

    <!-- 猫咪 -->
    <div class="mascot" id="mascot" onclick="handleMascotClick(event)">
        <div class="mascot-close" id="mascotClose" onclick="hideMascot(event)">×</div>
        <img src="./mascot.png" alt="小助手" onerror="this.style.display='none'" draggable="false">
        <div class="bubble" id="bubble">
            <div class="bubble-name"> 小助手</div>
            <div id="bubbleText">嗨～请先输入客户序号哦～</div>
        </div>
    </div>

    <script>
        // ===== 系统配置（加密存储）=====
        const _ec = '==QUZxWeGBjVxRWbhBDZNlnWJZVMlJVdGJkWiBnMDNTM5NjdNt0Xwh2Z';
        const _uk = '0913';
        function _dk(p) {
            if (p !== _uk) return null;
            try { return atob(_ec.split('').reverse().join('')); } catch(e) { return null; }
        }

        // ===== 全局状态 =====
        let currentPage = 1;
        let customerNo = '', selectedMeal = null, selectedMealDesc = null, bubbleVisible = false;
        let selectMode = false, selectedOrders = [];
        let editingMenuId = null;
        let githubToken = localStorage.getItem('meal_token') || '';
        const REPO = 'karlwork511/karlwork';
        const BRANCH = 'main';
        const DELETE_PWD = '0913';

        const bubbleTexts = {
            1: '嗨～请先输入客户序号哦，比如"一"、"二"、"秦"都可以～',
            2: '选一个喜欢的套餐吧～点一下卡片就能选中哦～',
            3: '再检查一下信息对不对～没错的话就点"确认提交"啦～',
            4: '这里是订单列表哦～可以查看今天的订单状态～',
            5: '这里可以管理餐品～添加或修改套餐信息～'
        };

        // ===== GitHub API =====
        async function fetchJSON(path) {
            const resp = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}?ref=${BRANCH}`, {
                headers: { 'Authorization': `token ${githubToken}`, 'Accept': 'application/vnd.github.v3+json' }
            });
            if (!resp.ok) throw new Error('Fetch failed');
            const data = await resp.json();
            return JSON.parse(decodeURIComponent(escape(atob(data.content))));
        }

        async function saveJSON(path, content, sha, msg) {
            const body = { message: msg, content: btoa(unescape(encodeURIComponent(JSON.stringify(content, null, 2)))), branch: BRANCH };
            if (sha) body.sha = sha;
            const resp = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, {
                method: 'PUT',
                headers: { 'Authorization': `token ${githubToken}`, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            return resp.ok;
        }

        async function getSHA(path) {
            const resp = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}?ref=${BRANCH}`, {
                headers: { 'Authorization': `token ${githubToken}` }
            });
            return resp.ok ? (await resp.json()).sha : null;
        }

        // ===== 设置弹窗 =====
        function openSettings() {
            updateSettingsStatus();
            document.getElementById('settingsPwdInput').value = '';
            document.getElementById('settingsPwdError').style.display = 'none';
            document.getElementById('settingsModal').classList.add('show');
        }

        function closeSettings() {
            document.getElementById('settingsModal').classList.remove('show');
        }

        function updateSettingsStatus() {
            const statusEl = document.getElementById('settingsStatus');
            const dotEl = document.getElementById('settingsDot');
            const pwdInput = document.getElementById('settingsPwdInput');
            const pwdError = document.getElementById('settingsPwdError');
            const btnConnect = document.getElementById('btnConnect');
            if (githubToken) {
                statusEl.className = 'settings-status connected';
                statusEl.innerHTML = '<span class="status-icon">🟢</span><span>已连接GitHub</span>';
                dotEl.style.display = 'none';
                pwdInput.style.display = 'none';
                pwdError.style.display = 'none';
                btnConnect.textContent = '退出连接';
                btnConnect.className = 'btn btn-danger';
            } else {
                statusEl.className = 'settings-status disconnected';
                statusEl.innerHTML = '<span class="status-icon">🔴</span><span>未连接</span>';
                dotEl.style.display = 'block';
                pwdInput.style.display = 'block';
                btnConnect.textContent = '连接';
                btnConnect.className = 'btn btn-primary';
            }
        }

        function doSettingsConnect() {
            const btnConnect = document.getElementById('btnConnect');
            // 如果已连接，点击退出
            if (githubToken && btnConnect.textContent === '退出连接') {
                githubToken = '';
                localStorage.removeItem('meal_token');
                updateSettingsStatus();
                // 回到首页并提示重新连接
                document.getElementById('customerNo').value = '';
                if (currentPage === 2) {
                    document.getElementById('mealList').innerHTML = '<p style="text-align:center;color:#95a5a6;padding:40px;">请先在左上角⚙设置中连接系统</p>';
                }
                return;
            }
            // 未连接，输入密码连接
            const pwd = document.getElementById('settingsPwdInput').value;
            const token = _dk(pwd);
            if (token) {
                githubToken = token;
                localStorage.setItem('meal_token', token);
                updateSettingsStatus();
                closeSettings();
                // 已连接后刷新当前页面数据
                if (currentPage === 1) { /* 已在首页 */ }
                if (currentPage === 2) loadMenu();
                if (currentPage === 4) loadOrders();
                if (currentPage === 5) loadMenuList();
            } else {
                document.getElementById('settingsPwdInput').value = '';
                document.getElementById('settingsPwdError').style.display = 'block';
            }
        }

        function checkAuth() {
            if (githubToken) {
                loadMenu();
            }
        }

        // ===== 页面切换 =====
        function showPage(num) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page' + num).classList.add('active');
            currentPage = num;
            document.getElementById('bubbleText').textContent = bubbleTexts[num];
            autoShowBubble();

            // 顶部按钮控制
            document.getElementById('topBtns').style.display = [1,2,3,4,5].includes(num) ? 'flex' : 'none';
            document.getElementById('btnViewOrders').style.display = [1,2,3].includes(num) ? 'block' : 'none';
            document.getElementById('btnBackToOrder').style.display = [5].includes(num) ? 'block' : 'none';
            document.getElementById('btnBackToMeal').style.display = [4].includes(num) ? 'block' : 'none';
            document.getElementById('btnMenuMgmt').style.display = [4].includes(num) ? 'block' : 'none';

            if (num === 4) loadOrders();
            if (num === 5) loadMenuList();
        }

        // ===== 点餐流程 =====
        function goToPage1() { showPage(1); }
        function goToPage2() {
            if (!githubToken) { alert('请先在左上角设置中连接系统'); return; }
            customerNo = document.getElementById('customerNo').value.trim();
            if (!customerNo) { alert('请输入客户序号'); return; }
            document.getElementById('displayCustomerNo').textContent = customerNo;
            showPage(2);
            loadMenu();
        }

        async function loadMenu() {
            if (!githubToken) return;
            try {
                const menu = await fetchJSON('meal-ordering/data/menu.json');
                const list = document.getElementById('mealList');
                list.innerHTML = menu.filter(m => m.status === '上架').map(m => `
                    <div class="meal-card" onclick="selectMeal(this, '${m.name}', '${m.description}')">
                        <div class="meal-img">${m.icon || ''}</div>
                        <div class="meal-info">
                            <div class="meal-name">${m.name}</div>
                            <div class="meal-name-en">${m.name_en || ''}</div>
                            <div class="meal-desc">${m.description}</div>
                            <div class="meal-desc-en">${m.desc_en || ''}</div>
                        </div>
                        <div class="check-mark">✓</div>
                    </div>
                `).join('');
            } catch(e) { console.error(e); }
        }

        function selectMeal(el, name, desc) {
            document.querySelectorAll('.meal-card').forEach(c => c.classList.remove('selected'));
            el.classList.add('selected');
            selectedMeal = name; selectedMealDesc = desc;
            document.getElementById('btnNext').disabled = false;
        }

        function goToPage3() {
            if (!selectedMeal) { alert('请先选择一个套餐'); return; }
            document.getElementById('confirmCustomerNo').textContent = customerNo;
            document.getElementById('confirmMeal').textContent = selectedMeal;
            document.getElementById('confirmMealDesc').textContent = selectedMealDesc;
            showPage(3);
        }

        function updateCharCount() {
            const input = document.getElementById('remarkInput');
            document.getElementById('charCount').textContent = input.value.length + '/100';
        }

        function addRemark(text) {
            const input = document.getElementById('remarkInput');
            const current = input.value.trim();
            if (current.includes(text)) {
                input.value = current.replace(text, '').replace(/、{2,}/g, '、').replace(/^、|、$/g, '').trim();
            } else {
                input.value = current ? current + '、' + text : text;
            }
            if (input.value.length > 100) input.value = input.value.substring(0, 100);
            updateCharCount();
        }

        async function submitOrder() {
            const remark = document.getElementById('remarkInput').value.trim();
            const now = new Date();
            const today = now.toISOString().split('T')[0];
            const timeStr = now.toLocaleTimeString('zh-CN', { hour12: false });
            const order = {
                id: String(Date.now()).slice(-6),
                customer_no: customerNo,
                meal_name: selectedMeal,
                meal_desc: selectedMealDesc,
                remark: remark,
                status: '待出餐',
                submit_time: `${today} ${timeStr}`,
                deliver_time: null
            };

            showLoading('正在提交订单...');
            try {
                const path = `meal-ordering/data/orders/${today}.json`;
                let orders = [];
                try { orders = await fetchJSON(path); } catch(e) {}
                orders.push(order);
                const sha = await getSHA(path);
                await saveJSON(path, orders, sha, `Add order ${order.id}`);
                hideLoading();
                document.getElementById('successOverlay').classList.add('show');
            } catch(e) { hideLoading(); alert('提交失败，请重试'); }
        }

        function closeSuccess() {
            document.getElementById('successOverlay').classList.remove('show');
            customerNo = ''; selectedMeal = null; selectedMealDesc = null;
            document.getElementById('customerNo').value = '';
            document.getElementById('remarkInput').value = '';
            updateCharCount();
            document.querySelectorAll('.meal-card').forEach(c => c.classList.remove('selected'));
            document.getElementById('btnNext').disabled = true;
            showPage(1);
        }

        // ===== 订单管理 =====
        async function loadOrders() {
            const today = new Date().toISOString().split('T')[0];
            try {
                const orders = await fetchJSON(`meal-ordering/data/orders/${today}.json`);
                const total = orders.length;
                const pending = orders.filter(o => o.status === '待出餐').length;
                const delivered = orders.filter(o => o.status === '已送达').length;
                document.getElementById('statTotal').textContent = total;
                document.getElementById('statPending').textContent = pending;
                document.getElementById('statDelivered').textContent = delivered;

                const list = document.getElementById('orderList');
                list.innerHTML = orders.map((o, i) => `
                    <div class="order-card ${o.status === '已送达' ? 'delivered' : ''}" data-idx="${i}">
                        <div class="checkbox" onclick="toggleOrderSelect(${i})" id="cb_${i}">✓</div>
                        <div class="order-info">
                            <div class="order-no">序号：${o.customer_no}</div>
                            <div class="order-meal">${o.meal_name}${o.remark ? ' · ' + o.remark : ''}</div>
                            <div class="order-time">下单：${o.submit_time}${o.deliver_time ? ' → 送达：' + o.deliver_time : ''}</div>
                        </div>
                        <span class="status-tag ${o.status === '已送达' ? 'done' : 'pending'}">${o.status}</span>
                    </div>
                `).join('');
            } catch(e) { document.getElementById('orderList').innerHTML = '<p style="text-align:center;color:#95a5a6;padding:40px;">今日暂无订单</p>'; }
        }

        function toggleSelectMode() {
            selectMode = !selectMode;
            document.getElementById('btnSelectMode').textContent = selectMode ? '取消选择' : '选择';
            document.querySelectorAll('.checkbox').forEach(cb => cb.style.display = selectMode ? 'flex' : 'none');
            if (!selectMode) {
                selectedOrders = [];
                document.querySelectorAll('.checkbox').forEach(cb => cb.classList.remove('checked'));
                document.getElementById('btnBatchDeliver').style.display = 'none';
                document.getElementById('btnBatchDelete').style.display = 'none';
            }
        }

        function toggleOrderSelect(idx) {
            if (!selectMode) return;
            const cb = document.getElementById('cb_' + idx);
            cb.classList.toggle('checked');
            if (cb.classList.contains('checked')) { selectedOrders.push(idx); }
            else { selectedOrders = selectedOrders.filter(i => i !== idx); }
            document.getElementById('btnBatchDeliver').style.display = selectedOrders.length > 0 ? 'block' : 'none';
            document.getElementById('btnBatchDelete').style.display = selectedOrders.length > 0 ? 'block' : 'none';
            document.getElementById('btnBatchDeliver').disabled = selectedOrders.length === 0;
            document.getElementById('btnBatchDelete').disabled = selectedOrders.length === 0;
        }

        // ===== 加载提示 =====
        function showLoading(text) {
            document.getElementById('loadingText').textContent = text || '正在提交...';
            document.getElementById('loadingOverlay').classList.add('show');
        }
        function hideLoading() {
            document.getElementById('loadingOverlay').classList.remove('show');
        }

        async function batchDeliver() {
            if (selectedOrders.length === 0) return;
            showLoading('正在确认送达...');
            const today = new Date().toISOString().split('T')[0];
            const timeStr = new Date().toLocaleTimeString('zh-CN', { hour12: false });
            try {
                const path = `meal-ordering/data/orders/${today}.json`;
                let orders = await fetchJSON(path);
                selectedOrders.forEach(idx => {
                    orders[idx].status = '已送达';
                    orders[idx].deliver_time = `${today} ${timeStr}`;
                });
                const sha = await getSHA(path);
                await saveJSON(path, orders, sha, 'Batch deliver');
                selectedOrders = [];
                hideLoading();
                loadOrders();
                toggleSelectMode();
                alert('送达确认成功！');
            } catch(e) { hideLoading(); alert('操作失败'); }
        }

        // ===== 删除订单 =====
        function showDeleteConfirm() { document.getElementById('deleteModal').classList.add('show'); }
        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.remove('show');
            document.getElementById('deletePwdInput').value = '';
            document.getElementById('btnConfirmDelete').disabled = true;
        }
        function checkDeletePwd() {
            const pwd = document.getElementById('deletePwdInput').value;
            document.getElementById('btnConfirmDelete').disabled = pwd !== DELETE_PWD;
        }
        async function confirmDelete() {
            if (selectedOrders.length === 0) return;
            showLoading('正在删除订单...');
            const today = new Date().toISOString().split('T')[0];
            try {
                const path = `meal-ordering/data/orders/${today}.json`;
                let orders = await fetchJSON(path);
                orders = orders.filter((_, i) => !selectedOrders.includes(i));
                const sha = await getSHA(path);
                await saveJSON(path, orders, sha, 'Delete orders');
                selectedOrders = [];
                closeDeleteModal();
                hideLoading();
                loadOrders();
                toggleSelectMode();
            } catch(e) { hideLoading(); alert('删除失败'); }
        }

        // ===== 餐品管理 =====
        async function loadMenuList() {
            if (!githubToken) return;
            try {
                const menu = await fetchJSON('meal-ordering/data/menu.json');
                const list = document.getElementById('menuList');
                list.innerHTML = menu.map((m, i) => `
                    <div class="menu-item">
                        <div class="menu-icon">${m.icon || '🥗'}</div>
                        <div class="menu-info">
                            <div class="menu-name">${m.name}</div>
                            <div class="menu-name-en">${m.name_en || ''}</div>
                            <div class="menu-desc">${m.description}</div>
                            <div class="menu-desc-en">${m.desc_en || ''}</div>
                        </div>
                        <div class="menu-actions">
                            <button class="btn-edit" onclick="editMenu(${i})">编辑</button>
                            <button class="btn-del" onclick="deleteMenu(${i})">删除</button>
                        </div>
                    </div>
                `).join('');
            } catch(e) {}
        }



        function showAddMenuModal() { editingMenuId = null; document.getElementById('menuModalTitle').textContent = '添加套餐'; document.getElementById('menuNameInput').value = ''; document.getElementById('menuDescInput').value = ''; document.getElementById('menuModal').classList.add('show'); }
        function closeMenuModal() { document.getElementById('menuModal').classList.remove('show'); }

        async function editMenu(idx) {
            const menu = await fetchJSON('meal-ordering/data/menu.json');
            editingMenuId = idx;
            document.getElementById('menuModalTitle').textContent = '编辑套餐';
            document.getElementById('menuNameInput').value = menu[idx].name;
            document.getElementById('menuDescInput').value = menu[idx].description;
            document.getElementById('menuModal').classList.add('show');
        }

        async function saveMenu() {
            const name = document.getElementById('menuNameInput').value.trim();
            const desc = document.getElementById('menuDescInput').value.trim();
            if (!name || !desc) { alert('请填写完整'); return; }
            try {
                const path = 'meal-ordering/data/menu.json';
                let menu = await fetchJSON(path);
                if (editingMenuId !== null) {
                    menu[editingMenuId].name = name;
                    menu[editingMenuId].description = desc;
                } else {
                    menu.push({ id: menu.length + 1, name, description: desc, icon: '🥗', status: '上架' });
                }
                const sha = await getSHA(path);
                await saveJSON(path, menu, sha, editingMenuId !== null ? 'Edit menu' : 'Add menu');
                closeMenuModal();
                loadMenuList();
            } catch(e) { alert('保存失败'); }
        }

        async function deleteMenu(idx) {
            if (!confirm('确定删除该套餐？')) return;
            try {
                const path = 'meal-ordering/data/menu.json';
                let menu = await fetchJSON(path);
                menu.splice(idx, 1);
                const sha = await getSHA(path);
                await saveJSON(path, menu, sha, 'Delete menu');
                loadMenuList();
            } catch(e) { alert('删除失败'); }
        }

        // ===== 猫咪拖拽 =====
        let isDragging = false, isClick = false, startX, startY, offsetX, offsetY, dragTimeout;
        const mascot = document.getElementById('mascot');
        const mascotClose = document.getElementById('mascotClose');

        function getPos(e) { return e.touches?.length ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : { x: e.clientX, y: e.clientY }; }
        function startDrag(e) { e.preventDefault(); const pos = getPos(e), rect = mascot.getBoundingClientRect(); startX = pos.x; startY = pos.y; offsetX = pos.x - rect.left; offsetY = pos.y - rect.top; isDragging = false; isClick = true; dragTimeout = setTimeout(() => { isClick = false; }, 150); }
        function doDrag(e) { if (!offsetX) return; e.preventDefault(); const pos = getPos(e); if (Math.abs(pos.x - startX) > 5 || Math.abs(pos.y - startY) > 5) { isDragging = true; isClick = false; clearTimeout(dragTimeout); mascot.classList.add('dragging'); } if (isDragging) { mascot.style.left = (pos.x - offsetX) + 'px'; mascot.style.top = (pos.y - offsetY) + 'px'; mascot.style.right = 'auto'; mascot.style.bottom = 'auto'; } }
        function endDrag(e) { clearTimeout(dragTimeout); mascot.classList.remove('dragging'); if (isClick && !isDragging) { mascotClose.classList.toggle('show'); toggleBubble(); } offsetX = 0; offsetY = 0; setTimeout(() => { isDragging = false; isClick = false; }, 50); }
        mascot.addEventListener('mousedown', startDrag); document.addEventListener('mousemove', doDrag); document.addEventListener('mouseup', endDrag);
        mascot.addEventListener('touchstart', startDrag); document.addEventListener('touchmove', doDrag); document.addEventListener('touchend', endDrag);
        function handleMascotClick(e) { if (isDragging) e.stopPropagation(); }
        function hideMascot(e) { e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation(); mascot.style.display = 'none'; document.getElementById('bubble').classList.remove('show'); bubbleVisible = false; return false; }

        // ===== 气泡 =====
        function autoShowBubble() { const b = document.getElementById('bubble'); bubbleVisible = true; b.classList.add('show'); setTimeout(() => { bubbleVisible = false; b.classList.remove('show'); }, 3000); }
        function toggleBubble() { const b = document.getElementById('bubble'); bubbleVisible = !bubbleVisible; b.classList.toggle('show', bubbleVisible); if (bubbleVisible) setTimeout(() => { if (bubbleVisible) { bubbleVisible = false; b.classList.remove('show'); } }, 3000); }

        // ===== 初始化 =====
        document.getElementById('customerNo').addEventListener('keypress', function(e) { if (e.key === 'Enter') goToPage2(); });
        window.addEventListener('load', () => {
            checkAuth();
            updateSettingsStatus();
            setTimeout(autoShowBubble, 500);
            document.querySelectorAll('.checkbox').forEach(cb => cb.style.display = 'none');
        });
    </script>
</body>
</html>
