<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Karl 工作台</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--bg-primary:#070A14;
--glass-bg:rgba(255,255,255,0.05);
--glass-border:rgba(255,255,255,0.1);
--glass-hover:rgba(255,255,255,0.08);
--accent:#7C5CFF;
--accent-light:#69E7FF;
--success:#62FAD3;
--warning:#FFB86C;
--danger:#FF6B6B;
--text-primary:#F7FAFF;
--text-secondary:#9AA7C7;
--text-muted:#6B7280;
--radius:12px;
--radius-lg:16px;
--transition:all 0.3s cubic-bezier(0.4,0,0.2,1);
}
html{scroll-behavior:smooth}
body{
font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',sans-serif;
background:var(--bg-primary);
color:var(--text-primary);
line-height:1.6;
min-height:100vh;
overflow-x:hidden;
padding-bottom:80px;
}
body::before{
content:'';
position:fixed;
top:0;left:0;right:0;bottom:0;
background:
radial-gradient(ellipse at 20% 20%,rgba(124,92,255,0.15) 0%,transparent 50%),
radial-gradient(ellipse at 80% 80%,rgba(105,231,255,0.1) 0%,transparent 50%);
pointer-events:none;
z-index:0;
}
.container{
position:relative;
z-index:1;
max-width:1400px;
margin:0 auto;
padding:0 16px;
}
/* 顶部导航 */
.navbar{
position:sticky;
top:0;
z-index:100;
backdrop-filter:blur(20px);
background:rgba(7,10,20,0.8);
border-bottom:1px solid var(--glass-border);
padding:12px 0;
}
.navbar-content{
display:flex;
align-items:center;
justify-content:space-between;
}
.logo{
display:flex;
align-items:center;
gap:10px;
font-size:18px;
font-weight:600;
}
.logo-icon{
width:32px;height:32px;
background:linear-gradient(135deg,var(--accent),var(--accent-light));
border-radius:8px;
display:flex;align-items:center;justify-content:center;
font-size:16px;
}
.sync-status {
display: inline-flex;
align-items: center;
gap: 4px;
font-size: 11px;
color: var(--text-muted);
padding: 4px 8px;
border-radius: 10px;
background: var(--glass-bg);
}
.sync-status.syncing { color: var(--warning); }
.sync-status.synced { color: var(--success); }
.sync-status.error { color: var(--danger); }
.sync-status .dot {
width: 5px; height: 5px;
border-radius: 50%;
background: currentColor;
}
/* 底部导航 */
.bottom-nav{
position:fixed;
bottom:0;
left:0;
right:0;
z-index:100;
backdrop-filter:blur(20px);
background:rgba(7,10,20,0.9);
border-top:1px solid var(--glass-border);
padding:8px 0 calc(8px + env(safe-area-inset-bottom));
}
.bottom-nav-content{
display:flex;
justify-content:space-around;
align-items:center;
}
.bottom-nav-item{
display:flex;
flex-direction:column;
align-items:center;
gap:4px;
padding:8px 16px;
border-radius:12px;
color:var(--text-muted);
text-decoration:none;
font-size:11px;
transition:var(--transition);
cursor:pointer;
}
.bottom-nav-item:hover,.bottom-nav-item.active{
color:var(--accent);
background:var(--glass-bg);
}
.bottom-nav-icon{
font-size:22px;
}
/* 主内容 */
main{padding:16px 0 24px}
.welcome{text-align:center;padding:24px 0 20px}
.welcome h1{font-size:22px;font-weight:700;margin-bottom:4px}
.welcome p{color:var(--text-secondary);font-size:13px}
.stats-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
margin-bottom:24px;
}
.stat-card{
background:var(--glass-bg);
backdrop-filter:blur(20px);
border:1px solid var(--glass-border);
border-radius:var(--radius);
padding:16px 12px;
text-align:center;
}
.stat-number{
font-size:28px;
font-weight:700;
background:linear-gradient(135deg,var(--accent),var(--accent-light));
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
background-clip:text;
}
.stat-label{
color:var(--text-secondary);
font-size:12px;
margin-top:2px;
}
.section{margin-bottom:32px}
.section-header{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:14px;
padding:0 4px;
}
.section-title{
font-size:17px;
font-weight:600;
display:flex;
align-items:center;
gap:8px;
}
.section-title::before{
content:'';
width:3px;
height:16px;
background:linear-gradient(180deg,var(--accent),var(--accent-light));
border-radius:2px;
}
.btn{
padding:10px 16px;
border-radius:10px;
border:none;
font-size:14px;
font-weight:500;
cursor:pointer;
transition:var(--transition);
display:inline-flex;
align-items:center;
gap:6px;
}
.btn-primary{
background:linear-gradient(135deg,var(--accent),#9B7BFF);
color:white;
}
.btn-primary:active{
transform:scale(0.96);
}
.btn-secondary{
background:var(--glass-bg);
color:var(--text-primary);
border:1px solid var(--glass-border);
}
.btn-secondary:active{
background:var(--glass-hover);
}
.btn-icon{
width:36px;
height:36px;
padding:0;
border-radius:10px;
display:flex;
align-items:center;
justify-content:center;
font-size:18px;
}
.glass-card{
background:var(--glass-bg);
backdrop-filter:blur(20px);
border:1px solid var(--glass-border);
border-radius:var(--radius);
padding:16px;
}
.todo-list{display:flex;flex-direction:column;gap:10px}
.todo-item{
display:flex;
align-items:center;
gap:12px;
padding:14px;
background:var(--glass-bg);
border:1px solid var(--glass-border);
border-radius:var(--radius);
transition:var(--transition);
}
.todo-item:active{
background:var(--glass-hover);
}
.todo-item.completed{opacity:0.5}
.todo-item.completed .todo-title{text-decoration:line-through;color:var(--text-muted)}
.todo-checkbox{
width:24px;height:24px;
border:2px solid var(--glass-border);
border-radius:8px;
cursor:pointer;
transition:var(--transition);
flex-shrink:0;
position:relative;
}
.todo-checkbox:active{
transform:scale(0.9);
}
.todo-checkbox.checked{
background:linear-gradient(135deg,var(--accent),var(--accent-light));
border-color:var(--accent);
}
.todo-checkbox.checked::after{
content:'✓';
position:absolute;
top:50%;left:50%;
transform:translate(-50%,-50%);
color:white;
font-size:14px;
font-weight:bold;
}
.todo-content{flex:1;min-width:0}
.todo-title{font-size:15px;font-weight:500;margin-bottom:4px;word-break:break-word}
.todo-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.todo-tag{
font-size:11px;
padding:2px 8px;
border-radius:12px;
font-weight:500;
}
.todo-priority{
font-size:10px;
padding:2px 6px;
border-radius:4px;
font-weight:600;
}
.todo-priority.high{background:rgba(255,107,107,0.2);color:var(--danger)}
.todo-priority.medium{background:rgba(255,184,108,0.2);color:var(--warning)}
.todo-priority.low{background:rgba(98,250,211,0.2);color:var(--success)}
.todo-date{font-size:11px;color:var(--text-muted)}
.todo-actions{display:flex;gap:4px;flex-shrink:0}
.todo-action-btn{
width:32px;height:32px;
border-radius:8px;
border:none;
background:transparent;
cursor:pointer;
transition:var(--transition);
display:flex;align-items:center;justify-content:center;
font-size:16px;
}
.todo-action-btn:active{background:var(--glass-bg)}
.todo-action-btn.delete:active{background:rgba(255,107,107,0.15)}
.empty-state{
text-align:center;
padding:32px 16px;
color:var(--text-muted);
}
.empty-state-icon{font-size:40px;margin-bottom:8px;opacity:0.5}
.category-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
}
.category-item{
display:flex;
align-items:center;
justify-content:space-between;
padding:12px 14px;
background:var(--glass-bg);
border:1px solid var(--glass-border);
border-radius:var(--radius);
}
.category-name{
display:flex;
align-items:center;
gap:8px;
font-size:13px;
font-weight:500;
}
.category-color{
width:14px;height:14px;
border-radius:4px;
}
.category-count{
background:var(--glass-bg);
padding:2px 8px;
border-radius:10px;
font-size:11px;
color:var(--text-secondary);
}
.category-actions{display:flex;gap:2px}
.shortcuts-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
}
.shortcut-card{
padding:16px 12px;
background:var(--glass-bg);
border:1px solid var(--glass-border);
border-radius:var(--radius);
text-align:center;
cursor:pointer;
text-decoration:none;
color:inherit;
}
.shortcut-card:active{
background:var(--glass-hover);
}
.shortcut-icon{font-size:24px;margin-bottom:6px}
.shortcut-label{font-size:13px;font-weight:500}
.filter-bar{
display:flex;
flex-wrap:nowrap;
gap:8px;
margin-bottom:14px;
overflow-x:auto;
padding-bottom:4px;
-webkit-overflow-scrolling:touch;
scrollbar-width:none;
}
.filter-bar::-webkit-scrollbar{display:none}
.filter-tag{
padding:6px 14px;
border-radius:20px;
font-size:13px;
font-weight:500;
cursor:pointer;
background:var(--glass-bg);
border:1px solid var(--glass-border);
color:var(--text-secondary);
transition:var(--transition);
white-space:nowrap;
flex-shrink:0;
}
.filter-tag:active{
background:var(--glass-hover);
}
.filter-tag.active{
background:linear-gradient(135deg,var(--accent),#9B7BFF);
color:white;
border-color:transparent;
}
/* 模态框 */
.modal{
display:none;
position:fixed;
top:0;left:0;right:0;bottom:0;
background:rgba(0,0,0,0.6);
backdrop-filter:blur(4px);
z-index:200;
}
.modal.active{display:block}
.modal-backdrop{
position:absolute;
top:0;left:0;right:0;bottom:0;
}
/* 底部弹出式模态框（移动端） */
.modal-content{
position:absolute;
bottom:0;
left:0;
right:0;
background:var(--bg-primary);
border:1px solid var(--glass-border);
border-radius:20px 20px 0 0;
padding:24px 20px calc(24px + env(safe-area-inset-bottom));
max-height:85vh;
overflow-y:auto;
transform:translateY(100%);
transition:transform 0.3s ease;
}
.modal.active .modal-content{
transform:translateY(0);
}
.modal-handle{
width:40px;
height:4px;
background:var(--glass-border);
border-radius:2px;
margin:0 auto 20px;
}
.modal-header{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:20px;
}
.modal-title{font-size:18px;font-weight:600}
.modal-close{
width:32px;height:32px;
border-radius:8px;
border:none;
background:var(--glass-bg);
color:var(--text-secondary);
cursor:pointer;
font-size:20px;
display:flex;align-items:center;justify-content:center;
}
.form-group{margin-bottom:18px}
.form-label{
display:block;
font-size:13px;
font-weight:500;
margin-bottom:8px;
color:var(--text-secondary);
}
.form-input,.form-select,.form-textarea{
width:100%;
padding:12px 14px;
background:var(--glass-bg);
border:1px solid var(--glass-border);
border-radius:10px;
color:var(--text-primary);
font-size:15px;
transition:var(--transition);
}
.form-input:focus,.form-select:focus,.form-textarea:focus{
outline:none;
border-color:var(--accent);
}
.form-textarea{resize:vertical;min-height:80px;font-family:inherit}
.form-select{cursor:pointer}
.form-select option{background:var(--bg-primary)}
.color-picker{
display:flex;
gap:10px;
flex-wrap:wrap;
}
.color-option{
width:36px;height:36px;
border-radius:10px;
cursor:pointer;
border:2px solid transparent;
transition:var(--transition);
}
.color-option:active{transform:scale(0.9)}
.color-option.selected{border-color:white}
/* 桌面端样式 */
@media (min-width: 768px) {
body{padding-bottom:0}
.bottom-nav{display:none}
.container{padding:0 24px}
.welcome{padding:48px 0 32px}
.welcome h1{font-size:32px}
.welcome p{font-size:16px}
.stats-grid{
grid-template-columns:repeat(4,1fr);
gap:16px;
margin-bottom:32px;
}
.stat-card{padding:24px}
.stat-number{font-size:36px}
.stat-label{font-size:14px}
.section{margin-bottom:48px}
.section-title{font-size:20px}
.glass-card{padding:24px}
.todo-list{gap:12px}
.todo-item{padding:16px 20px}
.category-grid{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.shortcuts-grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.modal-content{
position:relative;
bottom:auto;
left:50%;
top:50%;
transform:translate(-50%,-50%);
border-radius:var(--radius-lg);
max-width:480px;
width:90%;
}
.modal.active .modal-content{
transform:translate(-50%,-50%);
}
.modal-handle{display:none}
}
</style>
</head>
<body>
<nav class="navbar">
<div class="container navbar-content">
<div class="logo">
<div class="logo-icon">K</div>
<span>Karl</span>
</div>
<div id="syncStatus" class="sync-status">
<span class="dot"></span>
<span id="syncStatusText">检查中...</span>
</div>
</div>
</nav>

<main class="container">
<div class="welcome">
<h1 id="greeting">你好，Karl 👋</h1>
<p id="welcomeDate"></p>
</div>

<div class="stats-grid">
<div class="stat-card">
<div class="stat-number" id="stat-total">0</div>
<div class="stat-label">总待办</div>
</div>
<div class="stat-card">
<div class="stat-number" id="stat-completed">0</div>
<div class="stat-label">已完成</div>
</div>
<div class="stat-card">
<div class="stat-number" id="stat-progress">0</div>
<div class="stat-label">进行中</div>
</div>
<div class="stat-card">
<div class="stat-number" id="stat-rate">0%</div>
<div class="stat-label">完成率</div>
</div>
</div>

<section id="todos" class="section">
<div class="section-header">
<div class="section-title">待办事项</div>
<button class="btn btn-primary" onclick="openAddModal()">+ 新增</button>
</div>
<div class="filter-bar" id="filterBar"></div>
<div class="glass-card">
<div class="todo-list" id="todoList"></div>
</div>
</section>

<section id="categories" class="section">
<div class="section-header">
<div class="section-title">分类管理</div>
<button class="btn btn-secondary" onclick="openCategoryModal()">+ 新增</button>
</div>
<div class="category-grid" id="categoryList"></div>
</section>

<section id="shortcuts" class="section">
<div class="section-header">
<div class="section-title">快捷入口</div>
</div>
<div class="shortcuts-grid">
<a class="shortcut-card" href="https://github.com/karlwork511/karlwork" target="_blank">
<div class="shortcut-icon">📦</div>
<div class="shortcut-label">GitHub</div>
</a>
<a class="shortcut-card" onclick="openSettings()">
<div class="shortcut-icon">⚙️</div>
<div class="shortcut-label">设置</div>
</a>
<a class="shortcut-card" onclick="exportData()">
<div class="shortcut-icon">📥</div>
<div class="shortcut-label">导出数据</div>
</a>
<a class="shortcut-card" onclick="importData()">
<div class="shortcut-icon">📤</div>
<div class="shortcut-label">导入数据</div>
</a>
</div>
</section>
</main>

<!-- 底部导航 -->
<nav class="bottom-nav">
<div class="bottom-nav-content">
<a class="bottom-nav-item active" href="#todos">
<span class="bottom-nav-icon">📝</span>
<span>待办</span>
</a>
<a class="bottom-nav-item" href="#categories">
<span class="bottom-nav-icon">🏷️</span>
<span>分类</span>
</a>
<a class="bottom-nav-item" onclick="openAddModal()">
<span class="bottom-nav-icon">➕</span>
<span>新增</span>
</a>
<a class="bottom-nav-item" onclick="openSettings()">
<span class="bottom-nav-icon">⚙️</span>
<span>设置</span>
</a>
</div>
</nav>

<!-- 新增待办模态框 -->
<div class="modal" id="addModal">
<div class="modal-backdrop" onclick="closeModal('addModal')"></div>
<div class="modal-content">
<div class="modal-handle"></div>
<div class="modal-header">
<div class="modal-title">新增待办</div>
<button class="modal-close" onclick="closeModal('addModal')">×</button>
</div>
<form id="addForm" onsubmit="submitTodo(event)">
<div class="form-group">
<label class="form-label">标题 *</label>
<input class="form-input" id="todoTitle" required placeholder="输入待办事项">
</div>
<div class="form-group">
<label class="form-label">分类</label>
<select class="form-select" id="todoCategory"></select>
</div>
<div class="form-group">
<label class="form-label">优先级</label>
<select class="form-select" id="todoPriority">
<option value="">无</option>
<option value="high">高</option>
<option value="medium">中</option>
<option value="low">低</option>
</select>
</div>
<div class="form-group">
<label class="form-label">备注</label>
<textarea class="form-textarea" id="todoNote" placeholder="补充说明（可选）"></textarea>
</div>
<button type="submit" class="btn btn-primary" style="width:100%;justify-content:center">添加待办</button>
</form>
</div>
</div>

<!-- 新增分类模态框 -->
<div class="modal" id="categoryModal">
<div class="modal-backdrop" onclick="closeModal('categoryModal')"></div>
<div class="modal-content">
<div class="modal-handle"></div>
<div class="modal-header">
<div class="modal-title">新增分类</div>
<button class="modal-close" onclick="closeModal('categoryModal')">×</button>
</div>
<form onsubmit="submitCategory(event)">
<div class="form-group">
<label class="form-label">分类名称 *</label>
<input class="form-input" id="categoryName" required placeholder="输入分类名称">
</div>
<div class="form-group">
<label class="form-label">分类颜色</label>
<div class="color-picker" id="colorPicker">
<div class="color-option selected" style="background:#7C5CFF" data-color="#7C5CFF"></div>
<div class="color-option" style="background:#62FAD3" data-color="#62FAD3"></div>
<div class="color-option" style="background:#69E7FF" data-color="#69E7FF"></div>
<div class="color-option" style="background:#FFB86C" data-color="#FFB86C"></div>
<div class="color-option" style="background:#FF6B6B" data-color="#FF6B6B"></div>
<div class="color-option" style="background:#F472B6" data-color="#F472B6"></div>
<div class="color-option" style="background:#34D399" data-color="#34D399"></div>
<div class="color-option" style="background:#FBBF24" data-color="#FBBF24"></div>
</div>
</div>
<button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:8px">添加分类</button>
</form>
</div>
</div>

<!-- 设置模态框 -->
<div class="modal" id="settingsModal">
<div class="modal-backdrop" onclick="closeModal('settingsModal')"></div>
<div class="modal-content">
<div class="modal-handle"></div>
<div class="modal-header">
<div class="modal-title">设置</div>
<button class="modal-close" onclick="closeModal('settingsModal')">×</button>
</div>
<div style="margin-bottom:24px">
<h3 style="font-size:15px;margin-bottom:12px">GitHub 同步</h3>
<p style="font-size:12px;color:var(--text-secondary);margin-bottom:12px">
配置 Token 后，数据自动同步到 GitHub。
</p>
<div class="form-group">
<label class="form-label">GitHub Token</label>
<input class="form-input" id="githubToken" type="password" placeholder="ghp_xxxx">
</div>
<div style="display:flex;gap:8px;flex-wrap:wrap">
<button class="btn btn-primary" onclick="testGitHubConnection()">测试</button>
<button class="btn btn-secondary" onclick="saveGitHubSettings()">保存</button>
<button class="btn btn-secondary" onclick="syncFromGitHub()" style="color:var(--accent-light)">拉取</button>
<button class="btn btn-secondary" onclick="syncToGitHub()" style="color:var(--success)">推送</button>
</div>
<div id="githubTestResult" style="margin-top:10px;font-size:12px"></div>
</div>
<hr style="border:none;border-top:1px solid var(--glass-border);margin:20px 0">
<div>
<h3 style="font-size:15px;margin-bottom:12px">数据管理</h3>
<div style="display:flex;gap:8px;flex-wrap:wrap">
<button class="btn btn-secondary" onclick="clearData()" style="color:var(--danger)">清空数据</button>
</div>
<input type="file" id="importFile" accept=".json" style="display:none" onchange="handleImport(event)">
</div>
</div>
</div>

<script>
// ========== 配置 ==========
const GITHUB_OWNER = 'karlwork511';
const GITHUB_REPO = 'karlwork';
const GITHUB_FILE = 'todos.json';
const GITHUB_API = 'https://api.github.com';

// ========== 数据存储 ==========
let todos = [];
let categories = [];
let currentFilter = 'all';
let syncTimer = null;
let githubFileSha = null;

const DEFAULT_CATEGORIES = [
{id:1, name:'工作', color:'#7C5CFF'},
{id:2, name:'生活', color:'#62FAD3'},
{id:3, name:'学习', color:'#69E7FF'}
];

// ========== GitHub 同步 ==========
function getGitHubToken() {
return localStorage.getItem('github-token') || '';
}

function setGitHubToken(token) {
localStorage.setItem('github-token', token);
}

async function githubAPI(path, options = {}) {
const token = getGitHubToken();
const headers = {
'Accept': 'application/vnd.github.v3+json',
...options.headers,
};
if (token) {
headers['Authorization'] = `Bearer ${token}`;
}
return await fetch(`${GITHUB_API}${path}`, { ...options, headers });
}

async function loadFromGitHub() {
const token = getGitHubToken();
if (!token) {
updateSyncStatus('error', '未配置');
return false;
}

try {
updateSyncStatus('syncing', '同步中');
const response = await githubAPI(`/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`);

if (response.status === 401) {
updateSyncStatus('error', 'Token无效');
return false;
}

if (response.status === 404) {
updateSyncStatus('synced', '本地');
loadFromLocal();
return true;
}

if (!response.ok) throw new Error(`HTTP ${response.status}`);

const data = await response.json();
githubFileSha = data.sha;
const content = decodeBase64(data.content);
const parsed = JSON.parse(content);

localStorage.setItem('karl-todos', JSON.stringify(parsed.todos || []));
localStorage.setItem('karl-categories', JSON.stringify(parsed.categories || DEFAULT_CATEGORIES));

todos = parsed.todos || [];
categories = parsed.categories || DEFAULT_CATEGORIES;

updateSyncStatus('synced', `已同步`);
return true;
} catch (error) {
console.error('GitHub 同步失败:', error);
updateSyncStatus('error', '失败');
loadFromLocal();
return false;
}
}

async function saveToGitHub() {
const token = getGitHubToken();
if (!token) return;

if (syncTimer) clearTimeout(syncTimer);
syncTimer = setTimeout(async () => {
try {
updateSyncStatus('syncing', '保存中');
const content = JSON.stringify({ todos, categories }, null, 2);
const encoded = encodeBase64(content);

const getResponse = await githubAPI(`/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`);
let sha = null;
if (getResponse.ok) {
const currentData = await getResponse.json();
sha = currentData.sha;
githubFileSha = sha;
}

const body = {
message: `Update todos - ${new Date().toISOString()}`,
content: encoded,
};
if (sha) body.sha = sha;

const putResponse = await fetch(`${GITHUB_API}/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`, {
method: 'PUT',
headers: {
'Authorization': `Bearer ${token}`,
'Accept': 'application/vnd.github.v3+json',
'Content-Type': 'application/json',
},
body: JSON.stringify(body),
});

if (putResponse.ok) {
const result = await putResponse.json();
githubFileSha = result.content.sha;
updateSyncStatus('synced', `已保存`);
} else {
throw new Error(`HTTP ${putResponse.status}`);
}
} catch (error) {
console.error('保存到 GitHub 失败:', error);
updateSyncStatus('error', '失败');
}
}, 3000);
}

function loadFromLocal() {
todos = JSON.parse(localStorage.getItem('karl-todos') || '[]');
categories = JSON.parse(localStorage.getItem('karl-categories') || JSON.stringify(DEFAULT_CATEGORIES));
}

function encodeBase64(str) {
return btoa(unescape(encodeURIComponent(str)));
}
function decodeBase64(str) {
str = str.replace(/\n/g, '');
return decodeURIComponent(escape(atob(str)));
}

function updateSyncStatus(status, text) {
const el = document.getElementById('syncStatus');
const textEl = document.getElementById('syncStatusText');
el.className = 'sync-status ' + status;
textEl.textContent = text;
}

// ========== 数据保存 ==========
function saveData() {
localStorage.setItem('karl-todos', JSON.stringify(todos));
localStorage.setItem('karl-categories', JSON.stringify(categories));
saveToGitHub();
updateStats();
renderTodos();
renderCategories();
renderFilterBar();
updateCategorySelect();
}

// ========== GitHub 设置 ==========
async function testGitHubConnection() {
const token = document.getElementById('githubToken').value.trim();
const resultEl = document.getElementById('githubTestResult');

if (!token) {
resultEl.innerHTML = '<span style="color:var(--danger)">请输入 Token</span>';
return;
}

resultEl.innerHTML = '<span style="color:var(--warning)">测试中...</span>';

try {
const response = await fetch(`${GITHUB_API}/repos/${GITHUB_OWNER}/${GITHUB_REPO}`, {
headers: {
'Authorization': `Bearer ${token}`,
'Accept': 'application/vnd.github.v3+json',
}
});

if (response.ok) {
resultEl.innerHTML = '<span style="color:var(--success)">✅ 连接成功</span>';
} else if (response.status === 401) {
resultEl.innerHTML = '<span style="color:var(--danger)">❌ Token 无效</span>';
} else {
resultEl.innerHTML = `<span style="color:var(--danger)">❌ 失败</span>`;
}
} catch (error) {
resultEl.innerHTML = `<span style="color:var(--danger)">❌ ${error.message}</span>`;
}
}

function saveGitHubSettings() {
const token = document.getElementById('githubToken').value.trim();
if (token) {
setGitHubToken(token);
updateSyncStatus('synced', '已保存');
alert('已保存');
} else {
alert('请输入 Token');
}
}

async function syncFromGitHub() {
const success = await loadFromGitHub();
if (success) {
saveData();
alert('已同步');
} else {
alert('同步失败');
}
}

async function syncToGitHub() {
if (syncTimer) clearTimeout(syncTimer);
try {
updateSyncStatus('syncing', '推送中');
const content = JSON.stringify({ todos, categories }, null, 2);
const encoded = encodeBase64(content);
const token = getGitHubToken();

if (!token) {
updateSyncStatus('error', '未配置');
alert('请先配置 Token');
return;
}

const getResponse = await fetch(`${GITHUB_API}/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`, {
headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github.v3+json' }
});
let sha = null;
if (getResponse.ok) {
const data = await getResponse.json();
sha = data.sha;
}

const body = { message: `Update todos - ${new Date().toISOString()}`, content: encoded };
if (sha) body.sha = sha;

const putResponse = await fetch(`${GITHUB_API}/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`, {
method: 'PUT',
headers: {
'Authorization': `Bearer ${token}`,
'Accept': 'application/vnd.github.v3+json',
'Content-Type': 'application/json',
},
body: JSON.stringify(body),
});

if (putResponse.ok) {
const result = await putResponse.json();
githubFileSha = result.content.sha;
updateSyncStatus('synced', `已推送`);
alert('已推送');
} else {
throw new Error(`HTTP ${putResponse.status}`);
}
} catch (error) {
updateSyncStatus('error', '失败');
alert('推送失败：' + error.message);
}
}

// ========== 界面更新 ==========
function updateStats() {
const total = todos.length;
const completed = todos.filter(t => t.completed).length;
const progress = total - completed;
const rate = total > 0 ? Math.round((completed / total) * 100) : 0;
document.getElementById('stat-total').textContent = total;
document.getElementById('stat-completed').textContent = completed;
document.getElementById('stat-progress').textContent = progress;
document.getElementById('stat-rate').textContent = rate + '%';
}

function renderTodos() {
const list = document.getElementById('todoList');
let filtered;
if (currentFilter === 'all') {
filtered = todos.filter(t => !t.completed);
} else if (currentFilter === 'completed') {
filtered = todos.filter(t => t.completed);
} else {
filtered = todos.filter(t => !t.completed && String(t.categoryId) === String(currentFilter));
}

if (filtered.length === 0) {
const emptyText = currentFilter === 'completed' ? '暂无已完成事项' : '暂无待办事项';
list.innerHTML = `<div class="empty-state"><div class="empty-state-icon">📝</div><p>${emptyText}</p></div>`;
return;
}

list.innerHTML = filtered.map(todo => {
const category = categories.find(c => String(c.id) === String(todo.categoryId));
return `
<div class="todo-item ${todo.completed ? 'completed' : ''}">
<div class="todo-checkbox ${todo.completed ? 'checked' : ''}" onclick="toggleTodo(${todo.id})"></div>
<div class="todo-content">
<div class="todo-title">${escapeHtml(todo.title)}</div>
<div class="todo-meta">
${category ? `<span class="todo-tag" style="background:${category.color}30;color:${category.color}">${escapeHtml(category.name)}</span>` : ''}
${todo.priority ? `<span class="todo-priority ${todo.priority}">${{high:'高',medium:'中',low:'低'}[todo.priority]}</span>` : ''}
${todo.note ? `<span class="todo-date">${escapeHtml(todo.note)}</span>` : ''}
<span class="todo-date">${formatDate(todo.createdAt)}</span>
</div>
</div>
<div class="todo-actions">
<button class="todo-action-btn delete" onclick="deleteTodo(${todo.id})">🗑️</button>
</div>
</div>
`;
}).join('');
}

function renderCategories() {
const list = document.getElementById('categoryList');
list.innerHTML = categories.map(cat => {
const count = todos.filter(t => String(t.categoryId) === String(cat.id)).length;
return `
<div class="category-item">
<div class="category-name">
<span class="category-color" style="background:${cat.color}"></span>
<span>${escapeHtml(cat.name)}</span>
<span class="category-count">${count}</span>
</div>
<div class="category-actions">
<button class="todo-action-btn delete" onclick="deleteCategory(${cat.id})">🗑️</button>
</div>
</div>
`;
}).join('');
}

function renderFilterBar() {
const bar = document.getElementById('filterBar');
bar.innerHTML = `
<span class="filter-tag ${currentFilter === 'all' ? 'active' : ''}" onclick="filterTodos('all')">待办项</span>
${categories.map(cat => `
<span class="filter-tag ${String(currentFilter) === String(cat.id) ? 'active' : ''}" onclick="filterTodos(${cat.id})">${escapeHtml(cat.name)}</span>
`).join('')}
<span class="filter-tag ${currentFilter === 'completed' ? 'active' : ''}" onclick="filterTodos('completed')">已完成</span>
`;
}

function updateCategorySelect() {
const select = document.getElementById('todoCategory');
select.innerHTML = `<option value="">未分类</option>` + categories.map(cat => 
`<option value="${cat.id}">${escapeHtml(cat.name)}</option>`
).join('');
}

// ========== 操作 ==========
function filterTodos(filter) {
currentFilter = String(filter);
renderFilterBar();
renderTodos();
}

function toggleTodo(id) {
const todo = todos.find(t => t.id === id);
if (todo) {
todo.completed = !todo.completed;
saveData();
}
}

function deleteTodo(id) {
if (confirm('确定删除？')) {
todos = todos.filter(t => t.id !== id);
saveData();
}
}

function submitTodo(e) {
e.preventDefault();
const todo = {
id: Date.now(),
title: document.getElementById('todoTitle').value,
categoryId: document.getElementById('todoCategory').value || null,
priority: document.getElementById('todoPriority').value || null,
note: document.getElementById('todoNote').value || null,
completed: false,
createdAt: new Date().toISOString()
};
todos.unshift(todo);
saveData();
closeModal('addModal');
document.getElementById('addForm').reset();
}

function submitCategory(e) {
e.preventDefault();
const selectedColor = document.querySelector('.color-option.selected');
const category = {
id: Date.now(),
name: document.getElementById('categoryName').value,
color: selectedColor ? selectedColor.dataset.color : '#7C5CFF'
};
categories.push(category);
saveData();
closeModal('categoryModal');
document.getElementById('categoryName').value = '';
}

function deleteCategory(id) {
if (confirm('确定删除？相关待办将变为未分类。')) {
categories = categories.filter(c => c.id !== id);
todos.forEach(t => {
if (t.categoryId == id) t.categoryId = null;
});
saveData();
}
}

// ========== 模态框 ==========
function openAddModal() {
updateCategorySelect();
document.getElementById('addModal').classList.add('active');
}
function openCategoryModal() {
document.getElementById('categoryModal').classList.add('active');
}
function openSettings() {
document.getElementById('githubToken').value = getGitHubToken();
document.getElementById('settingsModal').classList.add('active');
}
function closeModal(id) {
document.getElementById(id).classList.remove('active');
}

// ========== 导出导入 ==========
function exportData() {
const data = { todos, categories, exportedAt: new Date().toISOString() };
const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
const url = URL.createObjectURL(blob);
const a = document.createElement('a');
a.href = url;
a.download = `karl-todos-${new Date().toISOString().split('T')[0]}.json`;
a.click();
URL.revokeObjectURL(url);
}
function importData() {
document.getElementById('importFile').click();
}
function handleImport(e) {
const file = e.target.files[0];
if (!file) return;
const reader = new FileReader();
reader.onload = (e) => {
try {
const data = JSON.parse(e.target.result);
if (data.todos) todos = data.todos;
if (data.categories) categories = data.categories;
saveData();
alert('导入成功');
} catch (err) {
alert('导入失败');
}
};
reader.readAsText(file);
}
function clearData() {
if (confirm('确定清空？')) {
todos = [];
categories = [...DEFAULT_CATEGORIES];
saveData();
}
}

// ========== 工具函数 ==========
function escapeHtml(text) {
const div = document.createElement('div');
div.textContent = text;
return div.innerHTML;
}
function formatDate(dateStr) {
const date = new Date(dateStr);
const now = new Date();
const diff = now - date;
const days = Math.floor(diff / (1000 * 60 * 60 * 24));
if (days === 0) return '今天';
if (days === 1) return '昨天';
if (days < 7) return days + '天前';
return date.toLocaleDateString('zh-CN');
}

// ========== 初始化 ==========
async function init() {
const now = new Date();
const hour = now.getHours();
const greeting = hour < 6 ? '凌晨好' : hour < 12 ? '早上好' : hour < 14 ? '中午好' : hour < 18 ? '下午好' : '晚上好';
document.getElementById('greeting').textContent = `${greeting}，Karl 👋`;
document.getElementById('welcomeDate').textContent = now.toLocaleDateString('zh-CN', { year:'numeric', month:'long', day:'numeric', weekday:'long' });

const token = getGitHubToken();
if (token) {
const success = await loadFromGitHub();
if (!success) loadFromLocal();
} else {
loadFromLocal();
updateSyncStatus('error', '未配置');
}

saveData();
}

document.getElementById('colorPicker').addEventListener('click', (e) => {
const option = e.target.closest('.color-option');
if (option) {
document.querySelectorAll('.color-option').forEach(o => o.classList.remove('selected'));
option.classList.add('selected');
}
});

document.querySelectorAll('.bottom-nav-item[href]').forEach(link => {
link.addEventListener('click', (e) => {
document.querySelectorAll('.bottom-nav-item').forEach(l => l.classList.remove('active'));
link.classList.add('active');
});
});

init();
</script>
