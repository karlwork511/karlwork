<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Karl 工作台</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--bg-primary:#070A14;
--glass-bg:rgba(255,255,255,0.05);
--glass-border:rgba(255,255,255,0.1);
--glass-hover:rgba(255,255,255,0.08);
--accent:#7C5CFF;
--accent-light:#69E7FF;
--success:#62FAD3;
--warning:#FFB86C;
--danger:#FF6B6B;
--text-primary:#F7FAFF;
--text-secondary:#9AA7C7;
--text-muted:#6B7280;
--radius:12px;
--radius-lg:16px;
--transition:all 0.3s cubic-bezier(0.4,0,0.2,1);
}
html{scroll-behavior:smooth}
body{
font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',sans-serif;
background:var(--bg-primary);
color:var(--text-primary);
line-height:1.6;
min-height:100vh;
overflow-x:hidden;
padding-bottom:80px;
}
body::before{
content:'';
position:fixed;
top:0;left:0;right:0;bottom:0;
background:
radial-gradient(ellipse at 20% 20%,rgba(124,92,255,0.15) 0%,transparent 50%),
radial-gradient(ellipse at 80% 80%,rgba(105,231,255,0.1) 0%,transparent 50%);
pointer-events:none;
z-index:0;
}
.container{
position:relative;
z-index:1;
max-width:1400px;
margin:0 auto;
padding:0 16px;
}
/* 顶部导航 */
.navbar{
position:sticky;
top:0;
z-index:100;
backdrop-filter:blur(20px);
background:rgba(7,10,20,0.8);
border-bottom:1px solid var(--glass-border);
padding:12px 0;
}
.navbar-content{
display:flex;
align-items:center;
justify-content:space-between;
}
.logo{
display:flex;
align-items:center;
gap:10px;
font-size:18px;
font-weight:600;
}
.logo-icon{
width:32px;height:32px;
background:linear-gradient(135deg,var(--accent),var(--accent-light));
border-radius:8px;
display:flex;align-items:center;justify-content:center;
font-size:16px;
}
/* 同步状态指示器 */
.sync-status{
display:inline-flex;
align-items:center;
gap:6px;
font-size:12px;
padding:5px 12px;
border-radius:20px;
background:var(--glass-bg);
border:1px solid var(--glass-border);
transition:var(--transition);
}
.sync-status .sync-dot{
width:7px;height:7px;
border-radius:50%;
flex-shrink:0;
transition:var(--transition);
}
.sync-status.syncing{color:var(--warning);border-color:rgba(255,184,108,0.3)}
.sync-status.syncing .sync-dot{background:var(--warning);animation:syncPulse 1s ease-in-out infinite}
.sync-status.synced{color:var(--success);border-color:rgba(98,250,211,0.3)}
.sync-status.synced .sync-dot{background:var(--success)}
.sync-status.error{color:var(--danger);border-color:rgba(255,107,107,0.3)}
.sync-status.error .sync-dot{background:var(--danger)}
.sync-status.local{color:var(--text-muted);border-color:var(--glass-border)}
.sync-status.local .sync-dot{background:var(--text-muted)}
@keyframes syncPulse{
0%,100%{opacity:1;transform:scale(1)}
50%{opacity:0.4;transform:scale(0.7)}
}

/* 底部导航 */
.bottom-nav{
position:fixed;
bottom:0;
left:0;
right:0;
z-index:100;
backdrop-filter:blur(20px);
background:rgba(7,10,20,0.9);
border-top:1px solid var(--glass-border);
padding:8px 0 calc(8px + env(safe-area-inset-bottom));
}
.bottom-nav-content{
display:flex;
justify-content:space-around;
align-items:center;
}
.bottom-nav-item{
display:flex;
flex-direction:column;
align-items:center;
gap:4px;
padding:8px 16px;
border-radius:12px;
color:var(--text-muted);
text-decoration:none;
font-size:11px;
transition:var(--transition);
cursor:pointer;
}
.bottom-nav-item:hover,.bottom-nav-item.active{
color:var(--accent);
background:var(--glass-bg);
}
.bottom-nav-icon{
font-size:22px;
}
/* 主内容 */
main{padding:16px 0 24px}
.welcome{text-align:center;padding:24px 0 20px}
.welcome h1{font-size:22px;font-weight:700;margin-bottom:4px}
.welcome p{color:var(--text-secondary);font-size:13px}
.stats-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
margin-bottom:24px;
}
.stat-card{
background:var(--glass-bg);
backdrop-filter:blur(20px);
border:1px solid var(--glass-border);
border-radius:var(--radius);
padding:16px 12px;
text-align:center;
}
.stat-number{
font-size:28px;
font-weight:700;
background:linear-gradient(135deg,var(--accent),var(--accent-light));
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
background-clip:text;
}
.stat-label{
color:var(--text-secondary);
font-size:12px;
margin-top:2px;
}
.section{margin-bottom:32px}
.section-header{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:14px;
padding:0 4px;
}
.section-title{
font-size:17px;
font-weight:600;
display:flex;
align-items:center;
gap:8px;
}
.section-title::before{
content:'';
width:3px;
height:16px;
background:linear-gradient(180deg,var(--accent),var(--accent-light));
border-radius:2px;
}
.btn{
padding:10px 16px;
border-radius:10px;
border:none;
font-size:14px;
font-weight:500;
cursor:pointer;
transition:var(--transition);
display:inline-flex;
align-items:center;
gap:6px;
}
.btn-primary{
background:linear-gradient(135deg,var(--accent),#9B7BFF);
color:white;
}
.btn-primary:active{
transform:scale(0.96);
}
.btn-secondary{
background:var(--glass-bg);
color:var(--text-primary);
border:1px solid var(--glass-border);
}
.btn-secondary:active{
background:var(--glass-hover);
}
.btn-icon{
width:36px;
height:36px;
padding:0;
border-radius:10px;
display:flex;
align-items:center;
justify-content:center;
font-size:18px;
}
.glass-card{
background:var(--glass-bg);
backdrop-filter:blur(20px);
border:1px solid var(--glass-border);
border-radius:var(--radius);
padding:16px;
}
.todo-list{display:flex;flex-direction:column;gap:10px}
.todo-item{
display:flex;
align-items:center;
gap:12px;
padding:14px;
background:var(--glass-bg);
border:1px solid var(--glass-border);
border-radius:var(--radius);
transition:var(--transition);
position:relative;
}
.todo-item:active{
background:var(--glass-hover);
}
.todo-item.completed{opacity:0.55}
/* 拖拽相关样式 */
.todo-item.dragging{
opacity:0.4;
transform:scale(0.98);
}
.todo-item.drag-over{
border-color:var(--accent);
box-shadow:0 0 0 1px var(--accent), 0 0 12px rgba(124,92,255,0.2);
}
.drag-handle{
width:20px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:2px;
cursor:grab;
flex-shrink:0;
padding:4px 0;
opacity:0.3;
transition:opacity 0.2s;
touch-action:none;
}
.drag-handle:hover,.drag-handle:active{opacity:0.7}
.drag-handle-line{
width:12px;
height:2px;
background:var(--text-secondary);
border-radius:1px;
}
@media(min-width:768px){
.drag-handle{opacity:0.2}
.drag-handle:hover{opacity:0.6}
}

/* 完成动效 */
@keyframes checkBounce{
0%{transform:translate(-50%,-50%) scale(0)}
50%{transform:translate(-50%,-50%) scale(1.3)}
70%{transform:translate(-50%,-50%) scale(0.9)}
100%{transform:translate(-50%,-50%) scale(1)}
}
@keyframes strikeThrough{
0%{width:0}
100%{width:100%}
}
@keyframes completeFlash{
0%{background:var(--glass-bg)}
30%{background:rgba(98,250,211,0.12)}
100%{background:var(--glass-bg)}
}
@keyframes uncheckShrink{
0%{transform:translate(-50%,-50%) scale(1)}
100%{transform:translate(-50%,-50%) scale(0)}
}
.todo-checkbox.animating-check::after{
animation:checkBounce 0.4s cubic-bezier(0.4,0,0.2,1) forwards;
}
.todo-item.animating-complete{
animation:completeFlash 0.6s ease;
}
.todo-title-wrapper{
position:relative;
display:inline-block;
}
.todo-title-wrapper .strike-line{
position:absolute;
top:50%;
left:0;
height:2px;
background:var(--text-muted);
border-radius:1px;
pointer-events:none;
}
.todo-title-wrapper .strike-line.animating{
animation:strikeThrough 0.3s ease forwards;
}

/* 截止日期样式 */
.due-date-tag{
font-size:11px;
padding:2px 8px;
border-radius:8px;
font-weight:500;
display:inline-flex;
align-items:center;
gap:4px;
}
.due-date-tag .due-icon{font-size:10px}
.due-date-tag.due-overdue{
background:rgba(255,107,107,0.2);
color:var(--danger);
animation:overduePulse 2s ease-in-out infinite;
}
.due-date-tag.dueurgent{
background:rgba(255,107,107,0.15);
color:var(--danger);
}
.due-date-tag.duewarning{
background:rgba(255,184,108,0.15);
color:var(--warning);
}
.due-date-tag.duenormal{
background:rgba(154,167,199,0.15);
color:var(--text-secondary);
}
.due-date-tag.dudone{
background:rgba(98,250,211,0.1);
color:var(--text-muted);
}
@keyframes overduePulse{
0%,100%{opacity:1}
50%{opacity:0.6}
}

.todo-checkbox{
width:24px;height:24px;
border:2px solid var(--glass-border);
border-radius:8px;
cursor:pointer;
transition:var(--transition);
flex-shrink:0;
position:relative;
}
.todo-checkbox:active{
transform:scale(0.9);
}
.todo-checkbox.checked{
background:linear-gradient(135deg,var(--accent),var(--accent-light));
border-color:var(--accent);
}
.todo-checkbox.checked::after{
content:'✓';
position:absolute;
top:50%;left:50%;
transform:translate(-50%,-50%);
color:white;
font-size:14px;
font-weight:bold;
}
.todo-content{flex:1;min-width:0}
.todo-title{font-size:15px;font-weight:500;margin-bottom:4px;word-break:break-word}
.todo-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.todo-tag{
font-size:11px;
padding:2px 8px;
border-radius:12px;
font-weight:500;
}
.todo-priority{
font-size:10px;
padding:2px 6px;
border-radius:4px;
font-weight:600;
}
.todo-priority.high{background:rgba(255,107,107,0.2);color:var(--danger)}
.todo-priority.medium{background:rgba(255,184,108,0.2);color:var(--warning)}
.todo-priority.low{background:rgba(98,250,211,0.2);color:var(--success)}
.todo-date{font-size:11px;color:var(--text-muted)}
.todo-actions{display:flex;gap:4px;flex-shrink:0}
.todo-action-btn{
width:32px;height:32px;
border-radius:8px;
border:none;
background:transparent;
cursor:pointer;
transition:var(--transition);
display:flex;align-items:center;justify-content:center;
font-size:16px;
}
.todo-action-btn:active{background:var(--glass-bg)}
.todo-action-btn.delete:active{background:rgba(255,107,107,0.15)}
.empty-state{
text-align:center;
padding:32px 16px;
color:var(--text-muted);
}
.empty-state-icon{font-size:40px;margin-bottom:8px;opacity:0.5}
.category-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
}
.category-item{
display:flex;
align-items:center;
justify-content:space-between;
padding:12px 14px;
background:var(--glass-bg);
border:1px solid var(--glass-border);
border-radius:var(--radius);
}
.category-name{
display:flex;
align-items:center;
gap:8px;
font-size:13px;
font-weight:500;
}
.category-color{
width:14px;height:14px;
border-radius:4px;
}
.category-count{
background:var(--glass-bg);
padding:2px 8px;
border-radius:10px;
font-size:11px;
color:var(--text-secondary);
}
.category-actions{display:flex;gap:2px}
.shortcuts-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
}
.shortcut-card{
padding:16px 12px;
background:var(--glass-bg);
border:1px solid var(--glass-border);
border-radius:var(--radius);
text-align:center;
cursor:pointer;
text-decoration:none;
color:inherit;
}
.shortcut-card:active{
background:var(--glass-hover);
}
.shortcut-icon{font-size:24px;margin-bottom:6px}
.shortcut-label{font-size:13px;font-weight:500}
.filter-bar{
display:flex;
flex-wrap:nowrap;
gap:8px;
margin-bottom:14px;
overflow-x:auto;
padding-bottom:4px;
-webkit-overflow-scrolling:touch;
scrollbar-width:none;
}
.filter-bar::-webkit-scrollbar{display:none}
.filter-tag{
padding:6px 14px;
border-radius:20px;
font-size:13px;
font-weight:500;
cursor:pointer;
background:var(--glass-bg);
border:1px solid var(--glass-border);
color:var(--text-secondary);
transition:var(--transition);
white-space:nowrap;
flex-shrink:0;
}
.filter-tag:active{
background:var(--glass-hover);
}
.filter-tag.active{
background:linear-gradient(135deg,var(--accent),#9B7BFF);
color:white;
border-color:transparent;
}
/* 排序指示 */
.sort-indicator{
font-size:11px;
color:var(--text-muted);
display:flex;
align-items:center;
gap:4px;
}

/* 模态框 */
.modal{
display:none;
position:fixed;
top:0;left:0;right:0;bottom:0;
background:rgba(0,0,0,0.6);
backdrop-filter:blur(4px);
z-index:200;
}
.modal.active{display:block}
.modal-backdrop{
position:absolute;
top:0;left:0;right:0;bottom:0;
}
/* 底部弹出式模态框（移动端） */
.modal-content{
position:absolute;
bottom:0;
left:0;
right:0;
background:var(--bg-primary);
border:1px solid var(--glass-border);
border-radius:20px 20px 0 0;
padding:24px 20px calc(24px + env(safe-area-inset-bottom));
max-height:85vh;
overflow-y:auto;
transform:translateY(100%);
transition:transform 0.3s ease;
}
.modal.active .modal-content{
transform:translateY(0);
}
.modal-handle{
width:40px;
height:4px;
background:var(--glass-border);
border-radius:2px;
margin:0 auto 20px;
}
.modal-header{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:20px;
}
.modal-title{font-size:18px;font-weight:600}
.modal-close{
width:32px;height:32px;
border-radius:8px;
border:none;
background:var(--glass-bg);
color:var(--text-secondary);
cursor:pointer;
font-size:20px;
display:flex;align-items:center;justify-content:center;
}
.form-group{margin-bottom:18px}
.form-label{
display:block;
font-size:13px;
font-weight:500;
margin-bottom:8px;
color:var(--text-secondary);
}
.form-input,.form-select,.form-textarea{
width:100%;
padding:12px 14px;
background:var(--glass-bg);
border:1px solid var(--glass-border);
border-radius:10px;
color:var(--text-primary);
font-size:15px;
transition:var(--transition);
}
.form-input:focus,.form-select:focus,.form-textarea:focus{
outline:none;
border-color:var(--accent);
}
.form-textarea{resize:vertical;min-height:80px;font-family:inherit}
.form-select{cursor:pointer}
.form-select option{background:var(--bg-primary)}
/* 日期输入框特殊样式 */
input[type="date"].form-input{
color-scheme:dark;
}
.color-picker{
display:flex;
gap:10px;
flex-wrap:wrap;
}
.color-option{
width:36px;height:36px;
border-radius:10px;
cursor:pointer;
border:2px solid transparent;
transition:var(--transition);
}
.color-option:active{transform:scale(0.9)}
.color-option.selected{border-color:white}
/* 桌面端样式 */
@media (min-width: 768px) {
body{padding-bottom:0}
.bottom-nav{display:none}
.container{padding:0 24px}
.welcome{padding:48px 0 32px}
.welcome h1{font-size:32px}
.welcome p{font-size:16px}
.stats-grid{
grid-template-columns:repeat(4,1fr);
gap:16px;
margin-bottom:32px;
}
.stat-card{padding:24px}
.stat-number{font-size:36px}
.stat-label{font-size:14px}
.section{margin-bottom:48px}
.section-title{font-size:20px}
.glass-card{padding:24px}
.todo-list{gap:12px}
.todo-item{padding:16px 20px}
.category-grid{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.shortcuts-grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.modal-content{
position:relative;
bottom:auto;
left:50%;
top:50%;
transform:translate(-50%,-50%);
border-radius:var(--radius-lg);
max-width:480px;
width:90%;
padding:32px;
}
.modal.active .modal-content{
transform:translate(-50%,-50%);
}
.modal-handle{display:none}
}

/* ===== Karl快记 - 密码弹窗 ===== */
.pw-overlay{
display:none;position:fixed;top:0;left:0;right:0;bottom:0;
background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);
z-index:300;align-items:center;justify-content:center;
}
.pw-overlay.active{display:flex}
.pw-box{
background:var(--bg-primary);border:1px solid var(--glass-border);
border-radius:var(--radius-lg);padding:32px 24px;
width:300px;max-width:90vw;text-align:center;
}
.pw-box h3{font-size:18px;font-weight:600;margin-bottom:4px}
.pw-box p{font-size:13px;color:var(--text-secondary);margin-bottom:20px}
.pw-input-wrap{position:relative;margin-bottom:12px}
.pw-dots{display:flex;justify-content:center;gap:16px}
.pw-dot{
width:14px;height:14px;border-radius:50%;
border:2px solid var(--glass-border);
transition:var(--transition);
}
.pw-dot.filled{background:var(--accent);border-color:var(--accent)}
.pw-hidden-input{
position:absolute;top:0;left:0;width:100%;height:100%;
opacity:0;cursor:pointer;font-size:24px;
}
.pw-error{
font-size:12px;color:var(--danger);
min-height:18px;margin-bottom:8px;
}
.pw-close-btn{
width:100%;padding:10px;border-radius:10px;border:none;
background:var(--glass-bg);color:var(--text-secondary);
font-size:14px;cursor:pointer;
}
.pw-close-btn:active{background:var(--glass-hover)}



/* 密码错误摇晃 */
@keyframes pwShake{
0%,100%{transform:translateX(0)}
20%{transform:translateX(-8px)}
40%{transform:translateX(8px)}
60%{transform:translateX(-4px)}
80%{transform:translateX(4px)}
}



/* ===== 生活要点弹窗 ===== */
.life-tips-overlay{
display:none;position:fixed;top:0;left:0;right:0;bottom:0;
background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);
z-index:300;align-items:center;justify-content:center;
}
.life-tips-overlay.active{display:flex}
.life-tips-box{
background:var(--bg-primary);border:1px solid var(--glass-border);
border-radius:var(--radius-lg);padding:0;
width:380px;max-width:92vw;max-height:80vh;
display:flex;flex-direction:column;overflow:hidden;
}
.life-tips-header{
padding:20px 20px 16px;display:flex;align-items:center;justify-content:space-between;
border-bottom:1px solid var(--glass-border);flex-shrink:0;
}
.life-tips-header h3{font-size:18px;font-weight:600;display:flex;align-items:center;gap:8px}
.life-tips-close{
width:28px;height:28px;border-radius:50%;border:none;
background:var(--glass-bg);color:var(--text-secondary);
font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.life-tips-close:active{background:var(--glass-hover)}
.life-tips-content{
padding:16px 20px;overflow-y:auto;flex:1;
}
.life-tips-section{margin-bottom:16px}
.life-tips-section:last-child{margin-bottom:0}
.life-tips-section-title{
font-size:13px;font-weight:600;color:var(--text-secondary);
margin-bottom:10px;display:flex;align-items:center;gap:6px;
text-transform:uppercase;letter-spacing:0.5px;
}
.life-tips-item{
display:flex;align-items:center;justify-content:space-between;
padding:10px 14px;border-radius:10px;
background:var(--glass-bg);border:1px solid var(--glass-border);
margin-bottom:8px;
}
.life-tips-item:last-child{margin-bottom:0}
.life-tips-item-label{font-size:14px;font-weight:500;color:var(--text-primary)}
.life-tips-item-value{font-size:14px;color:var(--accent-light);font-weight:500;text-align:right}
.life-tips-item-note{font-size:11px;color:var(--text-muted);margin-top:2px}

display:inline-flex;align-items:center;gap:4px;

<script>
// ========== 配置 ==========
const GITHUB_OWNER = 'karlwork511';
const GITHUB_REPO = 'karlwork';
const GITHUB_FILE = 'todos.json';
const GITHUB_API = 'https://api.github.com';

// ========== 数据存储 ==========
let todos = [];
let categories = [];
let currentFilter = 'all';
let syncTimer = null;
let githubFileSha = null;

// 拖拽状态
let dragSrcIndex = null;
let touchDragState = null; // { startIndex, currentOverIndex, timer, cloneEl }

const DEFAULT_CATEGORIES = [
{id:1, name:'工作', color:'#7C5CFF'},
{id:2, name:'生活', color:'#62FAD3'},
{id:3, name:'学习', color:'#69E7FF'}
];

// ========== GitHub 同步 ==========
function getGitHubToken() {
return localStorage.getItem('github-token') || '';
}

function setGitHubToken(token) {
localStorage.setItem('github-token', token);
}

async function githubAPI(path, options = {}) {
const token = getGitHubToken();
const headers = {
'Accept': 'application/vnd.github.v3+json',
...options.headers,
};
if (token) {
headers['Authorization'] = `Bearer ${token}`;
}
return await fetch(`${GITHUB_API}${path}`, { ...options, headers });
}

async function loadFromGitHub() {
const token = getGitHubToken();
if (!token) {
updateSyncStatus('local', '本地模式');
return false;
}

try {
updateSyncStatus('syncing', '同步中...');
const response = await githubAPI(`/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`);

if (response.status === 401) {
updateSyncStatus('error', 'Token 无效');
return false;
}

if (response.status === 404) {
updateSyncStatus('synced', '已同步 ✓');
loadFromLocal();
return true;
}

if (!response.ok) throw new Error(`HTTP ${response.status}`);

const data = await response.json();
githubFileSha = data.sha;
const content = decodeBase64(data.content);
const parsed = JSON.parse(content);

todos = parsed.todos || [];
categories = parsed.categories || DEFAULT_CATEGORIES;

updateSyncStatus('synced', '已同步 ✓');
return true;
} catch (error) {
console.error('GitHub 同步失败:', error);
updateSyncStatus('error', '同步失败');
loadFromLocal();
return false;
}
}

async function saveToGitHub() {
const token = getGitHubToken();
if (!token) return;

if (syncTimer) clearTimeout(syncTimer);
updateSyncStatus('syncing', '保存中...');
syncTimer = setTimeout(async () => {
try {
const content = JSON.stringify({ todos, categories }, null, 2);
const encoded = encodeBase64(content);

const getResponse = await githubAPI(`/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`);
let sha = null;
if (getResponse.ok) {
const currentData = await getResponse.json();
sha = currentData.sha;
githubFileSha = sha;
}

const body = {
message: `Update todos - ${new Date().toISOString()}`,
content: encoded,
};
if (sha) body.sha = sha;

const putResponse = await fetch(`${GITHUB_API}/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`, {
method: 'PUT',
headers: {
'Authorization': `Bearer ${token}`,
'Accept': 'application/vnd.github.v3+json',
'Content-Type': 'application/json',
},
body: JSON.stringify(body),
});

if (putResponse.ok) {
const result = await putResponse.json();
githubFileSha = result.content.sha;
updateSyncStatus('synced', '已同步 ✓');
} else {
throw new Error(`HTTP ${putResponse.status}`);
}
} catch (error) {
console.error('保存到 GitHub 失败:', error);
updateSyncStatus('error', '保存失败');
}
}, 3000);
}

function loadFromLocal() {
todos = JSON.parse(localStorage.getItem('karl-todos') || '[]');
categories = JSON.parse(localStorage.getItem('karl-categories') || JSON.stringify(DEFAULT_CATEGORIES));
}

function encodeBase64(str) {
return btoa(unescape(encodeURIComponent(str)));
}
function decodeBase64(str) {
str = str.replace(/\n/g, '');
return decodeURIComponent(escape(atob(str)));
}

function updateSyncStatus(status, text) {
const el = document.getElementById('syncStatus');
const textEl = document.getElementById('syncStatusText');
el.className = 'sync-status ' + status;
textEl.textContent = text;
}

// ========== 数据保存 ==========
function saveData() {
localStorage.setItem('karl-todos', JSON.stringify(todos));
localStorage.setItem('karl-categories', JSON.stringify(categories));
saveToGitHub();
updateStats();
renderTodos();
renderCategories();
renderFilterBar();
updateCategorySelect();
}

// ========== GitHub 设置 ==========
async function testGitHubConnection() {
const token = document.getElementById('githubToken').value.trim();
const resultEl = document.getElementById('githubTestResult');

if (!token) {
resultEl.innerHTML = '<span style="color:var(--danger)">请输入 Token</span>';
return;
}

resultEl.innerHTML = '<span style="color:var(--warning)">测试中...</span>';

try {
const response = await fetch(`${GITHUB_API}/repos/${GITHUB_OWNER}/${GITHUB_REPO}`, {
headers: {
'Authorization': `Bearer ${token}`,
'Accept': 'application/vnd.github.v3+json',
}
});

if (response.ok) {
resultEl.innerHTML = '<span style="color:var(--success)">✅ 连接成功</span>';
} else if (response.status === 401) {
resultEl.innerHTML = '<span style="color:var(--danger)">❌ Token 无效</span>';
} else {
resultEl.innerHTML = `<span style="color:var(--danger)">❌ 连接失败</span>`;
}
} catch (error) {
resultEl.innerHTML = `<span style="color:var(--danger)">❌ ${error.message}</span>`;
}
}

function saveGitHubSettings() {
const token = document.getElementById('githubToken').value.trim();
if (token) {
setGitHubToken(token);
updateSyncStatus('synced', '已保存');
alert('已保存');
} else {
alert('请输入 Token');
}
}

async function syncFromGitHub() {
const success = await loadFromGitHub();
if (success) {
saveData();
alert('已同步');
} else {
alert('同步失败');
}
}

async function syncToGitHub() {
if (syncTimer) clearTimeout(syncTimer);
try {
updateSyncStatus('syncing', '推送中...');
const content = JSON.stringify({ todos, categories }, null, 2);
const encoded = encodeBase64(content);
const token = getGitHubToken();

if (!token) {
updateSyncStatus('error', '未配置');
alert('请先配置 Token');
return;
}

const getResponse = await fetch(`${GITHUB_API}/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`, {
headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github.v3+json' }
});
let sha = null;
if (getResponse.ok) {
const data = await getResponse.json();
sha = data.sha;
}

const body = { message: `Update todos - ${new Date().toISOString()}`, content: encoded };
if (sha) body.sha = sha;

const putResponse = await fetch(`${GITHUB_API}/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`, {
method: 'PUT',
headers: {
'Authorization': `Bearer ${token}`,
'Accept': 'application/vnd.github.v3+json',
'Content-Type': 'application/json',
},
body: JSON.stringify(body),
});

if (putResponse.ok) {
const result = await putResponse.json();
githubFileSha = result.content.sha;
updateSyncStatus('synced', '已同步 ✓');
alert('已推送');
} else {
throw new Error(`HTTP ${putResponse.status}`);
}
} catch (error) {
updateSyncStatus('error', '推送失败');
alert('推送失败：' + error.message);
}
}

// ========== 截止日期工具函数 ==========
function getDueDateStatus(dueDateStr) {
if (!dueDateStr) return null;
const now = new Date();
now.setHours(0,0,0,0);
const due = new Date(dueDateStr + 'T00:00:00');
const diffMs = due - now;
const diffDays = Math.ceil(diffMs / (1000 * 60 * 60 * 24));

if (diffDays < 0) return 'overdue';   // 已过期
if (diffDays === 0) return 'urgent';   // 今天到期
if (diffDays <= 3) return 'warning';   // 3天内
return 'normal';                       // 正常
}

function formatDueDate(dueDateStr) {
if (!dueDateStr) return '';
const now = new Date();
now.setHours(0,0,0,0);
const due = new Date(dueDateStr + 'T00:00:00');
const diffMs = due - now;
const diffDays = Math.ceil(diffMs / (1000 * 60 * 60 * 24));

if (diffDays < 0) return `已过期${Math.abs(diffDays)}天`;
if (diffDays === 0) return '今天截止';
if (diffDays === 1) return '明天截止';
if (diffDays <= 7) return `${diffDays}天后截止`;
return due.toLocaleDateString('zh-CN', {month:'short', day:'numeric'});
}

function getDueDateIcon(status) {
switch(status) {
case 'overdue': return '🔴';
case 'urgent': return '🔴';
case 'warning': return '🟡';
default: return '📅';
}
}

// 按紧急程度排序：过期 > 今天到期 > 3天内 > 有截止日期 > 无截止日期
// 已完成的排最后
function sortTodosByUrgency(todoList) {
return todoList.slice().sort((a, b) => {
// 已完成的排在最后
if (a.completed !== b.completed) return a.completed ? 1 : -1;

const statusA = getDueDateStatus(a.dueDate);
const statusB = getDueDateStatus(b.dueDate);

const urgencyOrder = { overdue: 0, urgent: 1, warning: 2, normal: 3 };
const orderA = statusA ? urgencyOrder[statusA] : 4;
const orderB = statusB ? urgencyOrder[statusB] : 4;

if (orderA !== orderB) return orderA - orderB;

// 同为 normal 或都有日期，按日期升序
if (a.dueDate && b.dueDate) {
return new Date(a.dueDate) - new Date(b.dueDate);
}
// 都没有日期或只有一个有，保持原顺序
return 0;
});

function updateStats() {
const total = todos.length;
const completed = todos.filter(t => t.completed).length;
const progress = total - completed;
const rate = total > 0 ? Math.round((completed / total) * 100) : 0;
document.getElementById('stat-total').textContent = total;
document.getElementById('stat-completed').textContent = completed;
document.getElementById('stat-progress').textContent = progress;
document.getElementById('stat-rate').textContent = rate + '%';
}

function renderTodos() {
const list = document.getElementById('todoList');
let filtered;
if (currentFilter === 'all') {
filtered = todos.filter(t => !t.completed);
} else if (currentFilter === 'completed') {
filtered = todos.filter(t => t.completed);
} else {
filtered = todos.filter(t => !t.completed && String(t.categoryId) === String(currentFilter));
}

// 按紧急程度排序
filtered = sortTodosByUrgency(filtered);

if (filtered.length === 0) {
const emptyText = currentFilter === 'completed' ? '暂无已完成事项' : '暂无待办事项';
list.innerHTML = `<div class="empty-state"><div class="empty-state-icon">📝</div><p>${emptyText}</p></div>`;
return;
}

list.innerHTML = filtered.map((todo, visualIndex) => {
const category = categories.find(c => String(c.id) === String(todo.categoryId));
const dueStatus = todo.completed ? (todo.dueDate ? 'done' : null) : getDueDateStatus(todo.dueDate);
const dueLabel = formatDueDate(todo.dueDate);

// 找到在原始数组中的真实索引，用于拖拽
const realIndex = todos.indexOf(todo);

return `
<div class="todo-item ${todo.completed ? 'completed' : ''}"
     draggable="true"
     data-real-index="${realIndex}"
     ondragstart="onDragStart(event)"
     ondragover="onDragOver(event)"
     ondragenter="onDragEnter(event)"
     ondragleave="onDragLeave(event)"
     ondrop="onDrop(event)"
     ondragend="onDragEnd(event)"
     ontouchstart="onTouchStart(event)"
     ontouchmove="onTouchMove(event)"
     ontouchend="onTouchEnd(event)">
<div class="drag-handle" title="拖拽排序">
<div class="drag-handle-line"></div>
<div class="drag-handle-line"></div>
<div class="drag-handle-line"></div>
</div>
<div class="todo-checkbox ${todo.completed ? 'checked' : ''}" onclick="toggleTodo(${todo.id}, this, this.closest('.todo-item'))"></div>
<div class="todo-content">
<div class="todo-title-wrapper">
<div class="todo-title">${escapeHtml(todo.title)}</div>
</div>
<div class="todo-meta">
${category ? `<span class="todo-tag" style="background:${category.color}30;color:${category.color}">${escapeHtml(category.name)}</span>` : ''}
${todo.priority ? `<span class="todo-priority ${todo.priority}">${{high:'高',medium:'中',low:'低'}[todo.priority]}</span>` : ''}
${todo.dueDate ? `<span class="due-date-tag due${dueStatus}"><span class="due-icon">${getDueDateIcon(dueStatus)}</span>${dueLabel}</span>` : ''}
${todo.note ? `<span class="todo-date">${escapeHtml(todo.note)}</span>` : ''}
</div>
</div>
<div class="todo-actions">
<button class="todo-action-btn" onclick="openEditModal(${todo.id})">✏️</button>
<button class="todo-action-btn delete" onclick="deleteTodo(${todo.id})">🗑️</button>
</div>
</div>
`;
}).join('');
}

function toggleTodo(id, checkboxEl, itemEl) {
const todo = todos.find(t => String(t.id) === String(id));
if (!todo) return;

todo.completed = !todo.completed;

// 完成动效
if (todo.completed && checkboxEl && itemEl) {
checkboxEl.classList.add('checked', 'animating-check');
itemEl.classList.add('animating-complete');

// 划线动效
const titleWrapper = itemEl.querySelector('.todo-title-wrapper');
if (titleWrapper) {
const titleEl = titleWrapper.querySelector('.todo-title');
if (titleEl) {
const strikeLine = document.createElement('div');
strikeLine.className = 'strike-line animating';
strikeLine.style.width = '0';
titleWrapper.appendChild(strikeLine);
// 触发 reflow 后设置宽度
requestAnimationFrame(() => {
strikeLine.style.width = titleEl.offsetWidth + 'px';
});
}
}

setTimeout(() => {
checkboxEl.classList.remove('animating-check');
itemEl.classList.remove('animating-complete');
saveData();
}, 500);
} else {
saveData();
}
}

// ========== 拖拽排序（桌面端） ==========
function onDragStart(e) {
const item = e.target.closest('.todo-item');
if (!item) return;
// 如果拖拽的是 drag-handle 区域或整个 item
dragSrcIndex = parseInt(item.dataset.realIndex);
item.classList.add('dragging');
e.dataTransfer.effectAllowed = 'move';
e.dataTransfer.setData('text/plain', dragSrcIndex);
}

function onDragOver(e) {
e.preventDefault();
e.dataTransfer.dropEffect = 'move';
}

function onDragEnter(e) {
e.preventDefault();
const item = e.target.closest('.todo-item');
if (item && parseInt(item.dataset.realIndex) !== dragSrcIndex) {
item.classList.add('drag-over');
}
}

function onDragLeave(e) {
const item = e.target.closest('.todo-item');
if (item) {
item.classList.remove('drag-over');
}
}

function onDrop(e) {
e.preventDefault();
const item = e.target.closest('.todo-item');
if (!item) return;
item.classList.remove('drag-over');
const targetIndex = parseInt(item.dataset.realIndex);
if (dragSrcIndex !== null && dragSrcIndex !== targetIndex) {
reorderTodos(dragSrcIndex, targetIndex);
}
}

function onDragEnd(e) {
const item = e.target.closest('.todo-item');
if (item) item.classList.remove('dragging');
document.querySelectorAll('.todo-item.drag-over').forEach(el => el.classList.remove('drag-over'));
dragSrcIndex = null;
}

// ========== 拖拽排序（移动端触摸） ==========
function onTouchStart(e) {
const handle = e.target.closest('.drag-handle');
if (!handle) return; // 只有拖拽手柄触发

const item = handle.closest('.todo-item');
if (!item) return;

const touch = e.touches[0];
const startIndex = parseInt(item.dataset.realIndex);

touchDragState = {
startIndex: startIndex,
currentOverIndex: null,
startX: touch.clientX,
startY: touch.clientY,
timer: setTimeout(() => {
// 长按 200ms 后激活拖拽
if (touchDragState) {
touchDragState.active = true;
item.classList.add('dragging');
if (navigator.vibrate) navigator.vibrate(30);
}
}, 200)
};
}

function onTouchMove(e) {
if (!touchDragState) return;

const touch = e.touches[0];
const dx = Math.abs(touch.clientX - touchDragState.startX);
const dy = Math.abs(touch.clientY - touchDragState.startY);

// 如果还没激活且移动太多，取消
if (!touchDragState.active && (dx > 10 || dy > 10)) {
clearTimeout(touchDragState.timer);
touchDragState = null;
return;
}

if (!touchDragState.active) return;
e.preventDefault();

// 找到当前触摸位置下的 todo-item
const touchTarget = document.elementFromPoint(touch.clientX, touch.clientY);
if (!touchTarget) return;
const targetItem = touchTarget.closest('.todo-item');

// 清除之前的 drag-over
document.querySelectorAll('.todo-item.drag-over').forEach(el => el.classList.remove('drag-over'));

if (targetItem) {
const targetIndex = parseInt(targetItem.dataset.realIndex);
if (targetIndex !== touchDragState.startIndex) {
targetItem.classList.add('drag-over');
touchDragState.currentOverIndex = targetIndex;
}
}
}

function onTouchEnd(e) {
if (!touchDragState) return;

clearTimeout(touchDragState.timer);

if (touchDragState.active && touchDragState.currentOverIndex !== null) {
reorderTodos(touchDragState.startIndex, touchDragState.currentOverIndex);
}

// 清理状态
const srcItem = document.querySelector(`.todo-item[data-real-index="${touchDragState.startIndex}"]`);
if (srcItem) srcItem.classList.remove('dragging');
document.querySelectorAll('.todo-item.drag-over').forEach(el => el.classList.remove('drag-over'));

touchDragState = null;
}

// ========== 排序执行 ==========
function reorderTodos(fromIndex, toIndex) {
if (fromIndex === toIndex) return;
const item = todos.splice(fromIndex, 1)[0];
todos.splice(toIndex, 0, item);
saveData();
}

// ========== 导出导入 ==========
function exportData() {
const data = { todos, categories, exportedAt: new Date().toISOString() };
const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
const url = URL.createObjectURL(blob);
const a = document.createElement('a');
a.href = url;
a.download = `karl-todos-${new Date().toISOString().split('T')[0]}.json`;
a.click();
URL.revokeObjectURL(url);
}
function importData() {
document.getElementById('importFile').click();
}
function handleImport(e) {
const file = e.target.files[0];
if (!file) return;
const reader = new FileReader();
reader.onload = (e) => {
try {
const data = JSON.parse(e.target.result);
if (data.todos) todos = data.todos;
if (data.categories) categories = data.categories;
saveData();
alert('导入成功');
} catch (err) {
alert('导入失败');
}
};
reader.readAsText(file);
}
function clearData() {
if (confirm('确定清空？')) {
todos = [];
categories = [...DEFAULT_CATEGORIES];
saveData();
}
}

// ========== 工具函数 ==========
function escapeHtml(text) {
const div = document.createElement('div');
div.textContent = text;
return div.innerHTML;
}
function formatDate(dateStr) {
const date = new Date(dateStr);
const now = new Date();
const diff = now - date;
const days = Math.floor(diff / (1000 * 60 * 60 * 24));
if (days === 0) return '今天';
if (days === 1) return '昨天';
if (days < 7) return days + '天前';
return date.toLocaleDateString('zh-CN');
}

function showLifeTipsModal() {
  const overlay = document.getElementById('lifeTipsOverlay');
  const content = document.getElementById('lifeTipsContent');
  
  // 计算当前年份和倒计时
  const now = new Date();
  const currentYear = now.getFullYear();
  
  // 渲染内容
  let html = '';
  
  // 家人生日部分
  html += '<div class="life-tips-section">';
  html += '<div class="life-tips-section-title">🎂 家人生日</div>';
  
  LIFE_TIPS_DATA.birthdays.forEach(person => {
    const yearData = person.solar[currentYear];
    const nextYearData = person.solar[currentYear + 1];
    
    if (!yearData) return;
    
    const birthdayThisYear = new Date(yearData);
    let nextBirthday = birthdayThisYear;
    let targetYear = currentYear;
    
    // 如果今年生日已过，计算明年的
    if (now > birthdayThisYear) {
      if (nextYearData) {
        nextBirthday = new Date(nextYearData);
        targetYear = currentYear + 1;
      }
    }
    
    // 计算倒计时
    const diffTime = nextBirthday - now;
    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
    
    // 格式化日期
    const month = nextBirthday.getMonth() + 1;
    const day = nextBirthday.getDate();
    const weekDays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
    const weekDay = weekDays[nextBirthday.getDay()];
    
    html += '<div class="life-tips-item">';
    html += '<div>';
    html += `<div class="life-tips-item-label">${person.name}</div>`;
    html += `<div class="life-tips-item-note">${person.lunar} · ${targetYear}年${month}月${day}日 ${weekDay}</div>`;
    html += '</div>';
    html += '<div style="text-align:right">';
    if (diffDays === 0) {
      html += '<div class="life-tips-item-value" style="color:var(--danger)">今天！</div>';
    } else if (diffDays > 0) {
      html += `<div class="life-tips-item-value">${month}月${day}日</div>`;
      html += `<div class="life-tips-countdown">还有${diffDays}天</div>`;
    } else {
      html += '<div class="life-tips-item-value" style="color:var(--text-muted)">已过</div>';
    }
    html += '</div>';
    html += '</div>';
  });
  
  html += '</div>';
  
  // 后续可以添加更多分类，如密码、证件号等
  // html += '<div class="life-tips-section">';
  // html += '<div class="life-tips-section-title">🔐 重要密码</div>';
  // html += '<div class="life-tips-item">...</div>';
  // html += '</div>';
  
  content.innerHTML = html;
  overlay.classList.add('active');
}
