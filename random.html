<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>今天啥子？</title>
<style>
:root{
  --bg:#0a0a12;--card:#1a1a2e;--card2:#16213e;
  --accent:#f7b733;--accent2:#fc4a1a;
  --text:#fff;--text2:#b8c6db;--text3:#6b7a90;
  --success:#00d2a0;--danger:#ff4757;
  --safe-top:env(safe-area-inset-top,20px);--safe-bottom:env(safe-area-inset-bottom,20px);
  --radius:16px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro','PingFang SC','Helvetica Neue',sans-serif;
  line-height:1.5;position:fixed;width:100%;top:0;left:0;
}
.app{height:100%;display:flex;flex-direction:column;overflow:hidden}
.status-bar{height:var(--safe-top);background:transparent;flex-shrink:0}

/* ========== 顶栏 ========== */
.top-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 20px 8px;flex-shrink:0;
}
.top-title{font-size:20px;font-weight:700;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.top-actions{display:flex;gap:12px}
.icon-btn{
  width:36px;height:36px;border-radius:50%;
  background:rgba(255,255,255,.08);border:none;color:var(--text2);
  font-size:18px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .2s;
}
.icon-btn:active{transform:scale(.9);background:rgba(255,255,255,.15)}

/* ========== 内容区 ========== */
.content{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 16px 100px;-webkit-overflow-scrolling:touch}
.content::-webkit-scrollbar{display:none}

/* ========== 空态 ========== */
.empty-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:80px 40px;text-align:center;
}
.empty-icon{font-size:80px;margin-bottom:20px;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.empty-title{font-size:18px;font-weight:600;margin-bottom:8px}
.empty-desc{font-size:14px;color:var(--text3);margin-bottom:30px;line-height:1.6}

/* ========== 活动卡片 ========== */
.activity-list{display:flex;flex-direction:column;gap:12px}
.activity-card{
  background:var(--card);border-radius:var(--radius);
  padding:16px 18px;position:relative;overflow:hidden;
  border:1px solid rgba(255,255,255,.06);
  transition:transform .2s;cursor:pointer;
}
.activity-card:active{transform:scale(.97)}
.activity-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));opacity:.6;
}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.card-title{font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px}
.card-count{font-size:12px;color:var(--text3);background:rgba(255,255,255,.06);padding:2px 8px;border-radius:10px}
.card-actions{display:flex;gap:6px}
.card-action-btn{
  width:28px;height:28px;border-radius:8px;border:none;
  background:rgba(255,255,255,.06);color:var(--text3);
  font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.card-action-btn:active{background:rgba(255,255,255,.12)}
.card-preview{font-size:13px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ========== 随机结果页 ========== */
.result-view{
  display:none;flex-direction:column;align-items:center;
  padding:40px 20px 60px;height:100%;
}
.result-view.active{display:flex}
.result-back{
  position:absolute;top:12px;left:16px;
  font-size:24px;color:var(--text2);background:none;border:none;cursor:pointer;
  width:40px;height:40px;display:flex;align-items:center;justify-content:center;
}
.result-activity-name{
  font-size:16px;color:var(--text2);margin-top:40px;margin-bottom:40px;
  font-weight:500;
}
.result-display{
  width:240px;height:240px;border-radius:50%;
  background:linear-gradient(145deg,var(--card),var(--card2));
  border:2px solid rgba(255,255,255,.08);
  display:flex;align-items:center;justify-content:center;
  position:relative;margin-bottom:50px;
  box-shadow:0 0 60px rgba(247,183,51,.08);
}
.result-display.rolling{animation:pulse .15s ease-in-out infinite alternate}
@keyframes pulse{0%{transform:scale(1)}100%{transform:scale(1.02)}}
.result-text{
  font-size:28px;font-weight:700;text-align:center;
  padding:20px;word-break:break-all;
  max-width:200px;
}
.result-text.rolling-text{
  animation:textRoll .08s steps(1) infinite;
  color:var(--accent);
}
.result-ring{
  position:absolute;inset:-4px;border-radius:50%;
  border:2px solid transparent;
  border-top-color:var(--accent);border-right-color:var(--accent2);
  opacity:0;transition:opacity .3s;
}
.result-display.rolling .result-ring{opacity:1;animation:spin .5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.result-btn{
  width:200px;height:56px;border-radius:28px;border:none;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;font-size:18px;font-weight:700;
  cursor:pointer;transition:all .2s;
  box-shadow:0 8px 30px rgba(247,183,51,.3);
  letter-spacing:2px;
}
.result-btn:active{transform:scale(.95);box-shadow:0 4px 15px rgba(247,183,51,.2)}
.result-btn:disabled{opacity:.5;cursor:not-allowed}
.result-manage-btn{
  margin-top:16px;background:none;border:none;
  color:var(--text3);font-size:13px;cursor:pointer;
  padding:8px 16px;
}

/* ========== 底部按钮 ========== */
.bottom-area{
  position:fixed;bottom:0;left:0;right:0;
  padding:12px 20px calc(var(--safe-bottom) + 12px);
  background:linear-gradient(transparent,var(--bg) 20%);
}
.fab{
  width:100%;height:52px;border-radius:26px;border:none;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;font-size:16px;font-weight:600;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 6px 25px rgba(247,183,51,.25);
  transition:all .2s;
}
.fab:active{transform:scale(.96)}

/* ========== 弹窗 ========== */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.6);
  z-index:100;display:none;align-items:flex-end;justify-content:center;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
}
.overlay.active{display:flex}
.sheet{
  background:var(--card);border-radius:20px 20px 0 0;
  width:100%;max-width:500px;max-height:85vh;
  display:flex;flex-direction:column;
  animation:slideUp .3s ease;
  padding-bottom:var(--safe-bottom);
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 20px 12px;border-bottom:1px solid rgba(255,255,255,.06);
  flex-shrink:0;
}
.sheet-title{font-size:17px;font-weight:600}
.sheet-close{
  width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.08);
  border:none;color:var(--text2);font-size:16px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.sheet-body{flex:1;overflow-y:auto;padding:16px 20px;-webkit-overflow-scrolling:touch}
.sheet-body::-webkit-scrollbar{display:none}

/* ========== 表单 ========== */
.form-group{margin-bottom:16px}
.form-label{font-size:13px;color:var(--text2);margin-bottom:6px;display:block;font-weight:500}
.form-input{
  width:100%;height:46px;border-radius:12px;border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.04);color:var(--text);
  padding:0 14px;font-size:15px;outline:none;transition:border-color .2s;
}
.form-input:focus{border-color:var(--accent)}
.form-input::placeholder{color:var(--text3)}
.form-textarea{
  width:100%;min-height:120px;border-radius:12px;border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.04);color:var(--text);
  padding:12px 14px;font-size:15px;outline:none;resize:none;
  line-height:1.8;transition:border-color .2s;
  font-family:inherit;
}
.form-textarea:focus{border-color:var(--accent)}
.form-hint{font-size:12px;color:var(--text3);margin-top:6px}
.btn{
  height:46px;border-radius:12px;border:none;
  font-size:15px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;width:100%;
}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-ghost{background:rgba(255,255,255,.06);color:var(--text2)}

/* ========== 随机项列表 ========== */
.item-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.item-row{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;background:rgba(255,255,255,.04);
  border-radius:12px;border:1px solid rgba(255,255,255,.06);
}
.item-text{flex:1;font-size:14px;word-break:break-all}
.item-delete{
  width:28px;height:28px;border-radius:8px;border:none;
  background:rgba(255,75,87,.12);color:var(--danger);
  font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;
}

/* ========== 快速添加区 ========== */
.quick-add{display:flex;gap:8px;margin-bottom:16px}
.quick-add .form-input{flex:1}
.quick-add-btn{
  width:46px;height:46px;border-radius:12px;border:none;
  background:var(--success);color:#fff;font-size:20px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  flex-shrink:0;
}

/* ========== Toast ========== */
.toast{
  position:fixed;top:60px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.85);color:#fff;padding:10px 20px;
  border-radius:12px;font-size:14px;z-index:999;
  opacity:0;transition:opacity .3s;pointer-events:none;
}
.toast.show{opacity:1}

/* ========== 同步状态 ========== */
.sync-dot{
  width:6px;height:6px;border-radius:50%;
  display:inline-block;margin-right:4px;
}
.sync-dot.ok{background:var(--success)}
.sync-dot.fail{background:var(--danger)}
.sync-dot.syncing{background:var(--accent);animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* ========== 设置页 ========== */
.settings-section{margin-bottom:24px}
.settings-title{font-size:14px;color:var(--text2);font-weight:600;margin-bottom:12px}
.settings-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 14px;background:rgba(255,255,255,.04);
  border-radius:12px;margin-bottom:8px;
  border:1px solid rgba(255,255,255,.06);
}
.settings-row-left{display:flex;align-items:center;gap:10px;font-size:14px}
.settings-row-right{display:flex;align-items:center;gap:8px}
.mini-btn{
  padding:6px 12px;border-radius:8px;border:none;
  background:rgba(255,255,255,.08);color:var(--text2);
  font-size:12px;cursor:pointer;
}
.mini-btn:active{background:rgba(255,255,255,.15)}
.mini-btn.danger{background:rgba(255,75,87,.12);color:var(--danger)}

/* ========== 历史结果 ========== */
.history-list{display:flex;flex-direction:column;gap:8px}
.history-item{
  padding:10px 14px;background:rgba(255,255,255,.04);
  border-radius:12px;font-size:14px;
  display:flex;align-items:center;justify-content:space-between;
  border:1px solid rgba(255,255,255,.06);
}
.history-result{font-weight:600;color:var(--accent)}
.history-time{font-size:12px;color:var(--text3)}

/* ========== 响应式 ========== */
@media(min-width:500px){
  .app{max-width:500px;margin:0 auto;border-left:1px solid rgba(255,255,255,.06);border-right:1px solid rgba(255,255,255,.06)}
}
</style>
</head>
<body>
<div class="app">
  <div class="status-bar"></div>

  <!-- 顶栏 -->
  <div class="top-bar">
    <div class="top-title">🎲 今天啥子？</div>
    <div class="top-actions">
      <button class="icon-btn" onclick="openSyncSettings()" title="同步">☁️</button>
      <button class="icon-btn" onclick="openHistory()" title="历史">📜</button>
    </div>
  </div>

  <!-- 主内容 -->
  <div class="content" id="mainContent">
    <!-- 活动列表 -->
    <div id="activityList" class="activity-list"></div>
    <!-- 空态 -->
    <div id="emptyState" class="empty-state" style="display:none">
      <div class="empty-icon">🎯</div>
      <div class="empty-title">还没有活动</div>
      <div class="empty-desc">点击下方按钮创建第一个活动<br>比如「周六吃啥」「国庆去哪玩」</div>
    </div>
  </div>

  <!-- 随机结果页（覆盖在主内容上） -->
  <div class="result-view" id="resultView">
    <button class="result-back" onclick="closeResult()">←</button>
    <div class="result-activity-name" id="resultActivityName"></div>
    <div class="result-display" id="resultDisplay">
      <div class="result-ring"></div>
      <div class="result-text" id="resultText">?</div>
    </div>
    <button class="result-btn" id="rollBtn" onclick="startRoll()">摇 一 摇</button>
    <button class="result-manage-btn" onclick="openManageFromResult()">管理选项 →</button>
  </div>

  <!-- 底部按钮 -->
  <div class="bottom-area" id="bottomArea">
    <button class="fab" onclick="openCreateActivity()">
      <span>＋</span> 新建活动
    </button>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- 新建/编辑活动弹窗 -->
<div class="overlay" id="activityOverlay">
  <div class="sheet">
    <div class="sheet-header">
      <div class="sheet-title" id="activitySheetTitle">新建活动</div>
      <button class="sheet-close" onclick="closeSheet('activityOverlay')">✕</button>
    </div>
    <div class="sheet-body">
      <div class="form-group">
        <label class="form-label">活动名称</label>
        <input class="form-input" id="activityName" placeholder="比如：周六吃啥" maxlength="20">
      </div>
      <div class="form-group">
        <label class="form-label">随机选项</label>
        <textarea class="form-textarea" id="activityItems" placeholder="每行一个选项&#10;比如：&#10;火锅&#10;烤肉&#10;日料&#10;麦当劳"></textarea>
        <div class="form-hint">每行一个选项，也可以保存后在管理里逐条添加</div>
      </div>
      <div class="form-group">
        <button class="btn btn-primary" id="saveActivityBtn" onclick="saveActivity()">保存</button>
      </div>
    </div>
  </div>
</div>

<!-- 管理随机项弹窗 -->
<div class="overlay" id="manageOverlay">
  <div class="sheet">
    <div class="sheet-header">
      <div class="sheet-title" id="manageSheetTitle">管理选项</div>
      <button class="sheet-close" onclick="closeSheet('manageOverlay')">✕</button>
    </div>
    <div class="sheet-body">
      <div class="quick-add">
        <input class="form-input" id="quickAddInput" placeholder="快速添加选项" onkeydown="if(event.key==='Enter')quickAddItem()">
        <button class="quick-add-btn" onclick="quickAddItem()">＋</button>
      </div>
      <div class="item-list" id="itemList"></div>
      <div class="form-group" style="margin-top:8px">
        <button class="btn btn-ghost" onclick="closeSheet('manageOverlay')">完成</button>
      </div>
    </div>
  </div>
</div>

<!-- 同步设置弹窗 -->
<div class="overlay" id="syncOverlay">
  <div class="sheet">
    <div class="sheet-header">
      <div class="sheet-title">☁️ 数据同步</div>
      <button class="sheet-close" onclick="closeSheet('syncOverlay')">✕</button>
    </div>
    <div class="sheet-body">
      <div class="settings-section">
        <div class="settings-title">GitHub 配置</div>
        <div class="form-group">
          <label class="form-label">Token</label>
          <input class="form-input" id="syncToken" type="password" placeholder="ghp_xxx">
        </div>
        <div style="display:flex;gap:8px">
          <div class="form-group" style="flex:1">
            <label class="form-label">用户名</label>
            <input class="form-input" id="syncOwner" placeholder="karlwork511">
          </div>
          <div class="form-group" style="flex:1">
            <label class="form-label">仓库</label>
            <input class="form-input" id="syncRepo" placeholder="karlwork">
          </div>
        </div>
        <div class="form-group">
          <button class="btn btn-primary" onclick="saveSyncConfig()">保存配置</button>
        </div>
      </div>
      <div class="settings-section">
        <div class="settings-title">同步操作</div>
        <div class="settings-row">
          <div class="settings-row-left">
            <span id="syncStatusDot" class="sync-dot"></span>
            <span id="syncStatusText">未同步</span>
          </div>
          <div class="settings-row-right">
            <button class="mini-btn" onclick="syncPush()">⬆️ 上传</button>
            <button class="mini-btn" onclick="syncPull()">⬇️ 下载</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 历史记录弹窗 -->
<div class="overlay" id="historyOverlay">
  <div class="sheet">
    <div class="sheet-header">
      <div class="sheet-title">📜 随机历史</div>
      <button class="sheet-close" onclick="closeSheet('historyOverlay')">✕</button>
    </div>
    <div class="sheet-body">
      <div class="form-group">
        <select class="form-input" id="historyFilter" onchange="renderHistory()" style="height:40px">
          <option value="all">全部活动</option>
        </select>
      </div>
      <div class="history-list" id="historyList"></div>
      <div id="historyEmpty" style="text-align:center;padding:40px;color:var(--text3);font-size:14px;display:none">
        暂无记录
      </div>
    </div>
  </div>
</div>

<script>
// ========== 数据 ==========
const STORAGE_KEY = 'random-tool-data';
const SYNC_CONFIG_KEY = 'random-tool-sync';
const HISTORY_KEY = 'random-tool-history';
let data = { activities: [] };
let editingId = null;
let currentActivityId = null;
let isRolling = false;
let rollTimer = null;

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) data = JSON.parse(raw);
  } catch(e) {}
  if (!data.activities) data.activities = [];
}
function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}
function loadHistory() {
  try {
    const raw = localStorage.getItem(HISTORY_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return [];
}
function saveHistoryItem(activityId, result) {
  const history = loadHistory();
  history.unshift({
    activityId,
    activityName: getActivity(activityId)?.name || '',
    result,
    time: Date.now()
  });
  // 只保留最近200条
  if (history.length > 200) history.length = 200;
  localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
}
function getActivity(id) {
  return data.activities.find(a => String(a.id) === String(id));
}

// ========== 渲染 ==========
function renderActivities() {
  const list = document.getElementById('activityList');
  const empty = document.getElementById('emptyState');
  if (data.activities.length === 0) {
    list.innerHTML = '';
    empty.style.display = 'flex';
    return;
  }
  empty.style.display = 'none';
  list.innerHTML = data.activities.map(a => {
    const items = a.items || [];
    const preview = items.length > 0
      ? items.slice(0, 3).join('、') + (items.length > 3 ? ` 等${items.length}项` : '')
      : '还没有选项';
    return `
    <div class="activity-card" onclick="openResult('${a.id}')">
      <div class="card-header">
        <div class="card-title">
          <span>${escapeHtml(a.name)}</span>
          <span class="card-count">${items.length}项</span>
        </div>
        <div class="card-actions">
          <button class="card-action-btn" onclick="event.stopPropagation();openEditActivity('${a.id}')">✏️</button>
          <button class="card-action-btn" onclick="event.stopPropagation();openManage('${a.id}')">📝</button>
          <button class="card-action-btn" onclick="event.stopPropagation();deleteActivity('${a.id}')">🗑️</button>
        </div>
      </div>
      <div class="card-preview">${escapeHtml(preview)}</div>
    </div>`;
  }).join('');
}

// ========== 活动 CRUD ==========
function openCreateActivity() {
  editingId = null;
  document.getElementById('activitySheetTitle').textContent = '新建活动';
  document.getElementById('activityName').value = '';
  document.getElementById('activityItems').value = '';
  document.getElementById('activityOverlay').classList.add('active');
}
function openEditActivity(id) {
  const a = getActivity(id);
  if (!a) return;
  editingId = id;
  document.getElementById('activitySheetTitle').textContent = '编辑活动';
  document.getElementById('activityName').value = a.name;
  document.getElementById('activityItems').value = (a.items || []).join('\n');
  document.getElementById('activityOverlay').classList.add('active');
}
function saveActivity() {
  const name = document.getElementById('activityName').value.trim();
  if (!name) return toast('请输入活动名称');
  const itemsText = document.getElementById('activityItems').value.trim();
  const items = itemsText ? itemsText.split('\n').map(s => s.trim()).filter(Boolean) : [];

  if (editingId) {
    const a = getActivity(editingId);
    if (a) {
      a.name = name;
      // 合并：保留管理页单独添加的项，但用批量编辑的覆盖
      a.items = items;
    }
  } else {
    data.activities.push({
      id: 'act_' + Date.now(),
      name,
      items,
      createdAt: Date.now()
    });
  }
  saveData();
  renderActivities();
  closeSheet('activityOverlay');
  toast(editingId ? '已更新' : '已创建');
}
function deleteActivity(id) {
  const a = getActivity(id);
  if (!a) return;
  if (!confirm(`确定删除「${a.name}」吗？`)) return;
  data.activities = data.activities.filter(x => String(x.id) !== String(id));
  saveData();
  renderActivities();
  toast('已删除');
}

// ========== 管理随机项 ==========
let manageActivityId = null;
function openManage(id) {
  manageActivityId = id;
  const a = getActivity(id);
  if (!a) return;
  document.getElementById('manageSheetTitle').textContent = a.name + ' · 选项管理';
  renderItemList();
  document.getElementById('manageOverlay').classList.add('active');
  setTimeout(() => document.getElementById('quickAddInput').focus(), 300);
}
function openManageFromResult() {
  if (currentActivityId) {
    closeResult();
    setTimeout(() => openManage(currentActivityId), 200);
  }
}
function renderItemList() {
  const a = getActivity(manageActivityId);
  if (!a) return;
  const list = document.getElementById('itemList');
  const items = a.items || [];
  if (items.length === 0) {
    list.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text3);font-size:13px">还没有选项，快速添加吧 👆</div>';
    return;
  }
  list.innerHTML = items.map((item, i) => `
    <div class="item-row">
      <span class="item-text">${escapeHtml(item)}</span>
      <button class="item-delete" onclick="deleteItem(${i})">✕</button>
    </div>
  `).join('');
}
function quickAddItem() {
  const input = document.getElementById('quickAddInput');
  const val = input.value.trim();
  if (!val) return;
  const a = getActivity(manageActivityId);
  if (!a) return;
  if (!a.items) a.items = [];
  if (a.items.includes(val)) {
    toast('已存在');
    return;
  }
  a.items.push(val);
  saveData();
  renderItemList();
  renderActivities();
  input.value = '';
  input.focus();
}
function deleteItem(index) {
  const a = getActivity(manageActivityId);
  if (!a) return;
  a.items.splice(index, 1);
  saveData();
  renderItemList();
  renderActivities();
}

// ========== 随机结果 ==========
function openResult(id) {
  const a = getActivity(id);
  if (!a) return;
  if (!a.items || a.items.length === 0) {
    toast('先添加一些选项吧');
    openManage(id);
    return;
  }
  currentActivityId = id;
  document.getElementById('resultActivityName').textContent = a.name;
  document.getElementById('resultText').textContent = '?';
  document.getElementById('resultText').classList.remove('rolling-text');
  document.getElementById('resultDisplay').classList.remove('rolling');
  document.getElementById('rollBtn').disabled = false;
  document.getElementById('rollBtn').textContent = '摇 一 摇';
  document.getElementById('resultView').classList.add('active');
  document.getElementById('bottomArea').style.display = 'none';
  document.getElementById('mainContent').style.display = 'none';
}
function closeResult() {
  if (isRolling) {
    clearInterval(rollTimer);
    isRolling = false;
  }
  document.getElementById('resultView').classList.remove('active');
  document.getElementById('bottomArea').style.display = '';
  document.getElementById('mainContent').style.display = '';
  currentActivityId = null;
}
function startRoll() {
  if (isRolling) return;
  const a = getActivity(currentActivityId);
  if (!a || !a.items || a.items.length === 0) return;

  isRolling = true;
  const btn = document.getElementById('rollBtn');
  const display = document.getElementById('resultDisplay');
  const text = document.getElementById('resultText');

  btn.disabled = true;
  btn.textContent = '...';
  display.classList.add('rolling');
  text.classList.add('rolling-text');

  // 快速切换文字
  let count = 0;
  const maxCount = 15 + Math.floor(Math.random() * 10);
  const items = a.items;

  rollTimer = setInterval(() => {
    const idx = Math.floor(Math.random() * items.length);
    text.textContent = items[idx];
    count++;
    if (count >= maxCount) {
      clearInterval(rollTimer);
      // 最终结果
      const finalIdx = Math.floor(Math.random() * items.length);
      text.textContent = items[finalIdx];
      text.classList.remove('rolling-text');
      display.classList.remove('rolling');
      isRolling = false;
      btn.disabled = false;
      btn.textContent = '再 摇 一 次';

      // 保存历史
      saveHistoryItem(currentActivityId, items[finalIdx]);
    }
  }, 80);
}

// ========== 历史记录 ==========
function openHistory() {
  const filter = document.getElementById('historyFilter');
  // 填充活动选项
  filter.innerHTML = '<option value="all">全部活动</option>' +
    data.activities.map(a => `<option value="${a.id}">${escapeHtml(a.name)}</option>`).join('');
  renderHistory();
  document.getElementById('historyOverlay').classList.add('active');
}
function renderHistory() {
  const filterVal = document.getElementById('historyFilter').value;
  let history = loadHistory();
  if (filterVal !== 'all') {
    history = history.filter(h => String(h.activityId) === String(filterVal));
  }
  const list = document.getElementById('historyList');
  const empty = document.getElementById('historyEmpty');
  if (history.length === 0) {
    list.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  list.innerHTML = history.map(h => {
    const d = new Date(h.time);
    const timeStr = `${d.getMonth()+1}/${d.getDate()} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
    return `
    <div class="history-item">
      <span class="history-result">${escapeHtml(h.result)}</span>
      <span class="history-time">${escapeHtml(h.activityName)} · ${timeStr}</span>
    </div>`;
  }).join('');
}

// ========== 同步 ==========
function openSyncSettings() {
  const cfg = loadSyncConfig();
  document.getElementById('syncToken').value = cfg.token || '';
  document.getElementById('syncOwner').value = cfg.owner || '';
  document.getElementById('syncRepo').value = cfg.repo || '';
  updateSyncStatus('idle');
  document.getElementById('syncOverlay').classList.add('active');
}
function loadSyncConfig() {
  try {
    return JSON.parse(localStorage.getItem(SYNC_CONFIG_KEY)) || {};
  } catch(e) { return {}; }
}
function saveSyncConfig() {
  const cfg = {
    token: document.getElementById('syncToken').value.trim(),
    owner: document.getElementById('syncOwner').value.trim(),
    repo: document.getElementById('syncRepo').value.trim()
  };
  if (!cfg.token || !cfg.owner || !cfg.repo) return toast('请填写完整');
  localStorage.setItem(SYNC_CONFIG_KEY, JSON.stringify(cfg));
  toast('配置已保存');
}
function updateSyncStatus(status, msg) {
  const dot = document.getElementById('syncStatusDot');
  const text = document.getElementById('syncStatusText');
  dot.className = 'sync-dot';
  if (status === 'syncing') { dot.classList.add('syncing'); text.textContent = '同步中...'; }
  else if (status === 'ok') { dot.classList.add('ok'); text.textContent = msg || '同步成功'; }
  else if (status === 'fail') { dot.classList.add('fail'); text.textContent = msg || '同步失败'; }
  else { text.textContent = '未同步'; }
}
async function syncPush() {
  const cfg = loadSyncConfig();
  if (!cfg.token || !cfg.owner || !cfg.repo) return toast('请先配置GitHub信息');
  updateSyncStatus('syncing');
  try {
    const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/random-tool-data.json`;
    const headers = { Authorization: `Bearer ${cfg.token}`, Accept: 'application/vnd.github.v3+json' };

    // 获取远程SHA
    let sha = '';
    try {
      const resp = await fetch(url, { headers });
      if (resp.ok) {
        const d = await resp.json();
        sha = d.sha || '';
      }
    } catch(e) {}

    const content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));
    const body = {
      message: `🎲 sync: ${new Date().toLocaleString('zh-CN')}`,
      content,
      ...(sha ? { sha } : {})
    };
    const resp = await fetch(url, {
      method: 'PUT',
      headers,
      body: JSON.stringify(body)
    });
    if (resp.ok) {
      updateSyncStatus('ok', '上传成功 ' + new Date().toLocaleTimeString('zh-CN'));
    } else {
      const err = await resp.json();
      updateSyncStatus('fail', err.message || '上传失败');
    }
  } catch(e) {
    updateSyncStatus('fail', e.message || '网络错误');
  }
}
async function syncPull() {
  const cfg = loadSyncConfig();
  if (!cfg.token || !cfg.owner || !cfg.repo) return toast('请先配置GitHub信息');
  updateSyncStatus('syncing');
  try {
    const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/random-tool-data.json`;
    const resp = await fetch(url, {
      headers: { Authorization: `Bearer ${cfg.token}`, Accept: 'application/vnd.github.v3+json' }
    });
    if (!resp.ok) {
      const err = await resp.json();
      updateSyncStatus('fail', err.message || '下载失败');
      return;
    }
    const d = await resp.json();
    const content = decodeURIComponent(escape(atob(d.content)));
    const remote = JSON.parse(content);
    if (remote.activities) {
      data = remote;
      saveData();
      renderActivities();
      updateSyncStatus('ok', '下载成功 ' + data.activities.length + '个活动');
    } else {
      updateSyncStatus('fail', '数据格式错误');
    }
  } catch(e) {
    updateSyncStatus('fail', e.message || '网络错误');
  }
}

// ========== 工具 ==========
function escapeHtml(text) {
  const d = document.createElement('div');
  d.textContent = text;
  return d.innerHTML;
}
function closeSheet(id) {
  document.getElementById(id).classList.remove('active');
}
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}

// ========== 初始化 ==========
loadData();
renderActivities();
</script>
