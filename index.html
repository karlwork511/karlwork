<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POKO 原型中心</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; width: 100%; overflow: hidden; }
        .layout { display: flex; height: 100%; }
        
        /* 左侧导航 */
        .sidebar { 
            width: 220px; 
            min-width: 220px;
            background: #1e293b; 
            color: #fff; 
            display: flex; 
            flex-direction: column;
            border-right: 1px solid #334155;
        }
        .sidebar-header {
            padding: 20px 16px;
            border-bottom: 1px solid #334155;
        }
        .sidebar-header h1 {
            font-size: 16px;
            font-weight: 600;
            color: #f8fafc;
        }
        .sidebar-header p {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 4px;
        }
        .nav-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }
        .nav-group {
            margin-bottom: 4px;
        }
        .nav-group-title {
            padding: 8px 16px 4px;
            font-size: 11px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }
        .nav-item {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            cursor: pointer;
            transition: all 0.15s;
            font-size: 14px;
            color: #cbd5e1;
            border-left: 3px solid transparent;
        }
        .nav-item:hover {
            background: #334155;
            color: #f8fafc;
        }
        .nav-item.active {
            background: #3b82f6;
            color: #fff;
            border-left-color: #60a5fa;
        }
        .nav-item .icon {
            margin-right: 10px;
            font-size: 16px;
        }
        
        /* 右侧内容 */
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #f1f5f9;
        }
        .content-header {
            padding: 10px 16px;
            background: #fff;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 44px;
        }
        .content-title {
            font-size: 14px;
            color: #475569;
            font-weight: 500;
        }
        .content-actions a {
            font-size: 12px;
            color: #3b82f6;
            text-decoration: none;
            margin-left: 12px;
        }
        .content-actions a:hover {
            text-decoration: underline;
        }
        .iframe-container {
            flex: 1;
            position: relative;
        }
        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }
        .welcome {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #94a3b8;
            font-size: 16px;
            flex-direction: column;
            gap: 12px;
        }
        .welcome .icon { font-size: 48px; }
    </style>
</head>
<body>
    <div class="layout">
        <!-- 左侧导航 -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h1>POKO 原型中心</h1>
                <p>产品原型在线预览</p>
            </div>
            <div class="nav-list" id="navList">
                <!-- 导航项由JS动态生成 -->
            </div>
        </div>

        <!-- 右侧内容 -->
        <div class="content">
            <div class="content-header">
                <span class="content-title" id="contentTitle">请选择一个原型</span>
                <div class="content-actions" id="contentActions" style="display:none">
                    <a href="#" id="shareLink" target="_blank">📋 独立链接</a>
                    <a href="#" id="fullScreen" target="_blank">🔗 新窗口打开</a>
                </div>
            </div>
            <div class="iframe-container" id="iframeContainer">
                <div class="welcome" id="welcomeScreen">
                    <div class="icon">📐</div>
                    <div>从左侧选择一个原型开始查看</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ========== 原型配置 ==========
        // 新增原型只需要在这里添加一行
        const prototypes = [
            { name: 'SaaS 运营后台', file: 'POKO SaaS 运营后台 - 原型分享版.html', icon: '📋', group: 'SaaS 订阅系统' },
            { name: 'SaaS 租户后台', file: 'POKO SaaS 租户后台 - 原型分享版.html', icon: '🏠', group: 'SaaS 订阅系统' },
        ];

        // ========== 渲染导航 ==========
        function renderNav() {
            const navList = document.getElementById('navList');
            const groups = {};
            
            prototypes.forEach((p, i) => {
                if (!groups[p.group]) groups[p.group] = [];
                groups[p.group].push({ ...p, index: i });
            });

            let html = '';
            for (const [group, items] of Object.entries(groups)) {
                html += `<div class="nav-group">`;
                html += `<div class="nav-group-title">${group}</div>`;
                items.forEach(item => {
                    html += `
                        <div class="nav-item" data-index="${item.index}" onclick="loadPrototype(${item.index})">
                            <span class="icon">${item.icon}</span>
                            ${item.name}
                        </div>
                    `;
                });
                html += `</div>`;
            }
            navList.innerHTML = html;
        }

        // ========== 加载原型 ==========
        function loadPrototype(index) {
            const proto = prototypes[index];
            const fileUrl = encodeURIComponent(proto.file).replace(/%2F/g, '/');
            const shareUrl = `${location.origin}/${fileUrl}`;

            // 更新导航高亮
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.querySelector(`.nav-item[data-index="${index}"]`).classList.add('active');

            // 更新标题和操作
            document.getElementById('contentTitle').textContent = proto.name;
            document.getElementById('contentActions').style.display = 'block';
            document.getElementById('shareLink').href = shareUrl;
            document.getElementById('fullScreen').href = shareUrl;

            // 隐藏欢迎页，加载iframe
            document.getElementById('welcomeScreen').style.display = 'none';
            const container = document.getElementById('iframeContainer');
            
            // 如果已有iframe则更新src
            let iframe = container.querySelector('iframe');
            if (!iframe) {
                iframe = document.createElement('iframe');
                container.appendChild(iframe);
            }
            iframe.src = shareUrl;
        }

        // 初始化
        renderNav();
    </script>
</body>
</html>
